name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  unit:
    name: Offline tests + typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # No network, secrets, or database: vitest is configured offline-only.
      - run: npm test
      - run: npx tsc --noEmit
