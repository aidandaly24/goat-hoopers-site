      .game-preview img { width:100%; aspect-ratio:16/9; }
      .footer-top { grid-template-columns:1fr; gap:24px; }

      .face .team-name a { display:block; }
      .face .num a { display:inline-flex; min-height:44px; align-items:center; }
      .court figcaption a,.wire-row>a,.club-name,.opponent a,.provenance summary,.story .player-name>a,.value-list a,.ai-teams a,.score-row a,.top-values a,.notebook .person-row a,.face .player-name a,.happening a { display:inline-flex; min-height:44px; align-items:center; }
    }

</head>
<body>
<a class="skip" href="#main">Skip to content</a>
<header class="masthead" id="header"></header>
<main id="main" tabindex="-1"><p>Loading the offline league edition…</p></main>
<footer id="footer"></footer>
<script type="module">
import {inventory,data,mode,aiState,esc,money} from '../../data.js';

const member = mode==='member' && data.personal?.kind==='member' && data.personal.summary;
const s=member || null;
const home=data.home;
const edition=home.edition;
const teams=home.directory;
const teamById=new Map(teams.map(t=>[String(t.identity.id),t]));
const name=id=>teamById.get(String(id))?.identity.name || `Roster ${id}`;
const teamLink=id=>`<a href="/teams/${esc(id)}">${esc(name(id))}</a>`;
const plink=(id,text)=>`<a href="/player/${esc(id)}">${esc(text)}</a>`;
const rec=t=>t ? `${t.wins}–${t.losses}${t.ties ? `–${t.ties}`:''}` : 'Unavailable';
const date=(v,withTime=false)=>v==null?'Unavailable':new Intl.DateTimeFormat('en-US',{month:'short',day:'numeric',year:'numeric',...(withTime?{hour:'numeric',minute:'2-digit',timeZoneName:'short'}:{}),timeZone:'UTC'}).format(new Date(v));
const pct=v=>v==null?'Unavailable':`${Math.round(v*100)}%`;
const stamp=(v,withTime=false)=>`<time datetime="${esc(new Date(v).toISOString())}">${esc(date(v,withTime))}</time>`;
const portrait=(id,label,cls='')=>inventory.portraits[id]?`<img class="portrait ${cls}" src="${esc(inventory.portraits[id])}" alt="${esc(label)}" loading="lazy" width="44" height="48">`:`<span class="portrait-fallback ${cls}" role="img" aria-label="${esc(label)} — portrait unavailable">${esc(label.split(' ').map(w=>w[0]).slice(0,2).join(''))}</span>`;
const q=(v,ai=aiState)=>`?view=${v}${ai==='ready'?'':`&ai=${esc(ai)}`}`;
const label=(day,month,status)=>`<aside class="date-label"><div class="day mono ${/[A-Za-z]/.test(day)?'word':''}">${day}</div><div class="month">${month}</div><p class="status">${status}</p></aside>`;
const currentPair=(s?teams.find(t=>String(t.identity.id)===String(s.team.id))?.currentMatchup:null) || teams.find(t=>t.currentMatchup)?.currentMatchup;
const nav=[['Home',q(mode)],['News','/intel'],['Stocks','/stocks'],['History','/history'],['Arcade','/arcade']];

document.querySelector('#header').innerHTML=`
  <div class="masthead-top"><a class="brand" href="${q(mode)}" aria-label="GOAT Hoopers home"><img src="${inventory.assets.logo}" alt="GOAT Hoopers" width="246" height="44"></a><div class="mast-date"><strong class="edition-name">Timeline Edition</strong><span class="mono">2026 / W03</span></div></div>
  <div class="navline"><nav class="primary" aria-label="Primary">${nav.map(([n,u])=>`<a href="${u}" ${n==='Home'?'aria-current="page"':''} class="${n==='Stocks'?'stock-link':''}">${n}</a>`).join('')}${s?'<a href="/team">My team</a>':'<a href="/login">Member sign in</a>'}</nav>
  <details class="nav-more"><summary>League menu</summary><nav aria-label="League destinations">${nav.filter(([n])=>n!=='Stocks').map(([n,u])=>`<a class="phone-only" href="${u}">${n}</a>`).join('')}<a href="/ai-decides">AI Decides</a><a href="/teams">Teams</a><a href="/transactions">Transactions</a><a href="/weekly">Weekly archive</a><a href="/trade-analyzer">Trade analyzer</a>${s?'<a class="phone-only" href="/team">My team</a>':'<a class="phone-only" href="/login">Member sign in</a>'}</nav></details></div>
  <div class="fixture"><p><strong>Offline design fixture.</strong> Current records, scores, prices, form, news and AI are synthetic.<span class="warning-long"> Dated approved identities and editorial are retained.</span></p><div class="viewlinks"><a href="${q('member')}" ${s?'aria-current="true"':''}>Member view</a><a href="${q('public')}" ${!s?'aria-current="true"':''}>Public view</a></div></div>`;

function scoreRow(t,points){return `<div class="score-row"><div>${teamLink(t.id)} ${s&&String(t.id)===String(s.team.id)?'<span class="viewer-mark">Your team</span>':''}<p class="meta">${esc(t.managerName)} · Current record <span class="mono">${rec(t)}</span></p></div><span class="score mono ${points==null?'pending':''}">${points==null?'Pending':Number(points).toFixed(1)}</span></div>`;}

function topValues(){return s.players.map(p=>`<li class="person-row">${portrait(p.id,p.name)}<div>${plink(p.id,p.name)}<p class="meta">${esc(p.position)} · <a href="/stocks">Modeled price</a></p></div><div class="metric">${money(p.value)}<small>${p.changePct==null?'Change unavailable':`${p.changePct>0?'Up':p.changePct<0?'Down':'Flat'} ${Math.abs(p.changePct).toFixed(1)}%`}</small></div></li>`).join('');}
function memberValuation(){return `<section class="valuation" data-personal><p class="eyebrow">Your roster value</p><div class="big-number">${money(s.valuation.total).replace('$','$<wbr>')}</div><p class="small">${s.valuation.complete?'Current modeled total':'Partial modeled subtotal'} · FAAB value, not a spendable balance.</p><p class="meta">${s.valuation.priced} priced · ${s.valuation.unpriced} unpriced · ${s.coverage.roster} roster players<br>Computed ${date(s.market.updatedAt,true)} · ${esc(s.market.pricingBasis)} model</p><ul class="plain-list top-values">${topValues()}</ul><p class="meta">Highest modeled values. Price changes are historical model movements; their source interval is unavailable.</p><details class="value-details" data-roster-values><summary>All ${s.rosterValues.length} roster values</summary><ul class="value-list">${s.rosterValues.map(p=>`<li><span>${plink(p.id,p.name)} <span class="meta">${esc(p.position)}</span></span><span class="num">${money(p.value)}</span></li>`).join('')}</ul></details><p class="quiet-state">${esc(inventory.missing.history)}</p><a class="small" href="/stocks">Open the market</a></section>`;}

function notebook(){const watch=s?.playerGuide.watch;return `<section class="notebook"><p class="eyebrow">Scouting notebook</p><h3>${watch?'Players to watch':'League player context'}</h3><p class="small dim">${watch?esc(watch.label):'Selected league faces · current modeled FAAB prices'}</p><ul class="plain-list">${watch?watch.rows.map(p=>`<li class="person-row">${portrait(p.id,p.name)}<div>${plink(p.id,p.name)}<p class="meta">${esc(p.note)}</p></div><div class="metric">${p.value.toFixed(1)}<small>EMA FP/G · ${p.games} GP</small></div></li>`).join(''):data.faces.slice(0,3).map(f=>`<li class="person-row">${portrait(f.player.id,f.player.name)}<div>${plink(f.player.id,f.player.name)}<p class="meta">${esc(f.team.name)}</p></div><div class="metric">${money(f.player.value)}<small>Modeled FAAB</small></div></li>`).join('')}</ul><p class="meta">${watch?esc(watch.message)+' Period: 2026 in-season observations; exact game dates unavailable.':'Price describes modeled asset value. Observed-form evidence is not available in this public view.'}</p><div class="editor-note"><p class="meta">Dated editorial watch · source checked Oct 8, 2026</p><p>${plink('4866','AJ Dybantsa')} · No. 1 rookie selection</p><p class="small dim">A preseason editorial watch using 2025–26 college averages. <a href="#editorial">Read the dated take</a>.</p></div></section>`;}

function wire(){if(!s)return '';return `<section class="wire" data-personal><div class="wire-head"><h3>Your team wire</h3><p class="meta">Synthetic team news and moves · supplied timestamps</p></div>${s.news.map(n=>`<article class="wire-row">${stamp(n.publishedAt)}<a href="${esc(n.url)}">${esc(n.headline)}</a><span class="type">${esc(n.outlet.name)}</span></article>`).join('')}${s.moves.map(m=>`<article class="wire-row">${stamp(m.createdAt)}<p>${esc(m.summary)}</p><span class="type">Week ${m.week} · sample move<br>Add/drop detail unavailable</span></article>`).join('')}</section>`;}

function aiRows(){
 const pairs=[...new Map(teams.filter(t=>t.currentMatchup).map(t=>[t.currentMatchup.home.id+'-'+t.currentMatchup.away.id,t.currentMatchup])).values()];
 return pairs.map((pair,i)=>{
 const ids=[String(pair.home.id),String(pair.away.id)];
 const pick=data.weekly?.matchups.find(p=>p.teamIds.map(String).slice().sort().join('|')===ids.slice().sort().join('|'));
 const matched=pick && data.weekly.week===pair.week && String(data.weekly.season)===String(home.hub.season.seasonYear);
 const r=matched?pick.result:null;
 const stale=aiState==='stale'||data.weekly?.status==='stale'||pick?.status==='stale';
 const state=!r?'Unavailable':stale?'Stale saved result':'Saved model result';
 const probability=id=>r?.probabilities.find(p=>String(p.choice)===id)?.probability;
 const pa=probability(ids[0]);
 return `<article class="ai-row" ${pick?'data-ai-pair="'+esc(ids.join('-'))+'"':''}><span class="pair-index mono">0${i+1}</span><div><div class="ai-teams">${ids.map(id=>`${teamLink(id)}<span class="num">${r?pct(probability(id)):'—'}</span>`).join('')}</div>${r&&!stale&&pa!=null?`<div class="probability" aria-hidden="true"><span style="width:${pa*100}%"></span></div>`:''}${s&&ids.includes(String(s.team.id))?'<p class="viewer-mark">Your pairing</p>':''}</div><div class="ai-answer"><p class="meta ${stale?'stale':''}">${state}</p>${r?`<strong>Returned choice: ${esc(name(r.choice))} <span class="mono">#${esc(r.choice)}</span></strong><p class="meta">Confidence ${pct(r.confidence)} · a separate model signal</p>`:`<p class="small dim">${pick?'Saved result does not match the current season/week/pair.':'No saved pick is available for this pairing.'}</p>`}</div><details class="provenance"><summary>Provenance and model limits</summary><dl><dt>Saved</dt><dd>${data.weekly?.generatedAt?date(data.weekly.generatedAt,true):'Unavailable'}</dd><dt>Season / week</dt><dd>${data.weekly?`${data.weekly.season} / Week ${data.weekly.week}`:'Unavailable'}</dd><dt>Current roster IDs</dt><dd>${ids.map(esc).join(' / ')} · names are current display names</dd><dt>Model / prompt</dt><dd>${r?esc(r.model)+' / '+esc(r.promptVersion):'Unavailable'}</dd><dt>Returned distribution</dt><dd>${r?r.probabilities.map(p=>`Roster ${esc(p.choice)}: ${pct(p.probability)}`).join('; '):'Unavailable'}</dd><dt>Input timestamp / snapshot</dt><dd>Unavailable / ${pick?.result?.snapshot?'Provided':'Unavailable'}</dd><dt>Baseline / weekly snapshot</dt><dd>${pick?.baseline?'Provided':'Unavailable'} / ${data.weekly?.snapshot?'Provided':'Unavailable'}</dd><dt>Evidence</dt><dd>${pick?.evidence?.length?pick.evidence.map(esc).join(' '):'Unavailable'} ${r?.evidence?.length?r.evidence.map(esc).join(' '):'No result-level evidence supplied.'}</dd><dt>Meaning</dt><dd>${esc(r?.probabilityLabel || 'Model probabilities unavailable.')} Experimental synthetic fixture; no generation runs here.</dd></dl></details></article>`;
 }).join('');
}

function completed(){if(!s)return '';const g=s.playerGuide;const union=new Map();for(const [list,title] of [[g.best,'Your Best'],[g.rough,'The Rough Week']]) for(const p of list){if(union.has(p.id))union.get(p.id).selections.push(title);else union.set(p.id,{...p,selections:[title]});}return `<section class="chapter" id="completed" data-personal>${label('02–08','NOV 2026','Completed Week 2<br>Source ends Nov 9, exclusive')}<div class="chapter-content"><div class="section-head"><h2>The completed-week notebook</h2><p class="small dim">Synthetic recorded performers. These are examples, not current official awards.</p></div><p class="completed-intro small dim">${esc(g.period)}. ${esc(g.coverage)} ${union.size} unique players shown of ${g.eligiblePlayed} eligible; shared selections appear once.</p><div class="performance-head"><span>Player</span><span class="selection">Selection basis</span><span class="right">Total FP</span><span class="right">GP</span></div>${[...union.values()].sort((a,b)=>b.value-a.value).map(p=>`<div class="performance-row"><div>${plink(p.id,p.name)}</div><span class="selection">${p.selections.length>1?'Both lists · shared boundary':esc(p.selections[0])}</span><span class="num right points">${p.value.toFixed(1)}</span><span class="num right games">${p.games}</span></div>`).join('')}<p class="meta" style="margin-top:16px">Basis: supplied completed-week fantasy-point totals for verified participation. Your Best is the supplied high selection; The Rough Week is the supplied low selection. Small samples; DNP and unknown participation excluded.</p></div></section>`;}

function editorial(){return `<section class="chapter" id="editorial">${label('05–11','OCT 2026','Expired sample edition<br>Draft · never published')}<div class="chapter-content"><div class="section-head"><div><p class="eyebrow">From the October edition</p><h2>${esc(edition.title)}</h2></div><p class="small dim">Dated sample opinions, retained with their original basis. This edition is stale relative to the fixture’s November data.</p></div>${edition.playerSpotlights.map(p=>`<article class="story">${portrait(p.playerId,p.name)}<div><p class="eyebrow">${p.role==='player-of-week'?'Sample editorial praise':p.role==='underperformer'?'Sample editorial criticism':'Preseason watch'}</p><p class="player-name">${plink(p.playerId,p.name)} · ${esc(p.position)}</p><h3>${esc(p.headline)}</h3><p>${esc(p.opinion)}</p></div><div class="story-stats">${p.stats.map(st=>`<div><p class="num">${esc(st.value)}</p><p class="meta">${esc(st.label)}</p></div>`).join('')}<p class="meta">${esc(p.statPeriod)}<br>${esc(p.periodLabel)}</p></div><details><summary>Selection basis, ownership and source</summary><p>${esc(p.selectionReason)}</p><p>Current ownership link: ${teamLink(p.teamId)}. ${plink(p.playerId,p.name)}.</p><p><a href="${esc(p.source.url)}">${esc(p.source.label)}</a> · Checked ${esc(p.source.checkedAt)} · Sample edition ${esc(edition.dateLabel)}.</p></details></article>`).join('')}<div class="editorial-tail"><section><h3>League happenings</h3><p class="meta">October source chronology · retained editorial</p>${edition.happenings.map(h=>`<article class="happening"><span class="meta mono">${esc(h.dateLabel)}</span><div><h4><a href="${esc(h.href)}">${esc(h.title)}</a></h4><p class="small">${esc(h.text)}</p></div></article>`).join('')}<details class="sources"><summary>All ${edition.sources.length} editorial sources</summary><ul>${edition.sources.map(src=>`<li><a href="${esc(src.url)}">${esc(src.label)}</a><br><span class="meta">Checked ${esc(src.checkedAt)}</span></li>`).join('')}</ul></details></section><section><h3>Weekly archive</h3>${data.archive.map(a=>`<article class="archive-row"><p class="meta mono">${esc(a.dateLabel)}</p><a href="/weekly/${esc(a.id)}">${esc(a.title)}</a><p class="meta">${esc(a.id)} · ${esc(a.status)} sample · ${a.publishedAt?date(a.publishedAt):'Never published'}</p></article>`).join('')}<a class="button" href="/weekly" style="margin-top:20px">Browse weekly archive</a></section></div></div></section>`;}

function faces(){return `<div class="faces">${data.faces.map(f=>`<article class="face" data-face="${esc(f.team.id)}">${f.player?portrait(f.player.id,f.player.name):'<span class="portrait-fallback">—</span>'}<div><p class="team-name">${teamLink(f.team.id)}${f.champion?' · 2025 champion':''}</p>${f.player?`<span class="player-name">${plink(f.player.id,f.player.name)}</span><p class="num"><a href="/stocks" aria-label="${esc(f.player.name)} modeled market value ${money(f.player.value)}">${money(f.player.value)}</a></p>`:'<p class="small">Player unavailable</p>'}</div></article>`).join('')}</div>`;}

function directoryRow(t){const id=t.identity.id;const p=t.currentMatchup;const opp=p?String(p.home.id)===String(id)?p.away:p.home:null;return `<article class="club" data-team-id="${esc(id)}"><div class="club-line"><div><a class="club-name" href="/teams/${esc(id)}">${esc(t.identity.name)}</a> ${s&&String(s.team.id)===String(id)?'<span class="viewer-mark">Your team</span>':''}<p class="meta">${esc(t.identity.managerName)}</p></div><span class="num">${rec(t.currentRecord)}</span><div class="opponent"><span class="meta">${p?'Week '+p.week+' opponent':'Pairing unavailable'}</span><p>${opp?teamLink(opp.id):'Unavailable'}</p></div></div><details><summary>View ${t.players.length}-player roster and previous season</summary><p class="small dim">${t.previousSeason?`${t.previousSeason.season} record: ${rec(t.previousSeason)} · Finish ${t.previousSeason.finish}. ${t.previousSeason.ownerNote?esc(t.previousSeason.ownerNote):''}`:'Previous season unavailable.'}</p><ul class="roster">${t.players.map(p=>`<li>${plink(p.id,p.fullName)}<span class="meta">${esc(p.position)} · ${esc(p.nbaTeam || 'NBA team unavailable')}</span></li>`).join('')}</ul></details></article>`;}

function reference(){return `<section class="chapter" id="league">${label('LEAGUE','REFERENCE','Current roster source<br>'+date(home.checkedAt))}<div class="chapter-content"><div class="section-head"><h2>Ten teams. Their leading assets.</h2><p class="small dim">Top modeled player per team · FAAB values. Asset value is distinct from observed playing form.</p></div>${faces()}<section class="reference-sub" id="directory"><div class="section-head"><h3>The clubhouse directory</h3><p class="meta">Current synthetic records · complete roster references</p></div><div class="controls"><label class="search-label">Search teams, managers or players<input type="search" id="team-search" placeholder="Try a team, manager or player…" autocomplete="off"></label><label>Sort teams<select id="team-sort"><option value="name">Team name A–Z</option><option value="rank">Current standing</option><option value="roster">Roster size, largest first</option></select></label></div><p class="meta" id="team-count" role="status" aria-live="polite"></p><div id="directory-list"></div></section><section class="reference-sub" id="standings"><div class="standings-head"><div><h3 id="standings-heading">Standings</h3><p class="meta">2026 · synthetic current records · PF in fantasy points</p></div><label>Sort standings<select id="standing-sort"><option value="rank">Rank, first to last</option><option value="points">PF, highest first</option><option value="team">Team name A–Z</option><option value="wins">Wins, most first</option></select></label></div><p class="meta table-scroll-hint" id="standings-scroll-note">Scroll horizontally if needed; focus the table region and use Left/Right.</p><div class="standings-scroll" tabindex="0" role="region" aria-labelledby="standings-heading" aria-describedby="standings-scroll-note"><table><caption class="sr-only">All ten teams: current rank, wins, losses and fantasy points for</caption><thead><tr><th scope="col">Rank</th><th scope="col">Team</th><th scope="col">W</th><th scope="col">L</th><th scope="col">PF</th></tr></thead><tbody id="standings-body"></tbody></table></div><p class="quiet-state">League stat leaders and streaks: unavailable. ${esc(inventory.missing.power)}</p></section><section class="wire"><div class="wire-head"><h3>Recent league moves</h3><a class="small" href="/transactions">All transactions</a></div>${home.hub.transactions.map(t=>`<article class="wire-row">${stamp(t.createdAt)}<p>${esc(t.summary)}</p><span class="type">Week ${t.week} · synthetic free agent move<br>Players unavailable</span></article>`).join('')}</section><section class="tools"><div class="game-preview"><a href="/arcade/free-throw" aria-label="Play free-throw practice"><img src="${inventory.assets.game}" alt="Actual free-throw practice court preview" loading="lazy" width="320" height="180"></a><div><h3>Free-throw practice</h3><p class="small dim">A little time on the court. Practice is playable; no prize or reward is claimed here.</p><a class="button primary-button" href="/arcade/free-throw" style="margin-top:16px">Play free throw</a></div></div><div><h3>The working desk</h3><p class="small dim" style="margin-top:8px">Inspect player values, weigh a trade, or open the AI playground.</p><div class="tool-links"><a href="/stocks">Stocks and market</a><a href="/trade-analyzer">Trade analyzer</a><a href="/ai-decides">AI Decides playground</a><a href="/arcade">Arcade</a></div></div></section></div></section>`;}

document.querySelector('#main').innerHTML=`
<div class="issue-heading"><div><p class="eyebrow">GOAT Hoopers · 2026 season</p><h1>Week ${currentPair?.week || '—'}</h1></div><div class="issue-person" ${s?'data-personal':''}>${s?`<h2>${esc(s.team.name)}</h2><p class="small dim">${esc(s.team.managerName)} · ${s.coverage.roster} players · Standing ${s.standing.rank}/${home.hub.season.totalTeams} · ${rec(s.team)}</p><div class="actions"><a class="button primary-button" href="/team">My team</a><a class="button" href="/teams/1#team-roster">View roster</a></div>`:'<h2>The league edition</h2><p class="small dim">Ten teams, the current pairings, and the week’s reference desk.</p><div class="actions"><a class="button primary-button" href="/teams">Browse teams</a><a class="button" href="/login">Member sign in</a></div>'}</div></div>
<section class="chapter first" id="current">${label('12','NOV 2026','Fixture as of<br>'+date(home.checkedAt,true))}<div class="chapter-content"><div class="lead"><figure class="court"><img src="${inventory.assets.court}" alt="The GOAT Hoopers arena and hardwood court" width="640" height="360"><figcaption class="meta"><span>Our court · static arena image</span><a href="/arcade/free-throw">Get shots up</a></figcaption></figure><section class="matchup"><p class="eyebrow">${s?'Your current pairing':'Featured current matchup'}</p><h2>Week ${currentPair.week} · incomplete</h2>${scoreRow(currentPair.home,currentPair.homePoints)}${scoreRow(currentPair.away,currentPair.awayPoints)}<p class="match-note">0.0 is a known score. Pending is unavailable. This pairing is not final.</p><p class="meta" style="margin-top:12px">${s?'Selected because it is your team’s current pairing.':'Selected from the current directory’s first available pairing.'} October editorial is dated separately below.</p></section></div><nav class="contents" aria-label="In this edition"><a href="#roster-desk">${s?'Roster & scouting':'Scouting'}</a><a href="#saved-picks">Saved picks</a>${s?'<a href="#completed">Completed week</a>':''}<a href="#editorial">October edition</a><a href="#directory">Team directory</a><a href="#standings">Standings</a></nav></div></section>
<section class="chapter" id="roster-desk">${label('CURRENT','ROSTER DESK',(s?'Member edition':'Public edition')+'<br>Source as of Nov 12')}<div class="chapter-content"><div class="split">${s?memberValuation():`<section><h2>The league is open.</h2><p class="small dim" style="margin-top:16px">Public team identities, player profiles and saved matchups are available here. Personal roster valuation, form and team wire require a verified member.</p><div class="actions"><a class="button primary-button" href="/teams">Explore all teams</a><a class="button" href="/login">Member sign in</a></div></section>`}${notebook()}</div>${wire()}</div></section>
<section class="chapter" id="saved-picks">${label(data.weekly?'10':'AI',data.weekly?'NOV 2026':'UNAVAILABLE',data.weekly?'Saved AI slate<br>Week 3 · synthetic':'No saved timestamp<br>Week 3 pairings retained')}<div class="chapter-content"><div class="section-head"><h2><a href="/ai-decides">AI Decides</a></h2><p class="small ${aiState==='stale'?'stale':'dim'}">${aiState==='stale'?'Stale saved slate. Retained for reference; no current probability bars.':!data.weekly?'Unavailable: no saved AI slate is connected.':'Five saved model examples. Probabilities are not calibrated sports odds.'}</p></div>${aiRows()}<div class="actions"><a class="button" href="/ai-decides">Open AI playground</a></div></div></section>
${completed()}${editorial()}${reference()}`;

const norm=t=>String(t).normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLocaleLowerCase();
const rank=new Map(home.hub.standings.map(t=>[String(t.team.id),t.rank]));
function updateTeams(){const search=norm(document.querySelector('#team-search').value.trim());const sort=document.querySelector('#team-sort').value;const visible=teams.filter(t=>norm([t.identity.name,t.identity.managerName,...t.players.map(p=>p.fullName)].join(' ')).includes(search)).slice().sort((a,b)=>sort==='roster'?b.players.length-a.players.length||a.identity.name.localeCompare(b.identity.name):sort==='rank'?(rank.get(a.identity.id)||99)-(rank.get(b.identity.id)||99):a.identity.name.localeCompare(b.identity.name));document.querySelector('#directory-list').innerHTML=visible.map(directoryRow).join('')||'<p class="quiet-state">No teams match this search. Try a player’s surname or clear the field.</p>';document.querySelector('#team-count').textContent=`${visible.length} of ${teams.length} teams${search?' match your search':''}. Every roster remains available by expansion.`;}
function updateStandings(){const sort=document.querySelector('#standing-sort').value;const rows=home.hub.standings.slice().sort((a,b)=>sort==='points'?b.pointsFor-a.pointsFor||a.rank-b.rank:sort==='team'?a.team.name.localeCompare(b.team.name):sort==='wins'?b.wins-a.wins||a.rank-b.rank:a.rank-b.rank);document.querySelector('#standings-body').innerHTML=rows.map(t=>`<tr><td class="num">${t.rank}</td><td>${teamLink(t.team.id)} ${s&&String(t.team.id)===String(s.team.id)?'<span class="viewer-mark">You</span>':''}</td><td class="num">${t.wins}</td><td class="num">${t.losses}</td><td class="num">${t.pointsFor==null?'—':(t.pointsFor/100).toFixed(1)}</td></tr>`).join('');}
document.querySelector('#team-search').addEventListener('input',updateTeams);
document.querySelector('#team-sort').addEventListener('change',updateTeams);
document.querySelector('#standing-sort').addEventListener('change',updateStandings);
updateTeams();updateStandings();

document.querySelector('#footer').innerHTML=`<div class="footer-top"><div><p class="eyebrow">GOAT Hoopers</p><p style="margin-top:8px">The league, with its dates attached.</p></div><nav class="footer-nav" aria-label="Footer destinations"><a href="${q(mode)}">Home</a><a href="/intel">News</a><a href="/stocks">Stocks</a><a href="/history">History</a><a href="/arcade">Arcade</a><a href="/ai-decides">AI Decides</a><a href="/teams">Teams</a><a href="/transactions">Transactions</a><a href="/weekly">Weekly archive</a>${s?'<a href="/team">My team</a><a href="/teams/1#team-roster">View roster</a>':''}</nav></div><p class="footer-note meta">${esc(inventory.warning)} Current reference source: ${date(home.checkedAt,true)}. Saved AI source: ${data.weekly?.generatedAt?date(data.weekly.generatedAt,true):'Unavailable'}. October draft editions are expired samples. This static mock demonstrates layout and local controls; route links do not establish authentication, live data or gameplay.</p><div class="footer-states"><a href="${q('member')}">Member fixture</a><a href="${q('public')}">Public fixture</a><a href="${q(mode,'ready')}">AI ready</a><a href="${q(mode,'stale')}">AI stale</a><a href="${q(mode,'missing')}">AI unavailable</a><a href="#main">Back to edition</a></div>`;

document.addEventListener('error',event=>{if(event.target instanceof HTMLImageElement){const img=event.target;const fallback=document.createElement('span');fallback.className='portrait-fallback';fallback.setAttribute('role','img');fallback.setAttribute('aria-label',img.alt+' — image unavailable');fallback.textContent='Image unavailable';img.replaceWith(fallback);}},true);
document.querySelector('.nav-more').addEventListener('keydown',e=>{if(e.key==='Escape'){e.currentTarget.open=false;e.currentTarget.querySelector('summary').focus();}});
document.querySelector('.nav-more').addEventListener('click',e=>{if(e.target.closest('a'))e.currentTarget.open=false;});
document.querySelector('#main').dataset.mockReady='19';
</script>
</body>
