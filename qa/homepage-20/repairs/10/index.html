      .standing-row{grid-template-columns:minmax(20px,max-content) minmax(0,1fr) minmax(23px,max-content) minmax(23px,max-content) minmax(53px,max-content)}
      .roster-list a{min-width:0;overflow-wrap:anywhere}
      .court .pin{min-width:max-content}
      .form-number{flex-wrap:wrap}
    }
  </style>
</head>
<body>
  <a class="skip" href="#main">Skip to content</a>
  <header class="site-head" id="top">
    <div class="wrap head-row">
      <a class="brand" href="/" aria-label="GOAT Hoopers home"><img src="/public/courtside/GOAT-HOOPERS-horizontal-black.svg" alt="GOAT Hoopers" width="170" height="41"></a>
      <nav class="desktop-nav" aria-label="Main navigation">
        <a href="/" aria-current="page">Home</a><a href="/intel">News</a><a href="/stocks">Stocks</a><a href="/history">History</a><a href="/arcade">Arcade</a><a href="/ai-decides">AI Decides</a>
        <details class="nav-tools"><summary>League</summary><div class="nav-links"><a href="/teams">Teams</a><a href="/transactions">Transactions</a><a href="/trade-analyzer">Trade Analyzer</a><a href="/draft">Draft</a><a href="/weekly">Weekly archive</a><a id="desktop-account" href="/team">My team</a></div></details>
      </nav>
      <nav class="mobile-nav" aria-label="Quick navigation"><a href="/stocks">Stocks</a><button type="button" id="menu-button" aria-expanded="false" aria-controls="mobile-links">Menu</button></nav>
    </div>
    <nav class="wrap mobile-menu-links" id="mobile-links" aria-label="League navigation" hidden></nav>
  </header>
  <div class="wrap"><div class="fixture"><strong>Offline design fixture</strong><span>All current records, scores, prices, form, news and AI are synthetic. Dated identities and editorial are preserved. Not live league data.</span></div></div>
  <main id="main" class="wrap" tabindex="-1"><noscript><p>This offline mock needs JavaScript to display the shared fixture. League navigation remains available above.</p></noscript></main>
  <script type="module">
    import {inventory,data,mode,aiState,esc,money} from '../../data.js';
    const $ = s => document.querySelector(s);
    const home = data.home, edition = home.edition, personal = mode === 'member' ? data.personal.summary : null;
    const teams = new Map(home.directory.map(d => [d.identity.id,d.identity]));
    const teamName = id => teams.get(String(id))?.name ?? `Unknown roster ${id}`;
    const record = t => `${t.wins}–${t.losses}${t.ties ? '–'+t.ties : ''}`;
    const nameLink = (id,name,cls='') => `<a class="${cls}" href="/player/${esc(id)}">${esc(name)}</a>`;
    const teamLink = id => `<a href="/teams/${esc(id)}">${esc(teamName(id))}</a>`;
    const date = v => v == null ? 'Unavailable' : new Date(v).toLocaleString('en-US',{timeZone:'UTC',month:'short',day:'numeric',year:'numeric',hour:'2-digit',minute:'2-digit',hour12:false})+' UTC';
    const pct = v => Number.isFinite(v) ? `${Math.round(v*100)}%` : 'Unavailable';
    const score = v => v == null ? 'Pending' : Number(v).toFixed(1);
    const region = (n,label) => `<div class="region"><span class="coord">${n}</span><span>${esc(label)}</span></div>`;
    const portrait = (id,name,cls='',eager=false) => inventory.portraits[id] ? `<span class="portrait-wrap ${cls}"><img class="portrait" src="${esc(inventory.portraits[id])}" alt="" width="48" height="56" ${eager?'':'loading="lazy"'}><span class="initials" aria-hidden="true">${esc(name.split(' ').map(x=>x[0]).slice(0,2).join(''))}</span></span>` : '';
    const miniPlayer = p => `<li class="mini-person">${portrait(p.id,p.name,'',true)}<div>${nameLink(p.id,p.name)}<span class="micro muted">${esc(p.position)} · modeled FAAB</span></div><span class="num">${money(p.value)}</span></li>`;
    const navItems = [['Home','/'],['News','/intel'],['History','/history'],['Arcade','/arcade'],['AI Decides','/ai-decides'],['Teams','/teams'],['Transactions','/transactions'],['Trade Analyzer','/trade-analyzer'],['Draft','/draft'],['Weekly archive','/weekly'],[personal?'My team':'Sign in',personal?'/team':'/login']];
    $('#mobile-links').innerHTML = navItems.map(([n,h])=>`<a href="${h}" ${h==='/'?'aria-current="page"':''}>${n}</a>`).join('');
    if(!personal){$('#desktop-account').href='/login';$('#desktop-account').textContent='Sign in';}
    const comparisonLink = (view,label) => `<a href="?view=${view}&ai=${esc(aiState)}" ${mode===view?'aria-current="true"':''}>${label}</a>`;
    const pairing = personal?.matchup ?? home.directory.find(d=>d.currentMatchup)?.currentMatchup;
    const currentWeek = pairing?.week ?? 'Unavailable';
    const ownDirectory = personal ? home.directory.find(d=>d.identity.id===personal.team.id) : null;
    function matchTeam(t,points){return `<li class="match-team"><div><a href="/teams/${esc(t.id)}">${esc(t.name)}</a><span class="small muted">${esc(t.managerName)} · <span class="num">${record(t)}</span> current record</span></div><span class="score ${points==null?'pending':''}">${score(points)}</span></li>`;}
    function personalPanel(){
      if(!personal) return `<section class="baseline" id="baseline">${region('01','Baseline · league desk')}<div class="identity"><h2>Ten teams.<br>One floor.</h2><p class="manager small muted">Public league view · 2026</p><div class="actions"><a class="action primary" href="/teams">Explore teams</a></div></div><p class="small">Start with this week’s pair, then follow a player into the league.</p><ul class="public-teams">${data.faces.slice(0,3).map(f=>`<li>${teamLink(f.team.id)}<span class="small muted">${esc(f.team.managerName)} · ${record(f.team)}</span><span class="small">${nameLink(f.player.id,f.player.name)} · <span class="num">${money(f.player.value)}</span> modeled FAAB</span></li>`).join('')}</ul><p class="unavailable">Personal roster value and team wire appear in the member comparison.</p><a class="text-action" href="?view=member&ai=${esc(aiState)}">Compare member view</a></section>`;
      return `<section class="baseline" id="baseline" data-personal>${region('01','Baseline · your team')}<div class="identity"><h2>${esc(personal.team.name)}</h2><p class="manager small muted">${esc(personal.team.managerName)}<br><span class="num">${record(personal.team)}</span> · Standing <span class="num">${personal.standing.rank}/${personal.season.totalTeams}</span><br>${personal.coverage.roster} roster players</p><div class="actions"><a class="action primary" href="/team">My team</a><a class="text-action" href="/teams/1#team-roster">View roster</a></div></div><div class="value-label">Current modeled roster value</div><div class="total">${money(personal.valuation.total).replace('.','<wbr>.')}</div><p class="value-sub">${personal.valuation.priced}/${personal.coverage.roster} priced · ${personal.valuation.unpriced} unpriced<br>Rank ${personal.valuation.rank.rank} of ${personal.valuation.rank.teams} fully priced teams</p><p class="small muted">Highest modeled values</p><ul class="mini-list">${personal.players.map(miniPlayer).join('')}</ul><details data-roster-values><summary>All ${personal.rosterValues.length} player values</summary><div><p class="small">Modeled FAAB asset values, not available budget or real sale prices.</p><ul class="value-rows">${personal.rosterValues.map(p=>`<li>${nameLink(p.id,p.name)}<span class="num">${money(p.value)}</span></li>`).join('')}</ul></div></details><details><summary>Pricing basis and timestamp</summary><div><p>In-season modeled FAAB valuation. ${personal.valuation.priced} priced and ${personal.valuation.unpriced} unpriced; ${personal.valuation.complete?'complete roster total':'partial subtotal'}.</p><p>Calculation: ${date(personal.market.updatedAt)}<br>Roster checked: ${date(personal.checkedAt)}</p><a href="/stocks">Inspect modeled prices</a></div></details><p class="unavailable">${esc(inventory.missing.history)}</p></section>`;
    }
    function wingPanel(){
      const watch = personal?.playerGuide.watch;
      if(watch) return `<section class="wing" id="notebook">${region('03','Right wing · scouting')}<h2>Players to watch</h2><p class="lead muted">${esc(watch.label)}</p><ul class="form-list">${watch.rows.map(p=>`<li class="form-item">${nameLink(p.id,p.name)}<div class="form-number"><strong>${esc(p.value)}</strong><span class="micro muted">EMA FPTS / game<br>${esc(p.games)} observed games</span></div><p class="micro muted">${esc(p.note)}</p></li>`).join('')}</ul><p class="micro muted">${esc(watch.message)} Synthetic observed-form sample · 2026, Week ${personal.playerGuide.currentWeek}.</p><div class="watch-note"><p class="eyebrow">A different kind of watch</p><p class="small">${nameLink('4866','AJ Dybantsa')} is the dated editorial pick below. College averages and a preseason opinion are separate from this form guide.</p><a class="text-action" href="#stories">Read the editorial notebook</a></div></section>`;
      return `<section class="wing" id="notebook">${region('03','Right wing · scouting')}<h2>Follow the players</h2><p class="lead muted">A league lens, using modeled value rather than observed form.</p><ul class="form-list">${data.faces.slice(6,9).map(f=>`<li class="form-item">${nameLink(f.player.id,f.player.name)}<div class="form-number"><strong>${money(f.player.value)}</strong><span class="micro muted">Modeled FAAB</span></div><p class="micro muted">${esc(f.team.name)} · ${esc(f.player.position)}</p></li>`).join('')}</ul><p class="micro muted">Synthetic current prices. These are asset values, not fantasy-point projections.</p><div class="watch-note"><p class="eyebrow">Editorial one to watch</p><p class="small">${nameLink('4866','AJ Dybantsa')} · NeuralNets. The Oct 5–11 draft edition uses his 2025–26 BYU averages.</p><a class="text-action" href="#stories">Read selection and sources</a></div></section>`;
    }
    function story(p,i){return `<article class="story"><div class="story-intro">${portrait(p.playerId,p.name)}<div><span class="eyebrow">${['The standard','The critique','One to watch'][i]}</span><br>${nameLink(p.playerId,p.name,'story-name')}<div class="micro muted">${teamLink(p.teamId)} · ${esc(p.position)}</div></div></div><h3>${esc(p.headline)}</h3><p>${esc(p.opinion)}</p><ul class="stats">${p.stats.map(s=>`<li><b>${esc(s.value)}</b><span>${esc(s.label)}</span></li>`).join('')}</ul><p class="micro muted">${esc(p.statPeriod)}<br>${esc(p.periodLabel)} · sample editorial</p><details><summary>Why this pick / source</summary><div><p>${esc(p.selectionReason)}</p><a href="${esc(p.source.url)}">${esc(p.source.label)}</a><p class="micro muted">Source checked ${esc(p.source.checkedAt)}. Draft edition ${esc(edition.dateLabel)}; not a current official award.</p></div></details></article>`;}
    function recap(){if(!personal)return '';
      const guide=personal.playerGuide;
      const list=rows=>`<ul class="recap-list">${rows.map(p=>`<li><div class="recap-line">${nameLink(p.id,p.name)}<span class="num">${p.value} FPTS</span></div><div class="small">${p.games} GP · ${esc(p.note)}</div></li>`).join('')}</ul>`;
      return `<section class="section" data-personal id="recap"><div class="section-head"><div>${region('04','Bench notes · completed week')}<h2>Your last week, in the book</h2><p>${esc(inventory.missing.recap)}</p></div></div><div class="recap"><div><h3>Your best</h3>${list(guide.best)}</div><div><h3>The rough week</h3>${list(guide.rough)}</div><div class="team-wire"><h3>Team wire</h3><p class="micro muted">Synthetic news and roster moves</p><ul class="wire">${personal.news.map(n=>`<li><a href="${esc(n.url)}">${esc(n.headline)}</a><span class="micro muted">${esc(n.outlet.name)} · ${date(n.publishedAt)}</span></li>`).join('')}${personal.moves.map(m=>`<li><a href="/transactions">${esc(m.summary)}</a><span class="micro muted">Week ${m.week} · ${date(m.createdAt)}<br>Add/drop detail unavailable in fixture</span></li>`).join('')}</ul></div></div><div class="recap-note small muted"><p>${esc(guide.period)}. ${esc(guide.coverage)} Displayed: ${guide.best.length} best and ${guide.rough.length} rough entries; ${guide.eligiblePlayed} eligible players. Lists may overlap.</p></div></section>`;
    }
    function aiPairs(){
      if(!data.weekly)return `<div class="view-state"><strong>Unavailable</strong> · No saved AI slate is connected in this fixture state. Current matchups and all league information remain available.</div>`;
      return `<div class="ai-list">${data.weekly.matchups.map((m,i)=>{
        const live = home.directory.some(d=>d.currentMatchup && m.teamIds.every(id=>[d.currentMatchup.home.id,d.currentMatchup.away.id].includes(id)) && d.currentMatchup.week===data.weekly.week);
        const ready = m.status==='ready' && m.result && live;
        if(!ready)return `<article class="ai-pair" data-ai-pair="${esc(m.matchupId)}"><div class="pair-index">PAIR ${String(i+1).padStart(2,'0')}</div>${m.teamIds.map(id=>`<p class="small">${teamLink(id)}</p>`).join('')}<strong class="small">${live?'Unavailable':'Unmatched saved pair'}</strong><p class="small muted">${esc(m.message)}</p></article>`;
        const result=m.result;
        return `<article class="ai-pair" data-ai-pair="${esc(m.matchupId)}"><div class="pair-index">PAIR ${String(i+1).padStart(2,'0')} ${aiState==='stale'?'· STALE':''}</div>${m.teamIds.map(id=>`<div class="prob-row">${teamLink(id)}<span class="num">${pct(result.probabilities.find(p=>p.choice===id)?.probability)}</span></div>`).join('')}<div class="probbar" aria-hidden="true">${m.teamIds.map(id=>`<span style="flex:${result.probabilities.find(p=>p.choice===id)?.probability??0}"></span>`).join('')}</div><p class="returned">Returned choice<strong>${esc(teamName(result.choice))}</strong></p><p class="micro muted">Confidence ${pct(result.confidence)}<br>Separate model signal</p><details><summary>Saved pick provenance</summary><div><p>Saved ${date(data.weekly.generatedAt)}<br>Season ${data.weekly.season}, week ${data.weekly.week}<br>Roster IDs ${esc(m.teamIds.join(' / '))}</p><p>Model: ${esc(result.model)}<br>Prompt: ${esc(result.promptVersion)}<br>Returned choice: ${esc(result.choice)} (${esc(teamName(result.choice))})<br>Confidence: ${pct(result.confidence)}</p><p>${esc(result.probabilityLabel)}</p><ul>${result.probabilities.map(p=>`<li>${esc(teamName(p.choice))} [${esc(p.choice)}]: ${pct(p.probability)}</li>`).join('')}</ul><p>Evidence: ${esc([...m.evidence,...result.evidence].join(' ')||'Unavailable')}<br>Input snapshot: ${result.snapshot||data.weekly.snapshot?'Available in saved result':'Unavailable'}<br>Input timestamp: Unavailable<br>Baseline: ${m.baseline?'Available':'Unavailable'}</p><p>Display names are current identities. Synthetic result; no generation occurs here.</p></div></details></article>`;
      }).join('')}</div>`;
    }
    function face(f){return `<article class="face" data-face="${esc(f.team.id)}">${f.player?portrait(f.player.id,f.player.name):''}<div><a class="team-link" href="/teams/${esc(f.team.id)}">${esc(f.team.name)}${f.champion?' · 2025 champion':''}</a>${f.player?`${nameLink(f.player.id,f.player.name)}<span class="num">${money(f.player.value)}</span><span class="micro muted">Top modeled player · ${esc(f.player.position)}</span>`:'<span class="small muted">Player unavailable</span>'}</div></article>`;}
    const navFooter = [['Home','/'],['News','/intel'],['Stocks','/stocks'],['History','/history'],['Arcade','/arcade'],['AI Decides','/ai-decides'],['Teams','/teams'],['Transactions','/transactions'],['Trade Analyzer','/trade-analyzer'],['Weekly archive','/weekly']];
    $('#main').innerHTML = `
      <div class="mast"><div><p class="eyebrow">Court atlas · 2026 league notebook</p><h1>Week <span>${String(currentWeek).padStart(2,'0')}</span></h1></div><div class="mast-note"><p>One floor. The matchup at center court, the roster at the baseline, and the players worth a closer look.</p><div class="comparison" aria-label="Compare fixture views">${comparisonLink('member','Member view')}${comparisonLink('public','Public view')}</div></div></div>
      <div class="atlas">
        ${personalPanel()}
        <section class="center" id="center-court">${region('02','Center court · this week')}<h2>Featured matchup</h2><p class="match-state">Week ${currentWeek} · Incomplete scoring · synthetic fixture</p>${pairing?`<ul class="match-list">${matchTeam(pairing.home,pairing.homePoints)}${matchTeam(pairing.away,pairing.awayPoints)}</ul>`:'<p>Current pairing unavailable.</p>'}<p class="micro muted">${personal?'Your current pairing.':'First available current pairing from the league directory.'} A known zero is shown as 0.0; a missing score remains Pending.</p><figure class="court"><img src="${esc(inventory.assets.court)}" alt="The original GOAT Hoopers arena and basketball court" width="1440" height="810"><span class="pin p1" aria-hidden="true">01</span><span class="pin p2" aria-hidden="true">02</span><span class="pin p3" aria-hidden="true">03</span></figure><div class="court-caption"><span>Our court, used as a reading map. Static original art.</span><a href="/arcade/free-throw">Play Free Throw</a></div><nav class="map-key" aria-label="Court atlas sections"><a href="#baseline"><b>01</b> Baseline</a><a href="#center-court"><b>02</b> Center court</a><a href="#notebook"><b>03</b> Right wing</a></nav><div class="edition-note"><strong>Current pair. Earlier edition.</strong><p class="small muted">Directory checked ${date(home.checkedAt)}. The editorial notebook is a stale draft from ${esc(edition.dateLabel)}; its opening-week story is separate from this Week ${currentWeek} fixture.</p><details><summary>Editorial date and original selection</summary><div><p>${esc(edition.game.selectionReason)}</p><p>${esc(edition.game.context)}</p><p>The supplied draft text names the champion, while its fixture team IDs are ${esc(edition.game.teamIds.join(' / '))}. This earlier editorial is not used to select or describe the current pairing.</p><a href="/weekly/${esc(edition.id)}">Read the dated draft edition</a></div></details></div></section>
        ${wingPanel()}
      </div>
      <section class="section" id="stories"><div class="section-head"><div>${region('03','From the wings · editorial')}<h2>Three takes from the notebook</h2><p>${esc(edition.dateLabel)} · Draft, stale sample editorial. These are dated opinions and prior-period statistics, not official current Week 2 awards.</p></div><a class="text-action" href="/weekly/${esc(edition.id)}">Full edition</a></div><div class="stories">${edition.playerSpotlights.map(story).join('')}</div></section>
      ${recap()}
      <section class="section" id="ai-picks"><div class="section-head"><div>${region('05','Scorer’s table · saved models')}<h2><a href="/ai-decides">AI Decides</a></h2><p>All five saved pairs. Model probabilities are not calibrated sports odds; the returned choice and confidence are printed as separate signals.</p></div><a class="text-action" href="/ai-decides">Open the playground</a></div><div class="ai-head"><p class="micro muted">${data.weekly?`Saved ${date(data.weekly.generatedAt)} · Week ${data.weekly.week}`:'No saved timestamp available'}</p><p class="ai-status ${aiState==='stale'?'stale':''}">${!data.weekly?'Unavailable':aiState==='stale'?'Stale saved slate · may be outdated':'Ready saved fixture · synthetic'}</p></div>${aiPairs()}<div class="ai-compare" aria-label="Compare model states">${[['ready','Ready sample'],['stale','Stale sample'],['missing','Missing sample']].map(([s,label])=>`<a href="?view=${mode}&ai=${s}#ai-picks" ${aiState===s?'aria-current="true"':''}>${label}</a>`).join('')}</div></section>
      <section class="section" id="faces"><div class="section-head"><div>${region('06','Along the sideline · league faces')}<h2>The players behind the teams</h2><p>Each team’s highest modeled player value. Synthetic FAAB asset prices, separate from player form or an official ranking.</p></div><a class="text-action" href="/stocks">Open Stocks</a></div><div class="faces">${data.faces.map(face).join('')}</div></section>
      <section class="section" id="league"><div class="section-head"><div>${region('07','The full floor · directory & standings')}<h2>Everybody in the gym</h2><p>Ten teams, their current opponent, and every roster player. Search names, managers or players; open a roster for the complete list.</p></div><a class="text-action" href="/teams">Team profiles</a></div><div class="league-grid"><div class="directory"><div class="controls"><label class="field search">Find a team or player<input id="team-search" type="search" placeholder="Team, manager or player" autocomplete="off"></label><label class="field">Sort teams<select id="team-sort"><option value="rank">Current standing</option><option value="name">Team name A–Z</option><option value="roster">Roster size, largest</option></select></label><button type="button" id="clear-search">Clear</button></div><p id="result-count" class="result-count" role="status" aria-live="polite"></p><div id="directory-list"></div><p class="empty-search" id="empty-search" hidden>No matching team or player. Clear the search to return to all ten teams.</p></div><aside class="standings" aria-labelledby="standings-title"><h3 id="standings-title">Current standings</h3><p class="micro muted">Synthetic records · PF = source pointsFor ÷ 100</p><label class="field">Sort standings<select id="standings-sort"><option value="rank">Rank, ascending</option><option value="points">Points for, descending</option><option value="wins">Wins, descending</option><option value="name">Team name A–Z</option></select></label><div class="standing-row labels" aria-hidden="true"><span>#</span><span>Team</span><span>W</span><span>L</span><span>PF</span></div><ol id="standings-list"></ol><p class="status-note">Stats unavailable: no points leaders, streaks, activity leaders or game-margin records are connected in this fixture.</p><div class="league-below"><div><h3>Lineup Power</h3><p class="muted">${esc(inventory.missing.power)}</p><a class="text-action" href="/intel">League intel</a></div><div><h3>Recent transactions</h3><ul class="wire">${home.hub.transactions.map(t=>`<li><a href="/transactions">${esc(t.summary)}</a><span class="micro muted">Synthetic · Week ${t.week}<br>${date(t.createdAt)}</span></li>`).join('')}</ul><a class="text-action" href="/transactions">All transactions</a></div></div></aside></div></section>
      <section class="section" id="happenings"><div class="section-head"><div>${region('08','Courtside · the wire')}<h2>Around the league</h2><p>Dated editorial happenings from ${esc(edition.dateLabel)}. Separate from the current synthetic transaction feed above.</p></div><a class="text-action" href="/intel">News & intel</a></div><ul class="stories">${edition.happenings.map(h=>`<li class="story"><p class="eyebrow">${esc(h.dateLabel)}</p><h3><a href="${esc(h.href)}">${esc(h.title)}</a></h3><p>${esc(h.text)}</p></li>`).join('')}</ul></section>
      <section class="section" id="tools"><div class="section-head"><div>${region('09','Beyond the baseline · league tools')}<h2>Make the next move</h2></div></div><div class="tools-grid"><div class="market"><h3>Stocks & trade desk</h3><p>Inspect the modeled FAAB market, follow a player’s pricing basis, or compare a trade with the existing analyzer.</p><div class="actions"><a class="action primary" href="/stocks">Open Stocks</a><a class="action" href="/trade-analyzer">Trade Analyzer</a></div><p class="micro muted">No price updates or trade calculations run in this offline mock.</p></div><div class="practice"><a href="/arcade/free-throw" aria-label="Open Free Throw practice"><img src="${esc(inventory.assets.game)}" alt="Preview of the Free Throw court and basketball hoop" loading="lazy" width="170" height="131"></a><div><h3>Free Throw practice</h3><p>A little court time between roster decisions.</p><a class="action primary" href="/arcade/free-throw">Play Free Throw</a><br><a class="text-action" href="/arcade">Visit Arcade</a></div></div></div></section>
      <section class="section" id="archive"><div class="section-head"><div>${region('10','The archive · earlier editions')}<h2>Keep the old pages</h2><p>Both supplied entries are dated drafts. Their historical and opening-week contexts remain intact.</p></div><a class="text-action" href="/weekly">Weekly archive</a></div><div class="archives">${data.archive.map(e=>`<article class="archive"><div><p class="micro muted">${esc(e.dateLabel)} · ${esc(e.status)}</p><a href="/weekly/${esc(e.id)}">${esc(e.title)}</a><span class="micro mono muted">${esc(e.id)}</span></div></article>`).join('')}</div></section>
      <footer class="foot"><div><h2>GOAT Hoopers</h2><p>This is an offline Court Atlas design direction. Dated approved roster identities and editorial come from the shared benchmark fixture; all current records, scores, prices, form, news and model examples are synthetic.</p><details><summary>Editorial sources and check dates</summary><div><ul class="source-list">${edition.sources.map(s=>`<li><a href="${esc(s.url)}">${esc(s.label)}</a><div class="micro muted">Checked ${esc(s.checkedAt)}</div></li>`).join('')}</ul><p class="small muted">Sources are attribution links; this page makes no network data requests. Current snapshot checked ${date(home.checkedAt)}. Draft was never marked published.</p></div></details><a class="top-link" href="#top">Back to the top</a></div><div><nav class="foot-links" aria-label="Footer navigation">${navFooter.map(([n,h])=>`<a href="${h}">${n}</a>`).join('')}${personal?'<a href="/team">My team</a><a href="/teams/1#team-roster">View roster</a>':'<a href="/login">Sign in</a>'}</nav><p class="micro muted">Conventional routes point to the application. This static mock demonstrates composition and local controls; it does not emulate authentication, backend operations or game runtime.</p></div></footer>`;
    function directoryTeam(d){
      const t=d.identity, previous=d.previousSeason, m=d.currentMatchup;
      const opponent=m ? m.home.id===t.id?m.away:m.home : null;
      const ownScore=m ? m.home.id===t.id?m.homePoints:m.awayPoints : null;
      const otherScore=m ? m.home.id===t.id?m.awayPoints:m.homePoints : null;
      return `<article class="team-entry" data-team-id="${esc(t.id)}"><div class="team-top"><div><h3><a href="/teams/${esc(t.id)}">${esc(t.name)}</a>${personal?.team.id===t.id?' <span class="micro muted">Your team</span>':''}</h3><p class="team-meta">${esc(t.managerName)} · ${d.players.length} players</p></div><span class="record">${record(d.currentRecord)}</span></div><p class="opponent">${m?`Week ${m.week} vs ${teamLink(opponent.id)}<br><span class="num">${score(ownScore)}</span> / <span class="num">${score(otherScore)}</span> · ${ownScore==null||otherScore==null?'Incomplete scoring':'Recorded fixture scores; final status unavailable'}`:'Current matchup unavailable'}</p>${previous?`<p class="previous">${esc(previous.season)}: ${previous.wins}–${previous.losses} · Finish ${previous.finish}${previous.ownerNote?` · ${esc(previous.ownerNote)}`:''}</p>`:''}<details><summary>View all ${d.players.length} roster players</summary><div>${previous?.ownerNote?`<p class="small muted">${esc(previous.ownerNote)} The previous-season record belongs to that prior manager.</p>`:''}<ul class="roster-list">${d.players.map(p=>`<li>${nameLink(p.id,p.fullName)}<span>${esc(p.position)} · ${esc(p.nbaTeam??'—')}</span></li>`).join('')}</ul>${d.latestMove||d.recentMove?'<a class="text-action" href="/transactions">Recent move</a>':'<p class="micro muted">No team-specific latest move is attached to this directory fixture.</p>'}</div></details></article>`;
    }
    const rankFor=id=>home.hub.standings.find(s=>s.team.id===id)?.rank??Infinity;
    function renderDirectory(){
      const query=$('#team-search').value.trim().toLocaleLowerCase(),sort=$('#team-sort').value;
      const arr=[...home.directory].sort((a,b)=>sort==='name'?a.identity.name.localeCompare(b.identity.name):sort==='roster'?b.players.length-a.players.length||a.identity.name.localeCompare(b.identity.name):rankFor(a.identity.id)-rankFor(b.identity.id));
      $('#directory-list').innerHTML=arr.map(directoryTeam).join('');
      let count=0;
      for(const el of document.querySelectorAll('[data-team-id]')){
        const d=home.directory.find(d=>d.identity.id===el.dataset.teamId);
        const text=[d.identity.name,d.identity.managerName,...d.players.map(p=>p.fullName)].join(' ').toLocaleLowerCase();
        el.hidden=query!==''&&!text.includes(query);if(!el.hidden)count++;
        if(query&&d.players.some(p=>p.fullName.toLocaleLowerCase().includes(query)))el.querySelector('details').open=true;
      }
      $('#result-count').textContent=`${count} of ${home.directory.length} teams · ${home.directory.reduce((n,d)=>n+d.players.length,0)} roster references in complete directory`;
      $('#empty-search').hidden=count!==0;
    }
    function renderStandings(){
      const s=$('#standings-sort').value;
      const arr=[...home.hub.standings].sort((a,b)=>s==='name'?a.team.name.localeCompare(b.team.name):s==='points'?b.pointsFor-a.pointsFor||a.rank-b.rank:s==='wins'?b.wins-a.wins||a.rank-b.rank:a.rank-b.rank);
      $('#standings-list').innerHTML=arr.map(r=>`<li class="standing-row" aria-label="Rank ${r.rank}, ${esc(r.team.name)}, ${r.wins} wins, ${r.losses} losses, ${(r.pointsFor/100).toFixed(2)} points for"><span class="num rank">${r.rank}</span><a href="/teams/${esc(r.team.id)}">${esc(r.team.name)}${personal?.team.id===r.team.id?' · You':''}</a><span class="num">${r.wins}</span><span class="num">${r.losses}</span><span class="num">${(r.pointsFor/100).toFixed(2)}</span></li>`).join('');
    }
    $('#team-search').addEventListener('input',renderDirectory);$('#team-sort').addEventListener('change',renderDirectory);$('#standings-sort').addEventListener('change',renderStandings);
    $('#clear-search').addEventListener('click',()=>{$('#team-search').value='';renderDirectory();$('#team-search').focus();});
    const menuButton=$('#menu-button'),mobileLinks=$('#mobile-links');
    function closeMenu(focus=false){menuButton.setAttribute('aria-expanded','false');mobileLinks.hidden=true;mobileLinks.classList.remove('open');if(focus)menuButton.focus();}
    menuButton.addEventListener('click',()=>{const open=menuButton.getAttribute('aria-expanded')==='true';if(open)closeMenu();else{menuButton.setAttribute('aria-expanded','true');mobileLinks.hidden=false;mobileLinks.classList.add('open');}});
    document.addEventListener('keydown',e=>{if(e.key==='Escape'){if(menuButton.getAttribute('aria-expanded')==='true')closeMenu(true);for(const d of document.querySelectorAll('.nav-tools[open]')){d.open=false;d.querySelector('summary').focus();}}});
    mobileLinks.addEventListener('click',e=>{if(e.target.closest('a'))closeMenu();});
    matchMedia('(min-width:64rem)').addEventListener('change',()=>closeMenu());
    renderDirectory();renderStandings();
    document.querySelectorAll('img').forEach(img=>img.addEventListener('error',()=>{if(img.closest('.portrait-wrap'))img.closest('.portrait-wrap').classList.add('failed');}));
    document.querySelector('main').dataset.mockReady='10';
  </script>
</body>
</html>
