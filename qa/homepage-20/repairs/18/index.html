<body>
  <a class="skip" href="#main">Skip to content</a>
  <div id="app"></div>
  <noscript><main class="wrap"><h1>GOAT Hoopers</h1><p>This static design fixture needs JavaScript to display its local league inventory. <a href="../../inventory.json">Read the complete fixture</a>.</p></main></noscript>
  <script type="module">
    import {inventory,data,mode,aiState,esc,money} from '../../data.js';
    const member=mode==='member', home=data.home, edition=home.edition, summary=member?data.personal.summary:null;
    const directory=home.directory, teams=new Map(directory.map(d=>[d.identity.id,d.identity]));
    const teamName=id=>teams.get(String(id))?.name??`Unmatched team ${id}`;
    const date=(v,short=false)=>v==null?'Unavailable':new Intl.DateTimeFormat('en-US',{year:'numeric',month:'short',day:'numeric',...(short?{}:{hour:'2-digit',minute:'2-digit',timeZoneName:'short'}),timeZone:'UTC'}).format(new Date(v));
    const pct=v=>v==null?'Unavailable':`${Math.round(v*100)}%`;
    const score=v=>v==null?'Pending':Number(v).toFixed(1);
    const record=t=>`${t.wins}–${t.losses}${t.ties?`–${t.ties}`:''}`;
    const tl=t=>`<a href="/teams/${esc(t.id)}">${esc(t.name)}</a>`;
    const pl=(id,name)=>`<a href="/player/${esc(id)}">${esc(name)}</a>`;
    const initials=name=>name.split(/\s+/).slice(0,2).map(x=>x[0]).join('');
    const portrait=(id,name,extra='')=>inventory.portraits[id]?`<img class="portrait ${extra}" src="${esc(inventory.portraits[id])}" alt="" loading="eager" width="72" height="72">`:`<span class="portrait portrait-fallback ${extra}" aria-hidden="true">${esc(initials(name))}</span>`;
    const localHref=href=>href.startsWith('https://goathoopers.com')?new URL(href).pathname:href;
    const pair=directory.find(d=>d.identity.id===(summary?.team.id??directory[0].identity.id))?.currentMatchup;
    const currentWeek=pair?.week??data.weekly?.week??'Unavailable';
    const nav=[['Home','/'],['News','/intel'],['Stocks','/stocks'],['History','/history'],['Arcade','/arcade']];
    const leagueNav=[['AI Decides','/ai-decides'],['Teams','/teams'],['Transactions','/transactions'],['Trade Analyzer','/trade-analyzer'],['Weekly archive','/weekly'],['Draft','/draft']];
    const navLinks=items=>items.map(([label,href])=>`<a href="${href}" ${label==='Home'?'aria-current="page"':''}>${label}</a>`).join('');
    const compare=()=>`<div class="comparison"><a href="?view=member${aiState!=='ready'?`&ai=${esc(aiState)}`:''}" ${member?'aria-current="page"':''}>Member view</a><a href="?view=public${aiState!=='ready'?`&ai=${esc(aiState)}`:''}" ${!member?'aria-current="page"':''}>Public view</a></div>`;
    function hero(){return `<section class="night" aria-labelledby="match-heading"><div class="wrap"><div class="night-top"><span class="eyebrow"><strong>Week ${String(currentWeek).padStart(2,'0')}</strong> / 2026 season</span><span class="small">${member?'Your matchup':'Featured current matchup'} · incomplete</span></div><div class="night-grid"><div class="matchup"><h1 id="match-heading">${member?'Your week on the court':'This week on the court'}</h1>${pair?[['home',pair.home,pair.homePoints],['away',pair.away,pair.awayPoints]].map(([side,t,pts])=>`<div class="score-row"><div><h2>${tl(t)}</h2><p class="manager small">${esc(t.managerName)} · <span class="num">${record(t)}</span> record${member&&t.id===summary.team.id?' · Your team':''}</p></div><div class="score num ${pts==null?'pending':''}" aria-label="${esc(t.name)} score ${score(pts)}">${score(pts)}</div></div>`).join(''):'<p>Current matchup unavailable.</p>'}<div class="score-state small"><span class="status">Scoring incomplete</span><span>0.0 is known. Pending is unavailable.</span></div><div class="actions">${member?'<a class="button primary" href="/team">My team</a><a class="button" href="/teams/1#team-roster">View roster</a>':'<a class="button primary" href="#directory">Explore all teams</a>'}<a class="button" href="#saved-picks">Saved AI picks</a></div></div><figure class="court-window"><img src="${inventory.assets.game}" alt="Original GOAT free-throw practice court with a basketball and hoop" width="1248" height="697"><figcaption class="court-caption"><div><span class="eyebrow">Night practice</span><p class="small">Local court · no rewards</p></div><a href="/arcade/free-throw">Play free throws</a></figcaption></figure></div><div class="night-bottom small"><p>Fixture as of ${date(home.checkedAt)}. Scores are synthetic.</p><p>Dated editorial: ${esc(edition.dateLabel)} · <a href="#edition">stale sample edition</a></p></div></div></section>`}
    function personal(){if(!summary)return `<div class="wrap public-note"><div><h2>Ten teams. Same gym.</h2><p class="small muted" style="margin-top:8px">Public league view. The member comparison includes a synthetic personal team desk.</p></div><div class="actions"><a class="button primary" href="#directory">Find a team or player</a><a class="button" href="?view=member">Compare member view</a></div></div>`;
      const v=summary.valuation;return `<section class="desk wrap" data-personal aria-labelledby="desk-heading"><div class="desk-top"><div><p class="eyebrow muted">Your desk / ${esc(summary.team.managerName)}</p><h2 id="desk-heading">${esc(summary.team.name)}</h2><p class="small muted"><span class="num">${summary.coverage.roster}</span> roster players · Standing <span class="num">${summary.standing.rank} / ${summary.season.totalTeams}</span> · <span class="num">${record(summary.team)}</span> record</p></div><a class="link-line" href="/teams/1#team-roster">Open complete roster</a></div><div class="desk-grid"><div class="valuation"><p class="small">${v.complete?'Your roster value':'Your roster value · partial subtotal'}</p><p class="total num">${money(v.total).replace('$','$<wbr>')}</p><p class="small muted">Modeled FAAB value · ${esc(summary.market.pricingBasis)} pricing basis</p><div class="valuation-detail small"><span><strong>${v.priced}</strong> priced / ${summary.coverage.roster} players</span><span><strong>${v.unpriced}</strong> unpriced</span>${v.complete&&v.rank?`<span>Value rank <strong>${v.rank.rank} of ${v.rank.teams}</strong></span>`:''}</div><p class="meta muted">Computed ${date(summary.market.updatedAt)} · Synthetic model values</p><details class="roster-values"><summary>All ${summary.rosterValues.length} player values</summary><ul class="ruled-list value-list" data-roster-values>${summary.rosterValues.map(p=>`<li><div>${pl(p.id,p.name)} <span class="meta muted">${esc(p.position)}</span></div><span class="num small">${money(p.value)}</span></li>`).join('')}</ul></details><p class="small muted history-line">${esc(inventory.missing.history)}</p><a class="link-line" href="/stocks">Inspect player values in Stocks</a></div><div class="price-top"><h3>Highest modeled values</h3><p class="small muted">Asset price, separate from observed form.</p><ul class="ruled-list">${summary.players.map(p=>`<li class="value-row"><div class="player-line">${portrait(p.id,p.name)}<div>${pl(p.id,p.name)}<p class="meta muted">${esc(p.position)} · ${p.changePct==null?'Price change unavailable':`${p.changePct>0?'Up':p.changePct<0?'Down':'Flat'} ${Math.abs(p.changePct).toFixed(1)}% modeled price`}</p></div></div><span class="num">${money(p.value)}</span></li>`).join('')}</ul><p class="meta muted" style="margin-top:8px">Price-change comparison period unavailable in this fixture. No recorded history is connected.</p></div></div></section>`}
    function scout(){let left,right;
      if(summary){const g=summary.playerGuide;left=`<div><h3>Players to watch</h3><p class="basis">${esc(g.watch.label)}</p><ul class="ruled-list">${g.watch.rows.map(p=>`<li class="guide-line"><div class="player-line">${portrait(p.id,p.name)}<div>${pl(p.id,p.name)}<p class="meta muted">${esc(p.note)}</p></div></div><div class="guide-number"><strong class="num">${p.value.toFixed(1)}</strong><p class="meta muted">FP / game · ${p.games} GP</p></div></li>`).join('')}</ul><p class="small muted observed-note">${esc(g.watch.message)}</p><p class="meta muted" style="margin-top:8px">${esc(g.season)} season · observed ${g.watch.rows[0]?.games??'Unavailable'} games per shown player · exact observation dates unavailable.</p></div>`;
        const ids=[...new Set([...g.best,...g.rough].map(p=>p.id))];right=`<div><h3>Your completed week</h3><p class="basis">Best ${g.best.length} / rough ${g.rough.length} selections · ${g.eligiblePlayed} eligible players</p><ul class="ruled-list recap-list">${ids.map(id=>{const b=g.best.find(p=>p.id===id),r=g.rough.find(p=>p.id===id),p=b??r;return `<li class="guide-line"><div class="player-line">${portrait(p.id,p.name)}<div>${pl(p.id,p.name)}<p class="form-category">${b&&r?'Best & rough groups · shared selection':b?'Your best group':'Rough week group'}</p></div></div><div class="guide-number"><strong class="num">${p.value.toFixed(1)}</strong><p class="meta muted">points · ${p.games} GP</p></div></li>`}).join('')}</ul><p class="meta muted" style="margin-top:12px">${esc(g.period)}</p><p class="small muted observed-note">${esc(g.coverage)}</p><p class="meta muted" style="margin-top:8px">Synthetic completed-week fixture. Not current official Week 2 awards. Recorded weekly fantasy points, not modeled price.</p></div>`;
      } else {left=`<div><h3>League player context</h3><p class="basis">Highest modeled player for selected rosters · synthetic FAAB basis</p><ul class="ruled-list">${data.faces.slice(0,3).map(f=>`<li class="guide-line"><div class="player-line">${portrait(f.player.id,f.player.name)}<div>${pl(f.player.id,f.player.name)}<p class="meta muted">${esc(f.team.name)}</p></div></div><span class="num">${money(f.player.value)}</span></li>`).join('')}</ul><p class="small muted observed-note">These prices describe modeled asset value. Public observed-form evidence is unavailable.</p></div>`;const watch=edition.playerSpotlights.find(p=>p.role==='one-to-watch');right=`<div><h3>Editorial one to watch</h3><p class="basis">Dated preseason opinion · ${esc(edition.dateLabel)}</p><div class="player-line">${portrait(watch.playerId,watch.name)}<div>${pl(watch.playerId,watch.name)}<p class="small muted">${esc(watch.statPeriod)}</p></div></div><p style="margin-top:16px">${esc(watch.opinion)}</p><p class="small muted observed-note">${esc(watch.selectionReason)}</p><a class="link-line" href="#spotlight-${watch.playerId}">See stats and source</a></div>`;}
      return `<section class="paper-section" id="notebook"><div class="section-head"><h2>Scouting notebook</h2><p class="small muted">${summary?'Synthetic observed form and completed-week points. Price and editorial use their own bases.':'Player prices and dated editorial; each keeps its source and period.'}</p></div><div class="scout-grid">${left}${right}</div>${summary?`<div class="wire"><div><h3>Your team wire</h3><ul class="ruled-list">${summary.news.map(n=>`<li><a href="${esc(n.url)}">${esc(n.headline)}</a><time class="meta muted">${esc(n.outlet.name)} · ${date(n.publishedAt,true)} · Synthetic news</time></li>`).join('')}</ul></div><div><h3>Recent moves</h3><ul class="ruled-list">${summary.moves.map(m=>`<li><p>${esc(m.summary)}</p><time class="meta muted">Week ${m.week} · ${date(m.createdAt,true)} · Synthetic move</time></li>`).join('')}</ul><a class="link-line" href="/transactions">All transactions</a></div></div>`:''}</section>`}
    function leagueEdition(){return `<section class="paper-section" id="edition" aria-labelledby="edition-title"><div class="edition-heading"><div><p class="eyebrow muted">The league edition / dated sample</p><h2 id="edition-title">${esc(edition.title)}</h2></div><div class="edition-date"><p class="small">${esc(edition.dateLabel)}</p><p class="meta edition-warning">Stale sample · draft, never published</p><p class="meta muted">Editorial selection checked Oct 8, 2026</p></div></div><div class="spotlights">${edition.playerSpotlights.map(p=>`<article class="spotlight" id="spotlight-${esc(p.playerId)}"><div class="spotlight-top">${portrait(p.playerId,p.name)}<div><p class="meta muted">${esc(p.periodLabel)}</p><h3>${pl(p.playerId,p.name)}</h3><a class="meta muted" href="/teams/${esc(p.teamId)}">${esc(teamName(p.teamId))}</a></div></div><p class="headline">${esc(p.headline)}</p><p class="opinion">${esc(p.opinion)}</p><div class="stats-line">${p.stats.map(s=>`<div><strong>${esc(s.value)}</strong><span class="meta muted">${esc(s.label)}</span></div>`).join('')}</div><p class="meta muted period">${esc(p.statPeriod)}</p><details><summary>Selection and source</summary><div class="source-note"><p>${esc(p.selectionReason)}</p><p>Sample editorial selection, ${esc(edition.dateLabel)}. Not an official current-week award.</p><a href="${esc(p.source.url)}">${esc(p.source.label)}</a><p class="meta">Checked ${esc(p.source.checkedAt)}</p></div></details></article>`).join('')}</div></section><section class="paper-section" aria-labelledby="around-title"><div class="section-head"><h2 id="around-title">Around the league</h2><p class="small muted">${esc(edition.dateLabel)} · dated sample happenings</p></div><div class="happenings">${edition.happenings.map(h=>`<article class="happening"><time class="meta muted">${esc(h.dateLabel)} · 2026</time><h3><a href="${esc(localHref(h.href))}">${esc(h.title)}</a></h3><p>${esc(h.text)}</p></article>`).join('')}</div><details style="margin-top:24px"><summary class="small">Editorial sources and dates</summary><ul class="source-list">${edition.sources.map(s=>`<li><a href="${esc(s.url)}">${esc(s.label)}</a><span class="meta muted"> · checked ${esc(s.checkedAt)}</span></li>`).join('')}</ul></details></section>`}
    function ai(){const weekly=data.weekly;return `<section class="paper-section" id="saved-picks"><div class="ai-top"><div><p class="eyebrow muted">AI Decides / saved slate</p><h2 style="margin-top:8px">The model’s call</h2><a class="link-line" href="/ai-decides">Open AI Decides</a></div><div><span class="ai-state">${!weekly?'Unavailable':weekly.status==='stale'?'Stale saved AI picks':'Saved synthetic picks'}${weekly?` · Week ${weekly.week}`:''}</span><p class="small muted">Returned choices are printed separately from model probabilities and confidence. These synthetic probabilities are not calibrated sports odds. No model runs on this page.</p>${weekly?`<p class="meta muted" style="margin-top:8px">Saved ${date(weekly.generatedAt)}${weekly.status==='stale'?' · Stale results remain visible as past saved evidence.':''}</p>`:''}</div></div>${!weekly?'<p class="empty-line">Saved AI slate unavailable. No probabilities, choices or confidence are supplied. <a href="?view='+mode+'&ai=ready">View the ready fixture</a>.</p>':weekly.matchups.map(p=>{const r=p.result;const matching=directory.some(d=>d.currentMatchup?.week===weekly.week&&[d.currentMatchup.home.id,d.currentMatchup.away.id].every((id,i)=>id===p.teamIds[i]));const ready=!!r&&p.status==='ready'&&matching;return `<article class="ai-row" data-ai-pair="${esc(p.teamIds.join('-'))}"><div class="ai-row-main"><div><p class="small">${p.teamIds.map(id=>tl(teams.get(id)??{id,name:teamName(id)})).join('<br>')}</p></div><div class="ai-choice"><span class="meta muted">Returned choice${member&&p.teamIds.includes(summary.team.id)?' · Your matchup':''}</span><p><strong>${ready?esc(teamName(r.choice)):'Unavailable'}</strong></p><p class="meta muted">${weekly.status==='stale'?'Stale · ':''}${ready?`Confidence ${pct(r.confidence)} · separate model signal`:matching?'Missing saved result':'Unmatched current pair'}</p></div><div class="distribution">${ready?r.probabilities.map(pr=>`<div class="prob-row"><a href="/teams/${esc(pr.choice)}">${esc(teamName(pr.choice))}</a><strong class="num">${pct(pr.probability)}</strong></div>`).join(''):'<p class="small muted">Probabilities unavailable</p>'}${ready?`<div class="bar" aria-hidden="true">${r.probabilities.map(pr=>`<span style="width:${pr.probability*100}%"></span>`).join('')}</div>`:''}</div></div><details class="ai-provenance"><summary>Provenance, saved time and evidence</summary><div class="provenance-grid"><div><strong>Model / prompt</strong>${esc(r?.model??'Unavailable')} / ${esc(r?.promptVersion??'Unavailable')}<p class="meta">${esc(p.message)}</p></div><div><strong>Saved at</strong>${date(weekly.generatedAt)}<p class="meta">${esc(weekly.season)} · Week ${weekly.week} · ${esc(weekly.status)} slate / ${esc(p.status)} pair</p></div><div><strong>Input snapshot</strong>${r?.snapshot?esc(JSON.stringify(r.snapshot)):'Unavailable'}<p class="meta">Weekly snapshot: ${weekly.snapshot?esc(JSON.stringify(weekly.snapshot)):'Unavailable'} · Baseline: ${p.baseline?esc(JSON.stringify(p.baseline)):'Unavailable'}</p></div><div><strong>Evidence</strong>${p.evidence?.length?p.evidence.map(esc).join('<br>'):'Input evidence unavailable'}<p class="meta">Model-result evidence: ${r?.evidence?.length?r.evidence.map(esc).join('; '):'Unavailable'}</p></div><div><strong>Probability basis</strong>${esc(r?.probabilityLabel??'Unavailable')}<p class="meta">Confidence ${pct(r?.confidence)} is independent of the probability split.</p></div><div><strong>Current-pair check</strong>${matching?'Matches current Week '+weekly.week+' ordered roster IDs.':'Unmatched · prediction unavailable.'}<p class="meta">IDs ${esc(p.teamIds.join(' / '))}; names shown are current display names. Preview-period closure unavailable.</p></div></div></details></article>`}).join('')}</section>`}
    function faces(){return `<section class="paper-section" id="faces"><div class="section-head"><h2>Faces of the league</h2><p class="small muted">All ten teams · top modeled player per current roster · synthetic FAAB prices</p></div><div class="faces">${data.faces.map(f=>`<article class="face" data-face="${esc(f.team.id)}">${portrait(f.player.id,f.player.name)}<a class="team-name" href="/teams/${esc(f.team.id)}"><span class="identity-dot" style="--team:var(--gh-team-${esc(f.team.id)})"></span>${esc(f.team.name)}</a><h3>${pl(f.player.id,f.player.name)}</h3><p class="meta muted">${esc(f.player.position)}${f.champion?' · <span class="champion">2025 champion</span>':''}</p><p class="num price">${money(f.player.value)}</p></article>`).join('')}</div></section>`}
    function directoryTeam(d){const t=d.identity,m=d.currentMatchup,op=m?(m.home.id===t.id?m.away:m.home):null,rec=d.currentRecord;return `<article class="team-row" data-team-id="${esc(t.id)}"><div class="team-row-top"><div><h3><span class="identity-dot" style="--team:var(--gh-team-${esc(t.id)})"></span>${tl(t)}</h3><p class="small muted manager">${esc(t.managerName)}${summary?.team.id===t.id?' · Your team':''}</p></div><div class="record"><p class="num">${rec?record(rec):'Unavailable'}</p><p class="meta muted">2026 record</p></div></div><p class="current-opponent">${op?`Week ${m.week}: vs ${tl(op)} · Scoring incomplete`:'Current opponent unavailable'}</p><details class="directory-roster"><summary>${d.players.length} roster players</summary>${d.previousSeason?`<p class="small muted previous">${esc(d.previousSeason.season)}: ${d.previousSeason.wins}–${d.previousSeason.losses} · Finish ${d.previousSeason.finish}.${d.previousSeason.ownerNote?' <strong>'+esc(d.previousSeason.ownerNote)+'</strong>':''}</p>`:''}<ul class="team-roster">${d.players.map(p=>`<li>${pl(p.id,p.fullName)}<span>${esc(p.position??'Position unavailable')} · ${esc(p.nbaTeam??'NBA team unavailable')}</span></li>`).join('')}</ul><a class="link-line" href="/teams/${esc(t.id)}#team-roster">Open team roster</a></details></article>`}
    function standingsRows(rows){return rows.map(r=>`<tr ${summary?.team.id===r.team.id?'data-viewer="true"':''}><td class="num">${r.rank}</td><td>${tl(r.team)}${summary?.team.id===r.team.id?'<span class="meta muted"> · You</span>':''}</td><td class="num" data-label="W">${r.wins}</td><td class="num" data-label="L">${r.losses}</td><td class="num" data-label="PF">${(r.pointsFor/100).toFixed(1)}</td></tr>`).join('')}
    function reference(){return `<div class="paper-section reference"><section id="directory" aria-labelledby="directory-heading"><h2 id="directory-heading">The team book</h2><p class="small muted">Current identities, managers, opponents and every roster.</p><div class="reference-controls"><label for="team-search">Find team, manager or player<input id="team-search" type="search" placeholder="Try NeuralNets or Lillard" autocomplete="off"></label><label for="team-sort">Sort teams<select id="team-sort"><option value="rank">Standing rank</option><option value="name">Team name A–Z</option><option value="roster">Roster size, largest</option></select></label></div><p class="meta muted count" id="directory-count" aria-live="polite">10 teams · 228 player references</p><div id="team-list">${directory.map(directoryTeam).join('')}</div><p id="no-teams" hidden class="empty-line">No matching teams or players. Clear the search to see all ten teams.</p></section><section class="standings" id="standings" aria-labelledby="standings-heading"><h2 id="standings-heading">League table</h2><div class="standing-sort"><label for="standing-sort" class="small">Sort standings</label><select id="standing-sort"><option value="rank">Rank, ascending</option><option value="pf">Points for, descending</option><option value="wins">Wins, descending</option><option value="name">Team name A–Z</option></select></div><table><caption>2026 synthetic standings · PF = source pointsFor ÷ 100</caption><thead><tr><th scope="col">Rank</th><th scope="col">Team</th><th scope="col">W</th><th scope="col">L</th><th scope="col">PF</th></tr></thead><tbody id="standings-body">${standingsRows(home.hub.standings)}</tbody></table><div class="stat-unavailable"><h3>League stats</h3><p class="small muted">Unavailable: points-for leader, points-against leader, longest win streak, most active manager, biggest blowout and closest game. No producer results are supplied.</p></div><div class="stat-unavailable"><h3>Lineup Power</h3><p class="small muted">${esc(inventory.missing.power)}</p></div><div class="transactions"><h3>Transactions</h3><p class="meta muted">Synthetic Week ${currentWeek} league moves</p><ul class="ruled-list">${home.hub.transactions.map(t=>`<li><p class="small">${esc(t.summary)}</p><time class="meta muted">${date(t.createdAt,true)} · Week ${t.week}</time></li>`).join('')}</ul><a class="link-line" href="/transactions">View transaction log</a></div></section></div>`}
    function toolsSection(){return `<section class="paper-section" aria-labelledby="tools-heading"><div class="section-head"><h2 id="tools-heading">Between matchups</h2><a class="link-line" href="/arcade">Open Arcade</a></div><div class="toolstrip"><figure><img src="${inventory.assets.court}" alt="The original GOAT Hoopers basketball arena" loading="eager" width="1440" height="810"><figcaption>The original league court. Practice links open the existing game.</figcaption></figure><article><h3>Work the market.</h3><p>Inspect modeled player values or compare both sides of a trade. Fixture prices are synthetic; no moves are submitted here.</p><div class="actions"><a class="button primary" href="/stocks">Stocks & market</a><a class="button" href="/trade-analyzer">Trade analyzer</a></div></article><article><h3>Get your shots up.</h3><p>Local free-throw practice is ready in the Arcade. This preview does not show scores, a ranking or reward eligibility.</p><div class="actions"><a class="button primary" href="/arcade/free-throw">Play free throws</a><a class="button" href="/arcade">Arcade catalog</a></div></article></div></section><section class="paper-section" id="archive"><div class="section-head"><h2>The weekly archive</h2><a class="link-line" href="/weekly">All editions</a></div><div class="archive-list">${data.archive.map(a=>`<article><p class="eyebrow muted">${esc(a.dateLabel)}</p><h3><a href="/weekly/${esc(a.id)}">${esc(a.title)}</a></h3><p class="small muted">Dated sample · ${esc(a.status)} · not published</p><a class="link-line" href="/weekly/${esc(a.id)}">Read this edition</a></article>`).join('')}</div></section>`}
    document.querySelector('#app').innerHTML=`<header class="chrome"><div class="wrap header-row"><a href="/" class="brand" aria-label="GOAT Hoopers home"><img src="${inventory.assets.logo}" alt="GOAT Hoopers" width="180" height="66"></a><nav class="primary-nav" aria-label="Primary">${navLinks(nav)}</nav><a class="button mobile-only" href="/stocks">Stocks</a><details class="menu" id="league-menu"><summary aria-label="Open league navigation">Menu</summary><nav class="menu-links" aria-label="League destinations"><div class="wrap">${navLinks(nav.filter(([l])=>l!=='Stocks'))}${navLinks(leagueNav)}${member?'<a href="/team">My team</a><a href="/teams/1#team-roster">View roster</a>':''}</div></nav></details>${member?'<a class="account-link" href="/team">My team</a>':''}</div></header><div class="warning"><div class="wrap warning-inner"><p class="small"><strong>Offline design fixture.</strong> All current records, scores, prices, form, news and AI are synthetic. Dated approved identities/editorial retained.</p>${compare()}</div></div><main id="main" tabindex="-1">${hero()}${personal()}<div class="wrap"><nav class="content-subnav" aria-label="On this page"><a href="#notebook">Notebook</a><a href="#edition">League edition</a><a href="#saved-picks">AI picks</a><a href="#directory">Team book</a><a href="#standings">Standings</a><a href="#archive">Archive</a></nav>${scout()}${leagueEdition()}${ai()}${faces()}${reference()}${toolsSection()}</div></main><footer class="footer"><div class="wrap"><div class="footer-top"><a href="/" aria-label="GOAT Hoopers home"><img src="${inventory.assets.logo}" alt="GOAT Hoopers" width="160" height="59"></a><nav class="footer-links" aria-label="Footer">${navLinks([...nav,...leagueNav])}${member?'<a href="/team">My team</a><a href="/teams/1#team-roster">View roster</a>':''}</nav></div><div class="footer-source"><p class="small muted">${esc(inventory.warning)} Static HTML design only: comparison links switch fixtures and do not establish authentication. Destination links retain app routes.</p><details><summary class="small">Fixture provenance and limits</summary><p class="small muted">Source benchmark <span class="num">${esc(inventory.benchmark)}</span>. Actual dated roster identities, local portraits and approved editorial are retained. Current scores, records, prices, player form, news and saved predictions are synthetic. Edition ${esc(edition.id)} ended ${date(edition.endsAt,true)} and remains a stale, unpublished sample. The Week ${currentWeek} matchup uses the current directory rather than the dated editorial pairing. No recorded value-history series or power ranking is supplied.</p></details>${compare()}</div></div></footer>`;
    document.querySelectorAll('img.portrait').forEach(img=>img.addEventListener('error',()=>{const fallback=document.createElement('span');fallback.className='portrait portrait-fallback';fallback.setAttribute('aria-hidden','true');fallback.textContent='GH';img.replaceWith(fallback)},{once:true}));
    const teamList=document.querySelector('#team-list'), search=document.querySelector('#team-search'), sort=document.querySelector('#team-sort');
    const directoryNodes=new Map([...teamList.children].map(node=>[node.dataset.teamId,node]));
    function updateDirectory(){const q=search.value.trim().toLocaleLowerCase();let shown=0,refs=0;const rows=[...directory].sort((a,b)=>sort.value==='name'?a.identity.name.localeCompare(b.identity.name):sort.value==='roster'?b.players.length-a.players.length||a.identity.name.localeCompare(b.identity.name):(home.hub.standings.find(r=>r.team.id===a.identity.id)?.rank??99)-(home.hub.standings.find(r=>r.team.id===b.identity.id)?.rank??99));for(const d of rows){const node=directoryNodes.get(d.identity.id),identity=`${d.identity.name} ${d.identity.managerName}`.toLocaleLowerCase(),playerMatch=d.players.some(p=>p.fullName.toLocaleLowerCase().includes(q));const matches=!q||identity.includes(q)||playerMatch;node.hidden=!matches;teamList.append(node);if(matches){shown++;refs+=d.players.length}if(q&&playerMatch&&!identity.includes(q))node.querySelector('details').open=true;}document.querySelector('#directory-count').textContent=`${shown} ${shown===1?'team':'teams'} · ${refs} roster player references${q?' in matching teams':''}`;document.querySelector('#no-teams').hidden=shown!==0;}
    search.addEventListener('input',updateDirectory);sort.addEventListener('change',updateDirectory);
    document.querySelector('#standing-sort').addEventListener('change',e=>{const key=e.target.value;const rows=[...home.hub.standings].sort((a,b)=>key==='pf'?b.pointsFor-a.pointsFor||a.rank-b.rank:key==='wins'?b.wins-a.wins||a.rank-b.rank:key==='name'?a.team.name.localeCompare(b.team.name):a.rank-b.rank);document.querySelector('#standings-body').innerHTML=standingsRows(rows)});
    const menu=document.querySelector('#league-menu');menu.addEventListener('keydown',e=>{if(e.key==='Escape'&&menu.open){menu.open=false;menu.querySelector('summary').focus()}});menu.querySelectorAll('a').forEach(a=>a.addEventListener('click',()=>menu.open=false));
    document.body.dataset.mockReady='18';
  </script>
