<body>
  <a class="skip" href="#main">Skip to content</a>
  <header class="masthead"><div class="wrap masthead-inner" id="header"></div></header>
  <div class="wrap fixture" id="fixture"></div>
  <main id="main" class="wrap"><p style="padding:32px 0">Loading the offline league rundown…</p></main>
  <footer class="wrap" id="footer"></footer>
  <noscript><p class="wrap">This static concept needs JavaScript to read its bundled offline fixture. League destinations remain available at goathoopers.com.</p></noscript>
  <script type="module">
    import {inventory,data,mode,aiState,esc,money} from '../../data.js';
    const member=mode==='member', summary=member?data.personal.summary:null, home=data.home, edition=home.edition;
    const teams=home.directory, teamMap=new Map(teams.map(t=>[t.identity.id,t.identity]));
    const date=(v)=>v?new Intl.DateTimeFormat('en-US',{month:'short',day:'numeric',year:'numeric',timeZone:'UTC'}).format(new Date(v)):'Unavailable';
    const stamp=(v)=>v?`${date(v)} · ${new Date(v).toISOString().slice(11,16)} UTC`:'Unavailable';
    const teamLink=(id,name)=>`<a href="/teams/${esc(id)}">${esc(name??teamMap.get(id)?.name??`Roster ${id}`)}</a>`;
    const playerLink=(id,name)=>`<a href="/player/${esc(id)}">${esc(name)}</a>`;
    const pct=v=>`${Math.round(v*100)}%`;
    const portrait=(id,name,cls='')=>inventory.portraits[id]?`<img class="portrait ${cls}" src="${esc(inventory.portraits[id])}" alt="" width="88" height="100">`:`<span class="portrait fallback ${cls}" aria-label="Portrait unavailable">${esc(name.split(' ').map(n=>n[0]).slice(0,2).join(''))}</span>`;
    const heading=(n,title,description='',action='')=>`<div class="section-head"><div><h2><span class="section-no">${n}</span> ${title}</h2>${description?`<p class="secondary">${description}</p>`:''}</div>${action}</div>`;
    const navItems=[['Home','index.html?view='+mode],['News','/intel'],['Stocks','/stocks'],['History','/history'],['Arcade','/arcade'],['AI Decides','/ai-decides'],['Teams','/teams'],['Transactions','/transactions'],['Weekly archive','/weekly'],...(member?[['My team','/team']]:[])];
    const nav=navItems.map(([name,url])=>`<a href="${esc(url)}"${name==='Home'?' aria-current="page"':''}>${name}</a>`).join('');
    const switchUrl=view=>`index.html?view=${view}${aiState==='ready'?'':`&ai=${encodeURIComponent(aiState)}`}`;
    document.querySelector('#header').innerHTML=`<a class="brand" href="index.html?view=${mode}" aria-label="GOAT Hoopers home"><img src="${inventory.assets.logo}" alt="GOAT Hoopers" width="192" height="48"></a><nav class="desktop-nav" aria-label="League navigation">${nav}</nav><a class="mode-link" href="${switchUrl(member?'public':'member')}">${member?'Public view':'Member view'} →</a><details class="mobile-menu"><summary>Menu +</summary><nav aria-label="League navigation">${nav}<a href="${switchUrl(member?'public':'member')}">Compare ${member?'public':'member'} view →</a></nav></details>`;
    document.querySelector('#fixture').innerHTML=`<strong>OFFLINE DESIGN FIXTURE.</strong> All current records, scores, prices, form, news and AI are synthetic. Dated identities and editorial are preserved. <a href="#source-notes">Source notes ↓</a><a href="${switchUrl(member?'public':'member')}">Compare ${member?'public':'member'} view →</a>`;
    const pair=(summary?.matchup??teams.find(t=>t.currentMatchup)?.currentMatchup);
    const scoreboardTeam=(team,score)=>`<div class="score-row"><div class="score-team">${teamLink(team.id,team.name)}<p>${esc(team.managerName)} <span class="num">· ${team.wins}–${team.losses}${team.ties?`–${team.ties}`:''}</span></p></div><div class="score-number num ${score==null?'pending':''}">${score==null?'Pending':Number(score).toFixed(1)}</div></div>`;
    const top=`<div class="edition-line"><span class="eyebrow">GOAT Hoopers / ${home.hub.season.seasonYear} season</span><span class="num">Fixture checked ${stamp(home.checkedAt)}</span></div><section class="broadcast" aria-labelledby="rundown-title"><div class="broadcast-title"><div><p class="eyebrow">Current pairing</p><h1 id="rundown-title">Week ${pair.week}<br>rundown</h1></div><p class="match-status">Scoring incomplete</p></div><div class="scoreboard"><div class="scoreboard-head"><span>${member?'Your current matchup':'Featured current matchup'}</span><span>Fantasy points</span></div>${scoreboardTeam(pair.home,pair.homePoints)}${scoreboardTeam(pair.away,pair.awayPoints)}<p class="score-note">Recorded zero is shown as 0.0. Pending means no score is available. This pairing is not final. Editorial below is the older Oct 5–11 draft sample.</p></div><nav class="rundown" aria-label="This page"><p class="eyebrow">On the desk</p><ol><li><a href="#desk"><span class="num">01</span>${member?'Your team desk':'League notebook'}</a></li><li><a href="#editorial"><span class="num">02</span>Dated sample picks</a></li><li><a href="#ai"><span class="num">04</span>Saved AI slate</a></li><li><a href="#directory"><span class="num">06</span>All ten rosters</a></li><li><a href="#standings"><span class="num">07</span>Standings</a></li></ol></nav></section><div class="arena-strip"><img src="${inventory.assets.court}" alt="GOAT Hoopers basketball arena" width="360" height="96"><div><p><strong>Our court, between matchups.</strong><br>A quiet route to the league’s free-throw practice.</p><a class="text-action" href="/arcade/free-throw">Shoot around →</a></div></div>`;
    function personalDesk(){
      const s=summary,g=s.playerGuide;
      const recapRows=rows=>rows.map(p=>`<li>${playerLink(p.id,p.name)}<span class="num">${p.value.toFixed(1)} pts · ${p.games} GP</span><small class="secondary">${esc(p.note)}</small></li>`).join('');
      return `<section class="section" id="desk" data-personal>${heading('01','Your team desk','The current roster, its modeled value and the players to check first.')}<div class="desk-grid"><div><p class="eyebrow">${esc(s.team.managerName)} / member view</p><p class="team-name">${teamLink(s.team.id,s.team.name)}</p><p class="secondary">${s.coverage.roster} rostered players · ${esc(s.season.seasonYear)} season · sample records</p><div class="team-facts"><div class="fact"><span>Standing</span><strong class="num">${s.standing.rank}<small> / ${s.season.totalTeams}</small></strong></div><div class="fact"><span>Record · W–L</span><strong class="num">${s.standing.wins}–${s.standing.losses}</strong></div><div class="fact"><span>Points for</span><strong class="num">${(s.standing.pointsFor/100).toFixed(1)}</strong></div></div><div class="actions"><a class="button-link primary" href="/team">My team →</a><a class="button-link" href="/teams/${s.team.id}#team-roster">View roster →</a><a class="button-link" href="/stocks">Inspect prices →</a></div><div class="wire"><p class="eyebrow">Team wire / synthetic sample</p><ul>${s.news.map(n=>`<li><a href="${esc(n.url)}">${esc(n.headline)}</a><small>${esc(n.outlet.name)} · ${date(n.publishedAt)}</small></li>`).join('')}${s.moves.map(m=>`<li>${esc(m.summary)}<small>Sample move · Week ${m.week} · ${date(m.createdAt)} · <a href="/transactions">Transactions →</a></small></li>`).join('')}</ul></div></div><div class="valuation"><p class="eyebrow">Modeled roster value / FAAB</p><p class="value-total num">${money(s.valuation.total)}</p><p class="secondary">${s.valuation.priced} priced · ${s.valuation.unpriced} unpriced / ${s.coverage.roster} players. In-season modeled FAAB estimates, not cash or completed trade prices.</p><p class="meta muted" style="margin-top:8px">Value rank ${s.valuation.rank.rank} of ${s.valuation.rank.teams} · computed ${stamp(s.checkedAt)}</p><div class="top-values" aria-label="Top three modeled player values">${s.players.map(p=>`<div class="value-row">${portrait(p.id,p.name)}<div>${playerLink(p.id,p.name)}<small>${esc(p.position)} · modeled FAAB</small></div><span class="num">${money(p.value)}</span></div>`).join('')}</div><details data-roster-values><summary>All ${s.rosterValues.length} roster values</summary><div class="disclosure-body"><ul class="value-list">${s.rosterValues.map(p=>`<li>${playerLink(p.id,p.name)}<span class="num">${money(p.value)}</span></li>`).join('')}</ul><p class="meta muted">Market basis: ${esc(s.market.pricingBasis)} · source updated ${stamp(s.market.updatedAt)}. Values are synthetic fixture estimates.</p></div></details><p class="history-note">${esc(inventory.missing.history)}</p></div></div><div class="personal-lower"><div class="notebook"><p class="eyebrow">Scouting notebook / observed form</p><h3>Keep an eye on these three.</h3><p class="secondary">${esc(g.watch.label)}. Season ${g.season}, current sample Week ${g.currentWeek}. Form is separate from the modeled prices above.</p><div class="table-key"><span>Player</span><span>EMA FP/G</span><span>Games</span></div><ul class="form-list">${g.watch.rows.map(p=>`<li><div>${playerLink(p.id,p.name)}<small class="muted">${esc(p.note)}</small></div><span class="num">${p.value.toFixed(1)}</span><span class="num">${p.games}</span></li>`).join('')}</ul><p class="period-note">${esc(g.watch.message)}</p></div><div class="completed"><p class="eyebrow">Completed source week / synthetic</p><h3>Week ${g.previousWeek} performers</h3><p class="period-note">${esc(g.period)}</p><div class="recap-split"><div><p class="eyebrow">Best in this cohort</p><ul class="recap-list">${recapRows(g.best)}</ul></div><div><p class="eyebrow">Rougher in this cohort</p><ul class="recap-list">${recapRows(g.rough)}</ul></div></div><p class="period-note">${esc(g.coverage)} ${esc(inventory.missing.recap)}</p></div></div></section>`;
    }
    function publicDesk(){return `<section class="section" id="desk">${heading('01','League notebook','Public view / league and player context, with no personal roster summary.')}<div class="public-desk"><div><p class="eyebrow">Ten teams. One league.</p><h3>Find a team.<br>Know who’s on it.</h3><p class="secondary" style="margin-top:16px">The complete directory below connects every manager, current opponent and rostered player. These selected players lead their own teams by modeled value; they are not performance rankings.</p><div class="league-facts"><div class="fact"><span>Franchises</span><strong class="num">${teams.length}</strong></div><div class="fact"><span>Roster references</span><strong class="num">${teams.reduce((n,t)=>n+t.players.length,0)}</strong></div><div class="fact"><span>Season</span><strong class="num">${esc(home.hub.season.seasonYear)}</strong></div></div><a class="button-link primary" href="#directory">Explore all rosters ↓</a></div><ul class="public-selected" aria-label="Selected league faces">${[data.faces[0],data.faces[4],data.faces[7]].map(f=>`<li><div>${playerLink(f.player.id,f.player.name)}<small>${teamLink(f.team.id,f.team.name)} · modeled FAAB</small></div><span class="num">${money(f.player.value)}</span></li>`).join('')}</ul></div></section>`}
    function editorialSection(){return `<section class="section" id="editorial">${heading('02','From the sample edition',`${esc(edition.dateLabel)} · draft sample · edition window ended ${date(edition.endsAt)}. Older editorial, not current Week ${pair.week} awards.`)}<div class="editorial-grid">${edition.playerSpotlights.map((p,i)=>`<article class="story"><div class="story-top">${portrait(p.playerId,p.name)}<div><p class="eyebrow">${['Sample spotlight','Sample lookback','Editorial one to watch'][i]}</p><a class="story-name" href="/player/${p.playerId}">${esc(p.name)}</a><p class="secondary">${esc(p.periodLabel)}</p></div></div><h3>${esc(p.headline)}</h3><p>${esc(p.opinion)}</p><div class="statline">${p.stats.map(s=>`<div><strong class="num">${esc(s.value)}</strong><small>${esc(s.label)}</small></div>`).join('')}</div><p class="meta muted">${esc(p.statPeriod)} · current roster: ${teamLink(p.teamId)}</p><details><summary>Selection basis & dated source</summary><div class="disclosure-body"><p>${esc(p.selectionReason)}</p><p><a href="${esc(p.source.url)}">${esc(p.source.label)} →</a><br>Source checked ${date(p.source.checkedAt)} · sample selection in ${esc(edition.dateLabel)}.</p></div></details></article>`).join('')}</div></section>`}
    function aroundSection(){return `<section class="section" id="around">${heading('03','Around the league','Dated editorial dispatches and a separate synthetic transaction log.')}<div class="around-grid"><div><ul class="happenings">${edition.happenings.map(h=>`<li><span class="num muted">${esc(h.dateLabel)}</span><div><a href="${esc(h.href)}">${esc(h.title)}</a><p>${esc(h.text)}</p></div></li>`).join('')}</ul><p class="period-note">From “${esc(edition.title)},” ${esc(edition.dateLabel)}. Draft sample edition; these are not current breaking reports.</p><details><summary>Editorial sources / checked dates</summary><div class="disclosure-body"><ul class="source-list">${edition.sources.map(s=>`<li><a href="${esc(s.url)}">${esc(s.label)} →</a><br><small>Checked ${date(s.checkedAt)}</small></li>`).join('')}</ul></div></details></div><div class="around-right"><p class="eyebrow">Week ${pair.week} / sample transactions</p><h3 style="margin-top:8px">Recent moves</h3><ul class="transaction-list">${home.hub.transactions.map(t=>`<li>${esc(t.summary)}<small>Week ${t.week} · ${date(t.createdAt)} · ${esc(t.type.replaceAll('_',' '))}</small></li>`).join('')}</ul><a class="text-action" href="/transactions">Open transaction log →</a><p class="period-note">Adds and drops are empty in these sample records. No players or transfer values have been inferred.</p></div></div></section>`}
    const currentPairs=[...new Map(teams.filter(t=>t.currentMatchup).map(t=>[t.currentMatchup.home.id+'-'+t.currentMatchup.away.id,t.currentMatchup])).values()];
    function aiSection(){
      const w=data.weekly, stale=w?.status==='stale';
      if(!w)return `<section class="section ai-section" id="ai">${heading('04','AI Decides','Saved weekly model decisions, separate from scores and editorial.',`<a class="text-action" href="/ai-decides">Open AI Decides →</a>`)}<p class="ai-status">Unavailable — no saved AI slate is connected.</p><div style="margin-top:20px">${currentPairs.map(p=>`<div class="ai-row"><p>${teamLink(p.home.id)} / ${teamLink(p.away.id)}</p><p class="secondary">Week ${p.week} · Saved result unavailable. No probability, returned choice, confidence or provenance available.</p></div>`).join('')}</div></section>`;
      return `<section class="section ai-section" id="ai">${heading('04','AI Decides',`Week ${w.week} · five saved pairs · saved ${stamp(w.generatedAt)}`,`<a class="text-action" href="/ai-decides">Open AI Decides →</a>`)}<p class="ai-status ${stale?'stale':''}">${stale?'Stale saved slate — retained for reference; not a fresh prediction.':'Experimental saved slate / synthetic model results.'}</p><p class="period-note">Model probabilities are not calibrated sports odds. The returned choice is shown exactly as saved; confidence is a separate signal.</p><div class="ai-labels" aria-hidden="true"><span>Saved pairing · current display names</span><span>Model probabilities</span><span>Returned model choice</span><span style="text-align:right">Confidence</span></div>${w.matchups.map(p=>{const result=p.result;const matched=currentPairs.some(c=>c.week===w.week&&[c.home.id,c.away.id].join('|')===p.teamIds.join('|'));return `<article class="ai-row" data-ai-pair="${esc(p.matchupId)}"><div class="ai-main"><div class="ai-pair-names">${teamLink(p.teamIds[0])}<span>vs</span>${teamLink(p.teamIds[1])}<small class="meta ${stale?'ai-status stale':'muted'}">${!matched?'Unmatched saved pair':stale?'Stale saved result':'Saved fixture result'}</small></div><div class="distribution">${result?.probabilities?.map(q=>`<div class="prob">${teamLink(q.choice)}<span class="num">${pct(q.probability)}</span></div>`).join('')||'Unavailable'}</div><div class="returned">${result?esc(teamMap.get(result.choice)?.name??`Roster ${result.choice}`):'Unavailable'}<small>Returned choice${result?` · roster ID ${esc(result.choice)}`:''}</small></div><div class="confidence num">${result?.confidence!=null?pct(result.confidence):'Unavailable'}</div></div><details><summary>Provenance, saved time & input state</summary><div class="provenance"><dl><dt>Status</dt><dd>${!matched?'Unmatched':stale?'Stale':'Saved'} · ${esc(p.status)}</dd><dt>Saved</dt><dd>${stamp(w.generatedAt)}</dd><dt>Pair IDs</dt><dd>${esc(p.teamIds.join(' / '))}</dd><dt>Model</dt><dd>${esc(result?.model??'Unavailable')}</dd><dt>Prompt</dt><dd>${esc(result?.promptVersion??'Unavailable')}</dd><dt>Input snapshot</dt><dd>${result?.snapshot?'Saved snapshot present':'Unavailable'}</dd><dt>Baseline</dt><dd>${p.baseline?'Present':'Unavailable'}</dd></dl><div><p><strong>Evidence:</strong> ${esc(p.evidence?.join(' ')||'Unavailable')} Returned-result evidence: ${result?.evidence?.length?esc(result.evidence.join(' ')):'Unavailable'}.</p><p><strong>Probability label:</strong> ${esc(result?.probabilityLabel??'Unavailable')}.</p><p><strong>Confidence:</strong> ${result?.confidence!=null?pct(result.confidence):'Unavailable'}; separate from the two probabilities. Current display names are not frozen metadata.</p></div></div></details></article>`}).join('')}</section>`;
    }
    function facesSection(){return `<section class="section" id="faces">${heading('05','The league, in ten faces','Each team’s leading modeled player value. Prices are synthetic FAAB estimates, separate from form and editorial.')}<div class="faces">${data.faces.map(f=>`<div class="face" data-face="${esc(f.team.id)}">${portrait(f.player.id,f.player.name)}<div><a class="face-team" href="/teams/${f.team.id}">${esc(f.team.name)}</a><a class="face-player" href="/player/${f.player.id}">${esc(f.player.name)}</a><p>${esc(f.player.position)} · ${esc(f.team.managerName)}${f.champion?' · <span class="champion">2025 champion</span>':''}</p></div><div class="face-value num">${money(f.player.value)}<small>Modeled FAAB</small></div></div>`).join('')}</div></section>`}
    function directoryRows(list){return list.map(t=>{const i=t.identity,c=t.currentMatchup,p=t.previousSeason,op=c?(c.home.id===i.id?c.away:c.home):null;return `<article class="directory-team" data-team-id="${esc(i.id)}"><div class="directory-summary"><span class="team-id num">${String(i.id).padStart(2,'0')}</span><div><a class="directory-name" href="/teams/${i.id}">${esc(i.name)}</a><p class="manager">${esc(i.managerName)}</p><p class="prior">${p.season}: ${p.wins}–${p.losses} · finish ${p.finish}${p.ownerNote?` · ${esc(p.ownerNote)}`:''}</p></div><p class="record num">${t.currentRecord.wins}–${t.currentRecord.losses}<small>${home.hub.season.seasonYear} W–L</small></p><p class="opponent"><small>Current Week ${c?.week??'unavailable'} opponent</small>${op?teamLink(op.id,op.name):'Unavailable'}<small>Scoring incomplete · ${t.players.length} rostered</small></p></div><details class="roster-disclosure"><summary>${t.players.length} players · open full roster</summary><ul class="roster-list">${t.players.map(p=>`<li>${playerLink(p.id,p.fullName)}<small>${esc(p.position)} · ${esc(p.nbaTeam)} · ID ${esc(p.id)}</small></li>`).join('')}</ul></details></article>`}).join('')}
    function directorySection(){return `<section class="section" id="directory">${heading('06','The clubhouse directory','Ten managers, every current opponent and all 228 rostered player references.',`<a class="text-action" href="/teams">Open Teams →</a>`)}<div class="directory-controls"><div class="field"><label for="team-search">Find a team, manager or player</label><input id="team-search" type="search" placeholder="Try NeuralNets or Damian Lillard" autocomplete="off"></div><div class="field"><label for="team-sort">Order teams by</label><select id="team-sort"><option value="rank">Current standing</option><option value="name">Team name A–Z</option><option value="roster">Roster size, largest first</option></select></div><p class="results" id="directory-count" aria-live="polite">10 of 10 teams</p></div><div id="directory-rows">${directoryRows(teams)}</div><p class="empty-result" id="no-teams" hidden>No teams match. Try a different player, manager or team name.</p></section>`}
    function standingsRows(list){return list.map(s=>`<tr><td class="num">${s.rank}</td><td>${teamLink(s.team.id,s.team.name)}</td><td class="num">${s.wins}</td><td class="num">${s.losses}</td><td class="num">${(s.pointsFor/100).toFixed(1)}</td></tr>`).join('')}
    const statLabels={pointsForLeader:'Points-for leader',pointsAgainstLeader:'Points-against leader',longestWinStreak:'Longest win streak',mostActiveManager:'Most active manager',biggestBlowout:'Biggest blowout',closestGame:'Closest game'};
    function standingsSection(){return `<section class="section" id="standings">${heading('07','League table','All ten current sample records. PF is source pointsFor ÷ 100.')}<div class="field" style="max-width:280px;margin-bottom:20px"><label for="standings-sort">Sort standings</label><select id="standings-sort"><option value="rank">Source rank</option><option value="points">Points for, highest first</option><option value="name">Team name A–Z</option></select></div><div class="standings-layout"><table><caption>2026 season · synthetic fixture · checked ${date(home.checkedAt)}</caption><thead><tr><th scope="col">#</th><th scope="col">Team</th><th scope="col">W</th><th scope="col">L</th><th scope="col">PF</th></tr></thead><tbody id="standings-rows">${standingsRows(home.hub.standings)}</tbody></table><aside class="standings-aside"><p class="eyebrow">Producer status</p><h3 style="margin-top:8px">Lineup Power</h3><p>${esc(inventory.missing.power)}</p><h3>League stats</h3><p>No stats producer is connected to these fields. Standings PF does not establish a verified league award or record.</p><ul class="stats-list">${Object.entries(home.hub.stats).map(([k,v])=>`<li><span>${esc(statLabels[k]??k)}</span><span>${v==null?'Unavailable':esc(v)}</span></li>`).join('')}</ul></aside></div></section>`}
    function toolsSection(){return `<section class="section" id="tools">${heading('08','Elsewhere in the gym')}<div class="tool-row"><div><p class="eyebrow">The exchange</p><h3 style="margin-top:8px">Follow the market.</h3><p class="secondary">Inspect modeled player prices and their source basis. Recorded roster-value history is unavailable in this fixture.</p><a class="text-action" href="/stocks">Open Stocks →</a></div><div><p class="eyebrow">Roster decisions</p><h3 style="margin-top:8px">Work through a trade.</h3><p class="secondary">Go to the trade analyzer to compare the players in a proposed deal.</p><a class="text-action" href="/trade-analyzer">Open trade analyzer →</a></div><div class="game-preview"><img src="${inventory.assets.game}" alt="Free-throw game preview" width="130" height="130"><div><p class="eyebrow">Arcade / playable</p><h3 style="margin-top:8px">Take a few shots.</h3><p class="secondary">Local free-throw practice.</p><a class="text-action" href="/arcade/free-throw">Play free throws →</a><br><a class="text-action" href="/arcade">All arcade destinations →</a></div></div></div></section>`}
    function archiveSection(){return `<section class="section" id="archive">${heading('09','Previously, in GOAT',`Dated draft sample editions, with their own historical context.`,`<a class="text-action" href="/weekly">Weekly archive →</a>`)}<div class="archive-list">${data.archive.map(a=>`<article class="archive-item"><span class="num muted">${a.id.split('-')[1]}</span><div><a href="/weekly/${esc(a.id)}">${esc(a.title)} →</a><p>${esc(a.dateLabel)} · ${esc(a.status)} sample</p><p>${esc(a.game.note)}</p></div></article>`).join('')}</div></section>`}
    document.querySelector('#main').innerHTML=top+(member?personalDesk():publicDesk())+editorialSection()+aroundSection()+aiSection()+facesSection()+directorySection()+standingsSection()+toolsSection()+archiveSection();
    document.querySelector('#footer').innerHTML=`<div class="footer-top"><a href="index.html?view=${mode}" aria-label="GOAT Hoopers home"><img src="${inventory.assets.logo}" alt="GOAT Hoopers" width="150" height="38"></a><nav class="footer-links" aria-label="Footer"><a href="/intel">News</a><a href="/stocks">Stocks</a><a href="/history">History</a><a href="/weekly">Weekly archive</a><a href="${switchUrl('member')}">Member view</a><a href="${switchUrl('public')}">Public view</a><a href="#main">Back to the rundown ↑</a></nav></div><p class="footer-note" id="source-notes"><strong>About this offline desk.</strong> Source fixture: benchmark ${esc(inventory.benchmark.slice(0,7))}. ${esc(inventory.warning)} Portraits, logo and court are existing local assets. Current player links and roster ownership do not establish historical ownership. Sample editorial keeps its dates, selection basis and sources above. This static HTML concept does not verify live data, authentication, Next.js routing, price execution or gameplay; destination links point to the intended league routes.</p>`;
    const rankMap=new Map(home.hub.standings.map(s=>[s.team.id,s.rank]));
    function filterTeams(){const query=document.querySelector('#team-search').value.trim().toLocaleLowerCase();const order=document.querySelector('#team-sort').value;const sorted=[...teams].sort((a,b)=>order==='name'?a.identity.name.localeCompare(b.identity.name):order==='roster'?b.players.length-a.players.length:Number(rankMap.get(a.identity.id))-Number(rankMap.get(b.identity.id)));const list=document.querySelector('#directory-rows');for(const t of sorted){const el=list.querySelector(`[data-team-id="${t.identity.id}"]`);const base=[t.identity.name,t.identity.managerName].join(' ').toLocaleLowerCase();const playerMatch=t.players.some(p=>p.fullName.toLocaleLowerCase().includes(query));const matches=!query||base.includes(query)||playerMatch;el.hidden=!matches;list.append(el);if(query&&playerMatch&&!base.includes(query))el.querySelector('details').open=true;else if(!query)el.querySelector('details').open=false;}const count=[...list.children].filter(el=>!el.hidden).length;document.querySelector('#directory-count').textContent=`${count} of ${teams.length} teams`;document.querySelector('#no-teams').hidden=count>0;}
    document.querySelector('#team-search').addEventListener('input',filterTeams);document.querySelector('#team-sort').addEventListener('change',filterTeams);
    document.querySelector('#standings-sort').addEventListener('change',e=>{const val=e.target.value;const rows=[...home.hub.standings].sort((a,b)=>val==='name'?a.team.name.localeCompare(b.team.name):val==='points'?b.pointsFor-a.pointsFor:a.rank-b.rank);document.querySelector('#standings-rows').innerHTML=standingsRows(rows)});
    const menu=document.querySelector('.mobile-menu');menu.addEventListener('keydown',event=>{if(event.key==='Escape'&&menu.open){menu.open=false;menu.querySelector('summary').focus()}});menu.querySelectorAll('a').forEach(a=>a.addEventListener('click',()=>{menu.open=false}));
    document.querySelectorAll('img.portrait').forEach(img=>img.addEventListener('error',()=>{const replacement=document.createElement('span');replacement.className='portrait fallback';replacement.textContent='Photo unavailable';replacement.setAttribute('role','img');replacement.setAttribute('aria-label','Player portrait unavailable');img.replaceWith(replacement)}));
    document.querySelector('#main').dataset.mockReady='05';
  </script>
</body>
</html>
