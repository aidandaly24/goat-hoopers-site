<body>
<a class="skip" href="#main">Skip to content</a>
<header class="masthead wrap" id="top"></header>
<main id="main" class="wrap" tabindex="-1"><noscript>This offline design preview requires JavaScript to render its local fixture.</noscript></main>
<footer class="footer wrap" id="footer"></footer>
<script type="module">
import {inventory,data,mode,aiState,esc,money} from '../../data.js';
const home=data.home, dir=home.directory, edition=home.edition, summary=mode==='member'?data.personal.summary:null;
const teamById=id=>dir.find(d=>d.identity.id===String(id))?.identity;
const link=(href,label,cls='')=>`<a href="${esc(href)}"${cls?` class="${cls}"`:''}>${esc(label)}</a>`;
const teamLink=t=>t?link(`/teams/${t.id}`,t.name):'Unavailable team';
const playerLink=p=>link(`/player/${p.id}`,p.name??p.fullName);
const rec=t=>`${t.wins}–${t.losses}${t.ties?`–${t.ties}`:''}`;
const score=n=>n==null?'Pending':Number(n).toFixed(1);
const date=v=>v==null?'Unavailable':new Date(v).toLocaleString('en-GB',{timeZone:'UTC',day:'2-digit',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit'})+' UTC';
const portrait=(id,name,extra='')=>inventory.portraits[id]?`<img class="portrait ${extra}" src="${esc(inventory.portraits[id])}" alt="${esc(name)}" loading="lazy" width="56" height="64">`:`<span class="portrait portrait-fallback ${extra}" role="img" aria-label="Portrait unavailable for ${esc(name)}">Portrait unavailable</span>`;
const memberLink=summary?link('/team','My team','action primary'):'';
const mainNav=[['/','Home'],['/intel','News'],['/stocks','Stocks'],['/history','History'],['/arcade','Arcade']];
const tools=[['/ai-decides','AI Decides'],['/teams','Teams'],['/transactions','Transactions'],['/weekly','Weekly archive'],['/trade-analyzer','Trade analyzer'],['/draft','Draft']];
const navHtml=items=>items.map(([href,label])=>`<a href="${href}"${href==='/'?' aria-current="page"':''}${label==='Stocks'?' class="stocks"':''}>${label}</a>`).join('');
const compare=`<div class="compare" aria-label="Preview comparison"><a href="?view=public${aiState==='ready'?'':`&ai=${esc(aiState)}`}"${mode==='public'?' aria-current="page"':''}>Public</a><a href="?view=member${aiState==='ready'?'':`&ai=${esc(aiState)}`}"${mode==='member'?' aria-current="page"':''}>Member</a></div>`;
document.querySelector('header').innerHTML=`<div class="mast-row"><a class="logo" href="/" aria-label="GOAT Hoopers home"><img src="${inventory.assets.logo}" width="196" height="36" alt="GOAT Hoopers"></a><nav class="main-nav" aria-label="Main navigation">${navHtml(mainNav)}<details class="league-menu"><summary>League</summary><div class="menu-links">${navHtml(tools)}${summary?link('/team','My team'):''}</div></details></nav><details class="phone-menu"><summary>Menu</summary><nav class="menu-links" aria-label="Phone navigation">${navHtml(mainNav.filter(x=>x[1]!=='Stocks'))}${navHtml(tools)}${summary?link('/team','My team'):''}</nav></details></div><div class="issue-row"><span class="edition-label">2026 / Week ${dir[0].currentMatchup.week} / ${mode==='member'?'Your edition':'League edition'}</span>${compare}</div><div class="fixture-note"><strong>Offline design fixture.</strong> All current records, scores, prices, form, news and AI are synthetic. Dated approved identities and editorial are preserved. Not live league data.</div>`;
const featured=summary?dir.find(d=>d.identity.id===summary.team.id):dir[0];
const pair=featured.currentMatchup, first=summary?.team??pair.home, second=pair.home.id===first.id?pair.away:pair.home;
const ownScore=pair.home.id===first.id?pair.homePoints:pair.awayPoints, oppScore=pair.home.id===first.id?pair.awayPoints:pair.homePoints;
const hero=`<section class="hero" aria-label="Featured current matchup"><div class="hero-names"><p class="eyebrow">${summary?'Your matchup':'Featured matchup'} · Week ${pair.week} · Incomplete</p><div class="team-line"><div><h1 class="lead-heading">${teamLink(first)}</h1><p class="team-byline">${esc(first.managerName)} · <span class="num">${rec(first)}</span> current record${summary?` · Standing ${summary.standing.rank}/${summary.season.totalTeams} · ${summary.coverage.roster} players`:''}</p></div><span class="score num${ownScore==null?' pending':''}">${score(ownScore)}</span></div><p class="versus">versus</p><div class="team-line"><div><h2>${teamLink(second)}</h2><p class="team-byline">${esc(second.managerName)} · <span class="num">${rec(second)}</span> current record</p></div><span class="score num${oppScore==null?' pending':''}">${score(oppScore)}</span></div><p class="hero-status">${ownScore==null||oppScore==null?'Scoring is incomplete. Pending means no score is supplied; the known 0.0 is retained.':'Current supplied scoring; this fixture is not a final result.'} Checked ${date(home.checkedAt)}.</p><div class="actions">${memberLink}${summary?link(`/teams/${first.id}#team-roster`,'View roster','action'):link('#directory','Explore teams','action primary')}${link('#saved-picks','Saved AI picks','action')}</div></div><aside class="hero-aside"><div><span class="caption-kicker">League reference</span><p class="aside-intro">${home.hub.season.playoffTeams} of ${home.hub.season.totalTeams} teams reach the playoffs, starting Week ${home.hub.season.playoffWeekStart}.</p></div><figure class="court"><img src="${inventory.assets.court}" alt="GOAT Hoopers home court, a still arena photograph" width="640" height="360"><figcaption>Our court, between games. ${link('/arcade/free-throw','Play free-throw practice')}</figcaption></figure><p class="meta">The current Week ${pair.week} fixture above is separate from the draft sample edition, <strong>${esc(edition.dateLabel)}</strong>. That editorial period has ended; its stories are retained below with their original basis.</p></aside></section>`;
function rosterValue(){
const v=summary.valuation;
return `<section class="chapter" id="roster-value"><div class="chapter-heading"><h2>The roster ledger</h2><p>Your current roster’s modeled FAAB value. Values describe the market model, not player form or a real transaction.</p></div><div class="personal-grid"><div><p class="ledger-kicker">${v.complete?'Current modeled team value':'Partially priced roster subtotal'}</p><div class="value-line"><span class="value-total num">${money(v.total)}</span><span class="value-unit">modeled FAAB<br>${v.complete?'complete roster':'partial coverage'}</span></div><p class="value-facts">${v.priced} priced · ${v.unpriced} unpriced · ${summary.coverage.roster} roster players${v.rank?` · Value rank ${v.rank.rank} of ${v.rank.teams}${v.rank.tied?' (tied)':''}`:''}<br>Computed ${date(summary.market.updatedAt)} · ${esc(summary.market.pricingBasis)} pricing basis · synthetic</p><div class="top-values">${summary.players.map(p=>`<article class="top-value">${portrait(p.id,p.name)}<div>${playerLink(p)}<span class="num">${money(p.value)}</span><small>${esc(p.position)} · Price ${p.changePct>0?'Up':p.changePct<0?'Down':'Flat'} ${Math.abs(p.changePct).toFixed(1)}% vs previous quote</small></div></article>`).join('')}</div><details class="disclosure" data-roster-values><summary>All ${summary.rosterValues.length} player values and coverage</summary><p class="meta">${v.priced} priced, ${v.unpriced} unpriced. Missing quotes read Unpriced. Current modeled values only.</p><ul class="value-list">${summary.rosterValues.map(p=>`<li>${playerLink(p)}<span class="num">${money(p.value)}</span></li>`).join('')}</ul></details><p class="history-note"><strong>Recorded history unavailable.</strong> ${esc(inventory.missing.history)} ${link('/stocks','Inspect market values')}</p></div><aside class="notebook"><h3>Scouting notebook</h3><p>${esc(summary.playerGuide.watch.label)} · Synthetic observed form</p><div class="watch-rows">${summary.playerGuide.watch.rows.map(p=>`<article class="watch-row"><div>${playerLink(p)}<small>${p.games} observed games · ${esc(p.note)}</small></div><span class="num">${p.value.toFixed(1)}<small>EMA FP/GP</small></span></article>`).join('')}</div><p class="form-terms">${esc(summary.playerGuide.watch.message)} Period: ${summary.playerGuide.season} in-season observations, current Week ${summary.playerGuide.currentWeek}. This is separate from price movement and the dated editorial watch below.</p></aside></div><div class="recap-wire"><div><div class="recap-heading"><h3>Completed-week performers</h3><span class="meta">Synthetic recorded sample</span></div><div class="recap-grid">${[['best','Your best'],['rough','The rough week']].map(([key,label])=>`<div><h4>${label} · ${summary.playerGuide[key].length} shown / ${summary.playerGuide.eligiblePlayed} eligible</h4>${summary.playerGuide[key].map(p=>`<div class="recap-row">${playerLink(p)}<span class="num">${p.value.toFixed(1)} FP · ${p.games} GP</span></div>`).join('')}</div>`).join('')}</div><p class="form-terms">${esc(summary.playerGuide.period)}. ${esc(summary.playerGuide.coverage)} ${esc(inventory.missing.recap)}</p></div><aside class="team-wire"><h3>Your team wire</h3><ul class="wire-list">${summary.news.map(n=>`<li>${link(n.url,n.headline)}<small>${esc(n.outlet.name)} · ${date(n.publishedAt)} · Synthetic news</small></li>`).join('')}${summary.moves.map(m=>`<li><p>${esc(m.summary)}</p><small>Week ${m.week} · ${date(m.createdAt)} · Synthetic move</small></li>`).join('')}</ul>${link('/transactions','All transactions','action')}</aside></div></section>`;
}
function editorial(){return `<section class="chapter" id="editorial"><div class="chapter-heading"><h2>The dated notebook</h2><p>Draft sample · ${esc(edition.dateLabel)}. Stale editorial, retained for reading; these are not current official Week 2 awards.</p></div><div class="editorial-grid">${edition.playerSpotlights.map(p=>`<article class="story"><p class="eyebrow">${esc(p.periodLabel)}</p><div class="story-heading">${portrait(p.playerId,p.name)}<div><h3>${link(`/player/${p.playerId}`,p.name)}</h3><p class="meta">${esc(p.position)} · ${teamLink(teamById(p.teamId))}</p></div></div><p class="take"><strong>${esc(p.headline)}</strong> ${esc(p.opinion)}</p><p class="story-stat">${p.stats.map(s=>`<strong class="num">${esc(s.value)}</strong> ${esc(s.label)}`).join(' · ')}</p><p class="period">${esc(p.statPeriod)}</p><details><summary>Source and editorial selection basis</summary><p>${esc(p.selectionReason)}</p><p>Draft sample: ${esc(edition.dateLabel)}. Checked ${esc(p.source.checkedAt)}.</p>${link(p.source.url,p.source.label)}</details></article>`).join('')}</div><details class="disclosure"><summary>Original edition matchup and why it was selected</summary><p>${esc(edition.game.context)}</p><p>${esc(edition.game.selectionReason)}</p><p class="meta">${esc(edition.game.note)} · ${esc(edition.dateLabel)} · Draft sample, period ended. This does not describe the current Week ${pair.week} pairing.</p></details></section>`;}
function ai(){
let slate=data.weekly;
if(!slate)return `<section class="chapter" id="saved-picks"><div class="chapter-heading"><h2>${link('/ai-decides','AI Decides')}</h2></div><p class="state">Unavailable — no saved slate supplied.</p><p class="ai-intro" style="margin-top:12px">No probabilities or returned choice can be shown. ${link('/ai-decides','Open the AI playground')}</p></section>`;
let stale=slate.status==='stale';
return `<section class="chapter" id="saved-picks"><div class="chapter-heading"><h2>${link('/ai-decides','AI Decides')}</h2>${link('/ai-decides','Open playground')}</div><p class="ai-intro">All five saved pairs · Week ${slate.week} · ${stale?'<strong class="state">Stale saved slate — not current guidance.</strong>':'Synthetic model estimates.'} Saved ${date(slate.generatedAt)}. Model probability is not calibrated sports odds.</p><div>${slate.matchups.map((m,i)=>{
let r=m.result; const live=dir.some(d=>d.currentMatchup&&d.currentMatchup.week===slate.week&&[d.currentMatchup.home.id,d.currentMatchup.away.id].sort().join('|')===[...m.teamIds].sort().join('|')); const label=!live?'Unmatched current pair':stale||m.status==='stale'?'Stale saved pick':m.status!=='ready'||!r?'Unavailable':'Saved model pick';
return `<article class="ai-row" data-ai-pair="${esc(m.matchupId)}"><span class="pair-index num">${String(i+1).padStart(2,'0')}</span><div class="pair-teams">${m.teamIds.map(id=>{const p=r?.probabilities.find(p=>p.choice===id);return `<div class="prob-team">${teamLink(teamById(id))}<span class="num">${p?`${Math.round(p.probability*100)}%`:'Unavailable'}</span></div>`}).join('')}</div><div class="ai-result"><p class="${label.startsWith('Stale')||!live?'state':''}">${label}${r?` · Returned choice: <strong>${esc(teamById(r.choice)?.name??r.choice)}</strong>`:''}</p><p class="meta">${r?`Confidence ${Math.round(r.confidence*100)}% — independent signal`:'Confidence unavailable'}</p></div><details class="ai-provenance"><summary>Provenance, evidence and saved inputs</summary><dl><dt>Saved</dt><dd>${date(slate.generatedAt)}</dd><dt>Model / prompt</dt><dd>${esc(r?.model??'Unavailable')} / ${esc(r?.promptVersion??'Unavailable')}</dd><dt>Returned choice ID</dt><dd>${esc(r?.choice??'Unavailable')} · current display names used above</dd><dt>Every probability</dt><dd>${r?r.probabilities.map(p=>`${esc(teamById(p.choice)?.name??p.choice)} (roster ${esc(p.choice)}): ${Math.round(p.probability*100)}%`).join('; '):'Unavailable'}</dd><dt>Confidence</dt><dd>${r?Math.round(r.confidence*100)+'%':'Unavailable'}; separate from choice probabilities.</dd><dt>Input snapshot</dt><dd>${r?.snapshot||slate.snapshot?'Supplied snapshot available':'Unavailable — no input snapshot or input timestamp supplied.'}</dd><dt>Evidence</dt><dd>${[...m.evidence,...(r?.evidence??[])].map(esc).join(' ')||'Unavailable'}</dd><dt>Match status</dt><dd>${esc(label)} · Season ${esc(slate.season)} · Week ${slate.week} · roster IDs ${m.teamIds.map(esc).join(', ')}.</dd><dt>Probability basis</dt><dd>${esc(r?.probabilityLabel??'Unavailable')} · Synthetic fixture, not real outcomes.</dd></dl></details></article>`}).join('')}</div></section>`;
}
function faces(){return `<section class="chapter" id="faces"><div class="chapter-heading"><h2>Faces of the league</h2>${link('/stocks','Open the market')}</div><p class="face-intro">Each team’s top modeled player in this synthetic snapshot. A price comparison, separate from the observed-form notebook and editorial picks.</p><div class="faces">${data.faces.map(f=>`<article class="face" data-face="${esc(f.team.id)}">${portrait(f.player.id,f.player.name)}<div>${teamLink(f.team)}${playerLink(f.player).replace('<a ','<a class="player-link" ')}<span class="num">${money(f.player.value)}</span><small>Modeled FAAB · ${esc(f.player.position)}${f.champion?' · Defending champion':''}</small></div></article>`).join('')}</div></section>`;}
function leagueWire(){return `<section class="chapter" id="league-wire"><div class="chapter-heading"><h2>Around the league</h2>${link('/intel','News and intelligence')}</div><div class="two-thirds"><div><h3>Dated league happenings</h3><p class="meta" style="margin-top:8px">Draft editorial sample · ${esc(edition.dateLabel)} · period ended</p><ul class="wire-list" style="margin-top:16px">${edition.happenings.map(h=>`<li>${link(h.href,h.title)}<p>${esc(h.text)}</p><small>${esc(h.dateLabel)} · Dated sample editorial</small></li>`).join('')}</ul><details class="disclosure"><summary>Editorial sources and check dates</summary><ul class="source-links">${edition.sources.map(s=>`<li>${link(s.url,s.label)} · checked ${esc(s.checkedAt)}</li>`).join('')}</ul></details></div><div><h3>Transactions</h3><p class="meta" style="margin-top:8px">Current Week ${pair.week} · Synthetic activity</p><ul class="wire-list" style="margin-top:16px">${home.hub.transactions.map(t=>`<li><p>${esc(t.summary)}</p><small>${esc(t.type)} · Week ${t.week} · ${date(t.createdAt)}</small></li>`).join('')}</ul>${link('/transactions','View transactions','action')}</div></div></section>`;}
function directory(){return `<section class="chapter" id="directory"><div class="chapter-heading"><h2>The team directory</h2><p>Find a manager, a team or any roster player. Full current rosters stay one disclosure away.</p></div><div class="controls"><div><label for="search">Search teams, managers or players</label><input id="search" type="search" placeholder="Try Reaves, Aedan23 or Giannis" autocomplete="off"></div><div><label for="team-sort">Sort directory</label><select id="team-sort"><option value="name">Team name A–Z</option><option value="pf">Points for, highest first</option><option value="roster">Roster size, largest first</option></select></div></div><p id="result-count" class="result-count" role="status" aria-live="polite"></p><div class="directory-head" aria-hidden="true"><span>Team / manager</span><span>2026 W–L</span><span>Current opponent</span><span>Roster</span></div><div id="directory-rows"></div></section>`;}
function standings(){return `<section class="chapter" id="standings"><div class="chapter-heading"><h2>The league table</h2><p>All ten teams · 2026 synthetic standings. Points for use the source UI’s pointsFor ÷ 100 display.</p></div><div class="two-thirds"><div class="standings-wrap"><table class="standings"><caption class="sr-only">2026 synthetic league standings. Activate Rank or PF to sort.</caption><thead><tr><th id="rank-head" scope="col" aria-sort="ascending"><button id="sort-rank" type="button" aria-label="Sort by rank, ascending">Rank</button></th><th scope="col">Team</th><th scope="col">W</th><th scope="col">L</th><th id="pf-head" scope="col"><button id="sort-pf" type="button" aria-label="Sort by points for, highest first">PF</button></th></tr></thead><tbody id="standings-body"></tbody></table><p id="standings-sort-note" class="meta" role="status" style="margin-top:12px">Sorted by rank, ascending.</p></div><aside class="league-reference"><h3>The working reference</h3><p>Complete rosters, public profiles and the tools for your next decision.</p><div class="actions">${link('/stocks','Stocks / market','action')}${link('/trade-analyzer','Trade analyzer','action')}${link('/teams','All team profiles','action')}</div><ul class="status-list"><li><strong>League stats unavailable</strong>No points leader, streak, activity, blowout or closest-game snapshot is supplied. No league superlatives are inferred.</li><li><strong>Lineup Power unavailable</strong>${esc(inventory.missing.power)}</li></ul><div class="game-link"><img src="${inventory.assets.game}" alt="Free-throw practice preview" width="130" height="81" loading="lazy"><div>${link('/arcade/free-throw','Play free-throw practice')}<p>Practice only. ${link('/arcade','Browse Arcade')}</p></div></div></aside></div></section>`;}
function archive(){return `<section class="chapter" id="archive"><div class="chapter-heading"><h2>Earlier editions</h2>${link('/weekly','Weekly archive')}</div>${data.archive.map(a=>`<article class="archive-row"><small>${esc(a.dateLabel)}</small>${link(`/weekly/${a.id}`,a.title)}<small>Draft sample · ${esc(a.season)}<br>Original period ended</small></article>`).join('')}</section>`;}
document.querySelector('main').innerHTML=`${summary?'<div data-personal>':''}${hero}${summary?rosterValue()+'</div>':''}${editorial()}${ai()}${faces()}${leagueWire()}${directory()}${standings()}${archive()}`;
document.querySelector('footer').innerHTML=`<div class="footer-grid"><div><p class="footer-logo">GOAT Hoopers</p><p>A working league bulletin. This static prototype uses dated approved roster identities and editorial with synthetic current data from benchmark ${esc(inventory.benchmark.slice(0,7))}. It makes no live requests and does not prove authentication or backend behavior.</p><p style="margin-top:12px">Checked fixture: ${date(home.checkedAt)}. Recorded team-value history, Lineup Power and league statistics are unavailable.</p></div><nav class="footer-nav" aria-label="Footer navigation">${navHtml(mainNav)}${navHtml(tools)}${summary?link('/team','My team'):''}${link('#top','Back to top')}</nav></div>`;
let query='',directorySort='name';
function renderDirectory(){
let rows=dir.filter(d=>[d.identity.name,d.identity.managerName,...d.players.map(p=>p.fullName)].join(' ').toLowerCase().includes(query.toLowerCase()));
rows.sort((a,b)=>directorySort==='pf'?b.currentRecord.pointsFor-a.currentRecord.pointsFor||a.identity.name.localeCompare(b.identity.name):directorySort==='roster'?b.players.length-a.players.length||a.identity.name.localeCompare(b.identity.name):a.identity.name.localeCompare(b.identity.name));
document.querySelector('#result-count').textContent=`${rows.length} of ${dir.length} teams shown${query?` for “${query}”`:''}. ${dir.reduce((n,d)=>n+d.players.length,0)} roster references available.`;
document.querySelector('#directory-rows').innerHTML=rows.length?rows.map(d=>{const t=d.identity,m=d.currentMatchup,o=m?(m.home.id===t.id?m.away:m.home):null;return `<article class="directory-row" data-team-id="${esc(t.id)}"><div>${teamLink(t).replace('<a ','<a class="team-name" ')}<p class="manager">${esc(t.managerName)}${summary?.team.id===t.id?' · Your team':''}</p></div><p class="record num">${rec(d.currentRecord)}</p><p class="opponent"><small>Week ${m?.week??'unavailable'} · Incomplete</small>${o?teamLink(o):'No pairing supplied'}${m?`<br><span class="num">${score(m.home.id===t.id?m.homePoints:m.awayPoints)} / ${score(m.home.id===t.id?m.awayPoints:m.homePoints)}</span>`:''}</p><details><summary>${d.players.length} players · View roster</summary><p class="past">${d.previousSeason?`${esc(d.previousSeason.season)} record: ${d.previousSeason.wins}–${d.previousSeason.losses} · Finish ${d.previousSeason.finish}. ${esc(d.previousSeason.ownerNote??'Same franchise historical record.')}`:'Previous-season record unavailable.'}</p><ul class="roster-list">${d.players.map(p=>`<li>${playerLink(p)}<span>${esc(p.position??'—')} · ${esc(p.nbaTeam??'Unknown')}</span></li>`).join('')}</ul></details></article>`}).join(''):'<p class="empty">No team or roster player matches. Clear the search to see all ten teams.</p>';
}
renderDirectory();
document.querySelector('#search').addEventListener('input',e=>{query=e.target.value;renderDirectory()});
document.querySelector('#team-sort').addEventListener('change',e=>{directorySort=e.target.value;renderDirectory()});
let standingKey='rank',standingDirection='ascending';
function renderStandings(){
let rows=[...home.hub.standings].sort((a,b)=>(standingKey==='rank'?a.rank-b.rank:a.pointsFor-b.pointsFor)*(standingDirection==='ascending'?1:-1)||a.rank-b.rank);
document.querySelector('#standings-body').innerHTML=rows.map(s=>`<tr${summary?.team.id===s.team.id?' class="viewer"':''}><td>${s.rank}</td><td>${teamLink(s.team)}</td><td>${s.wins}</td><td>${s.losses}</td><td>${(s.pointsFor/100).toFixed(1)}</td></tr>`).join('');
for(const key of ['rank','pf']){const th=document.querySelector(`#${key}-head`);if(key===standingKey)th.setAttribute('aria-sort',standingDirection);else th.removeAttribute('aria-sort')}
document.querySelector('#standings-sort-note').textContent=`Sorted by ${standingKey==='rank'?'rank':'points for'}, ${standingDirection}.`;
}
renderStandings();
for(const key of ['rank','pf'])document.querySelector(`#sort-${key}`).addEventListener('click',()=>{standingDirection=key===standingKey?(standingDirection==='ascending'?'descending':'ascending'):(key==='rank'?'ascending':'descending');standingKey=key;renderStandings()});
document.querySelectorAll('.phone-menu,.league-menu').forEach(d=>{d.addEventListener('keydown',e=>{if(e.key==='Escape'&&d.open){d.open=false;d.querySelector('summary').focus()}});d.querySelectorAll('a').forEach(a=>a.addEventListener('click',()=>{d.open=false}))});
document.querySelectorAll('img').forEach(img=>img.addEventListener('error',()=>{const fallback=document.createElement('span');fallback.className=img.className+' portrait-fallback';fallback.textContent=img.alt||'Image unavailable';fallback.setAttribute('role','img');fallback.setAttribute('aria-label',`${img.alt||'Image'} unavailable`);img.replaceWith(fallback)},{once:true}));
document.querySelector('main').dataset.mockReady='17';
</script>
</body>
</html>
