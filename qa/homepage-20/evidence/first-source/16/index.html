const record=t=>`${t.wins}–${t.losses}${t.ties?'–'+t.ties:''}`;
const teamLink=t=>`<a href="/teams/${esc(t.id)}">${esc(t.name)}</a>`;
const number=id=>`<span class="team-number num" aria-hidden="true">${String(id).padStart(2,'0')}</span>`;
const playerLink=(id,name)=>`<a href="/player/${esc(id)}">${esc(name)}</a>`;
const portrait=(id,name,cls='')=>inventory.portraits[id]?`<img class="${cls}" src="${esc(inventory.portraits[id])}" alt="${esc(name)}" loading="lazy" onerror="this.hidden=true;this.nextElementSibling?.removeAttribute('hidden')"><span hidden class="meta">${esc(name)} · portrait unavailable</span>`:`<span class="meta">${esc(name)} · portrait unavailable</span>`;
const currentPair=summary?.matchup ?? directory.find(t=>edition.game.teamIds.includes(t.identity.id)&&t.currentMatchup)?.currentMatchup ?? directory.find(t=>t.currentMatchup)?.currentMatchup;
const pairTeam=(team,points)=>`<div class="match-team">${number(team.id)}<div><h2>${teamLink(team)}</h2><p class="manager">${esc(team.managerName)} · <span class="num">${record(team)}</span></p></div><span class="score ${points==null?'pending':'num'}">${points==null?'Pending':Number(points).toFixed(1)}</span></div>`;
const matchup=personal=>`<div class="matchup ${personal?'your-match':''}"><div class="match-label"><h2>${personal?'Your matchup':'Featured matchup'}</h2><span class="status">Week ${currentPair.week} · Incomplete</span></div>${pairTeam(currentPair.home,currentPair.homePoints)}${pairTeam(currentPair.away,currentPair.awayPoints)}<p class="match-note">Known scores are shown as recorded. Pending is missing scoring, so this pairing has no final result.</p>${personal?`<div class="actions"><a class="button primary" href="/team">My team</a><a class="button" href="/teams/${summary.team.id}#team-roster">View roster</a></div>`:`<div class="actions"><a class="button primary" href="#saved-picks">See all five pairings</a><a class="button" href="/teams/${currentPair.home.id}">Explore the teams</a></div>`}<details class="provenance"><summary>Current pair & dated edition context</summary><p>The pairing above comes from the current directory fixture, checked ${date(data.home.checkedAt)}. It is not the older editorial opener.</p><p>Sample edition: ${esc(edition.dateLabel)} · ${esc(edition.status)} · stale. Original selection basis: ${esc(edition.game.selectionReason)}</p><p>The original opener copy names Josh Diddy’s Roster. That dated story is retained as a source note, not presented as the current opponent.</p></details></div>`;
const nav=`<a href="/" aria-current="page">Home</a><a href="/intel">News</a><a href="/stocks">Stocks</a><a href="/history" class="wide-link">History</a><a href="/arcade">Arcade</a><a href="/ai-decides" class="wide-link">AI Decides</a>`;
const header=`<header class="site-header" data-site-chrome><div class="wrap header-top"><a class="logo" href="/" aria-label="GOAT Hoopers home"><img src="${inventory.assets.logo}" alt="GOAT Hoopers"></a><nav class="main-nav" aria-label="Primary">${nav}</nav><a class="account" href="${member?'/team':'?view=member'}">${member?'My team':'Member edition'}</a><details class="menu"><summary>Menu</summary><nav aria-label="All league destinations"><a href="/">Home</a><a href="/intel">News</a><a href="/stocks">Stocks</a><a href="/history">History</a><a href="/arcade">Arcade</a><a href="/ai-decides">AI Decides</a><a href="/teams">Teams</a><a href="/transactions">Transactions</a><a href="/weekly">Weekly archive</a><a href="/trade-analyzer">Trade analyzer</a>${member?'<a href="/team">My team</a><a href="/teams/1#team-roster">View roster</a>':''}</nav></details></div></header><div class="fixture"><div class="wrap"><strong>Offline design fixture.</strong> Current records, scores, prices, form, news and AI are synthetic. Dated approved identities and editorial are preserved. Not live league data.</div></div>`;
const editionBar=`<div class="edition-bar"><span class="eyebrow">2026 season · Week ${currentPair.week}</span><nav class="view-switch" aria-label="Compare homepage editions"><a href="?view=public${aiState!=='ready'?'&ai='+esc(aiState):''}" ${!member?'aria-current="page"':''}>Public edition</a><a href="?view=member${aiState!=='ready'?'&ai='+esc(aiState):''}" ${member?'aria-current="page"':''}>Member edition</a></nav></div>`;
function publicLead(){return `<div class="page-intro"><div><p class="eyebrow">The league front page</p><h1>Week ${currentPair.week}, courtside.</h1></div><div class="edition-note"><p class="small muted">Ten teams. One shared notebook.<br>Current pairing fixture + dated sample stories.</p><p class="edition-stale">Editorial: ${esc(edition.dateLabel)} · Stale draft</p></div></div><section class="public-lead" aria-label="Current league feature"><figure><img class="court" src="${inventory.assets.court}" alt="GOAT Hoopers arena with a central basketball court"><figcaption class="court-caption"><span>Our court · GOAT Hoopers</span><span>Explore the league. Then take your shot.</span></figcaption></figure>${matchup(false)}</section>`}
function valuation(){const v=summary.valuation;return `<section class="value-desk" aria-labelledby="value-heading"><p class="eyebrow" id="value-heading">Your roster, modeled in FAAB</p><div class="value-total num">${money(v.total)}</div><p class="value-unit">${v.complete?'Complete modeled roster total':'Partial modeled roster subtotal'} · not a FAAB balance</p><div class="value-coverage"><div><strong>${v.priced}/${summary.coverage.roster}</strong>players priced</div><div><strong>${v.unpriced}</strong>unpriced</div><div><strong>${v.rank?`${v.rank.rank}/${v.rank.teams}`:'—'}</strong>value rank</div></div><p class="eyebrow">Highest modeled values</p><div class="top-values">${summary.players.map(p=>`<div class="top-value">${playerLink(p.id,p.name)}<span class="num">${money(p.value)}</span></div>`).join('')}</div><details class="value-list" data-roster-values><summary>All ${summary.rosterValues.length} player values</summary><div>${summary.rosterValues.map(p=>`<div class="value-row">${playerLink(p.id,p.name)}<span class="meta">${esc(p.position)}</span><span class="num">${money(p.value)}</span></div>`).join('')}</div></details><p class="meta">In-season modeled FAAB pricing · computed ${date(summary.market.updatedAt)}. Prices are estimates, not completed trades.</p><p class="history-status">${esc(inventory.missing.history)}</p><div class="member-floor"><img src="${inventory.assets.court}" alt="GOAT Hoopers court"><div><p class="meta">The rest of the league is here.</p><a href="#league-reference">Open league reference</a></div></div></section>`}
function memberLead(){return `<section data-personal aria-labelledby="member-title"><div class="page-intro member-intro"><div><div class="member-identity">${number(summary.team.id)}<div><p class="eyebrow">Your member workspace</p><h1 id="member-title">${esc(summary.team.name)}</h1><p class="identity-line">${esc(summary.team.managerName)} · <span class="num">${summary.coverage.roster}</span> players · <span class="num">${summary.standing.rank}/${directory.length}</span> standing · <span class="num">${record(summary.team)}</span> record</p></div></div></div><p class="edition-note meta">Workspace checked ${date(summary.checkedAt)}<br>Synthetic current-season snapshot</p></div><nav class="member-index" aria-label="Workspace sections"><a href="#your-notebook">Scouting notebook</a><a href="#completed-week">Completed week</a><a href="#league-reference">League reference</a><a href="#clubhouse">All rosters</a></nav><div class="workspace">${matchup(true)}${valuation()}</div>${memberNotebook()}</section>`}
function memberNotebook(){const g=summary.playerGuide;const recap=(rows,title)=>`<div><h3>${title}</h3>${rows.map(p=>`<div class="recap-row">${playerLink(p.id,p.name)}<span class="num">${p.value.toFixed(1)} pts · ${p.games} GP</span></div>`).join('')}</div>`;return `<div class="member-context"><section id="your-notebook" aria-labelledby="watch-heading"><p class="eyebrow">Observed form, not price</p><h2 id="watch-heading" style="margin-top:8px">Your scouting notebook</h2><table class="watch-table"><caption>${esc(g.watch.label)}</caption><thead><tr><th scope="col">Player</th><th scope="col">EMA FPPG</th><th scope="col">Games</th></tr></thead><tbody>${g.watch.rows.map(p=>`<tr><td>${playerLink(p.id,p.name)}<small>${esc(p.note)}</small></td><td class="num">${p.value.toFixed(1)}</td><td class="num">${p.games}</td></tr>`).join('')}</tbody></table><p class="meta" style="margin-top:12px">${esc(g.season)} in-season observed sample · ${esc(g.watch.message)}</p><div id="completed-week" class="recap">${recap(g.best,'Your best · Week '+g.previousWeek)}${recap(g.rough,'The rough week')}</div><p class="meta" style="margin-top:16px">${esc(inventory.missing.recap)}<br>${esc(g.period)}. ${esc(g.coverage)} Displayed: ${g.best.length} best and ${g.rough.length} rough; points are completed-week totals, not averages.</p></section><section class="member-wire" aria-labelledby="team-wire"><p class="eyebrow">Sample news + recent moves</p><h2 id="team-wire" style="margin-top:8px">Your team wire</h2>${summary.news.map(n=>`<article class="wire-item"><a href="${esc(n.url)}">${esc(n.headline)}</a><p class="meta">${esc(n.outlet.name)} · ${day(n.publishedAt)} · Synthetic news</p></article>`).join('')}${summary.moves.map(m=>`<article class="wire-item"><p class="small">${esc(m.summary)}</p><p class="meta">Week ${m.week} · ${day(m.createdAt)} · Synthetic move</p></article>`).join('')}<div class="actions"><a class="button" href="/intel">Open News</a><a class="button" href="/transactions">All transactions</a></div></section></div>`}
function editorial(){return `<section class="section" id="editorial"><div class="section-head"><div><p class="eyebrow">Dated sample draft · Stale · ${esc(edition.dateLabel)}</p><h2 style="margin-top:8px">From the notebook</h2><p>Three opinions from an older draft. These are not current Week ${currentPair.week} awards.</p></div><a href="/weekly/${esc(edition.id)}">Read the edition</a></div><div class="notebook-grid">${edition.playerSpotlights.map(s=>`<article class="story"><div class="story-portrait">${portrait(s.playerId,s.name)}<div><a class="name" href="/player/${esc(s.playerId)}">${esc(s.name)}</a><p class="meta">${esc(s.periodLabel)}<br>${teamLink(teams[s.teamId])}</p></div></div><h3>${esc(s.headline)}</h3><p>${esc(s.opinion)}</p><div class="stats">${s.stats.map(t=>`<div><strong class="num">${esc(t.value)}</strong><span>${esc(t.label)}</span></div>`).join('')}</div><p class="period">${esc(s.statPeriod)}</p><details class="provenance"><summary>Selection & source</summary><p>${esc(s.selectionReason)}</p><p>Sample selection: ${esc(edition.dateLabel)} · draft, never published. <a href="${esc(s.source.url)}">${esc(s.source.label)}</a> · checked ${esc(s.source.checkedAt)}.</p></details></article>`).join('')}</div></section>`}
function aiRows(){const weekly=data.weekly;if(!weekly)return `<div class="empty-state"><h3>Saved picks unavailable</h3><p style="margin-top:12px">No saved slate is supplied in this state. Current matchups remain available in the team directory.</p><a class="button" style="margin-top:20px" href="/ai-decides">Open AI Decides</a></div>`;return weekly.matchups.map(m=>{const r=m.result;const ids=m.teamIds;const exists=ids.every(id=>teams[id]);const matching=directory.some(t=>t.currentMatchup&&[t.currentMatchup.home.id,t.currentMatchup.away.id].every(id=>ids.includes(id)))&&weekly.week===currentPair.week;const stale=weekly.status==='stale'||m.status==='stale';const available=exists&&matching&&r&&m.status==='ready';const label=!matching?'Unmatched · unavailable':stale?'Stale saved pick':!available?'Unavailable':'Saved model pick';const probabilities=available?ids.map(id=>({team:teams[id],p:r.probabilities.find(p=>p.choice===id)?.probability})):[];return `<article class="ai-row" data-ai-pair="${esc(ids.join('-'))}"><div class="ai-row-top"><div class="ai-names">${ids.map(id=>teams[id]?teamLink(teams[id]):esc(id)).join('<span>vs</span>')}</div><span class="ai-state">${label}</span></div>${available?`<div class="probabilities">${probabilities.map(p=>`<div><span class="num">${p.p==null?'Unavailable':Math.round(p.p*100)+'%'}</span> <span class="meta">${esc(p.team.name)}</span></div>`).join('')}</div>${!stale&&probabilities.every(p=>p.p!=null)?`<div class="prob-bar" aria-hidden="true">${probabilities.map(p=>`<span style="width:${p.p*100}%"></span>`).join('')}</div>`:''}<p class="ai-choice">Returned choice: <strong>${esc(teams[r.choice]?.name??r.choice)}</strong> · Confidence <span class="num">${Math.round(r.confidence*100)}%</span> (separate signal)</p>`:`<p class="small muted" style="margin-top:12px">No valid matching probabilities available.</p>`}<p class="meta" style="margin-top:8px">Saved ${date(weekly.generatedAt)}${stale?' · Stale: retained for reference; not a current estimate.':''}</p><details class="provenance"><summary>Model & provenance</summary><dl><dt>Season / week</dt><dd>${esc(weekly.season)} / ${weekly.week}</dd><dt>Roster IDs</dt><dd>${esc(ids.join(' / '))}</dd><dt>Returned choice</dt><dd>${esc(r?.choice??'Unavailable')} (${esc(teams[r?.choice]?.name??'current name unavailable')})</dd><dt>Model</dt><dd>${esc(r?.model??'Unavailable')}</dd><dt>Prompt</dt><dd>${esc(r?.promptVersion??'Unavailable')}</dd><dt>Input snapshot</dt><dd>${r?.snapshot?'Supplied':'Unavailable'}</dd><dt>Slate snapshot</dt><dd>${weekly.snapshot?'Supplied':'Unavailable'}</dd><dt>Input timestamp</dt><dd>Unavailable</dd><dt>Evidence</dt><dd>${esc([...(m.evidence??[]),...(r?.evidence??[])].join(' ')||'Unavailable')}</dd><dt>Probabilities</dt><dd>${r?.probabilities?.map(p=>`${esc(teams[p.choice]?.name??p.choice)} (ID ${esc(p.choice)}): ${Math.round(p.probability*100)}%`).join('; ')??'Unavailable'}</dd></dl><p>${esc(r?.probabilityLabel??'Probability unavailable')}. Current display names are resolved from roster IDs. Confidence is independent of probability. Synthetic fixture; no generation occurs.</p></details></article>`}).join('')}
function league(){return `<section class="section" id="league-reference"><div class="section-head"><div><p class="eyebrow">The shared league reference</p><h2 style="margin-top:8px">Five pairings. Ten sides.</h2></div><a href="/teams">Team profiles</a></div><div class="league-grid"><section id="saved-picks" aria-labelledby="ai-heading"><div class="section-head" style="margin-bottom:8px"><div><h3 id="ai-heading"><a href="/ai-decides">AI Decides</a></h3><p>Saved synthetic Week ${currentPair.week} picks · model estimates, not calibrated odds.</p></div><a href="/ai-decides">Playground</a></div>${aiRows()}</section><section aria-labelledby="happenings-heading"><h3 id="happenings-heading" style="margin-bottom:22px">Around the league</h3><p class="meta" style="margin-bottom:16px">Dated sample happenings · ${esc(edition.dateLabel)}. Kept distinct from the current fixture.</p>${edition.happenings.map(h=>`<article class="happening"><p class="meta">${esc(h.dateLabel)} · 2026 sample</p><h3><a href="${esc(h.href)}">${esc(h.title)}</a></h3><p>${esc(h.text)}</p></article>`).join('')}<div class="actions"><a class="button" href="/transactions">Transactions</a><a class="button" href="/intel">League News</a></div></section></div></section>`}
function faces(){return `<section class="section" aria-labelledby="faces-heading"><div class="section-head"><div><p class="eyebrow">People worth knowing</p><h2 id="faces-heading" style="margin-top:8px">The faces of all ten teams</h2><p>Each roster’s highest modeled FAAB value. Price is an asset estimate, not observed form.</p></div><a href="/stocks">Open Stocks</a></div><div class="faces">${data.faces.map(f=>`<article class="face" data-face="${esc(f.team.id)}">${f.player?portrait(f.player.id,f.player.name):'<span class="meta">Player unavailable</span>'}<div><a class="face-name" href="/teams/${esc(f.team.id)}">${esc(f.team.name)}</a>${f.player?`<a class="player" href="/player/${esc(f.player.id)}">${esc(f.player.name)}</a><div class="face-price num">${money(f.player.value)}</div><a class="meta" href="/stocks?player=${esc(f.player.id)}">Price details</a>`:'<p class="meta">Modeled value unavailable</p>'}</div></article>`).join('')}</div></section>`}
const opponent=t=>{const m=t.currentMatchup;if(!m)return 'Current opponent unavailable';const o=m.home.id===t.identity.id?m.away:m.home;return `Week ${m.week} vs ${teamLink(o)} · Incomplete`};
function teamRow(t){const id=t.identity.id;const prev=t.previousSeason;return `<article class="directory-team" data-team-id="${esc(id)}"><div class="directory-team-head">${number(id)}<div><h3>${teamLink(t.identity)}</h3><p class="meta">${esc(t.identity.managerName)}${member&&id===summary.team.id?' · Your team':''}</p></div><span class="record num" aria-label="${t.currentRecord.wins} wins, ${t.currentRecord.losses} losses">${record(t.currentRecord)}</span></div><p class="opponent">${opponent(t)}</p><details><summary>${t.players.length} players · Open roster</summary><ul class="roster">${t.players.map(p=>`<li>${playerLink(p.id,p.fullName)}<span>${esc(p.position)} · ${esc(p.nbaTeam??'—')}</span></li>`).join('')}</ul></details>${prev?`<p class="previous" style="margin-left:44px">${esc(prev.season)}: ${prev.wins}–${prev.losses}, finish ${prev.finish}. ${esc(prev.ownerNote??'')}</p>`:''}</article>`}
function reference(){return `<section class="section" id="clubhouse"><div class="directory-layout"><section aria-labelledby="directory-heading"><div class="section-head" style="margin-bottom:0"><div><p class="eyebrow">Every manager. Every player.</p><h2 id="directory-heading" style="margin-top:8px">The clubhouse</h2></div><a href="/teams">All teams</a></div><div class="directory-controls"><div class="field"><label for="team-search">Search team, manager or player</label><input type="search" id="team-search" placeholder="Find a team or player" autocomplete="off"></div><div class="field"><label for="team-sort">Sort teams</label><select id="team-sort"><option value="id">Roster order</option><option value="name">Team A–Z</option><option value="players">Roster size</option><option value="points">Points for</option></select></div></div><p class="result-count" id="team-count" aria-live="polite">10 of 10 teams</p><div id="directory-list">${directory.map(teamRow).join('')}</div><p id="directory-empty" class="empty-state" hidden>No team, manager or roster player matches. Try another name or clear the search.</p></section><aside><div class="standings-head"><div><p class="eyebrow">2026 · synthetic standings</p><h2 style="margin-top:8px">The table</h2></div><div class="field"><label for="standings-sort">Sort standings</label><select id="standings-sort"><option value="rank">League rank</option><option value="points">Points for</option><option value="name">Team A–Z</option><option value="wins">Wins</option></select></div></div><table class="standings-table"><caption class="sr-only">All ten teams, rank, record and points for. Points are divided by 100 from the source fixture.</caption><thead><tr><th scope="col">#</th><th scope="col">Team</th><th scope="col">W–L</th><th scope="col">PF</th></tr></thead><tbody id="standings-body"></tbody></table><div class="unavailable"><h3>League stats</h3><p>Leaders, streaks, activity, blowouts and closest-game statistics are unavailable in this fixture.</p></div><div class="unavailable"><h3>Lineup Power</h3><p>${esc(inventory.missing.power)}</p></div><section class="transactions"><h3>Recent transactions</h3><p class="meta" style="margin-top:8px">Synthetic moves · current fixture</p>${data.home.hub.transactions.map(t=>`<article class="transaction"><p>${esc(t.summary)}</p><p class="meta">Week ${t.week} · ${day(t.createdAt)} · ${esc(t.type.replaceAll('_',' '))}</p></article>`).join('')}<div class="actions"><a class="button" href="/transactions">All transactions</a></div></section></aside></div></section>`}
function tools(){return `<section class="section" aria-labelledby="tools-heading"><div class="section-head"><div><p class="eyebrow">Useful between matchups</p><h2 id="tools-heading" style="margin-top:8px">Keep the league moving.</h2></div></div><div class="tools"><div class="market-tools"><article class="tool"><h3>Player market</h3><p>Inspect modeled player values and the evidence behind the prices.</p><div class="actions"><a class="button" href="/stocks">Open Stocks</a></div></article><article class="tool"><h3>Make your case.</h3><p>Bring both sides to the trade analyzer before the group chat does.</p><div class="actions"><a class="button" href="/trade-analyzer">Trade analyzer</a></div></article></div><article class="arcade"><a href="/arcade/free-throw" aria-label="Play free-throw practice"><img src="${inventory.assets.game}" alt="Preview of GOAT Hoopers free-throw practice" loading="lazy"></a><div><h3>A few shots after.</h3><p>Free-throw practice in the league arcade.</p><div class="actions"><a class="button primary" href="/arcade/free-throw">Play free throws</a><a class="button" href="/arcade">Arcade</a></div></div></article></div></section>`}
function archives(){return `<section class="section" aria-labelledby="archive-heading"><div class="section-head"><div><p class="eyebrow">The weekly archive</p><h2 id="archive-heading" style="margin-top:8px">Keep the receipts.</h2></div><a href="/weekly">Every edition</a></div><div class="archive">${data.archive.map(e=>`<a href="/weekly/${esc(e.id)}"><p class="eyebrow">${esc(e.dateLabel)} · Sample draft</p><h3>${esc(e.title)}</h3><p>${esc(e.game.note)}. ${e.game.state==='final'?'Verified 2025 historical final; not a current score.':'Dated opening-week sample; not the current fixture.'}</p></a>`).join('')}</div></section>`}
function footer(){return `<footer><div class="wrap"><div class="footer-top"><a href="/" aria-label="GOAT Hoopers home"><img src="${inventory.assets.logo}" alt="GOAT Hoopers"></a><nav class="footer-nav" aria-label="Footer"><a href="/teams">Teams</a><a href="/transactions">Transactions</a><a href="/history">History</a><a href="/weekly">Weekly archive</a><a href="/ai-decides">AI Decides</a></nav></div><details class="source-notes"><summary>About this edition & source notes</summary><p>${esc(inventory.warning)} Current fixture checked ${date(data.home.checkedAt)}. Sample editorial ${esc(edition.dateLabel)} is draft and stale, not published current-week coverage. Every current record, score, modeled price, form row, news item and AI example is synthetic.</p><p style="margin-top:12px">Source material for the dated editorial, checked separately on the dates shown:</p><ul>${edition.sources.map(s=>`<li><a href="${esc(s.url)}">${esc(s.label)}</a> · checked ${esc(s.checkedAt)}</li>`).join('')}</ul><p>Benchmark ${esc(inventory.benchmark)}. Static design preview; links retain the application’s destinations. This file does not establish authentication, backend, external route, or game behavior.</p></details><p class="footer-note">GOAT Hoopers · Direction 16 / Two editions · Same league. A useful place for each visitor.</p></div></footer>`}
document.getElementById('app').innerHTML=header+`<main id="content" class="${member?'member':'public'}-page"><div class="wrap">${editionBar}${member?memberLead():publicLead()}${member?league()+editorial():editorial()+league()}${faces()}${reference()}${tools()}${archives()}</div></main>`+footer();
function renderStandings(){const sort=document.getElementById('standings-sort').value;const rows=[...data.home.hub.standings].sort((a,b)=>sort==='name'?a.team.name.localeCompare(b.team.name):sort==='points'?b.pointsFor-a.pointsFor||a.rank-b.rank:sort==='wins'?b.wins-a.wins||a.rank-b.rank:a.rank-b.rank);document.getElementById('standings-body').innerHTML=rows.map(r=>`<tr><td class="num">${r.rank}</td><td><a class="rank-name" href="/teams/${esc(r.team.id)}">${esc(r.team.name)}</a><span class="manager-name">${esc(r.team.managerName)}${member&&r.team.id===summary.team.id?' · You':''}</span></td><td class="num">${r.wins}–${r.losses}</td><td class="num">${(r.pointsFor/100).toFixed(1)}</td></tr>`).join('')}
function updateDirectory(){const term=document.getElementById('team-search').value.trim().toLocaleLowerCase();const sort=document.getElementById('team-sort').value;const rows=[...directory].sort((a,b)=>sort==='name'?a.identity.name.localeCompare(b.identity.name):sort==='players'?b.players.length-a.players.length||Number(a.identity.id)-Number(b.identity.id):sort==='points'?b.currentRecord.pointsFor-a.currentRecord.pointsFor||Number(a.identity.id)-Number(b.identity.id):Number(a.identity.id)-Number(b.identity.id));const list=document.getElementById('directory-list');let count=0;rows.forEach(t=>{const el=list.querySelector(`[data-team-id="${t.identity.id}"]`);const match=[t.identity.name,t.identity.managerName,...t.players.map(p=>p.fullName)].some(s=>s.toLocaleLowerCase().includes(term));el.hidden=!match;if(match)count++;list.append(el);if(term&&match){const playerMatch=t.players.some(p=>p.fullName.toLocaleLowerCase().includes(term));el.querySelector('details').open=playerMatch}else if(!term)el.querySelector('details').open=false});document.getElementById('team-count').textContent=`${count} of ${directory.length} teams`;document.getElementById('directory-empty').hidden=count!==0}
document.getElementById('standings-sort').addEventListener('change',renderStandings);document.getElementById('team-search').addEventListener('input',updateDirectory);document.getElementById('team-sort').addEventListener('change',updateDirectory);renderStandings();
document.querySelector('.menu').addEventListener('keydown',e=>{if(e.key==='Escape'){e.currentTarget.open=false;e.currentTarget.querySelector('summary').focus()}});
document.body.dataset.mockReady='16';
</script>
</body>
</html>
