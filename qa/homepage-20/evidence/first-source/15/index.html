<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>GOAT Hoopers — Team rail</title>
<link rel="stylesheet" href="../../base.css">
<style>
:root { color-scheme:light; }
body { font-size:16px; }
a,button,input,select,summary { touch-action:manipulation; }
a { text-decoration-thickness:1px; }
a:hover { color:var(--gh-accent); }
h1,h2,h3,p,figure { margin:0; }
h1,h2,h3 { line-height:1.12; font-weight:720; letter-spacing:-.035em; }
h1,h2,h3,.player-name,.value-total,.rail-player a { overflow-wrap:anywhere; }
h2 { font-size:32px; }
h3 { font-size:20px; }
button,select,input { min-height:44px; border:1px solid var(--gh-control); border-radius:4px; color:var(--gh-text); background:var(--gh-bg-raised); }
input { width:100%; padding:10px 12px; }
select { padding:9px 32px 9px 12px; max-width:100%; }
summary { cursor:pointer; min-height:44px; padding:12px 0; }
small,.meta { font-size:12px; line-height:1.5; color:var(--gh-text-dim); }
.secondary { font-size:14px; color:var(--gh-text-dim); }
.num { font-family:var(--gh-font-mono); font-variant-numeric:tabular-nums; letter-spacing:-.04em; }
.kicker { font-size:12px; font-weight:650; letter-spacing:.12em; text-transform:uppercase; color:var(--gh-accent); }
.label { font-size:12px; font-weight:650; text-transform:uppercase; letter-spacing:.08em; color:var(--gh-text-dim); }
.skip { position:fixed; top:12px; left:16px; transform:translateY(-200%); padding:12px 16px; background:var(--gh-accent); color:var(--gh-on-accent); z-index:10; }
.skip:focus { transform:none; }
.arrow { display:inline-block; width:7px; height:7px; border-top:1.5px solid currentColor; border-right:1.5px solid currentColor; transform:rotate(45deg); margin-left:3px; vertical-align:middle; flex-shrink:0; }
.rail-value-collapse > summary { display:none; }
.site-header { padding:24px 32px 0; max-width:1504px; margin:auto; }
.header-line { display:flex; align-items:center; justify-content:space-between; gap:24px; padding-bottom:20px; }
.brand { display:block; width:190px; flex-shrink:0; }
.brand img { display:block; width:100%; height:auto; }
.compare { display:flex; align-items:center; flex-wrap:wrap; justify-content:flex-end; gap:8px 16px; font-size:12px; }
.compare a { min-height:32px; display:inline-flex; align-items:center; }
.compare [aria-current] { color:var(--gh-accent); font-weight:750; }
.desktop-nav { display:flex; flex-wrap:wrap; gap:8px 24px; border-block:1px solid var(--gh-border); }
.desktop-nav a { min-height:48px; display:inline-flex; align-items:center; font-size:14px; text-decoration:none; }
.desktop-nav a[aria-current] { font-weight:750; color:var(--gh-accent); }
.mobile-nav { display:none; border-block:1px solid var(--gh-border); }
.fixture { font-size:12px; padding:12px 0; color:var(--gh-text-dim); max-width:100ch; }
.fixture strong { color:var(--gh-text); }
.studio { max-width:1504px; padding:24px 32px 64px; display:grid; grid-template-columns:230px minmax(0,1fr); column-gap:44px; margin:auto; align-items:start; }
.team-rail { min-width:0; border-right:1px solid var(--gh-border); padding-right:24px; }
.rail-label { display:flex; align-items:center; gap:8px; margin-bottom:18px; }
.rail-mark { width:26px; height:26px; display:grid; place-content:center; font-size:12px; color:var(--gh-ink-on-color); background:var(--gh-team-1); font-weight:750; }
.rail-title { font-size:29px; margin-bottom:8px; }
.rail-section { padding:24px 0; border-top:1px solid var(--gh-border); margin-top:24px; }
.rail-section p + p { margin-top:8px; }
.rail-record { display:flex; flex-wrap:wrap; gap:24px; margin-top:20px; }
.rail-record strong { font-size:26px; display:block; }
.rail-record span { display:block; font-size:12px; color:var(--gh-text-dim); }
.actions { display:flex; flex-wrap:wrap; gap:8px 16px; margin-top:20px; align-items:center; }
.action { min-height:44px; display:inline-flex; gap:16px; align-items:center; font-size:14px; font-weight:650; }
.action.filled { padding:11px 16px; border-radius:4px; background:var(--gh-accent); color:var(--gh-on-accent); text-decoration:none; }
.value-total { font-size:34px; line-height:1.15; font-weight:650; display:block; margin:8px 0; }
.rail-player { display:flex; gap:10px; align-items:center; padding:10px 0; border-bottom:1px solid var(--gh-border); }
.rail-player .portrait { width:40px; height:44px; flex-shrink:0; }
.rail-player a { display:block; font-size:14px; font-weight:600; }
.rail-player small { display:block; }
.rail-full { font-size:14px; }
.value-list { padding:0; margin:4px 0 0; list-style:none; }
.value-list li { display:flex; justify-content:space-between; gap:16px; padding:8px 0; border-top:1px solid var(--gh-border); font-size:14px; }
.value-list a { overflow-wrap:anywhere; }
.value-list .num { white-space:nowrap; }
.rail-jumps { display:grid; gap:4px; margin-top:12px; }
.rail-jumps a { display:flex; justify-content:space-between; align-items:center; min-height:44px; font-size:14px; text-decoration:none; border-bottom:1px solid var(--gh-border); }
.canvas { min-width:0; }
.week-heading { display:flex; align-items:end; justify-content:space-between; gap:24px; padding-bottom:24px; }
.week-heading h1 { font-size:76px; line-height:.94; font-style:italic; letter-spacing:-.075em; margin-top:8px; }
.week-heading .week-side { text-align:right; max-width:230px; }
.status { display:inline-block; font-size:12px; color:var(--gh-live); font-weight:700; }
.lead { display:grid; grid-template-columns:minmax(0,1.15fr) minmax(0,1fr); gap:32px; padding-block:24px 32px; border-block:1px solid var(--gh-border); }
.score-team { display:grid; grid-template-columns:minmax(0,1fr) auto; gap:16px; align-items:start; padding:16px 0; }
.score-team + .score-team { border-top:1px solid var(--gh-border); }
.score-team h2 { font-size:29px; line-height:1.08; margin-bottom:8px; }
.score-team h2 a { text-decoration:none; }
.score { font-size:38px; font-weight:600; line-height:1; }
.score.pending { font-family:var(--gh-font-body); font-size:18px; font-weight:500; color:var(--gh-text-dim); letter-spacing:0; padding-top:7px; }
.score-label { font-size:12px; color:var(--gh-text-dim); display:block; margin-top:5px; text-align:right; }
.court { width:100%; aspect-ratio:16/9; object-fit:cover; display:block; background:var(--gh-bg-hover); }
.court-note { font-size:12px; color:var(--gh-text-dim); margin-top:10px; }
.edition-note { font-size:14px; margin-top:12px; }
.edition-note summary { font-size:14px; padding-block:8px; }
.edition-note p { margin:6px 0 12px; color:var(--gh-text-dim); }
.section { padding-top:40px; }
.section-top { display:flex; gap:24px; justify-content:space-between; align-items:end; margin-bottom:20px; }
.section-top .meta { max-width:36ch; }
.section-top .kicker { margin-bottom:6px; }
.section-intro { margin-top:-8px; margin-bottom:20px; font-size:14px; color:var(--gh-text-dim); max-width:76ch; }
.ai-row { border-top:1px solid var(--gh-border); padding:16px 0; display:grid; grid-template-columns:30px minmax(0,1.1fr) minmax(0,1fr); gap:12px 20px; }
.ai-index { font-size:12px; color:var(--gh-text-dim); padding-top:3px; }
.ai-names { display:grid; gap:8px; }
.ai-name { display:flex; justify-content:space-between; gap:12px; font-size:16px; }
.ai-name a { text-decoration:none; }
.ai-name strong { font-size:16px; font-weight:500; white-space:nowrap; }
.ai-return { font-size:14px; }
.ai-return strong { font-weight:650; }
.ai-row details { grid-column:2/-1; font-size:12px; }
.ai-row details summary { font-size:12px; padding-block:4px; min-height:32px; color:var(--gh-text-dim); }
.provenance { padding:12px 0 8px; display:grid; gap:8px; color:var(--gh-text-dim); overflow-wrap:anywhere; }
.provenance dl { display:grid; grid-template-columns:112px minmax(0,1fr); gap:6px 12px; margin:0; }
.provenance dd { margin:0; }
.provenance ul { margin:0; padding-left:20px; }
.empty { padding:20px 0; border-block:1px solid var(--gh-border); font-size:14px; color:var(--gh-text-dim); }
.notebook { display:grid; grid-template-columns:1.1fr 1fr; gap:32px; }
.notebook h3 { margin-bottom:10px; }
.watch-row { display:grid; grid-template-columns:minmax(0,1fr) auto; gap:8px; border-top:1px solid var(--gh-border); padding:12px 0; }
.watch-row a { font-weight:600; }
.watch-row small { display:block; }
.watch-row .num { font-size:24px; line-height:1.1; text-align:right; }
.watch-row .num small { font-family:var(--gh-font-body); font-size:12px; letter-spacing:0; margin-top:6px; }
.watch-note { padding-top:10px; font-size:14px; color:var(--gh-text-dim); }
.league-note { border-top:1px solid var(--gh-border); padding-top:16px; }
.league-note .portrait { width:96px; height:112px; float:right; margin:0 0 12px 20px; }
.league-note h3 { font-size:25px; margin-block:8px 12px; }
.league-note p { font-size:14px; }
.notebook details { font-size:14px; clear:both; }
.completed { margin-top:24px; border-block:1px solid var(--gh-border); }
.completed summary { font-size:16px; font-weight:600; }
.completed .two-col { margin-bottom:20px; }
.two-col { display:grid; grid-template-columns:1fr 1fr; gap:32px; }
.simple-list { margin:0; list-style:none; padding:0; }
.simple-list li { padding:12px 0; border-top:1px solid var(--gh-border); }
.simple-list p { margin-top:5px; }
.performance li { display:flex; justify-content:space-between; gap:12px; font-size:14px; }
.performance small { display:block; }
.performance .num { white-space:nowrap; }
.spotlight-grid { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:24px; }
.spotlight { border-top:1px solid var(--gh-border); padding-top:16px; }
.portrait { display:block; object-fit:cover; object-position:bottom; background:var(--gh-bg-hover); }
.spotlight .portrait { width:84px; height:96px; margin-bottom:12px; }
.spotlight h3 { font-size:24px; margin-block:10px 12px; }
.spotlight p { font-size:14px; }
.statline { font-family:var(--gh-font-mono); font-size:14px; margin-block:14px 4px; }
.spotlight details { font-size:12px; margin-top:10px; }
.spotlight details summary { font-size:12px; min-height:32px; }
.spotlight details p { font-size:12px; color:var(--gh-text-dim); margin-bottom:8px; }
.face-grid { display:grid; grid-template-columns:repeat(5,minmax(0,1fr)); column-gap:24px; row-gap:24px; }
.face { border-top:1px solid var(--gh-border); padding-top:12px; }
.face .portrait { width:100%; height:114px; background:none; object-fit:contain; }
.face .team-name { display:block; font-size:12px; font-weight:600; color:var(--gh-text-dim); margin-top:8px; }
.face .player-name { display:block; font-size:16px; font-weight:650; line-height:1.25; text-decoration:none; margin:6px 0; }
.face .num { font-size:16px; }
.face .champion { color:var(--gh-champion); font-size:12px; }
.directory-tools { display:grid; grid-template-columns:minmax(0,1fr) 210px; gap:16px; align-items:end; margin-bottom:16px; }
.field label { font-size:12px; font-weight:650; display:block; margin-bottom:6px; }
.field select { width:100%; }
.result-count { font-size:12px; color:var(--gh-text-dim); margin-bottom:12px; }
.club { border-top:1px solid var(--gh-border); }
.club summary { padding:16px 0; display:grid; grid-template-columns:20px minmax(0,1fr) minmax(0,.65fr) 60px; gap:16px; list-style:none; align-items:start; }
.club summary::-webkit-details-marker { display:none; }
.club summary::before { content:"+"; font-family:var(--gh-font-mono); color:var(--gh-accent); }
.club details[open] summary::before { content:"−"; }
.club-name { display:block; font-size:20px; font-weight:650; line-height:1.2; letter-spacing:-.025em; }
.club-manager { display:block; font-size:12px; color:var(--gh-text-dim); margin-top:6px; overflow-wrap:anywhere; }
.opponent { font-size:14px; }
.opponent small { display:block; margin-bottom:4px; }
.club-record { font-size:16px; text-align:right; white-space:nowrap; }
.club-content { padding:0 0 24px 36px; }
.club-info { display:flex; flex-wrap:wrap; gap:8px 24px; font-size:14px; color:var(--gh-text-dim); margin-bottom:16px; }
.roster { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:0 24px; list-style:none; margin:0; padding:0; }
.roster li { min-width:0; padding:9px 0; border-top:1px solid var(--gh-border); }
.roster a { display:block; font-size:14px; line-height:1.35; }
.roster small { display:block; margin-top:4px; }
.standings-head { display:flex; gap:24px; justify-content:space-between; align-items:end; margin-bottom:16px; }
.standings-head .field { width:180px; }
table { width:100%; border-collapse:collapse; font-size:14px; }
th,td { border-top:1px solid var(--gh-border); padding:12px 6px; text-align:right; vertical-align:top; }
th { font-size:12px; color:var(--gh-text-dim); font-weight:600; }
th:nth-child(2),td:nth-child(2) { text-align:left; width:65%; }
th:first-child,td:first-child { text-align:left; padding-left:0; }
td:not(:nth-child(2)) { font-family:var(--gh-font-mono); font-variant-numeric:tabular-nums; }
td a { text-decoration:none; font-weight:600; }
td small { display:block; }
.tools-line { display:grid; grid-template-columns:minmax(0,1fr) 1fr; gap:32px; }
.tools-line h3 { margin-bottom:10px; }
.market-links { display:flex; gap:8px 24px; flex-wrap:wrap; margin-top:12px; }
.market-links a { min-height:44px; display:inline-flex; align-items:center; font-size:14px; font-weight:600; }
.game-link { display:grid; grid-template-columns:132px minmax(0,1fr); gap:16px; text-decoration:none; align-items:start; }
.game-link img { width:132px; aspect-ratio:16/9; object-fit:cover; display:block; }
.game-link strong { display:block; font-size:20px; line-height:1.2; }
.game-link small { display:block; margin-top:8px; }
.text-link { display:inline-flex; min-height:44px; align-items:center; gap:16px; font-size:14px; font-weight:650; }
.source-details { margin-top:24px; border-block:1px solid var(--gh-border); font-size:14px; }
.source-details p { margin:8px 0 16px; max-width:80ch; }
.source-details ul { padding-left:20px; margin:8px 0 20px; }
.source-details li { margin:8px 0; }
.page-footer { margin-top:40px; padding-top:24px; border-top:1px solid var(--gh-control); display:flex; flex-wrap:wrap; gap:16px 32px; align-items:center; justify-content:space-between; font-size:12px; }
.page-footer nav { display:flex; flex-wrap:wrap; gap:8px 20px; }
.page-footer a { min-height:44px; display:inline-flex; align-items:center; }
@media(min-width:1600px) { .studio { column-gap:56px; grid-template-columns:240px minmax(0,1fr); } }
@media(max-width:1100px) {
.studio { grid-template-columns:200px minmax(0,1fr); column-gap:28px; padding-inline:24px; }
.site-header { padding-inline:24px; }
.team-rail { padding-right:20px; }
.lead { grid-template-columns:1fr; gap:20px; }
.lead figure { display:grid; grid-template-columns:180px minmax(0,1fr); gap:16px; align-items:start; }
.lead figure .court-note { margin-top:0; }
.week-heading h1 { font-size:64px; }
.score-team h2 { font-size:28px; }
.face-grid { grid-template-columns:repeat(5,minmax(0,1fr)); gap:16px; }
.face .portrait { height:90px; }
.notebook,.two-col,.tools-line { gap:24px; }
.spotlight-grid { gap:20px; }
.ai-row { grid-template-columns:20px minmax(0,1fr) minmax(0,1fr); gap:12px; }
.roster { grid-template-columns:repeat(2,minmax(0,1fr)); }
}
@media(max-width:760px) {
.site-header { padding:16px 16px 0; }
.header-line { gap:16px; padding-bottom:12px; align-items:start; }
.brand { width:142px; margin-top:6px; }
.compare { gap:0 10px; max-width:150px; }
.compare span { display:none; }
.desktop-nav { display:none; }
.mobile-nav { display:block; }
.mobile-nav summary { display:flex; align-items:center; justify-content:space-between; font-size:14px; font-weight:650; list-style:none; }
.mobile-nav summary::after { content:"+"; font-size:20px; color:var(--gh-accent); }
.mobile-nav[open] summary::after { content:"−"; }

.mobile-nav a { display:flex; align-items:center; min-height:44px; border-top:1px solid var(--gh-border); text-decoration:none; font-size:14px; }

.studio { display:flex; flex-direction:column; padding:8px 16px 32px; gap:28px; }
.team-rail { border-right:0; padding:16px 0; border-block:1px solid var(--gh-control); width:100%; }
.rail-label { margin-bottom:10px; }
.rail-title { font-size:24px; max-width:400px; }
.rail-record { margin-top:12px; gap:24px; }
.rail-record strong { font-size:22px; }

.rail-identity .rail-record { margin:0; flex-direction:column; gap:8px; text-align:right; }
.rail-identity .rail-record > div { display:flex; align-items:baseline; gap:8px; justify-content:flex-end; }
.rail-record span { max-width:75px; text-align:right; }
.rail-actions { margin-top:14px; }
.rail-section { margin-top:16px; padding-top:16px; padding-bottom:0; }
.rail-value details summary { min-height:44px; }
.rail-section.rail-navigate { display:none; }
.rail-value .value-total { font-size:28px; display:inline; margin-right:8px; }
.value-lead { display:flex; justify-content:space-between; gap:16px; flex-wrap:wrap; align-items:baseline; }
.value-lead .label { font-size:12px; }
.rail-top3 { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:12px; }
.rail-player { flex-direction:column; align-items:start; gap:8px; border:0; }
.rail-player .portrait { width:48px; height:52px; }
.rail-player a { font-size:14px; }
.value-list { display:grid; grid-template-columns:1fr 1fr; column-gap:24px; }
.value-list li { display:block; }
.value-list .num { display:block; margin-top:4px; }
.canvas { width:100%; }
.week-heading { gap:16px; padding-bottom:16px; }
.week-heading h1 { font-size:60px; }
.week-heading .week-side { max-width:140px; }
.lead { padding:16px 0 24px; }
.score-team { padding:14px 0; gap:12px; }
.score-team h2 { font-size:27px; }
.score { font-size:34px; }
.score.pending { font-size:16px; }
.lead figure { grid-template-columns:132px minmax(0,1fr); gap:14px; }
.section { padding-top:32px; }
.section-top { align-items:start; gap:16px; margin-bottom:16px; }
.section-top h2,h2 { font-size:28px; }
.section-top .meta { max-width:160px; }
.ai-row { grid-template-columns:20px minmax(0,1fr); padding-block:16px; gap:10px 12px; }

.ai-row details { grid-column:2; }

.ai-name { gap:12px; font-size:16px; }
.notebook,.two-col,.tools-line { grid-template-columns:1fr; gap:24px; }

.spotlight-grid { grid-template-columns:1fr; gap:24px; }

.face-grid { grid-template-columns:repeat(2,minmax(0,1fr)); gap:20px; }
.face .portrait { height:108px; }
.face .team-name { font-size:12px; }
.directory-tools { grid-template-columns:1fr; gap:12px; }
.club summary { grid-template-columns:16px minmax(0,1fr) 45px; gap:10px; padding-block:16px; }
.club-name { font-size:19px; }
.club summary .opponent { grid-column:2; font-size:14px; }
.club summary .opponent small { display:inline; }
.club-record { grid-row:1; grid-column:3; }

.club-info { display:block; }
.club-info span { display:block; margin-bottom:8px; }
.roster { grid-template-columns:1fr 1fr; gap:0 16px; }
.roster a { min-height:44px; display:flex; align-items:center; font-size:14px; }
.roster small { margin-top:0; }
.standings-head { align-items:start; flex-direction:column; gap:12px; }
.standings-head .field { width:100%; }
th,td { padding:12px 4px; font-size:14px; }
th { font-size:12px; }
th:nth-child(2),td:nth-child(2) { width:auto; }
td small { display:none; }
.game-link { grid-template-columns:110px minmax(0,1fr); gap:14px; }
.game-link img { width:110px; }
.game-link strong { font-size:20px; }
.page-footer { display:block; margin-top:24px; }
.page-footer nav { margin-top:12px; }
.provenance dl { grid-template-columns:1fr; gap:3px; }
.provenance dd { margin-bottom:8px; }
}
@media(max-width:760px) {
.compare a { min-height:44px; }
.rail-identity { display:block; }
.rail-identity .rail-record { margin-top:12px; flex-direction:row; gap:20px; text-align:left; }

<script type="module">
import {inventory,data,mode,aiState,esc,money} from '../../data.js';
const {home,weekly,faces,archive}=data;
const edition=home.edition;
const member=mode==='member' && data.personal.kind==='member';
const summary=member?data.personal.summary:null;
const teams=home.directory;
const teamById=id=>teams.find(t=>t.identity.id===String(id))?.identity;
const name=id=>teamById(id)?.name??`Roster ${id} (unmatched)`;
const record=t=>`${t.wins}–${t.losses}${t.ties?'–'+t.ties:''}`;
const date=v=>v==null?'Unavailable':new Date(v).toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric',timeZone:'UTC'});
const stamp=v=>v==null?'Unavailable':new Date(v).toLocaleString('en-GB',{day:'2-digit',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit',hour12:false,timeZone:'UTC'})+' UTC';
const hrefTeam=id=>`/teams/${esc(id)}`;
const hrefPlayer=id=>`/player/${esc(id)}`;
const teamLink=t=>`<a href="${hrefTeam(t.id)}">${esc(t.name)}</a>`;
const playerLink=p=>`<a href="${hrefPlayer(p.id??p.playerId)}">${esc(p.name??p.fullName)}</a>`;
const portrait=(id,label,cl='')=>inventory.portraits[id]?`<img class="portrait ${cl}" src="${inventory.portraits[id]}" alt="" loading="lazy" onerror="this.hidden=true;this.nextElementSibling.hidden=false"><span hidden class="secondary">Portrait unavailable · ${esc(label)}</span>`:`<span class="portrait-fallback secondary">Portrait unavailable · ${esc(label)}</span>`;
const links=[['Home','./index.html?view='+mode],['News','/intel'],['Stocks','/stocks'],['History','/history'],['Arcade','/arcade'],['AI Decides','/ai-decides'],['Teams','/teams'],['Transactions','/transactions'],['Weekly archive','/weekly']];
const nav=links.map(([l,h])=>`<a href="${h}" ${l==='Home'?'aria-current="page"':''}>${l}</a>`).join('');
const params=v=>`?view=${v}${aiState==='ready'?'':'&ai='+esc(aiState)}`;
document.querySelector('#top').innerHTML=`
<div class="header-line"><a class="brand" href="./index.html?view=${mode}" aria-label="GOAT Hoopers home"><img src="${inventory.assets.logo}" alt="GOAT Hoopers"></a><div class="compare"><span>Compare fixture</span><a href="${params('member')}" ${member?'aria-current="page"':''}>Member</a><a href="${params('public')}" ${!member?'aria-current="page"':''}>Public</a></div></div>
<nav class="desktop-nav" aria-label="League navigation">${nav}</nav>
<details class="mobile-nav"><summary>Home <span>League menu</span></summary><nav aria-label="League navigation">${nav}</nav></details>
<p class="fixture"><strong>Offline design fixture.</strong> All current records, scores, prices, form, news and AI are synthetic. Dated identities and sample editorial are preserved.</p>`;
const rail=document.querySelector('#rail');
const fullValues=summary?.rosterValues.map(p=>`<li>${playerLink(p)} <span class="num">${money(p.value)}</span></li>`).join('');
rail.innerHTML=member?`
<div data-personal>
<div class="rail-label"><span class="rail-mark">01</span><span class="kicker">Your team desk</span></div>
<div class="rail-identity"><div><h2 class="rail-title"><a href="/team" style="text-decoration:none">${esc(summary.team.name)}</a></h2><p class="secondary">${esc(summary.team.managerName)} · ${summary.coverage.roster} players</p></div>
<div class="rail-record"><div><strong class="num">${record(summary.team)}</strong><span>Current record</span></div><div><strong class="num">${summary.standing.rank}<span style="display:inline;font-size:14px">/10</span></strong><span>Standing</span></div></div></div>
<div class="actions rail-actions"><a class="action filled" href="/team">My team <span aria-hidden="true"><span class="arrow" aria-hidden="true"></span></span></a><a class="action" href="/teams/1#team-roster">View roster</a></div>
<section class="rail-section rail-value" aria-labelledby="value-title"><details class="rail-value-collapse" open><summary><span>Roster value <strong class="num">${money(summary.valuation.total)}</strong></span><span class="meta">${summary.valuation.priced}/${summary.coverage.roster} priced · ${summary.valuation.unpriced} unpriced · history unavailable</span></summary><div>
<div class="value-lead"><h3 id="value-title" class="label">Roster value</h3><strong class="value-total num">${money(summary.valuation.total)}</strong></div>
<p class="secondary">Modeled FAAB value · ${summary.valuation.priced}/${summary.coverage.roster} priced · ${summary.valuation.unpriced} unpriced</p>
<p class="meta">Value rank ${summary.valuation.rank.rank} of ${summary.valuation.rank.teams} fully priced rosters. In-season modeled basis. Computed ${stamp(summary.market.updatedAt)}.</p>
<details class="rail-full"><summary>Top 3 & all 24 values</summary><div class="rail-top3">${summary.players.map(p=>`<div class="rail-player">${portrait(p.id,p.name)}<div>${playerLink(p)}<small><span class="num">${money(p.value)}</span> · +${p.changePct}% vs prior snapshot</small></div></div>`).join('')}</div><ul class="value-list" data-roster-values>${fullValues}</ul></details>
<p class="meta" style="margin-top:8px">${esc(inventory.missing.history)}</p>
</div></details></section>
</div>`:`
<div class="rail-label"><span class="kicker">League desk</span></div><h2 class="rail-title">Ten teams.<br>One floor.</h2><p class="secondary">2026 season · Week ${teams[0].currentMatchup.week}<br>Ten friends, one league.</p><div class="actions"><a class="action filled" href="/teams">Meet the teams <span aria-hidden="true"><span class="arrow" aria-hidden="true"></span></span></a></div><section class="rail-section"><h3>Make yourself at home.</h3><p class="secondary" style="margin-top:10px">League stories, the full rosters, saved model picks and free-throw practice are open to explore.</p><a class="action" href="/login">Log in</a></section>`;
rail.insertAdjacentHTML('beforeend',`<nav class="rail-section rail-navigate" aria-label="On this page"><p class="label">On the floor</p><div class="rail-jumps"><a href="#matchup">This matchup <span>01</span></a><a href="#saved-calls">Saved calls <span>02</span></a><a href="#scouting">Scouting notebook <span>03</span></a><a href="#clubhouse">The clubhouse <span>04</span></a><a href="#standings">Standings <span>05</span></a></div></nav>`);
const matchup=member?teams.find(t=>t.identity.id===summary.team.id).currentMatchup:teams[0].currentMatchup;
const scoreTeam=(t,value)=>`<div class="score-team"><div><h2>${teamLink(t)}</h2><p class="secondary">${esc(t.managerName)} · <span class="num">${record(t)}</span></p></div><div><strong class="score ${value==null?'pending':'num'}">${value==null?'Pending':Number(value).toFixed(1)}</strong><span class="score-label">${value==null?'Awaiting score':'Known score'}</span></div></div>`;
function aiRows(){
 if(!weekly) return `<div class="empty"><strong>Saved AI unavailable.</strong> No saved slate is connected. No probability or returned choice is inferred. <a href="/ai-decides">Open AI Decides</a>.</div>`;
 const slateMatches=weekly.season===home.hub.season.seasonYear && weekly.week===matchup.week;
 return weekly.matchups.map((pair,i)=>{
 const live=teams.find(t=>t.currentMatchup && pair.teamIds.includes(t.currentMatchup.home.id) && pair.teamIds.includes(t.currentMatchup.away.id))?.currentMatchup;
 const matched=slateMatches && !!live && pair.teamIds.every(id=>teamById(id));
 const result=pair.result;
 const stale=weekly.status==='stale'||pair.status==='stale';
 const available=matched && result && ['ready','stale'].includes(pair.status);
 const probabilities=available?pair.teamIds.map(id=>({id,p:result.probabilities.find(p=>p.choice===id)?.probability})):pair.teamIds.map(id=>({id,p:null}));
 const choice=available?result.choice:null;
 return `<article class="ai-row" data-ai-pair="${esc(pair.matchupId)}"><span class="ai-index num">${String(i+1).padStart(2,'0')}</span>
 <div class="ai-names">${probabilities.map(p=>`<div class="ai-name"><a href="${hrefTeam(p.id)}">${esc(name(p.id))}</a><strong class="num">${p.p==null?'Unavailable':(p.p*100).toFixed(0)+'%'}</strong></div>`).join('')}</div>
 <div class="ai-return"><span class="status">${stale?'Stale saved pick':!matched?'Unmatched slate':!available?'Unavailable':'Synthetic saved pick'}</span><p>Returned choice<br><strong>${choice?esc(name(choice)):'Unavailable'}</strong></p><p class="secondary" style="margin-top:6px">Confidence <span class="num">${available?(result.confidence*100).toFixed(0)+'%':'Unavailable'}</span> · separate model signal</p></div>
 <details><summary>Saved pick provenance</summary><div class="provenance"><dl><dt>Saved</dt><dd>${stamp(weekly.generatedAt)}</dd><dt>Season / week</dt><dd>${esc(weekly.season)} / ${weekly.week} · ${matched?'Current IDs matched':'Does not match current pairing'}</dd><dt>Roster IDs</dt><dd>${pair.teamIds.map(esc).join(' / ')}</dd><dt>Model / prompt</dt><dd>${esc(result?.model??'Unavailable')} / ${esc(result?.promptVersion??'Unavailable')}</dd><dt>Input snapshot</dt><dd>${result?.snapshot?'Connected':'Unavailable'}</dd><dt>Baseline</dt><dd>${pair.baseline?'Connected':'Unavailable'}</dd><dt>Probability basis</dt><dd>${esc(result?.probabilityLabel??'Unavailable')}</dd></dl><p>Returned choice is shown as saved. Confidence is independent of the displayed probability. No new generation occurs here.</p><p>Input evidence: ${(pair.evidence??[]).map(esc).join(' ')||'Unavailable'}</p><p>Result evidence: ${(result?.evidence??[]).map(esc).join(' ')||'Unavailable'}</p></div></details></article>`;
 }).join('');
}
const editorialWatch=edition.playerSpotlights.find(p=>p.role==='one-to-watch');
const perfRows=rows=>rows.map(p=>`<li><div>${playerLink(p)}<small>${esc(p.note)}</small></div><div class="num">${p.value.toFixed(1)} pts<small>${p.games} GP</small></div></li>`).join('');
const watchContent=member?`<div><h3>Your observed form</h3><p class="secondary">${esc(summary.playerGuide.watch.label)}</p><div style="margin-top:14px">${summary.playerGuide.watch.rows.map(p=>`<div class="watch-row"><div>${playerLink(p)}<small>${esc(p.note)}</small></div><div class="num">${p.value.toFixed(1)}<small>${p.games} observed GP</small></div></div>`).join('')}</div><p class="watch-note">2026 in-season · synthetic observed form. ${esc(summary.playerGuide.watch.message)}</p></div>`:`<div><h3>Players around the league</h3><p class="secondary">Current roster context, using synthetic modeled FAAB values. Price is a market signal, not observed form or a weekly score projection.</p>${faces.slice(0,3).map(f=>`<div class="watch-row"><div>${playerLink(f.player)}<small>${teamLink(f.team)}</small></div><div class="num" style="font-size:20px">${money(f.player.value)}<small>Modeled FAAB</small></div></div>`).join('')}</div>`;
const main=document.querySelector('#main');
main.innerHTML=`
<section id="matchup" aria-labelledby="week-title">
<div class="week-heading"><div><p class="kicker">${member?'Your current matchup':'Featured current matchup'} · 2026</p><h1 id="week-title">Week ${String(matchup.week).padStart(2,'0')}</h1></div><div class="week-side"><span class="status">Scoring incomplete</span><p class="meta">Fixture checked<br>${stamp(home.checkedAt)}</p></div></div>
<div class="lead"><div>${scoreTeam(matchup.home,matchup.homePoints)}${scoreTeam(matchup.away,matchup.awayPoints)}<p class="meta" style="margin-top:14px">A known 0.0 is a score. Pending is missing data. This pairing is not final.</p><a class="text-link" href="${hrefTeam(member?summary.team.id:matchup.home.id)}#team-roster">Inspect the roster <span aria-hidden="true"><span class="arrow" aria-hidden="true"></span></span></a></div>
<div><figure><img class="court" src="${inventory.assets.court}" alt="The original GOAT Hoopers arena, with league pennants above the hardwood"><figcaption class="court-note">Our court, our league.<br><a class="text-link" href="/arcade/free-throw" style="font-size:12px">Shoot around <span aria-hidden="true"><span class="arrow" aria-hidden="true"></span></span></a></figcaption></figure><details class="edition-note"><summary>Dated edition · stale sample</summary><p><strong>${esc(edition.title)}</strong> · ${esc(edition.dateLabel)} · ${esc(edition.status)}. This edition predates the current Week ${matchup.week} fixture. Its opening-week matchup is separate.</p><p>${esc(edition.game.context)}</p><p>Selection basis: ${esc(edition.game.selectionReason)}</p><a href="/weekly/${esc(edition.id)}">Read this sample edition</a></details></div></div>
</section>
<section class="section" id="saved-calls" aria-labelledby="calls-title"><div class="section-top"><div><p class="kicker">02 / Model notebook</p><h2 id="calls-title"><a href="/ai-decides" style="text-decoration:none">Saved calls</a></h2></div><p class="meta">${weekly?`${weekly.status==='stale'?'<strong class="status">Stale saved slate</strong><br>':''}All five pairs · ${stamp(weekly.generatedAt)}`:'Saved slate unavailable'}</p></div><p class="section-intro">Synthetic model probabilities, not sports odds. Returned choice and confidence remain separate. <a href="/ai-decides">Open AI playground <span class="arrow" aria-hidden="true"></span></a></p>${aiRows()}</section>
<section class="section" id="scouting" aria-labelledby="scout-title"><div class="section-top"><div><p class="kicker">03 / Follow the players</p><h2 id="scout-title">Scouting notebook</h2></div><p class="meta">Form, price and editorial opinion each keep their own basis.</p></div><div class="notebook">${watchContent}<article class="league-note">${portrait(editorialWatch.playerId,editorialWatch.name)}<p class="label">Dated editorial · one to watch</p><h3>${esc(editorialWatch.headline)}</h3><p>${playerLink({id:editorialWatch.playerId,name:editorialWatch.name})} · <a href="${hrefTeam(editorialWatch.teamId)}">${esc(name(editorialWatch.teamId))}</a></p><p style="margin-top:8px">${esc(editorialWatch.opinion)}</p><details><summary>Editorial basis & period</summary><p>${esc(editorialWatch.selectionReason)}</p><p class="meta">${esc(edition.dateLabel)} · ${esc(editorialWatch.statPeriod)} · source checked ${date(editorialWatch.source.checkedAt)}. <a href="${esc(editorialWatch.source.url)}">${esc(editorialWatch.source.label)}</a>.</p></details></article></div>
${member?`<details class="completed" data-personal><summary>Last completed week · best & rough performers</summary><p class="secondary" style="margin-bottom:16px">${esc(inventory.missing.recap)}<br>${esc(summary.playerGuide.period)}</p><div class="two-col"><div><h3>Best recorded</h3><ul class="simple-list performance" style="margin-top:12px">${perfRows(summary.playerGuide.best)}</ul></div><div><h3>Rough recorded</h3><ul class="simple-list performance" style="margin-top:12px">${perfRows(summary.playerGuide.rough)}</ul></div></div><p class="meta" style="margin-bottom:20px">${esc(summary.playerGuide.coverage)} Eligible played: ${summary.playerGuide.eligiblePlayed}. ${esc(summary.playerGuide.recapMessage)}</p></details>`:''}
</section>
<section class="section" aria-labelledby="sample-title"><div class="section-top"><div><p class="kicker">From the dated edition</p><h2 id="sample-title">Good, bad, watch next</h2></div><p class="meta">${esc(edition.dateLabel)} · draft sample.<br>These are not current official Week 2 awards.</p></div><div class="spotlight-grid">${edition.playerSpotlights.map(p=>`<article class="spotlight">${portrait(p.playerId,p.name)}<p class="label">${esc(p.periodLabel)}</p><h3>${esc(p.headline)}</h3><p>${playerLink({id:p.playerId,name:p.name})} · ${esc(p.position)}</p><p style="margin-top:8px">${esc(p.opinion)}</p><div class="statline">${p.stats.map(s=>`${esc(s.value)} ${esc(s.label)}`).join(' / ')}</div><p class="meta">${esc(p.statPeriod)}</p><details><summary>Source & selection basis</summary><p>${esc(p.selectionReason)}</p><p>Source checked ${date(p.source.checkedAt)}. <a href="${esc(p.source.url)}">${esc(p.source.label)}</a>.</p><p>Current team: <a href="${hrefTeam(p.teamId)}">${esc(name(p.teamId))}</a>. Edition: ${esc(edition.dateLabel)} · draft.</p></details></article>`).join('')}</div></section>
<section class="section" aria-labelledby="faces-title"><div class="section-top"><div><p class="kicker">Ten teams / ten faces</p><h2 id="faces-title">The names on the floor</h2></div><p class="meta">Each team's top modeled player.<br>Synthetic FAAB prices · no form ranking.</p></div><div class="face-grid">${faces.map(f=>`<article class="face" data-face="${f.team.id}">${portrait(f.player.id,f.player.name)}<a class="team-name" href="${hrefTeam(f.team.id)}">${esc(f.team.name)}</a><a class="player-name" href="${hrefPlayer(f.player.id)}">${esc(f.player.name)}</a><span class="num">${money(f.player.value)}</span> <small>· ${esc(f.player.position)}</small>${f.champion?'<p class="champion">Defending champion</p>':''}</article>`).join('')}</div></section>

<section class="section" id="standings" aria-labelledby="stand-title"><div class="standings-head"><div><p class="kicker">05 / Across the league</p><h2 id="stand-title" style="margin-top:6px">Standings</h2></div><div class="field"><label for="stand-sort">Sort standings</label><select id="stand-sort"><option value="rank">Rank</option><option value="points">Points for</option><option value="name">Team name</option></select></div></div><p class="section-intro">All 10 teams · synthetic current season. PF uses source points ÷ 100.</p><table><caption class="sr-only">Current synthetic league standings</caption><thead><tr><th scope="col">#</th><th scope="col">Team</th><th scope="col">W</th><th scope="col">L</th><th scope="col">PF</th></tr></thead><tbody id="stand-body"></tbody></table><details class="source-details"><summary>League statistics unavailable · Power unavailable</summary><p>${esc(inventory.missing.power)}</p><p>League statistics unavailable: points-for leader, points-against leader, longest streak, most active manager, biggest blowout and closest game all have no producer value in this fixture. No ranking or result is inferred.</p></details></section>

${member?`<details class="source-details"><summary>All 3 recent league transactions</summary><ul>${home.hub.transactions.map(m=>`<li>${esc(m.summary)} · ${date(m.createdAt)} · Week ${m.week} · ${m.teamIds.map(id=>`<a href="${hrefTeam(id)}">${esc(name(id))}</a>`).join(', ')}</li>`).join('')}</ul><a class="text-link" href="/transactions">All transactions <span class="arrow" aria-hidden="true"></span></a></details>`:''}</section>
<section class="section" aria-labelledby="break-title"><div class="section-top"><div><p class="kicker">Beyond the matchup</p><h2 id="break-title">Work the market. Hit the court.</h2></div></div><div class="tools-line"><div><h3>Stocks & trades</h3><p class="secondary">Inspect modeled FAAB prices and compare the players in a deal. Quotes here are synthetic; recorded team-value history is unavailable.</p><div class="market-links"><a href="/stocks">Open Stocks <span class="arrow" aria-hidden="true"></span></a><a href="/trade-analyzer">Trade Analyzer <span class="arrow" aria-hidden="true"></span></a></div></div><div><a class="game-link" href="/arcade/free-throw"><img src="${inventory.assets.game}" alt="Free Throw practice game preview" loading="lazy"><span><strong>Free Throw practice <span class="arrow" aria-hidden="true"></span></strong><small>Playable local practice. No league prize or ranked score is claimed by this mock.</small></span></a><a class="text-link" href="/arcade">Visit Arcade <span class="arrow" aria-hidden="true"></span></a></div></div></section>
<section class="section" aria-labelledby="archive-title"><div class="section-top"><div><p class="kicker">Keep the receipts</p><h2 id="archive-title">Weekly archive</h2></div><a class="text-link" href="/weekly">All editions <span class="arrow" aria-hidden="true"></span></a></div><ul class="simple-list">${archive.map(a=>`<li><small>${esc(a.dateLabel)} · ${esc(a.status)} sample</small><p><a class="text-link" href="/weekly/${esc(a.id)}" style="font-size:20px">${esc(a.title)} <span class="arrow" aria-hidden="true"></span></a></p></li>`).join('')}</ul><details class="source-details"><summary>Sources, dates & fixture limits</summary><p>${esc(inventory.warning)}</p><p>This HTML changes presentation only. Member/public comparison is a fixture switch, not authentication. Destination links preserve product routes; this static server does not implement those app routes. No live data, saved generation or account action occurs.</p><p>Current fixture checked ${stamp(home.checkedAt)}. The edition is a stale draft from ${esc(edition.dateLabel)}, with dated selection reasons attached to each story. Source links below document that editorial, not current Week 3 results.</p><ul>${edition.sources.map(s=>`<li><a href="${esc(s.url)}">${esc(s.label)}</a> · checked ${date(s.checkedAt)}</li>`).join('')}</ul><p>Recorded valuation history and Lineup Power are unavailable. Empty statistics remain unavailable. All roster names remain linked, even without a local portrait.</p></details></section>
<footer class="page-footer"><p>GOAT Hoopers · the league's working notebook.</p><nav aria-label="Footer"><a href="#top">Back to top</a><a href="/history">League history</a><a href="/weekly">Weekly archive</a><a href="/transactions">Transactions</a></nav></footer>`;
function renderTeams(){
 const query=document.querySelector('#team-search').value.trim().toLocaleLowerCase();
 const sort=document.querySelector('#team-sort').value;
 const entries=[...teams].sort((a,b)=>sort==='points'?b.currentRecord.pointsFor-a.currentRecord.pointsFor:sort==='roster'?b.players.length-a.players.length:a.identity.name.localeCompare(b.identity.name));
 let count=0;
 document.querySelector('#team-directory').innerHTML=entries.map(t=>{
 const teamText=[t.identity.name,t.identity.managerName].join(' ').toLocaleLowerCase();
 const playerMatches=t.players.some(p=>p.fullName.toLocaleLowerCase().includes(query));
 const visible=!query||teamText.includes(query)||playerMatches;
 if(visible) count++;
 const pair=t.currentMatchup;
 const opp=pair?(pair.home.id===t.identity.id?pair.away:pair.home):null;
 const historical=t.previousSeason;
 return `<article class="club" data-team-id="${t.identity.id}" ${visible?'':'hidden'}><details ${query&&playerMatches&&!teamText.includes(query)?'open':''}><summary><span><span class="club-name">${esc(t.identity.name)}</span><span class="club-manager">${esc(t.identity.managerName)} · ${t.players.length} players</span>${historical?.ownerNote?`<span class="club-manager">${esc(historical.season)} record ${historical.wins}–${historical.losses} · ${esc(historical.ownerNote)}</span>`:''}</span><span class="opponent"><small>Week ${pair?.week??'Unavailable'} vs </small>${opp?esc(opp.name):'Unavailable'}</span><span class="club-record num">${record(t.currentRecord)}</span></summary><div class="club-content"><div class="club-info"><span><a href="${hrefTeam(t.identity.id)}">Full team profile <span class="arrow" aria-hidden="true"></span></a></span><span>Current PF: <span class="num">${(t.currentRecord.pointsFor/100).toFixed(1)}</span></span><span>${historical?`${esc(historical.season)}: ${historical.wins}–${historical.losses}, finish ${historical.finish}. ${esc(historical.ownerNote??'Same franchise record; dated previous season.')}`:'Previous-season record unavailable.'}</span></div><ul class="roster">${t.players.map(p=>`<li><a href="${hrefPlayer(p.id)}">${esc(p.fullName)}</a><small>${esc(p.position??'Position unavailable')} · ${esc(p.nbaTeam??'NBA team unavailable')}</small></li>`).join('')}</ul></div></details></article>`;
 }).join('');
 document.querySelector('#team-count').textContent=`${count} of 10 teams · 228 roster references across the full league.${query?' Player matches open the relevant roster.':''}`;
}
function renderStandings(){
 const sort=document.querySelector('#stand-sort').value;
 const rows=[...home.hub.standings].sort((a,b)=>sort==='points'?b.pointsFor-a.pointsFor:sort==='name'?a.team.name.localeCompare(b.team.name):a.rank-b.rank);
 document.querySelector('#stand-body').innerHTML=rows.map(r=>`<tr><td>${r.rank}</td><td>${teamLink(r.team)}<small>${esc(r.team.managerName)}</small></td><td>${r.wins}</td><td>${r.losses}</td><td>${(r.pointsFor/100).toFixed(1)}</td></tr>`).join('');
}
renderTeams();renderStandings();
const railCollapse=document.querySelector('.rail-value-collapse');
if(railCollapse){
 const compact=matchMedia('(max-width:760px)');
 const updateRail=()=>{railCollapse.open=!compact.matches;};
 updateRail();compact.addEventListener('change',updateRail);
}
document.querySelector('#team-search').addEventListener('input',renderTeams);
document.querySelector('#team-sort').addEventListener('change',renderTeams);
document.querySelector('#stand-sort').addEventListener('change',renderStandings);
document.querySelectorAll('details.mobile-nav').forEach(d=>d.addEventListener('keydown',e=>{if(e.key==='Escape'){d.open=false;d.querySelector('summary').focus();}}));
main.dataset.mockReady='15';
</script>
</body>
</html>
