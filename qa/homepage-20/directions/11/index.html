<script type="module">
import {inventory,data,mode,aiState,esc,money} from '../../data.js';
const {home,personal,faces,weekly,archive}=data;
const edition=home.edition, summary=mode==='member'?personal.summary:null, teams=home.hub.teams;
const team=id=>teams.find(t=>String(t.id)===String(id));
const teamName=id=>team(id)?.name||`Roster ${id}`;
const teamLink=(t)=>`<a href="/teams/${esc(t.id)}">${esc(t.name)}</a>`;
const playerLink=(p)=>`<a href="/player/${esc(p.id||p.playerId)}">${esc(p.name||p.fullName)}</a>`;
const date=value=>value==null?'Unavailable':new Date(value).toLocaleString('en-US',{timeZone:'UTC',month:'short',day:'numeric',year:'numeric',hour:'2-digit',minute:'2-digit'})+' UTC';
const record=t=>`${t.wins}–${t.losses}${t.ties?'–'+t.ties:''}`;
const pct=v=>Number.isFinite(v)?Math.round(v*100)+'%':'Unavailable';
const score=v=>v===null||v===undefined?'Pending':Number(v).toFixed(1);
const portrait=(p,extra='')=>{const id=p.id||p.playerId,name=p.name||p.fullName||'Player',src=inventory.portraits[id];return `<span class="portrait ${extra}"><span class="initials" aria-hidden="true">${esc(name.split(' ').map(x=>x[0]).slice(0,2).join(''))}</span>${src?`<img src="${esc(src)}" alt="" loading="lazy">`:''}</span>`};
const current=summary?.matchup||home.directory.find(d=>edition?.game?.teamIds?.includes(d.identity.id))?.currentMatchup||home.directory[0].currentMatchup;
const currentWeek=current?.week;
const pairs=[...new Map(home.directory.filter(d=>d.currentMatchup).map(d=>{const m=d.currentMatchup;return [[m.home.id,m.away.id].sort().join(':'),m]})).values()];
const editionMeta=()=>`<details class="provenance"><summary>Edition dates and selection basis</summary><p>${esc(edition.dateLabel)} · ${esc(edition.status)} sample · not published. Its period ended ${esc(date(edition.endsAt))}; it does not describe this current matchup.</p><p>${esc(edition.game.selectionReason)}</p><p>${esc(edition.game.context)}</p><p>Source check: October 8, 2026. <a href="/weekly/${esc(edition.id)}">Read the dated edition</a>.</p></details>`;
function memberDesk(){if(!summary)return `<div class="public-desk"><p class="eyebrow">Inside the league</p><h2>Ten teams. One clubhouse.</h2><p class="small muted">Current pairings, team rosters and the weekly archive, all in one place.</p><div class="actionline"><a href="#directory">Find a team</a><a href="/login">Sign in</a></div><div class="public-desk-feature">${portrait(faces[4].player)}<div><p class="eyebrow">A face of the league</p><h3>${playerLink(faces[4].player)}</h3><p class="small">${teamLink(faces[4].team)}</p><p class="meta">Top modeled player · ${money(faces[4].player.value)} FAAB · synthetic</p></div></div><p class="meta spaced">The public preview has no member summary. <a href="index.html?view=member">Compare the member edition</a>.</p></div>`;
return `<div data-personal><p class="eyebrow">Your league desk · sample</p><div class="identity"><h2>${teamLink(summary.team)}</h2><p class="small muted">${esc(summary.team.managerName)}</p><div class="facts"><div><b class="num">#${summary.standing.rank}</b><span class="meta">Current standing</span></div><div><b class="num">${record(summary.team)}</b><span class="meta">2026 W–L</span></div><div><b class="num">${summary.coverage.roster}</b><span class="meta">Roster players</span></div></div><div class="actionline"><a href="/team">My team</a><a href="/teams/1#team-roster">View roster</a></div></div></div><div class="value-head" data-personal><p class="eyebrow">Roster value · modeled FAAB</p><p class="value-number num">${money(summary.valuation.total)}</p><p class="meta">${summary.valuation.complete?'Complete total':'Priced subtotal'} · ${summary.valuation.priced} priced / ${summary.valuation.unpriced} unpriced · ${summary.coverage.roster} rostered</p><p class="meta">Synthetic in-season model · computed ${esc(date(summary.checkedAt))} · quote snapshot ${esc(date(summary.market.updatedAt))}.</p><div class="top-values">${summary.players.map(p=>`<div class="value-row">${portrait(p)}<div>${playerLink(p)}<span class="meta">${esc(p.position)} · price vs last snapshot <span class="num">+${p.changePct}%</span></span></div><span class="num">${money(p.value)}</span></div>`).join('')}</div><details data-roster-values><summary>All ${summary.rosterValues.length} roster values</summary><p class="meta">Modeled FAAB prices, not transactions or fantasy point forecasts. ${summary.valuation.priced} priced; ${summary.valuation.unpriced} unpriced. Value rank ${summary.valuation.rank.rank} of ${summary.valuation.rank.teams} completely priced teams.</p><ul class="value-list">${summary.rosterValues.map(p=>`<li>${playerLink(p)}<span class="num">${money(p.value)}</span></li>`).join('')}</ul></details><p class="history-state">${esc(inventory.missing.history)}</p></div>`;
}
const spotlight=(p,lead=false)=>`<article class="${lead?'feature-story':'support-story'}">${portrait(p)}<div class="story-copy"><p class="eyebrow">${esc(p.periodLabel)} · sample</p><h3>${esc(p.headline)}</h3><p class="small"><strong>${playerLink(p)}</strong> · ${esc(p.position)} · ${teamLink(team(p.teamId))}</p><p class="opinion spaced">${esc(p.opinion)}</p><div class="stats">${p.stats.map(s=>`<div><strong>${esc(s.value)}</strong><span>${esc(s.label)}</span></div>`).join('')}</div><p class="meta">${esc(p.statPeriod)}</p><details class="provenance"><summary>Why this pick? Source and dates</summary><p>${esc(p.selectionReason)}</p><p>${esc(edition.dateLabel)} · Draft sample editorial, not a current weekly award.</p><p><a href="${esc(p.source.url)}">${esc(p.source.label)}</a> · checked ${esc(p.source.checkedAt)}</p></details></div></article>`;
function notebook(){const watch=summary?.playerGuide.watch;return `<aside class="notebook" aria-label="Scouting notebook"><div><p class="eyebrow">Scouting notebook</p><h3>${watch?'On form, on your roster':'Players to know'}</h3>${watch?`<p class="meta">Synthetic ${summary.playerGuide.season} observed form · EMA fantasy points/game</p>${watch.rows.map(p=>`<div class="watch-row"><div>${playerLink(p)}<span class="meta">${p.games} observed games · ${esc(p.note)}</span></div><b class="num">${p.value}</b></div>`).join('')}<p class="meta spaced">${esc(watch.message)}</p>`:`<p class="small muted">Top modeled players from current roster identities. Synthetic prices are separate from editorial picks.</p>${[faces[0],faces[4],faces[7]].map(f=>`<div class="watch-row"><div>${playerLink(f.player)}<span class="meta">${teamLink(f.team)}</span></div><span class="num small">${money(f.player.value)}</span></div>`).join('')}`}</div><div><h3 class="subhead">Price is a different signal.</h3><p class="small muted">Modeled FAAB prices describe market value. Observed form uses games played. The dated one-to-watch is an editorial choice.</p><a class="action spaced" href="/stocks">Open the market</a></div></aside>`}
function recap(){if(!summary)return ''; const guide=summary.playerGuide;return `<section class="section" data-personal id="recap"><div class="section-head"><h2>Your completed-week notebook</h2><a href="/team">Open My team</a></div><p class="section-intro">${esc(inventory.missing.recap)} ${esc(guide.period)}.</p><div class="two-column">${[['Best recorded output',guide.best],['Rougher recorded output',guide.rough]].map(([label,rows])=>`<article><h3>${label}</h3><ul class="performer-list">${rows.map(p=>`<li>${playerLink(p)}<span class="num">${p.value} pts</span><span class="meta">${p.games} GP</span></li>`).join('')}</ul></article>`).join('')}</div><p class="meta recap-foot">${esc(guide.coverage)} Points are recorded weekly fantasy points in this synthetic fixture.</p></section>`}
function aiRows(){return pairs.map(m=>{const pair=weekly?.matchups.find(p=>p.teamIds.length===2&&p.teamIds.includes(m.home.id)&&p.teamIds.includes(m.away.id));const matched=pair&&String(weekly.season)===String(home.hub.season.seasonYear)&&weekly.week===m.week;const result=matched?pair.result:null,stale=weekly?.status==='stale'||pair?.status==='stale',ready=!!result&&pair.status==='ready'&&weekly.status==='ready';const label=!matched?'Unavailable':stale?'Stale saved pick':ready?'Saved model estimate':'Unavailable';return `<article class="ai-row" ${pair?'data-ai-pair="'+esc(pair.matchupId)+'"':''}><div><p class="eyebrow ${stale?'stale':''}">${label}</p><p class="ai-pair-names">${teamLink(m.home)}<span>versus</span>${teamLink(m.away)}</p></div><div>${result?result.probabilities.map(p=>`<div class="probability-line"><span>${esc(teamName(p.choice))}</span><b class="num">${pct(p.probability)}</b></div>`).join(''):`<p class="small muted">No matching saved probabilities.</p>`}${ready?`<div class="probbar" aria-hidden="true"><span style="width:${(result.probabilities[0]?.probability||0)*100}%"></span><span></span></div>`:''}</div><div class="ai-choice">${result?`<span class="meta">Actual returned choice</span><b>${esc(teamName(result.choice))}</b><p class="meta spaced">Separate confidence: <span class="num">${pct(result.confidence)}</span></p>`:'<p class="small">Returned choice unavailable.</p>'}</div><details class="provenance"><summary>Saved pick provenance</summary><p>Current pair: roster ${esc(m.home.id)} / ${esc(m.away.id)} · ${weekly?`saved season ${esc(weekly.season)}, week ${weekly.week}`:'saved slate unavailable'} · ${matched?'roster IDs match':'no matching saved result'}.</p>${result?`<p>Saved ${esc(date(weekly.generatedAt))}. Model: ${esc(result.model)} · prompt: ${esc(result.promptVersion)}. ${esc(result.probabilityLabel)}. Choice ${esc(result.choice)} is the actual returned choice, even when another listed probability is greater.</p><p>Input snapshot: ${result.snapshot?'available in fixture':'unavailable'}. Baseline: ${pair.baseline?'available':'unavailable'}. ${stale?'This saved result is stale and is not a fresh prediction.':''}</p><ul>${[...(pair.evidence||[]),...(result.evidence||[])].map(e=>`<li>${esc(e)}</li>`).join('')||'<li>No returned evidence.</li>'}</ul>`:'<p>Model, prompt, confidence, input snapshot and evidence unavailable. No estimate is invented.</p>'}</details></article>`}).join('')}
function wire(){return `<section class="section" id="wire"><div class="section-head"><h2>Around the league</h2><a href="/intel">All news</a></div><div class="wire-layout">${summary?`<div data-personal><h3>Your team wire</h3><p class="meta">Synthetic team news</p><ul class="wire-list">${summary.news.map(n=>`<li><h4><a href="${esc(n.url)}">${esc(n.headline)}</a></h4><p class="meta">${esc(n.outlet.name)} · ${esc(date(n.publishedAt))}</p></li>`).join('')}</ul><h4 class="spaced">Your recent moves</h4><ul class="wire-list">${summary.moves.map(m=>`<li><p>${esc(m.summary)}</p><p class="meta">Week ${m.week} · ${esc(date(m.createdAt))} · synthetic</p></li>`).join('')}</ul></div>`:`<div><h3>League reference</h3><p class="small spaced">Ten roster identities, their current opponents and every player profile stay available below.</p><a class="action spaced" href="#directory">Browse the directory</a></div>`}<div><h3>From the dated edition</h3><p class="meta">${esc(edition.dateLabel)} · sample draft</p><ul class="wire-list">${edition.happenings.map(h=>`<li><p class="meta">${esc(h.dateLabel)}</p><h4><a href="${esc(h.href)}">${esc(h.title)}</a></h4><p>${esc(h.text)}</p></li>`).join('')}</ul></div><div><h3>Transaction desk</h3><p class="meta">Current sample feed</p><ul class="wire-list">${home.hub.transactions.map(t=>`<li><p class="small">${esc(t.summary)}</p><p class="meta">Week ${t.week} · ${esc(date(t.createdAt))}</p></li>`).join('')}</ul><a class="action spaced" href="/transactions">All transactions</a></div></div></section>`}
function directoryRow(d){const t=d.identity,m=d.currentMatchup,opp=m?(m.home.id===t.id?m.away:m.home):null;return `<article class="directory-team" data-team-id="${esc(t.id)}"><div class="team-line"><div><h3>${teamLink(t)}</h3><p class="meta">${esc(t.managerName)} · ${d.players.length} players</p></div><div class="record"><span class="num">${record(d.currentRecord)}</span><p class="meta">2026 W–L</p></div></div><p class="matchline">${m?`Week ${m.week} vs ${teamLink(opp)} · <span class="num">${score(m.home.id===t.id?m.homePoints:m.awayPoints)}</span> / <span class="num">${score(m.home.id===t.id?m.awayPoints:m.homePoints)}</span> · incomplete`:'Current pairing unavailable'}</p><details><summary>Roster · all ${d.players.length} players</summary><p class="meta">${d.previousSeason?`${esc(d.previousSeason.season)}: ${d.previousSeason.wins}–${d.previousSeason.losses}, finish #${d.previousSeason.finish}. ${esc(d.previousSeason.ownerNote||'')}`:'Previous season unavailable.'}</p><ul class="roster-list">${d.players.map(p=>`<li>${playerLink(p)}<span>${esc(p.position||'—')} · ${esc(p.nbaTeam||'Team unavailable')}</span></li>`).join('')}</ul><a class="action spaced" href="/teams/${esc(t.id)}#team-roster">Open team roster</a></details></article>`}
function standingsRows(sort='rank'){const rows=[...home.hub.standings].sort((a,b)=>sort==='pf'?b.pointsFor-a.pointsFor||a.rank-b.rank:sort==='name'?a.team.name.localeCompare(b.team.name):a.rank-b.rank);return rows.map(s=>`<tr><td class="num">${s.rank}</td><td>${teamLink(s.team)}</td><td class="num">${s.wins}–${s.losses}${s.ties?'–'+s.ties:''}</td><td class="num">${(s.pointsFor/100).toFixed(1)}</td></tr>`).join('')}
const main=document.querySelector('main');
main.innerHTML=`<div class="editionline"><p class="editionname">The weekly / League magazine</p><p class="meta">2026 season · current Week ${currentWeek} · ${mode==='member'?'member edition':'public edition'}</p></div><p class="fixture-note"><strong>Design preview · synthetic league state.</strong> Real dated roster identities, approved imagery and sample editorial. Current records, scores, prices, form, news and AI examples are synthetic.</p><nav class="contents" aria-label="On this page"><a href="#feature">This week</a><a href="#stories">Scouting</a><a href="#ai">Saved AI picks</a><a href="#directory">Team directory</a><a href="#archive">Archive</a></nav><section class="lead-grid" id="feature" aria-labelledby="feature-title"><div><div class="lead-head"><p class="eyebrow">Featured current matchup · Week ${currentWeek}</p><h1 id="feature-title">${esc(current.home.name)} meets ${esc(current.away.name)}</h1><p>Current scoring is incomplete. One known score, one pending score; this is a pairing to follow, not a final result.</p></div><div class="scoreboard"><div><p class="small"><strong>Home</strong> · ${esc(current.home.managerName)}</p><p class="meta">${record(current.home)} · 2026 record</p><span class="score num" aria-label="Home score ${score(current.homePoints)}">${score(current.homePoints)}</span></div><div><p class="small"><strong>Away</strong> · ${esc(current.away.managerName)}</p><p class="meta">${record(current.away)} · 2026 record</p><span class="score ${current.awayPoints==null?'pending':'num'}" aria-label="Away score ${score(current.awayPoints)}">${score(current.awayPoints)}</span></div></div><figure><img class="court" src="${esc(inventory.assets.court)}" alt="The approved GOAT Hoopers home court, a still arena scene"><figcaption class="court-caption"><span>Our court · approved arena artwork</span><a href="/arcade/free-throw">Play free-throw practice</a></figcaption></figure><p class="meta">Synthetic current pair · checked ${esc(date(home.checkedAt))}. ${summary?'Selected because this is your current pairing.':'Selected from the current directory, using a team in the dated featured edition.'}</p>${editionMeta()}</div><aside class="desk" aria-label="${summary?'Your':'League'} desk">${memberDesk()}</aside></section><section class="section" id="stories"><div class="section-head"><h2>The scouting pages</h2><a href="/weekly/${esc(edition.id)}">Read the sample edition</a></div><p class="section-intro">Dated sample editorial · ${esc(edition.dateLabel)} · draft, past its date range. These opinions are not official current-week awards.</p><div class="story-layout">${spotlight(edition.playerSpotlights[0],true)}${notebook()}</div><div class="supporting-stories">${edition.playerSpotlights.slice(1).map(p=>spotlight(p)).join('')}</div></section>${recap()}${wire()}<section class="section" id="ai"><div class="section-head"><h2><a href="/ai-decides">AI Decides</a></h2><a href="/ai-decides">Open the playground</a></div><p class="section-intro"><strong class="${aiState==='stale'?'stale':''}">${!weekly?'Unavailable':weekly.status==='stale'?'Stale saved slate':'Saved synthetic slate'}.</strong> All five Week ${currentWeek} pairs. ${weekly?'Saved '+esc(date(weekly.generatedAt))+'. ':''}Experimental model probabilities, not calibrated sports odds. Confidence is a separate returned signal.</p><div class="ai-list">${aiRows()}</div></section><section class="section" id="faces"><div class="section-head"><h2>Faces of the league</h2><a href="/teams">All team profiles</a></div><p class="section-intro">Each team’s top modeled player in this synthetic snapshot. A price is a FAAB model value, not a player ranking or game forecast.</p><div class="faces">${faces.map(f=>`<article class="face" data-face="${esc(f.team.id)}">${portrait(f.player)}<h3>${teamLink(f.team)}</h3>${playerLink(f.player).replace('<a ','<a class="player-link" ')}<p class="num">${money(f.player.value)} <span class="meta">FAAB · ${esc(f.player.position)}</span></p></article>`).join('')}</div></section><section class="section reference-layout" id="directory"><div><div class="section-head"><h2>The clubhouse directory</h2></div><p class="small muted">Current names, managers, opponents and complete rosters. Synthetic current records and scores.</p><div class="controls"><label>Find a team, manager or player<input id="team-search" type="search" placeholder="Try NeuralNets or Lillard" autocomplete="off"></label><label>Sort teams<select id="team-sort"><option value="name">Team name A–Z</option><option value="record">Current record</option><option value="roster">Roster size</option></select></label></div><p id="directory-count" class="meta directory-count" aria-live="polite">10 of 10 teams</p><div id="directory-list">${[...home.directory].sort((a,b)=>a.identity.name.localeCompare(b.identity.name)).map(directoryRow).join('')}</div></div><aside class="standings" id="standings"><h2>Standings</h2><p class="meta spaced">2026 synthetic current state · all ten teams</p><label class="standing-control">Sort standings<select id="standing-sort"><option value="rank">League rank</option><option value="pf">Points for, highest first</option><option value="name">Team name A–Z</option></select></label><table><caption class="sr-only">All ten teams, rank, wins and losses, and points for</caption><thead><tr><th scope="col">#</th><th scope="col">Team</th><th scope="col">W–L</th><th scope="col">PF</th></tr></thead><tbody id="standings-body">${standingsRows()}</tbody></table><p class="meta spaced">PF uses source pointsFor ÷ 100. Ranks remain the source ranks when sorted.</p><div class="stats-state"><h3>League stats</h3><p class="small muted spaced">Points leaders, streaks, activity and result superlatives are unavailable in this fixture.</p><h3 class="spaced">Lineup Power</h3><p class="small muted spaced">${esc(inventory.missing.power)}</p></div></aside></section><section class="section" id="tools"><div class="section-head"><h2>Keep the league moving</h2></div><div class="tools"><article class="tool-copy"><p class="eyebrow">The market</p><h3 class="spaced">Put a price next to the name.</h3><p class="small muted">Browse modeled FAAB player values and their stated pricing basis. Inspect the source before a roster decision.</p><a href="/stocks" class="action primary">Open Stocks</a></article><article class="tool-copy"><p class="eyebrow">The trade desk</p><h3 class="spaced">Work through the offer.</h3><p class="small muted">Reach the trade analyzer, then compare the players on each side.</p><a href="/trade-analyzer" class="action">Trade analyzer</a></article><article class="tool-copy"><img class="game-image" src="${esc(inventory.assets.game)}" alt="Actual preview of free-throw practice on the outdoor court" loading="lazy"><div><p class="eyebrow">Arcade · practice</p><h3 class="spaced">Take it to the line.</h3><p class="small muted">Free-throw practice. Local play; no league score or prize is claimed by this homepage preview.</p><div class="actionline"><a href="/arcade/free-throw">Play free throw</a><a href="/arcade">All Arcade games</a></div></div></article></div></section><section class="section" id="archive"><div class="section-head"><h2>The back issues</h2><a href="/weekly">Weekly archive</a></div><div class="archive-list">${archive.map((e,i)=>`<article class="archive-item"><span class="issue num" aria-hidden="true">0${archive.length-i}</span><div><p class="eyebrow">${esc(e.dateLabel)}</p><h3><a href="/weekly/${esc(e.id)}">${esc(e.title)}</a></h3><p class="small muted">${esc(e.game.title)}</p><p class="meta spaced">${e.game.state==='final'?'Historical 2025 final recap':'Opening-week sample'} · ${esc(e.status)} · not published</p><details class="provenance"><summary>Archive context</summary><p>${esc(e.game.context)}</p><p>${esc(e.game.selectionReason)}</p></details></div></article>`).join('')}</div></section>`;
document.querySelector('#account-link').textContent=summary?'My team':'Sign in';
document.querySelector('#account-link').href=summary?'/team':'/login';
document.querySelector('#footer-content').innerHTML=`<div class="footer-top"><div><p class="editionname">GOAT Hoopers</p><p class="small muted spaced">A weekly bulletin and working reference for our ten-team league.</p><p class="meta spaced">This is an isolated static design fixture, not live league data. It makes no auth, backend, game or production routing claim. Source identities and editorial were checked October 8, 2026; synthetic current state is dated ${esc(date(home.checkedAt))}.</p><details class="provenance"><summary>Editorial sources and checks</summary><ul class="source-list">${edition.sources.map(s=>`<li><a href="${esc(s.url)}">${esc(s.label)}</a> · checked ${esc(s.checkedAt)}</li>`).join('')}</ul><p>Player source and selection notes remain beside each story. Recorded team-value history and Power are unavailable; no missing measurement is replaced with zero.</p></details></div><nav class="footer-nav" aria-label="Footer"><a href="/">Home</a><a href="/intel">News</a><a href="/stocks">Stocks</a><a href="/history">History</a><a href="/arcade">Arcade</a><a href="/ai-decides">AI Decides</a><a href="/teams">Teams</a><a href="/transactions">Transactions</a><a href="/weekly">Weekly archive</a><a href="/trade-analyzer">Trade analyzer</a>${summary?'<a href="/team">My team</a><a href="/teams/1#team-roster">View roster</a>':''}<a href="index.html?view=member">Member preview</a><a href="index.html?view=public">Public preview</a></nav></div>`;
const search=document.querySelector('#team-search'), sort=document.querySelector('#team-sort');
function updateDirectory(){const q=search.value.trim().toLocaleLowerCase();const filtered=home.directory.filter(d=>[d.identity.name,d.identity.managerName,...d.players.map(p=>p.fullName)].join(' ').toLocaleLowerCase().includes(q));filtered.sort((a,b)=>sort.value==='record'?(b.currentRecord.wins-a.currentRecord.wins||a.currentRecord.losses-b.currentRecord.losses||a.identity.name.localeCompare(b.identity.name)):sort.value==='roster'?(b.players.length-a.players.length||a.identity.name.localeCompare(b.identity.name)):a.identity.name.localeCompare(b.identity.name));document.querySelector('#directory-count').textContent=`${filtered.length} of ${home.directory.length} teams`;document.querySelector('#directory-list').innerHTML=filtered.map(directoryRow).join('')||'<p class="empty">No team or roster player matches. Clear the search to see every team.</p>'}
search.addEventListener('input',updateDirectory);sort.addEventListener('change',updateDirectory);
document.querySelector('#standing-sort').addEventListener('change',e=>{document.querySelector('#standings-body').innerHTML=standingsRows(e.target.value)});
document.querySelectorAll('img').forEach(img=>img.addEventListener('error',()=>{img.hidden=true;if(img.closest('.brand'))img.nextElementSibling.hidden=false;if(img.matches('.court,.game-image')){const note=document.createElement('p');note.className='meta';note.textContent=img.classList.contains('court')?'Court image unavailable.':'Free-throw preview image unavailable.';img.after(note)}}));
const navMore=document.querySelector('.navmore');document.addEventListener('keydown',e=>{if(e.key==='Escape'&&navMore.open){navMore.open=false;navMore.querySelector('summary').focus()}});navMore.querySelectorAll('a').forEach(a=>a.addEventListener('click',()=>{navMore.open=false}));
main.dataset.mockReady='11';
</script>
