<!doctype html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>GOAT Hoopers — Stats Exchange</title>
  <link rel="stylesheet" href="../../base.css">
  <style>
    :root { color-scheme:light; }
    html { scroll-padding-top:var(--header-clearance,100px); }
    body { font-size:16px; }
    h1,h2,h3,p,figure,ol,ul { margin:0; }
    h1,h2,h3 { line-height:1.18; font-weight:700; letter-spacing:-.025em; overflow-wrap:anywhere; }
    h1 { font-size:40px; } h2 { font-size:24px; } h3 { font-size:18px; }
    a { text-decoration-thickness:1px; }
    a:hover { color:var(--gh-accent); }
    button,select,summary,input { color:var(--gh-text); }
    button,select,input { background:var(--gh-bg-raised); border:1px solid var(--gh-control); border-radius:4px; min-height:44px; }
    input,select { padding:9px 12px; max-width:100%; min-width:0; }
    button { padding:8px 12px; cursor:pointer; }
    summary { cursor:pointer; min-height:44px; padding:10px 0; font-size:14px; font-weight:600; }
    details[open]>summary { color:var(--gh-accent); }
    table { border-collapse:collapse; width:100%; text-align:left; }
    th { font-weight:500; color:var(--gh-text-dim); font-size:12px; }
    th,td { padding:10px 0; vertical-align:top; }
    td { border-top:1px solid var(--gh-border); }
    .num { font-family:var(--gh-font-mono); font-variant-numeric:tabular-nums; letter-spacing:-.035em; }
    .muted { color:var(--gh-text-dim); }
    .small { font-size:14px; line-height:1.45; }
    .meta { font-size:12px; line-height:1.5; color:var(--gh-text-dim); }
    .kicker { font-size:12px; text-transform:uppercase; letter-spacing:.1em; font-weight:600; color:var(--gh-text-dim); }
    .wrap { width:min(1280px,calc(100% - 80px)); margin:auto; }
    .skip { position:fixed; top:8px; left:16px; z-index:10; transform:translateY(-150%); padding:12px; background:var(--gh-bg-raised); }
    .skip:focus { transform:none; }
    .site-header { background:var(--gh-bg-raised); position:sticky; top:0; z-index:5; border-bottom:1px solid var(--gh-border); }
    .header-line { min-height:76px; display:flex; align-items:center; gap:28px; flex-wrap:wrap; }
    .brand { display:flex; align-items:center; min-height:44px; flex:none; }
    .brand img { width:166px; height:auto; display:block; }
    .desktop-nav { display:flex; align-items:center; gap:12px 22px; flex:1; flex-wrap:wrap; }
    .desktop-nav>a,.account-link { font-size:14px; text-decoration:none; min-height:44px; display:flex; align-items:center; font-weight:500; }
    .desktop-nav>a[aria-current] { color:var(--gh-accent); font-weight:700; text-decoration:underline; text-underline-offset:9px; }
    .menu { position:relative; }
    .menu summary { font-size:14px; list-style-position:inside; }
    .menu-links { position:absolute; top:52px; left:0; min-width:230px; background:var(--gh-bg-raised); border:1px solid var(--gh-control); padding:8px 16px; box-shadow:0 8px 18px #242d3510; }
    .menu-links a { min-height:44px; display:flex; align-items:center; font-size:14px; text-decoration:none; }
    .mobile-menu { display:none; }
    .header-account { margin-left:auto; display:flex; gap:16px; align-items:center; }
    .header-account .mobile-stocks { display:none; }
    .mode-link { font-size:12px; color:var(--gh-text-dim); }
    .fixture { padding:12px 0; border-bottom:1px solid var(--gh-border); font-size:12px; }
    .fixture strong { font-weight:700; color:var(--gh-text); }
    .page-top { display:flex; align-items:end; justify-content:space-between; gap:24px; padding:32px 0 20px; }
    .page-top .kicker { margin-bottom:8px; }
    .top-stamp { text-align:right; max-width:260px; }
    .desk-nav { display:flex; gap:24px; border-top:1px solid var(--gh-text); border-bottom:1px solid var(--gh-border); margin-bottom:28px; flex-wrap:wrap; }
    .desk-nav a { display:flex; align-items:center; min-height:44px; text-decoration:none; font-size:14px; font-weight:500; }
    .section-head { display:flex; align-items:baseline; justify-content:space-between; gap:16px; margin-bottom:16px; }
    .section-head a { font-size:14px; flex:none; }
    .lead { display:grid; grid-template-columns:minmax(0,1.22fr) minmax(0,1fr); gap:48px; }
    .lead>* { min-width:0; }
    .state { display:inline-flex; gap:7px; align-items:center; color:var(--gh-live); font-size:12px; font-weight:600; }
    .state::before { content:""; display:block; width:6px; height:6px; background:currentColor; border-radius:50%; }
    .matchup-table { width:100%; }
    .matchup-table td { padding:14px 0; }
    .matchup-table .score { width:130px; text-align:right; font-size:36px; line-height:1.2; }
    .matchup-table .score.pending { font-size:23px; padding-top:20px; color:var(--gh-text-dim); }
    .matchup-table .team-link { font-size:24px; font-weight:650; line-height:1.2; display:inline-block; text-decoration:none; max-width:100%; overflow-wrap:anywhere; }
    .matchup-table .record { text-align:right; padding-right:20px; font-size:14px; white-space:nowrap; }
    .matchup-table .record span { display:block; margin-bottom:6px; }
    .court-note { display:grid; grid-template-columns:180px minmax(0,1fr); gap:20px; margin-top:16px; align-items:center; }
    .court-note img { width:180px; height:auto; aspect-ratio:16/9; display:block; object-fit:cover; border-radius:4px; }
    .court-note figcaption { margin-top:5px; }
    .court-note p+p { margin-top:8px; }
    .personal-desk { border-left:1px solid var(--gh-border); padding-left:32px; }
    .personal-name { display:flex; justify-content:space-between; gap:16px; margin-bottom:14px; }
    .personal-name h2 { font-size:20px; margin-top:4px; }
    .personal-name>p { text-align:right; }
    .value-row { display:flex; align-items:baseline; flex-wrap:wrap; gap:12px; }
    .total-value { font-size:44px; line-height:1.15; letter-spacing:-.06em; }
    .value-label { font-size:12px; color:var(--gh-text-dim); }
    .value-coverage { margin:8px 0 16px; }
    .top-players { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:12px; }
    .top-player { min-width:0; }
    .portrait { width:60px; height:60px; object-fit:contain; object-position:center bottom; background:var(--gh-bg-hover); display:block; border-radius:4px; }
    .top-player a { display:block; text-decoration:none; font-size:14px; font-weight:600; line-height:1.35; margin:8px 0 4px; }
    .top-player .num { font-size:16px; }
    .actions { display:flex; flex-wrap:wrap; gap:8px; align-items:center; margin-top:16px; }
    .action { display:inline-flex; min-height:44px; align-items:center; justify-content:center; padding:8px 14px; background:var(--gh-accent); color:var(--gh-on-accent); text-decoration:none; font-size:14px; font-weight:600; border-radius:4px; }
    .action:hover { color:var(--gh-on-accent); background:var(--gh-text); }
    .action.secondary { color:var(--gh-text); background:transparent; border:1px solid var(--gh-control); }
    .action.secondary:hover { background:var(--gh-bg-hover); }
    .valuation-details { margin-top:8px; }
    .value-list { list-style:none; padding:0; display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:0 20px; }
    .value-list li { display:flex; align-items:baseline; gap:8px; justify-content:space-between; border-top:1px solid var(--gh-border); padding:8px 0; font-size:14px; min-width:0; }
    .value-list a { overflow-wrap:anywhere; }
    .value-list .num { white-space:nowrap; }
    .value-foot { margin-top:12px; }
    .league-desk h2 { margin:8px 0 12px; font-size:28px; }
    .league-desk .big-count { font-size:44px; line-height:1; margin-bottom:12px; }
    .league-desk .big-count span { font-size:14px; font-family:var(--gh-font-body); letter-spacing:0; }
    .major { margin-top:36px; padding-top:24px; border-top:1px solid var(--gh-control); }
    .work-columns { display:grid; grid-template-columns:minmax(0,1.22fr) minmax(0,1fr); gap:48px; }
    .work-columns>* { min-width:0; }
    .ai-header { display:flex; justify-content:space-between; gap:12px; padding-bottom:12px; border-bottom:1px solid var(--gh-border); }
    .ai-header h2 a { font-size:24px; text-decoration:none; }
    .ai-status { font-weight:650; color:var(--gh-accent); }
    .ai-status.stale { color:var(--gh-live); }
    .ai-row { display:grid; grid-template-columns:minmax(0,1fr) minmax(142px,.65fr); column-gap:24px; row-gap:0; padding:14px 0; border-bottom:1px solid var(--gh-border); }
    .ai-side { display:flex; align-items:baseline; gap:10px; justify-content:space-between; min-width:0; font-size:14px; }
    .ai-side+.ai-side { margin-top:5px; }
    .ai-side a { text-decoration:none; overflow-wrap:anywhere; }
    .ai-side .num { font-size:16px; white-space:nowrap; }
    .prob-bar { display:flex; height:4px; margin-top:12px; background:var(--gh-border); }
    .prob-bar span { background:var(--gh-accent); }
    .prob-bar span+span { background:var(--gh-control); }
    .ai-result { min-width:0; }
    .ai-result>p:nth-child(2) { font-size:14px; font-weight:600; margin:3px 0; overflow-wrap:anywhere; }
    .provenance { grid-column:1/-1; }
    .provenance summary { font-size:12px; min-height:32px; padding:6px 0; color:var(--gh-text-dim); }
    .provenance-content { font-size:12px; line-height:1.5; overflow-wrap:anywhere; padding-bottom:8px; }
    .provenance-content dl { margin:8px 0; }
    .provenance-content dt { font-weight:650; }
    .provenance-content dd { margin:0 0 6px; }
    .ai-foot { margin-top:12px; }
    .scouting-table td { font-size:14px; }
    .scouting-table td:first-child { padding-right:16px; }
    .scouting-table th:not(:first-child),.scouting-table td:not(:first-child) { text-align:right; }
    .scouting-table .num { font-size:16px; white-space:nowrap; }
    .scouting-table a { text-decoration:none; font-weight:600; }
    .scouting-note { margin-top:12px; }
    .notebook-sub { margin-top:24px; }
    .notebook-sub h3 { margin-bottom:8px; }
    .price-note { display:grid; grid-template-columns:40px minmax(0,1fr) auto; gap:12px; align-items:center; padding:10px 0; border-bottom:1px solid var(--gh-border); font-size:14px; }
    .price-note .portrait { height:40px; width:40px; }
    .price-note a { text-decoration:none; font-weight:600; }
    .price-note .num { font-size:16px; }
    .editorial { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:32px; }
    .editorial article { min-width:0; }
    .editorial .story-top { display:flex; align-items:center; gap:16px; margin-bottom:12px; }
    .editorial h3 { font-size:20px; }
    .editorial h3 a { text-decoration:none; }
    .editorial .story-role { margin-bottom:3px; }
    .editorial .take { font-weight:600; margin-bottom:6px; }
    .editorial .stats { display:flex; gap:16px; padding:12px 0 4px; }
    .editorial .stat-num { display:block; font-size:22px; }
    .editorial .stats .meta { display:block; }
    .editorial details { margin-top:8px; }
    .editorial details>div { font-size:14px; }
    .editorial details p+p { margin-top:8px; }
    .form-wire { display:grid; grid-template-columns:minmax(0,1.22fr) minmax(0,1fr); gap:48px; }
    .form-tables { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:24px; margin:16px 0 12px; }
    .form-table td { font-size:14px; padding:10px 0; }
    .form-table td:first-child { padding-right:8px; }
    .form-table td:not(:first-child),.form-table th:not(:first-child) { text-align:right; }
    .form-table a { text-decoration:none; }
    .feed { list-style:none; padding:0; }
    .feed li { padding:12px 0; border-bottom:1px solid var(--gh-border); }
    .feed a { text-decoration:none; font-size:14px; font-weight:550; }
    .feed .meta { margin-top:4px; }
    .feed p { font-size:14px; }
    .wire h3 { margin:16px 0 4px; }
    .around { display:grid; grid-template-columns:minmax(0,1.22fr) minmax(0,1fr); gap:48px; }
    .happenings { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:24px; }
    .happenings h3 { font-size:16px; line-height:1.4; margin:8px 0; }
    .happenings p { font-size:14px; }
    .happenings a { text-decoration:none; }
    .unavailable { background:var(--gh-bg-hover); padding:16px; margin-top:16px; border-radius:4px; }
    .unavailable p+p { margin-top:8px; }
    .faces { display:grid; grid-template-columns:repeat(5,minmax(0,1fr)); gap:24px; }
    .face { display:grid; grid-template-columns:44px minmax(0,1fr); column-gap:12px; align-items:start; min-width:0; padding:12px 0; }
    .face .portrait { height:52px; width:44px; }
    .face a { text-decoration:none; overflow-wrap:anywhere; }
    .face .player { font-size:14px; font-weight:600; display:block; line-height:1.35; margin-bottom:4px; }
    .face .team { font-size:12px; color:var(--gh-text-dim); display:block; line-height:1.45; }
    .face .num { font-size:16px; margin-top:7px; display:block; }
    .league-columns { display:grid; grid-template-columns:minmax(0,1.5fr) minmax(0,1fr); gap:48px; }
    .league-columns>* { min-width:0; }
    .directory-controls { display:grid; grid-template-columns:minmax(0,1fr) 180px; gap:16px; margin:16px 0 12px; }
    label { display:block; font-size:12px; color:var(--gh-text-dim); font-weight:600; }
    label input,label select { display:block; width:100%; margin-top:6px; font-size:14px; }
    .directory-count { margin-bottom:8px; }
    .directory-team { padding:16px 0 0; border-top:1px solid var(--gh-border); }
    .directory-line { display:grid; grid-template-columns:minmax(0,1.2fr) 48px minmax(0,1fr); gap:16px; align-items:start; }
    .directory-line h3 { font-size:18px; }
    .directory-line h3 a { text-decoration:none; }
    .directory-line .manager { margin-top:4px; overflow-wrap:anywhere; }
    .directory-line .record { font-size:14px; white-space:nowrap; }
    .directory-line .opponent { font-size:14px; overflow-wrap:anywhere; }
    .directory-line .opponent a { text-decoration:none; }
    .directory-team summary { font-weight:400; font-size:12px; color:var(--gh-text-dim); }
    .roster-grid { list-style:none; padding:0; display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:0 16px; margin-bottom:16px; }
    .roster-grid li { font-size:14px; border-top:1px solid var(--gh-border); padding:8px 0; min-width:0; }
    .roster-grid a { display:inline-block; text-decoration:none; overflow-wrap:anywhere; }
    .roster-grid .meta { display:block; }
    .standings-controls { margin:16px 0 12px; }
    .standings-table td { font-size:14px; padding:11px 0; }
    .standings-table th:first-child,.standings-table td:first-child { width:32px; }
    .standings-table td:nth-child(2) { padding-right:12px; }
    .standings-table th:nth-child(n+3),.standings-table td:nth-child(n+3) { text-align:right; padding-left:10px; white-space:nowrap; }
    .standings-table a { text-decoration:none; overflow-wrap:anywhere; }
    .standings-table .mine a { font-weight:700; }
    .tools { margin-top:28px; border-top:1px solid var(--gh-control); padding-top:24px; }
    .tool-link { display:flex; align-items:center; justify-content:space-between; gap:16px; min-height:44px; margin-top:14px; }
    .tool-link a { font-weight:650; text-decoration:none; }
    .game-preview { margin-top:20px; display:grid; grid-template-columns:130px minmax(0,1fr); gap:16px; }
    .game-preview img { width:130px; height:auto; aspect-ratio:16/9; object-fit:cover; border-radius:4px; }
    .game-preview .action { margin-top:12px; }
    .archives { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:32px; }
    .archive-entry { display:grid; grid-template-columns:110px minmax(0,1fr); gap:20px; align-items:start; }
    .archive-entry h3 a { text-decoration:none; }
    .archive-entry h3 { margin:6px 0; }
    .archive-index { font-size:28px; border-top:2px solid var(--gh-text); padding-top:12px; }
    footer { margin-top:40px; border-top:1px solid var(--gh-border); padding:28px 0 32px; }
    .footer-line { display:flex; justify-content:space-between; gap:32px; }
    .footer-line>div:first-child { max-width:650px; }
    .footer-line .brand { margin-bottom:12px; }
    .footer-links { display:flex; flex-wrap:wrap; gap:8px 20px; }
    .footer-links a { display:inline-flex; align-items:center; min-height:44px; font-size:14px; }
    .sources { margin-top:16px; }
    .sources ul { padding-left:20px; }
    .sources li { margin-bottom:6px; font-size:14px; }
    @media(max-width:1100px) {
      .wrap { width:calc(100% - 48px); }
      .desktop-nav { gap:16px; } .desktop-nav .wide-only { display:none; }
      .header-line { gap:24px; }
      .lead,.work-columns,.form-wire,.around,.league-columns { gap:28px; }
      .personal-desk { padding-left:24px; }
      .court-note { grid-template-columns:140px minmax(0,1fr); gap:16px; }
      .court-note img { width:140px; }
      .matchup-table .team-link { font-size:21px; }
      .matchup-table .score { width:110px; font-size:32px; }
      .matchup-table .record { padding-right:12px; }
      .total-value { font-size:38px; }
      .ai-row { column-gap:16px; row-gap:0; grid-template-columns:minmax(0,1fr) 140px; }
      .faces { grid-template-columns:repeat(3,minmax(0,1fr)); gap:8px 24px; }
      .directory-line { grid-template-columns:minmax(0,1.2fr) 40px minmax(0,1fr); gap:12px; }
      .form-tables { gap:16px; }
      .happenings { gap:16px; }
    }
    @media(max-width:800px) {
      .desktop-nav { display:none; } .mobile-menu { display:block; margin-left:auto; }
      .header-line { min-height:68px; gap:16px; flex-wrap:wrap; }
      .header-account { margin-left:0; }
      .header-account .mode-link { display:none; }
      .header-account .desktop-account { display:none; }
      .header-account .mobile-stocks { display:flex; }
      .mobile-menu .menu-links { left:auto; right:0; }
      .lead,.work-columns,.form-wire,.around,.league-columns { grid-template-columns:1fr; gap:32px; }
      .personal-desk { border-left:0; border-top:1px solid var(--gh-border); padding:24px 0 0; }
      .lead .top-players { grid-template-columns:repeat(3,minmax(0,1fr)); }
      .top-player { display:grid; grid-template-columns:48px minmax(0,1fr); column-gap:12px; }
      .top-player .portrait { width:48px; height:60px; grid-row:span 2; }
      .top-player a { margin:0; align-self:end; }
      .top-player .num { align-self:start; }
      .editorial { gap:20px; }
      .editorial .story-top { display:block; }
      .editorial .story-top .portrait { margin-bottom:12px; }
      .editorial .stats { gap:12px; }
      .happenings { gap:24px; }
      .faces { grid-template-columns:repeat(3,minmax(0,1fr)); }
      .directory-line { grid-template-columns:minmax(0,1.2fr) 60px minmax(0,1fr); }
      .standings-table td { padding:12px 0; }
      .archives { gap:24px; }
      .archive-entry { grid-template-columns:70px minmax(0,1fr); gap:16px; }
    }
    @media(max-width:540px) {
      .wrap { width:calc(100% - 32px); }
      .brand img { width:128px; }
      .header-line { gap:12px; }
      .mobile-menu summary { font-size:14px; }
      .header-account .account-link { font-size:14px; }
      .fixture { padding:10px 0; }
      .page-top { padding:24px 0 16px; display:block; }
      h1 { font-size:32px; } h2 { font-size:22px; }
      .top-stamp { text-align:left; max-width:none; margin-top:12px; }
      .desk-nav { gap:0 20px; margin-bottom:24px; }
      .desk-nav a { font-size:14px; }
      .section-head { align-items:start; }
      .section-head h2 { max-width:75%; }
      .section-head a { font-size:12px; min-height:44px; display:flex; align-items:center; }
      .matchup-table .team-link { font-size:20px; }
      .matchup-table .score { font-size:30px; width:100px; }
      .matchup-table .score.pending { font-size:20px; }
      .matchup-table .record { width:40px; padding-right:12px; }
      .matchup-table .record span { font-size:12px; }
      .matchup-table .record .num { font-size:14px; }
      .court-note { grid-template-columns:112px minmax(0,1fr); align-items:start; }
      .court-note img { width:112px; }
      .court-note p { font-size:14px; }
      .court-note figcaption { font-size:12px; }
      .personal-name { gap:12px; }
      .personal-name h2 { font-size:20px; }
      .total-value { font-size:40px; }
      .lead .top-players { gap:16px; grid-template-columns:1fr; }
      .top-player { grid-template-columns:48px minmax(0,1fr) auto; align-items:center; }
      .top-player .portrait { height:48px; grid-row:auto; }
      .top-player a,.top-player .num { align-self:center; }
      .top-player .num { font-size:16px; }
      .value-list { grid-template-columns:1fr; }
      .major { margin-top:28px; padding-top:20px; }
      .ai-row { grid-template-columns:minmax(0,1fr) 125px; column-gap:16px; row-gap:0; }
      .ai-side { gap:8px; align-items:start; }
      .ai-side .num { font-size:14px; }
      .ai-result>p:nth-child(2) { font-size:14px; }
      .provenance summary { min-height:44px; padding:12px 0; }
      .editorial { grid-template-columns:1fr; gap:24px; }
      .editorial article { border-bottom:1px solid var(--gh-border); padding-bottom:16px; }
      .editorial .story-top { display:flex; align-items:center; margin-bottom:12px; }
      .editorial .story-top .portrait { margin:0; width:64px; height:64px; }
      .editorial .stats { gap:24px; }
      .editorial details summary { min-height:44px; }
      .form-tables { gap:20px; grid-template-columns:1fr; }
      .form-table td { font-size:16px; }
      .form-table th { font-size:12px; }
      .happenings { grid-template-columns:1fr; gap:20px; }
      .happenings h3 { margin:4px 0; }
      .faces { grid-template-columns:repeat(2,minmax(0,1fr)); gap:12px 20px; }
      .face { grid-template-columns:40px minmax(0,1fr); gap:8px; }
      .face .portrait { width:40px; height:48px; }
      .face .team { font-size:12px; }
      .directory-controls { grid-template-columns:1fr; gap:12px; }
      .directory-line { grid-template-columns:minmax(0,1fr) 48px; gap:8px 16px; }
      .directory-line .opponent { grid-column:1/-1; }
      .directory-team summary { padding:12px 0; }
      .roster-grid { grid-template-columns:repeat(2,minmax(0,1fr)); }
      .roster-grid a { display:flex; align-items:center; min-height:44px; }
      .value-list a { display:flex; align-items:center; min-height:44px; }
      .standings-table td { font-size:14px; }
      .standings-table td:first-child,.standings-table th:first-child { width:22px; }
      .standings-table th:nth-child(n+3),.standings-table td:nth-child(n+3) { padding-left:8px; }
      .standings-table td:nth-child(2) { padding-right:0; }
      .standings-table a { display:inline-flex; min-height:44px; align-items:center; }
      .archives { grid-template-columns:1fr; gap:24px; }
      .archive-entry { grid-template-columns:70px minmax(0,1fr); }
      .footer-line { display:block; }
      .footer-links { margin-top:16px; }
      .top-player>a,.ai-side>a,.scouting-table a,.price-note a,.face .player,.face .team,.directory-line h3 a,.wire .feed a,.happenings h3 a,.editorial h3 a,.archive-entry h3 a,.tool-link a,.game-preview h3 a { min-height:44px; display:flex; align-items:center; }
      .face .player,.face .team { margin:0; }
    }
    @media(max-width:350px) {
      .brand img { width:112px; }
      .header-line { gap:8px; }
      .header-account .account-link,.mobile-menu summary { font-size:12px; }
      .matchup-table .score { width:88px; font-size:28px; }
      .matchup-table .score.pending { font-size:18px; }
      .matchup-table .team-link { font-size:18px; }
      .matchup-table .record { padding-right:8px; }
      .court-note { grid-template-columns:1fr; gap:12px; }
      .court-note figure { display:flex; gap:12px; align-items:end; }
      .court-note img { width:112px; }
      .ai-row { grid-template-columns:1fr; row-gap:12px; }
      .ai-result { display:grid; grid-template-columns:minmax(0,1fr) 100px; column-gap:12px; }
      .ai-result>p:first-child { grid-column:1; }
      .ai-result>p:nth-child(2) { grid-column:1; }
      .ai-result>p:nth-child(3) { grid-column:1; }
      .ai-result>details { grid-column:2; grid-row:1/4; }
      .provenance-content { grid-column:1/-1; }
      .faces { grid-template-columns:1fr; gap:0; }
      .face { grid-template-columns:44px minmax(0,1fr); }
      .face>div { display:grid; grid-template-columns:minmax(0,1fr) auto; column-gap:12px; }
      .face .team { grid-column:1; }
      .face .num { grid-column:2; grid-row:1/3; margin:0; align-self:center; }
      .game-preview { grid-template-columns:100px minmax(0,1fr); gap:12px; }
      .game-preview img { width:100px; }
    }
  </style>
</head>
<body>
  <a class="skip" href="#main">Skip to league desk</a>
  <div id="app"></div>
  <script type="module">
    import {inventory,data,mode,aiState,esc,money} from '../../data.js';
    const directory=data.home.directory, edition=data.home.edition;
    const summary=mode==='member' ? data.personal.summary : null;
    const teamMap=new Map(directory.map(t=>[String(t.identity.id),t.identity]));
    const byId=id=>teamMap.get(String(id));
    const teamName=id=>byId(id)?.name ?? `Roster ${id}`;
    const date=value=>value==null?'Unavailable':new Date(value).toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric',timeZone:'UTC'});
    const stamp=value=>value==null?'Unavailable':new Date(value).toISOString().replace('T',' ').replace(':00.000Z',' UTC').replace(':00Z',' UTC');
    const record=t=>`${t.wins}–${t.losses}${t.ties?'–'+t.ties:''}`;
    const teamLink=t=>`<a href="/teams/${esc(t.id)}">${esc(t.name)}</a>`;
    const playerLink=p=>`<a href="/player/${esc(p.id)}">${esc(p.name??p.fullName)}</a>`;
    const pct=v=>v==null?'Unavailable':`${Math.round(v*100)}%`;
    const portrait=(id,name,extra='')=>inventory.portraits[id] ? `<img class="portrait ${extra}" src="${esc(inventory.portraits[id])}" alt="" loading="lazy" onerror="this.hidden=true;this.nextElementSibling.hidden=false"><span class="meta" hidden>Portrait unavailable</span>` : `<span class="portrait meta ${extra}" role="img" aria-label="${esc(name)}: portrait unavailable">No photo</span>`;
    const pair=directory.find(t=>String(t.identity.id)===String(summary?.team.id))?.currentMatchup ?? directory.find(t=>t.currentMatchup)?.currentMatchup;
    const navLinks=[['Home','/'],['News','/intel'],['Stocks','/stocks'],['Teams','/teams'],['AI Decides','/ai-decides'],['Arcade','/arcade']];
    const moreLinks=[['History','/history'],['Transactions','/transactions'],['Weekly archive','/weekly'],['Trade analyzer','/trade-analyzer']];
    const comparison=`index.html?view=${mode==='member'?'public':'member'}${aiState==='ready'?'':'&ai='+encodeURIComponent(aiState)}`;
    const menuItems=items=>items.map(([label,href])=>`<a href="${href}" ${label==='Home'?'aria-current="page"':''}>${label}</a>`).join('');
    const nav=`<header class="site-header"><div class="wrap header-line"><a class="brand" href="/" aria-label="GOAT Hoopers home"><img src="${inventory.assets.logo}" alt="GOAT Hoopers" width="166" height="40"></a><nav class="desktop-nav" aria-label="Primary">${menuItems(navLinks)}<details class="menu"><summary>League tools</summary><div class="menu-links">${menuItems(moreLinks)}</div></details></nav><details class="menu mobile-menu"><summary>Menu</summary><nav class="menu-links" aria-label="League navigation">${menuItems([...navLinks.filter(([label])=>label!=='Stocks'),...moreLinks])}${summary?'<a href="/team">My team</a>':''}<a href="${comparison}">${mode==='member'?'Public':'Member'} preview</a></nav></details><div class="header-account"><a class="account-link desktop-account" href="${summary?'/team':'/stocks'}">${summary?'My team':'Stocks'}</a><a class="account-link mobile-stocks" href="/stocks">Stocks</a><a class="mode-link" href="${comparison}">${mode==='member'?'Public':'Member'} preview</a></div></div></header>`;
    function featured() {
      if(!pair)return `<section><h2>Featured matchup</h2><p>Current pairing unavailable.</p></section>`;
      return `<section aria-labelledby="matchup-title"><div class="section-head"><h2 id="matchup-title">Featured matchup</h2><span class="state">Week ${pair.week} · incomplete</span></div><table class="matchup-table"><caption class="sr-only">Current synthetic matchup and incomplete scores</caption><thead><tr><th>Team / manager</th><th class="record">Record</th><th style="text-align:right">Current score</th></tr></thead><tbody>${[[pair.home,pair.homePoints],[pair.away,pair.awayPoints]].map(([t,points])=>`<tr><td><a class="team-link" href="/teams/${esc(t.id)}">${esc(t.name)}</a><p class="meta">${esc(t.managerName)}</p></td><td class="record"><span class="meta">2026</span><span class="num">${record(t)}</span></td><td class="score num ${points==null?'pending':''}">${points==null?'Pending':Number(points).toFixed(1)}</td></tr>`).join('')}</tbody></table><div class="court-note"><figure><img src="${inventory.assets.court}" alt="GOAT Hoopers arena and basketball court" width="180" height="101"><figcaption class="meta">Our court, between games.</figcaption></figure><div><p class="small">${summary?'Your current pair':'Selected from the current league directory'}. Scoring is incomplete; the known zero is retained.</p><p class="meta">Synthetic snapshot: ${stamp(data.home.checkedAt)}. The dated draft edition below is a separate sample.</p></div></div></section>`;
    }
    function personal() {
      if(!summary)return `<aside class="personal-desk league-desk" aria-labelledby="public-title"><p class="kicker">Public league desk</p><h2 id="public-title">Know the league.<br>Find your next move.</h2><p class="big-count num">10 <span>teams</span> / 228 <span>players</span></p><p class="small muted">Browse every roster, compare the saved slate, or inspect a modeled player price.</p><div class="actions"><a class="action" href="#directory">Find a team or player</a><a class="action secondary" href="/stocks">Open Stocks</a></div><p class="meta value-foot">Personal team values and completed-week performers appear in the member preview.</p><a class="small" href="${comparison}">View member preview</a></aside>`;
      const v=summary.valuation;
      return `<aside class="personal-desk" data-personal aria-labelledby="personal-title"><div class="personal-name"><div><p class="kicker">Your desk · ${esc(summary.team.managerName)}</p><h2 id="personal-title">${esc(summary.team.name)}</h2></div><p class="meta"><span class="num">#${summary.standing.rank}/${directory.length}</span> standing<br><span class="num">${summary.coverage.roster}</span> roster players</p></div><p class="meta">Modeled roster value · FAAB dollars</p><div class="value-row"><strong class="num total-value">${money(v.total)}</strong><span class="value-label">Value rank ${v.rank.rank}/${v.rank.teams}${v.rank.tied?' · tied':''}</span></div><p class="meta value-coverage">${v.priced} priced / ${v.unpriced} unpriced · ${esc(summary.market.pricingBasis)} model · ${date(summary.market.updatedAt)}</p><div class="top-players">${summary.players.map(p=>`<div class="top-player">${portrait(p.id,p.name)}${playerLink(p)}<span class="num">${money(p.value)}</span></div>`).join('')}</div><div class="actions"><a class="action" href="/teams/${summary.team.id}#team-roster">View roster</a><a class="action secondary" href="/stocks">Inspect values</a></div><details class="valuation-details"><summary>All ${summary.rosterValues.length} roster values &amp; pricing basis</summary><div data-roster-values><ul class="value-list">${summary.rosterValues.map(p=>`<li>${playerLink(p)}<span class="num">${money(p.value)}</span></li>`).join('')}</ul><p class="meta value-foot">Modeled FAAB values are estimates, not transactions or a spendable balance. Computed ${stamp(summary.market.updatedAt)}; team snapshot ${stamp(summary.checkedAt)}. Coverage: ${v.priced} priced, ${v.unpriced} unpriced, ${summary.coverage.roster} roster players.</p></div></details><p class="meta">${esc(inventory.missing.history)}</p></aside>`;
    }
    function aiDesk() {
      if(!data.weekly)return `<section id="ai" aria-labelledby="ai-title"><div class="ai-header"><h2 id="ai-title"><a href="/ai-decides">AI Decides</a></h2><span class="ai-status">Unavailable</span></div><p class="small" style="margin-top:16px">Saved weekly slate unavailable. No probabilities, returned choices or confidence are supplied.</p><p class="meta ai-foot">Current matchup information remains in the directory. <a href="/ai-decides">Open the AI playground</a>.</p></section>`;
      const weekly=data.weekly;
      return `<section id="ai" aria-labelledby="ai-title"><div class="ai-header"><div><h2 id="ai-title"><a href="/ai-decides">AI Decides</a></h2><p class="meta">Five saved pairs · synthetic model probabilities</p></div><p class="meta"><span class="ai-status ${weekly.status==='stale'?'stale':''}">${weekly.status==='stale'?'Stale saved slate':'Saved Week '+weekly.week}</span><br>${date(weekly.generatedAt)}</p></div>${weekly.matchups.map(p=>{
        const r=p.result;
        const matched=directory.some(t=>{const m=t.currentMatchup; return m&&m.week===weekly.week&&[m.home.id,m.away.id].every(id=>p.teamIds.includes(String(id)))&&String(weekly.season)===data.home.hub.season.seasonYear;});
        const available=r&&matched&&p.status==='ready';
        const probs=p.teamIds.map(id=>({id,p:r?.probabilities.find(q=>String(q.choice)===String(id))?.probability}));
        return `<article class="ai-row" data-ai-pair="${esc(p.teamIds.join('-'))}"><div>${probs.map(({id,p:prob})=>`<p class="ai-side"><a href="/teams/${esc(id)}">${esc(teamName(id))}</a><span class="num">${available?pct(prob):'Unavailable'}</span></p>`).join('')}${available?`<div class="prob-bar" aria-hidden="true">${probs.map(({p:prob})=>`<span style="width:${(prob??0)*100}%"></span>`).join('')}</div>`:''}</div><div class="ai-result"><p class="meta">${!matched?'Unmatched pair':weekly.status==='stale'?'Stale returned choice':'Returned choice'}</p><p>${available?esc(teamName(r.choice)):'Unavailable'}</p><p class="meta">Confidence ${available?pct(r.confidence):'Unavailable'}</p></div><details class="provenance"><summary>Model notes</summary><div class="provenance-content"><p>${esc(r?.probabilityLabel??'Probability unavailable')}. Confidence is a separate model signal.</p><dl><dt>Saved</dt><dd>${stamp(weekly.generatedAt)}</dd><dt>Status / roster IDs</dt><dd>${esc(weekly.status)} / ${esc(p.teamIds.join(', '))}; ${matched?'matched to current pair':'not matched to current pair'}</dd><dt>Actual returned choice</dt><dd>${esc(r?.choice??'Unavailable')} — ${r?esc(teamName(r.choice)):'Unavailable'}</dd><dt>Model / prompt</dt><dd>${esc(r?.model??'Unavailable')} / ${esc(r?.promptVersion??'Unavailable')}</dd><dt>Input snapshot / input timestamp</dt><dd>${r?.snapshot?'Supplied in fixture':'Unavailable'} / Unavailable</dd><dt>Evidence</dt><dd>${esc(p.evidence?.join(' ')||'Unavailable')} ${r?.evidence?.length?esc(r.evidence.join(' ')):'No returned model evidence.'}</dd><dt>Baseline</dt><dd>${p.baseline==null?'Unavailable':'Supplied in fixture'}</dd></dl></div></details></article>`;
      }).join('')}<p class="meta ai-foot">Returned choices are shown as saved; they are not inferred from the larger probability. ${weekly.status==='stale'?'Stale estimates remain historical examples. ':''}<a href="/ai-decides">Open the AI playground</a>.</p></section>`;
    }
    function scouting() {
      const watch=summary?.playerGuide.watch;
      const selectedFaces=[data.faces[0],data.faces[4],data.faces[7]];
      const editorialWatch=edition.playerSpotlights.find(p=>p.role==='one-to-watch');
      return `<section id="scouting" aria-labelledby="scouting-title"><div class="section-head"><h2 id="scouting-title">Scouting notebook</h2><a href="/intel">League news</a></div>${watch?`<p class="small"><strong>Observed form</strong> · ${esc(watch.label)}</p><table class="scouting-table"><thead><tr><th>Player</th><th>EMA FPPG</th><th>GP</th></tr></thead><tbody>${watch.rows.map(p=>`<tr><td>${playerLink(p)}<p class="meta">${esc(p.note)}</p></td><td class="num">${p.value.toFixed(1)}</td><td class="num">${p.games}</td></tr>`).join('')}</tbody></table><p class="meta scouting-note">Synthetic in-season observations, 2026 through Week ${summary.playerGuide.currentWeek}. ${esc(watch.message)}</p>`:`<p class="small muted">League player context and modeled prices. Use the complete directory to inspect current roster ownership.</p>`}<div class="notebook-sub"><h3>Across the league</h3><p class="meta">Price basis · top modeled player from selected rosters</p>${selectedFaces.map(f=>`<div class="price-note">${portrait(f.player.id,f.player.name)}<div>${playerLink(f.player)}<p class="meta">${esc(f.team.name)}</p></div><span class="num">${money(f.player.value)}</span></div>`).join('')}</div>${editorialWatch?`<div class="notebook-sub"><p class="kicker">Editorial watch · dated sample</p><p class="small" style="margin-top:6px"><a href="/player/${editorialWatch.playerId}"><strong>${esc(editorialWatch.name)}</strong></a> — ${esc(editorialWatch.headline)}</p><p class="meta">${esc(editorialWatch.statPeriod)} · checked ${esc(editorialWatch.source.checkedAt)}. Opinion and selection basis below.</p></div>`:''}</section>`;
    }
    function editorials() {
      const roles={'player-of-week':'Last season’s standard','underperformer':'Last-season lookback','one-to-watch':'Preseason watch'};
      return `<section class="major" aria-labelledby="editorial-title"><div class="section-head"><div><p class="kicker">Dated draft · ${esc(edition.dateLabel)} · stale edition</p><h2 id="editorial-title" style="margin-top:6px">Three takes from the notebook</h2></div><a href="/weekly/${esc(edition.id)}">Read edition</a></div><p class="meta" style="margin-bottom:20px">Sample editorial, not current official Week 2 Stud/Chud or computed awards.</p><div class="editorial">${edition.playerSpotlights.map(p=>`<article><div class="story-top">${portrait(p.playerId,p.name)}<div><p class="kicker story-role">${esc(roles[p.role]??p.role)}</p><h3><a href="/player/${p.playerId}">${esc(p.name)}</a></h3><p class="meta">${esc(p.position)} · ${esc(p.periodLabel)}</p></div></div><p class="small take">${esc(p.headline)}</p><p class="small muted">${esc(p.opinion)}</p><div class="stats">${p.stats.map(s=>`<div><span class="stat-num num">${esc(s.value)}</span><span class="meta">${esc(s.label)}</span></div>`).join('')}</div><p class="meta">${esc(p.statPeriod)}</p><details><summary>Selection &amp; source</summary><div><p>${esc(p.selectionReason)}</p><p><a href="${esc(p.source.url)}">${esc(p.source.label)}</a> · checked ${esc(p.source.checkedAt)}</p><p class="meta">Draft ${esc(edition.id)} · ${esc(edition.dateLabel)} · unpublished. The current directory supplies current roster ownership.</p></div></details></article>`).join('')}</div></section>`;
    }
    function formAndNews() {
      if(!summary)return '';
      const g=summary.playerGuide;
      const formTable=(label,rows)=>`<div><h3>${label}</h3><table class="form-table"><thead><tr><th>Player</th><th>FP</th><th>GP</th></tr></thead><tbody>${rows.map(p=>`<tr><td>${playerLink(p)}</td><td class="num">${p.value.toFixed(1)}</td><td class="num">${p.games}</td></tr>`).join('')}</tbody></table></div>`;
      return `<section class="major form-wire" data-personal aria-labelledby="form-title"><div><p class="kicker">Synthetic completed-week fixture</p><h2 id="form-title" style="margin-top:6px">Your last completed source week</h2><p class="meta" style="margin-top:8px">${esc(g.period)}</p><div class="form-tables">${formTable('Best recorded',g.best)}${formTable('Rough recorded',g.rough)}</div><p class="meta">${esc(g.coverage)}</p><p class="meta" style="margin-top:6px">${esc(inventory.missing.recap)}</p></div><div class="wire"><div class="section-head"><h2>Your team wire</h2><a href="/intel">All news</a></div><ul class="feed">${summary.news.map(n=>`<li><a href="${esc(n.url)}">${esc(n.headline)}</a><p class="meta">${esc(n.outlet.name)} · ${date(n.publishedAt)} · synthetic news</p></li>`).join('')}</ul><h3>Recent moves</h3><ul class="feed">${summary.moves.map(m=>`<li><p>${esc(m.summary)}</p><p class="meta">Week ${m.week} · ${date(m.createdAt)} · synthetic sample</p></li>`).join('')}</ul><a class="small" style="display:inline-flex;min-height:44px;align-items:center" href="/transactions">View transactions</a></div></section>`;
    }
    function aroundLeague() {
      return `<section class="major around" aria-labelledby="around-title"><div><div class="section-head"><h2 id="around-title">Around the league</h2><a href="/intel">News desk</a></div><p class="meta" style="margin-bottom:16px">Dated editorial sample · ${esc(edition.dateLabel)}</p><div class="happenings">${edition.happenings.map(h=>`<article><p class="meta">${esc(h.dateLabel)}</p><h3><a href="${esc(h.href)}">${esc(h.title)}</a></h3><p class="muted">${esc(h.text)}</p></article>`).join('')}</div><details class="sources"><summary>Editorial source notes</summary><ul>${edition.sources.map(s=>`<li><a href="${esc(s.url)}">${esc(s.label)}</a> · checked ${esc(s.checkedAt)}</li>`).join('')}</ul><p class="meta">${esc(edition.title)} · draft, unpublished · ${esc(edition.dateLabel)}. The opening-week story is historical editorial context, separate from the current Week ${pair?.week??'—'} pairing.</p><p class="meta" style="margin-top:8px">${esc(edition.game.selectionReason)}</p></details></div><div><div class="section-head"><h2>Transactions</h2><a href="/transactions">All moves</a></div><ul class="feed">${data.home.hub.transactions.map(m=>`<li><p>${esc(m.summary)}</p><p class="meta">${date(m.createdAt)} · Week ${m.week} · synthetic${summary&&m.teamIds.includes(summary.team.id)?' · your team':''}</p></li>`).join('')}</ul></div></section>`;
    }
    function faces() {
      return `<section class="major" aria-labelledby="faces-title"><div class="section-head"><div><h2 id="faces-title">Faces of the league</h2><p class="meta" style="margin-top:6px">Each roster’s top modeled player · synthetic FAAB estimates</p></div><a href="/stocks">Compare prices</a></div><div class="faces">${data.faces.map(f=>`<article class="face" data-face="${esc(f.team.id)}">${portrait(f.player.id,f.player.name)}<div><a class="player" href="/player/${esc(f.player.id)}">${esc(f.player.name)}</a><a class="team" href="/teams/${esc(f.team.id)}">${esc(f.team.name)}${f.champion?' · 2025 champion':''}</a><span class="num">${money(f.player.value)}</span></div></article>`).join('')}</div></section>`;
    }
    function directoryRow(t) {
      const identity=t.identity, current=t.currentRecord, matchup=t.currentMatchup;
      const opponent=matchup?(String(matchup.home.id)===String(identity.id)?matchup.away:matchup.home):null;
      const old=t.previousSeason;
      return `<article class="directory-team" data-team-id="${esc(identity.id)}"><div class="directory-line"><div><h3>${teamLink(identity)}</h3><p class="meta manager">${esc(identity.managerName)}</p></div><p class="num record">${record(current)}</p><div class="opponent"><span class="meta">Week ${matchup?.week??'—'} · incomplete</span><p>${opponent?'vs '+teamLink(opponent):'Opponent unavailable'}</p></div></div><details class="team-roster"><summary>${t.players.length}-player roster${old?` · ${esc(old.season)}: ${old.wins}–${old.losses}${old.finish===1?' · champion':''}${old.ownerNote?' · '+esc(old.ownerNote):''}`:''}</summary>${old?.ownerNote?`<p class="small muted" style="margin-bottom:12px">${esc(old.ownerNote)} The previous-season record belongs to that previous manager.</p>`:''}<ul class="roster-grid">${t.players.map(p=>`<li>${playerLink(p)}<span class="meta">${esc(p.position)} · ${esc(p.nbaTeam||'NBA team unavailable')}</span></li>`).join('')}</ul><a class="small" style="display:inline-flex;align-items:center;min-height:44px" href="/teams/${esc(identity.id)}#team-roster">Open team roster</a></details></article>`;
    }
    function leagueTables() {
      return `<section class="major league-columns"><section id="directory" aria-labelledby="directory-title"><div class="section-head"><h2 id="directory-title">Clubhouse directory</h2><a href="/teams">Team profiles</a></div><p class="meta">Current 2026 records · full rosters retained</p><div class="directory-controls"><label for="team-search">Search team, manager or player<input id="team-search" type="search" placeholder="Try Damian Lillard" autocomplete="off"></label><label for="directory-sort">Sort teams<select id="directory-sort"><option value="name">Team name A–Z</option><option value="points">Points for, highest</option><option value="roster">Roster count, largest</option></select></label></div><p class="meta directory-count" id="directory-count" aria-live="polite"></p><div id="directory-rows"></div></section><aside><section id="standings" aria-labelledby="standings-title"><div class="section-head"><h2 id="standings-title">Standings</h2><a href="/history">History</a></div><p class="meta">2026 · synthetic source records</p><label class="standings-controls" for="standings-sort">Sort standings<select id="standings-sort"><option value="rank">Source rank, ascending</option><option value="points">Points for, highest</option><option value="name">Team name A–Z</option></select></label><table class="standings-table"><caption class="sr-only">All ten teams, wins, losses and points for</caption><thead><tr><th scope="col">#</th><th scope="col">Team</th><th scope="col">W</th><th scope="col">L</th><th scope="col">PF</th></tr></thead><tbody id="standings-rows"></tbody></table><p class="meta" style="margin-top:8px">PF uses source pointsFor ÷ 100. Source rank stays attached when sorting.</p><div class="unavailable"><p class="small"><strong>League stats unavailable.</strong> Points leaders, streaks, activity, blowout and closest-game snapshots are not supplied.</p><p class="small"><strong>Power unavailable.</strong> No Lineup Power producer snapshot is connected.</p></div></section><section class="tools" aria-labelledby="tools-title"><h2 id="tools-title">Off the scoresheet</h2><div class="tool-link"><a href="/stocks">Stocks exchange</a><span class="meta">Modeled FAAB</span></div><p class="small muted">Inspect a player price, its basis and available source detail.</p><div class="tool-link"><a href="/trade-analyzer">Trade analyzer</a><span class="meta">Compare rosters</span></div><div class="game-preview"><a href="/arcade/free-throw" aria-label="Open Free Throw practice"><img src="${inventory.assets.game}" alt="Free Throw basketball practice preview" loading="lazy" width="130" height="73"></a><div><h3><a href="/arcade">Arcade</a></h3><p class="small muted" style="margin-top:4px">Free Throw practice</p><a class="action" href="/arcade/free-throw">Play Free Throw</a></div></div></section></aside></section>`;
    }
    function archives() {
      return `<section class="major" id="archive" aria-labelledby="archive-title"><div class="section-head"><h2 id="archive-title">Weekly archive</h2><a href="/weekly">All editions</a></div><div class="archives">${data.archive.map(a=>`<article class="archive-entry"><p class="archive-index num">W${esc(a.id.split('W')[1])}</p><div><p class="meta">${esc(a.dateLabel)} · dated draft sample</p><h3><a href="/weekly/${esc(a.id)}">${esc(a.title)}</a></h3><p class="small muted">${esc(a.game.note)}</p></div></article>`).join('')}</div></section>`;
    }
    document.querySelector('#app').innerHTML=`${nav}<div class="fixture"><div class="wrap"><strong>OFFLINE DESIGN FIXTURE.</strong> All current records, scores, prices, form, news and AI are synthetic. Approved dated identities and editorial are preserved. This is not live league data.</div></div><main id="main" class="wrap"><div class="page-top"><div><p class="kicker">GOAT Hoopers · 2026 season · Stats Exchange</p><h1>Week ${pair?.week??'—'} working desk</h1></div><p class="meta top-stamp">${summary?'Member':'Public'} preview<br>Fixture as of ${stamp(data.home.checkedAt)}<br><a href="${comparison}">Switch to ${mode==='member'?'public':'member'} preview</a></p></div><nav class="desk-nav" aria-label="On this page"><a href="#matchup-title">This week</a>${summary?'<a href="#personal-title">Roster value</a>':''}<a href="#scouting">Scouting</a><a href="#directory">Directory</a><a href="#standings">Standings</a><a href="#archive">Archive</a></nav><div class="lead">${featured()}${personal()}</div><div class="major work-columns">${aiDesk()}${scouting()}</div>${editorials()}${formAndNews()}${aroundLeague()}${faces()}${leagueTables()}${archives()}</main><footer><div class="wrap footer-line"><div><a class="brand" href="/" aria-label="GOAT Hoopers home"><img src="${inventory.assets.logo}" alt="GOAT Hoopers" width="166" height="40" loading="lazy"></a><p class="meta">An independent homepage study for ten friends and their league. Approved identities and dated editorial come from the offline benchmark fixture. Synthetic records, prices and model results demonstrate layout only. No recorded value history or Power ranking is invented.</p><details class="sources"><summary>Fixture &amp; source explanation</summary><p class="small muted">Benchmark ${esc(inventory.benchmark)}. ${esc(inventory.warning)} All data is supplied locally; this page requests no league, pricing or AI service. Saved AI inputs and their timestamp are unavailable. Editorial sources are linked under Around the league and each dated player take.</p></details></div><nav class="footer-links" aria-label="Footer"><a href="/stocks">Stocks</a><a href="/transactions">Transactions</a><a href="/history">History</a><a href="/weekly">Weekly archive</a><a href="${comparison}">${mode==='member'?'Public':'Member'} preview</a></nav></div></footer>`;
    const originalOrder=new Map(directory.map((t,i)=>[t.identity.id,i]));
    function renderDirectory() {
      const query=document.querySelector('#team-search').value.trim().toLocaleLowerCase();
      const sort=document.querySelector('#directory-sort').value;
      const selected=directory.filter(t=>[t.identity.name,t.identity.managerName,...t.players.map(p=>p.fullName)].join(' ').toLocaleLowerCase().includes(query));
      selected.sort((a,b)=>(sort==='points'?b.currentRecord.pointsFor-a.currentRecord.pointsFor:sort==='roster'?b.players.length-a.players.length:a.identity.name.localeCompare(b.identity.name))||originalOrder.get(a.identity.id)-originalOrder.get(b.identity.id));
      document.querySelector('#directory-rows').innerHTML=selected.length?selected.map(directoryRow).join(''):`<p class="small" style="padding:24px 0">No matching teams or players. Clear search to restore all ten teams.</p>`;
      document.querySelector('#directory-count').textContent=`${selected.length} ${selected.length===1?'team':'teams'} · ${selected.reduce((n,t)=>n+t.players.length,0)} roster references`;
      if(query) for(const t of selected) if(![t.identity.name,t.identity.managerName].join(' ').toLocaleLowerCase().includes(query))document.querySelector(`[data-team-id="${t.identity.id}"] .team-roster`).open=true;
    }
    function renderStandings() {
      const sort=document.querySelector('#standings-sort').value;
      const rows=[...data.home.hub.standings].sort((a,b)=>(sort==='points'?b.pointsFor-a.pointsFor:sort==='name'?a.team.name.localeCompare(b.team.name):a.rank-b.rank)||a.rank-b.rank);
      document.querySelector('#standings-rows').innerHTML=rows.map(s=>`<tr ${summary&&s.team.id===summary.team.id?'class="mine"':''}><td class="num">${s.rank}</td><td>${teamLink(s.team)}</td><td class="num">${s.wins}</td><td class="num">${s.losses}</td><td class="num">${(s.pointsFor/100).toFixed(1)}</td></tr>`).join('');
    }
    document.querySelector('#team-search').addEventListener('input',renderDirectory);
    document.querySelector('#directory-sort').addEventListener('change',renderDirectory);
    document.querySelector('#standings-sort').addEventListener('change',renderStandings);
    document.addEventListener('keydown',e=>{if(e.key==='Escape'){const d=[...document.querySelectorAll('.menu[open]')].find(d=>d.contains(document.activeElement));if(d){d.open=false;d.querySelector('summary').focus();}}});
    const header=document.querySelector('.site-header');
    const headerClearance=()=>document.documentElement.style.setProperty('--header-clearance',`${header.getBoundingClientRect().height+16}px`);
    new ResizeObserver(headerClearance).observe(header);headerClearance();
    renderDirectory();renderStandings();
    document.querySelector('main').setAttribute('data-mock-ready','09');
  </script>
</body>
</html>
