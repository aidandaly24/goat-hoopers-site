<script type="module">
import {inventory,data,mode,aiState,esc,money} from '../../data.js';
const member=mode==='member';
const home=data.home, directory=home.directory, teams=home.hub.teams, edition=home.edition;
const summary=member?data.personal.summary:null;
const personal=summary;
const byId=Object.fromEntries(teams.map(t=>[t.id,t]));
const playerMap=Object.fromEntries(directory.flatMap(d=>d.players).map(p=>[p.id,p]));
const faceMap=Object.fromEntries(data.faces.map(f=>[f.team.id,f]));
const matchup=summary?.matchup||directory.find(d=>d.currentMatchup)?.currentMatchup;
const time=(v)=>v?new Date(v).toLocaleString('en-GB',{day:'2-digit',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit',timeZone:'UTC'})+' UTC':'Unavailable';
const date=(v)=>v?new Date(v).toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric',timeZone:'UTC'}):'Unavailable';
const teamName=id=>byId[id]?.name??`Roster ${id}`;
const teamLink=id=>`<a href="/teams/${esc(id)}">${esc(teamName(id))}</a>`;
const playerLink=(id,name)=>`<a href="/player/${esc(id)}">${esc(name??playerMap[id]?.fullName??id)}</a>`;
const portrait=(id,name,klass='portrait')=>inventory.portraits[id]?`<img class="${klass}" src="${esc(inventory.portraits[id])}" alt="${esc(name)}" onerror="this.replaceWith(Object.assign(document.createElement('span'),{className:'portrait-wrap',textContent:'N/A'}))">`:`<span class="portrait-wrap" role="img" aria-label="Portrait unavailable for ${esc(name)}">N/A</span>`;
const record=t=>`${t.wins}–${t.losses}${t.ties?'–'+t.ties:''}`;
const compare=`<div class="compare" aria-label="Compare homepage views"><a href="index.html?view=member${aiState!=='ready'?'&ai='+esc(aiState):''}" ${member?'aria-current="page"':''}>Member</a><a href="index.html?view=public${aiState!=='ready'?'&ai='+esc(aiState):''}" ${!member?'aria-current="page"':''}>Public</a></div>`;
const heading=(num,title,link,label)=>`<div class="section-heading"><h2><span class="section-number">${num}</span>${title}</h2>${link?`<a href="${link}">${label}</a>`:''}</div>`;
function scoreTeam(t,score){return `<div class="team-score"><span class="team-marker">${esc(t.id.padStart(2,'0'))}</span><div><h3>${teamLink(t.id)}${summary?.team.id===t.id?' <small> / You</small>':''}</h3><p>${esc(t.managerName)} · ${record(t)} record</p></div><span class="figure ${score==null?'pending':'score'}">${score==null?'Pending':Number(score).toFixed(1)}</span></div>`}
function valueSection(){if(!summary)return '';const v=summary.valuation;return `<div class="ledger" data-personal id="notebook"><section aria-labelledby="value-title"><div class="value-panel"><div><div class="eyebrow">02 / Asset ledger</div><h3 id="value-title">Your roster value</h3><div class="figure total-value">${money(v.total)}</div><p class="coverage">${v.complete?'Complete modeled total':'Partial priced subtotal'} · FAAB model<br>${v.priced} priced / ${v.unpriced} unpriced / ${summary.coverage.roster} rostered<br>${v.rank?`Value rank ${v.rank.rank} of ${v.rank.teams}${v.rank.tied?' · tied':''}<br>`:''}In-season computation<br>${time(summary.market.updatedAt)}</p></div><div><h3>Highest modeled values</h3><ol class="top-value">${summary.players.map(p=>`<li><span>${playerLink(p.id,p.name)}<small>${p.position} · ${p.changePct>0?'Up':p.changePct<0?'Down':'Flat'} ${Math.abs(p.changePct).toFixed(1)}% sample price change</small></span><span class="figure">${money(p.value)}</span></li>`).join('')}</ol></div></div><details class="native-detail"><summary>All ${summary.rosterValues.length} roster values</summary><ul class="value-rows" data-roster-values>${summary.rosterValues.map(p=>`<li><span>${playerLink(p.id,p.name)} <small>${esc(p.position)}</small></span><span class="figure">${money(p.value)}</span></li>`).join('')}</ul></details><p class="note-line">${esc(inventory.missing.history)}</p></section><section class="guide" aria-labelledby="guide-title"><div class="eyebrow">03 / Scouting notebook</div><h3 id="guide-title">Players to watch</h3><p>${esc(summary.playerGuide.watch.label)}</p>${summary.playerGuide.watch.rows.map(p=>`<div class="scout-row">${portrait(p.id,p.name)}<div>${playerLink(p.id,p.name)}<small>${p.games} observed games · ${esc(p.note)}</small></div><span class="figure">${p.value}<small>EMA FP/GP</small></span></div>`).join('')}<p class="note-line">${esc(summary.playerGuide.watch.message)} Season ${summary.playerGuide.season}, through fixture Week ${summary.playerGuide.currentWeek}. Synthetic form evidence; separate from modeled FAAB prices.</p></section></div>`}
function recap(){if(!summary)return '';const g=summary.playerGuide;const shared=g.best.filter(p=>g.rough.some(r=>r.id===p.id));const sharedIds=new Set(shared.map(p=>p.id));const uniqueBest=g.best.filter(p=>!sharedIds.has(p.id));const uniqueRough=g.rough.filter(p=>!sharedIds.has(p.id));const renderRow=p=>`<div class="recap-row"><span>${playerLink(p.id,p.name)}<small>${esc(p.note)}</small></span><span class="figure">${p.value} FP / ${p.games} GP</span></div>`;return `<section class="recap" data-personal aria-labelledby="recap-title"><div class="eyebrow" id="recap-title">Completed source week / synthetic performances</div><div class="recap-top" style="margin-top:15px">${[['Your best',uniqueBest],['The rough week',uniqueRough]].map(([label,rows])=>`<div><h3>${label}</h3>${rows.map(renderRow).join('')}</div>`).join('')}</div>${shared.length?`<div style="margin-top:20px"><h3>Shared best / rough selection</h3>${shared.map(renderRow).join('')}</div>`:''}<p class="recap-period">${esc(g.period)}. ${esc(g.coverage)} ${esc(inventory.missing.recap)} ${esc(g.recapMessage)} ${g.best.length} best / ${g.rough.length} rough selections among ${g.eligiblePlayed} eligible players; shared selections appear once.</p></section><section class="wire-strip" data-personal aria-labelledby="team-wire-title"><h3 id="team-wire-title">Your wire</h3>${summary.news.map(n=>`<div class="wire-item"><small>Synthetic · ${esc(n.outlet.name)} · ${date(n.publishedAt)}</small><a href="${esc(n.url)}">${esc(n.headline)}</a></div>`).join('')}${summary.moves.map(m=>`<div class="wire-item"><small>Sample move · Week ${m.week} · ${date(m.createdAt)}</small><a href="/transactions">${esc(m.summary)}</a></div>`).join('')}</section>`}
function aiRows(){if(!data.weekly)return `<p class="empty">Unavailable — no saved AI slate is connected for this view. No probabilities or returned choices are available. <a href="/ai-decides">Open AI Decides</a></p>`;return data.weekly.matchups.map((m,i)=>{let r=m.result;let ids=m.teamIds;let matches=directory.some(d=>d.currentMatchup && ids.every(id=>[d.currentMatchup.home.id,d.currentMatchup.away.id].includes(id)));let ready=r&&m.status==='ready'&&matches;return `<article class="ai-row" data-ai-pair="${esc(m.matchupId)}"><span class="ai-index">${String(i+1).padStart(2,'0')}</span>${ids.map(id=>`<div class="ai-team"><span>${teamLink(id)}${summary?.team.id===id?' <small>/ You</small>':''}</span><span class="figure">${ready?((r.probabilities.find(p=>p.choice===id)?.probability??NaN)*100).toFixed(0)+'%':'—'}</span></div>`).join('')}<div class="ai-choice">${aiState==='stale'?'<span class="ai-state">STALE SAVED PICK</span><br>':''}${!matches?'<span class="ai-state">Unmatched current pairing</span>':ready?`Returned choice${teamLink(r.choice)}<span>Confidence ${(r.confidence*100).toFixed(0)}% · separate signal</span>`:'Unavailable — no matched result'}</div><details class="ai-provenance"><summary>Saved ${time(data.weekly.generatedAt)} · pick provenance</summary><div class="provenance-content"><dl><dt>Status</dt><dd>${esc(data.weekly.status)} / ${esc(m.status)}${aiState==='stale'?' · stale saved result; not a fresh prediction':''}</dd><dt>Returned choice</dt><dd>${r?esc(teamName(r.choice)):'Unavailable'}${r?' (roster '+esc(r.choice)+')':''}</dd><dt>Probabilities</dt><dd>${r?r.probabilities.map(p=>`${esc(teamName(p.choice))} (roster ${esc(p.choice)}): ${(p.probability*100).toFixed(0)}%`).join(' · '):'Unavailable'}</dd><dt>Meaning</dt><dd>${esc(r?.probabilityLabel??'Unavailable')}</dd><dt>Confidence</dt><dd>${r?(r.confidence*100).toFixed(0)+'%':'Unavailable'}; independent from model probability</dd><dt>Model / prompt</dt><dd>${esc(r?.model??'Unavailable')} / ${esc(r?.promptVersion??'Unavailable')}</dd><dt>Input snapshot</dt><dd>${r?.snapshot?'Available in source':'Unavailable'}. Weekly snapshot ${data.weekly.snapshot?'available':'unavailable'}.</dd><dt>Saved / inputs</dt><dd>${time(data.weekly.generatedAt)} / input timestamp unavailable</dd><dt>Evidence</dt><dd>${esc([...(m.evidence??[]),...(r?.evidence??[])].join(' ')||'Unavailable')}</dd><dt>Context</dt><dd>Season ${esc(data.weekly.season)}, Week ${esc(data.weekly.week)}, roster IDs ${ids.map(esc).join(' / ')}. Experimental synthetic model output; no generation on render.</dd></dl></div></details></article>`}).join('')}
function faces(){return data.faces.map((f,i)=>`<article class="face" data-face="${esc(f.team.id)}"><span class="face-no">${String(i+1).padStart(2,'0')}</span><a class="face-image" href="/player/${esc(f.player.id)}">${inventory.portraits[f.player.id]?`<img src="${esc(inventory.portraits[f.player.id])}" alt="${esc(f.player.name)}" onerror="this.replaceWith(Object.assign(document.createElement('span'),{className:'meta',textContent:'Portrait unavailable'}))">`:`<span class="meta">Portrait unavailable</span>`}</a><h3>${teamLink(f.team.id)}</h3><p>${esc(f.team.managerName)}${f.champion?' · 2025 champion':''}</p><div class="face-price">${playerLink(f.player.id,f.player.name)}<span class="figure">${money(f.player.value)}</span></div><p>Top modeled player · ${esc(f.player.position)}</p></article>`).join('')}
function stories(){return edition.playerSpotlights.map(s=>`<article><div class="story-id">${portrait(s.playerId,s.name)}<div><div class="eyebrow">${esc(s.periodLabel)}</div><h3>${playerLink(s.playerId,s.name)}</h3></div></div><h4>${esc(s.headline)}</h4><p>${esc(s.opinion)}</p><div class="stat-line">${s.stats.map(t=>`<div><strong>${esc(t.value)}</strong><small>${esc(t.label)}</small></div>`).join('')}</div><p class="meta">${esc(s.statPeriod)} · ${teamLink(s.teamId)}</p><details class="native-detail story-reason"><summary>Editorial basis & source</summary><p>${esc(s.selectionReason)}</p><p>Sample edition ${esc(edition.dateLabel)} · Draft, unpublished.</p><a href="${esc(s.source.url)}">${esc(s.source.label)}</a> · checked ${esc(s.source.checkedAt)}</details></article>`).join('')}
function directoryRows(rows){return rows.map(d=>{let t=d.identity;let m=d.currentMatchup;let opp=m?(m.home.id===t.id?m.away:m.home):null;return `<details class="directory-team" data-team-id="${esc(t.id)}"><summary><span><span class="directory-name">${esc(t.name)}${summary?.team.id===t.id?' <small>/ You</small>':''}</span><span class="directory-sub">${esc(t.managerName)} · ${d.players.length} players<br>${opp?'Week '+m.week+' vs '+esc(opp.name):'Current opponent unavailable'}</span></span><span class="directory-record">${record(t)}</span></summary><div class="directory-context"><p>Current synthetic record ${record(t)}. ${d.previousSeason?`${d.previousSeason.season}: ${d.previousSeason.wins}–${d.previousSeason.losses} · finish ${d.previousSeason.finish}. ${d.previousSeason.ownerNote?'<strong>Previous manager: '+esc(d.previousSeason.ownerNote)+'</strong>':''}`:'Previous season unavailable.'}</p><div class="directory-links"><a href="/teams/${esc(t.id)}">Team profile</a><a href="/teams/${esc(t.id)}#team-roster">View roster</a></div></div><ul class="roster">${d.players.map(p=>`<li>${playerLink(p.id,p.fullName)}<small>${esc(p.position??'—')} · ${esc(p.nbaTeam??'—')}</small></li>`).join('')}</ul></details>`}).join('')}
function standingsRows(rows){return rows.map(s=>`<tr><td>${s.rank}</td><td>${teamLink(s.team.id)}${summary?.team.id===s.team.id?'<span class="you">Your team</span>':''}</td><td class="record">${s.wins}</td><td class="record">${s.losses}</td><td>${(s.pointsFor/100).toFixed(1)}</td></tr>`).join('')}
const featuredLabel=member?'Your Week 3 matchup':'Featured current matchup';
document.getElementById('app').innerHTML=`
<header class="site-head"><div class="wrap"><div class="head-top"><a class="brand" href="/"><img src="${inventory.assets.logo}" alt="GOAT Hoopers"><span class="season-label eyebrow">2026 season<br>10 teams / one league</span></a><div class="head-actions">${compare}<a href="/stocks">Stocks</a>${member?'<a class="mobile-myteam" href="/team"><strong>My team</strong></a>':'<a href="/teams"><strong>Teams</strong></a>'}</div></div><details class="nav-disclosure" id="nav" open><summary>League destinations</summary><nav class="primary-nav" aria-label="League"><a href="/" aria-current="page">Home</a><a href="/intel">News</a><a href="/stocks">Stocks</a><a href="/history">History</a><a href="/arcade">Arcade</a><a href="/ai-decides">AI Decides</a><a href="/teams">Teams</a><a href="/transactions">Transactions</a><a href="/weekly">Weekly archive</a></nav></details></div></header>
<div class="fixture"><div class="wrap"><strong>OFFLINE DESIGN FIXTURE</strong>All current records, scores, prices, form, news and AI are synthetic. Dated identities and editorial are preserved. This is not live league data.</div></div>
<main class="wrap" id="main"><div class="masthead"><div><div class="eyebrow">GOAT Hoopers / weekly working sheet</div><h1>Coach’s clipboard.</h1></div><div class="sheet-id"><div class="figure">03</div><small>2026 fixture week</small></div></div>
<div class="edition-note"><p><strong>Dated sample edition:</strong> ${esc(edition.title)} · ${esc(edition.dateLabel)} · draft / stale. The current matchup below is Week ${matchup.week}.</p><a href="#editorial">Read the sample notes</a></div>
${member?`<section class="personal-id" data-personal aria-labelledby="identity-title"><div><div class="eyebrow">Your team / ${esc(summary.team.managerName)}</div><h2 id="identity-title">${esc(summary.team.name)}</h2><p>${record(summary.team)} record · No. ${summary.standing.rank} of ${teams.length} · ${summary.coverage.roster} rostered players · Synthetic account view</p></div><div class="action-set"><a class="button" href="/team">My team</a><a class="button secondary" href="/teams/${esc(summary.team.id)}#team-roster">View roster</a></div></section>`:`<section class="personal-id" aria-labelledby="identity-title"><div><div class="eyebrow">Public league edition</div><h2 id="identity-title">Ten teams. The whole floor.</h2><p>Current matchup, scouting notes and every league roster in one working sheet.</p></div><div class="action-set"><a class="button" href="#directory">Find a team</a><a class="button secondary" href="index.html?view=member">Compare member view</a></div></section>`}

ef="#${member?'notebook':'faces'}"><b>02 / SCOUTING</b>${member?'Check your players':'Know the league'}</a><a href="#directory"><b>03 / ROSTERS</b>Inspect all ten teams</a></div><div class="tactical-caption"><small>Static arena / working navigation map</small><a href="/arcade/free-throw">Play free-throw practice</a></div></div></section>
${valueSection()}${recap()}

<section class="block" id="faces" aria-labelledby="faces-heading">${heading('05','Faces of the league','/stocks','Inspect the market')}<p class="note-line faces-heading">Each team’s highest modeled player. Synthetic FAAB values; these are assets, not form rankings.</p><div class="faces">${faces()}</div></section>
<section class="block" id="editorial" aria-labelledby="editorial-heading">${heading('06','From the scouting notebook','/weekly/'+edition.id,'Full dated edition')}<p class="note-line" style="margin:0 0 20px">Dated sample opinions · ${esc(edition.dateLabel)} · not official current Week 2 awards. Last-season and college periods stay attached to every stat.</p><div class="editorial">${stories()}</div><details class="edition-explainer"><summary>Why the sample featured the opener · editorial context</summary><p><strong>${esc(edition.game.title)}</strong> ${esc(edition.game.context)}</p><p>${esc(edition.game.selectionReason)} This is a dated Week ${edition.game.leagueWeek} proposal, separate from the current Week ${matchup.week} directory pairing.</p></details></section>
<section class="block two-col" aria-labelledby="happenings-heading"><div>${heading('07','League happenings','/intel','News')}<p class="note-line" style="margin:0 0 14px">Dated sample wire · ${esc(edition.dateLabel)}</p>${edition.happenings.map(h=>`<article class="happening"><time>${esc(h.dateLabel)}</time><div><h3><a href="${esc(h.href)}">${esc(h.title)}</a></h3><p>${esc(h.text)}</p></div></article>`).join('')}</div><div>${heading('08','Recent transactions','/transactions','All moves')}<p class="note-line" style="margin:0 0 14px">Synthetic current moves</p>${home.hub.transactions.map(m=>`<div class="movement"><small>Week ${m.week} · ${date(m.createdAt)} · ${esc(m.type.replaceAll('_',' '))}</small><a href="/transactions">${esc(m.summary)}</a></div>`).join('')}</div></section>
<section class="block" id="directory" aria-labelledby="directory-title">${heading('09','The team book','/teams','Teams')}<div class="directory-layout"><div><div class="directory-controls"><div class="field"><label for="team-search">Search team, manager or player</label><input type="search" id="team-search" placeholder="Try Embiid or NeuralNets" autocomplete="off"></div><div class="field"><label for="team-sort">Order teams</label><select id="team-sort"><option value="id">Roster number</option><option value="name">Team name A–Z</option><option value="roster">Roster size</option></select></div></div><p class="search-count" id="team-count" aria-live="polite">10 teams · 228 player references · expand a roster</p><div id="team-results">${directoryRows(directory)}</div></div><aside class="side-section"><h3>Standings / all ten</h3><div class="standings-controls"><label for="standings-sort">Sort standings</label><select id="standings-sort"><option value="rank">League rank</option><option value="points">Points for</option><option value="name">Team name A–Z</option></select></div><table class="standings"><caption class="sr-only">Synthetic league standings. PF divides source pointsFor by 100.</caption><thead><tr><th scope="col">#</th><th scope="col">Team</th><th scope="col">W</th><th scope="col">L</th><th scope="col">PF</th></tr></thead><tbody id="standings-rows">${standingsRows(home.hub.standings)}</tbody></table><p class="note-line">Synthetic current record. PF = source pointsFor ÷ 100. Rank stays attached when reordered.</p><div class="unavailable"><h4>League statistics / unavailable</h4><p>Points leaders, streak, activity leader, biggest blowout and closest game have no connected source values.</p></div><div class="unavailable"><h4>Lineup Power / unavailable</h4><p>${esc(inventory.missing.power)}</p></div></aside></div></section>
<section class="block" aria-labelledby="tools-heading">${heading('10','Off the clipboard')}<div class="tools"><div class="tool-list"><a class="tool-link" href="/stocks"><span>01</span><span><strong>Stocks / market</strong><small>Inspect modeled FAAB prices and player detail.</small></span><span>Open</span></a><a class="tool-link" href="/trade-analyzer"><span>02</span><span><strong>Trade analyzer</strong><small>Bring a deal to the table.</small></span><span>Open</span></a><a class="tool-link" href="/arcade"><span>03</span><span><strong>Arcade</strong><small>Browse the playable league games.</small></span><span>Open</span></a></div><div><a href="/arcade/free-throw"><img class="arcade-photo" src="${inventory.assets.game}" alt="Preview of the playable free-throw practice court"></a><div class="arcade-copy"><div><h3>Free-throw practice</h3><p>Real game preview · practice at the line.</p></div><a class="button secondary" href="/arcade/free-throw">Play practice</a></div></div></div></section>

const nav=document.getElementById('nav'); const narrow=matchMedia('(max-width:760px)');
const setNav=()=>{nav.open=!narrow.matches};setNav();narrow.addEventListener('change',setNav);
const search=document.getElementById('team-search'),sort=document.getElementById('team-sort');
function updateDirectory(){const q=search.value.trim().toLocaleLowerCase();const openIds=[...document.querySelectorAll('.directory-team[open]')].map(d=>d.dataset.teamId);const rows=directory.filter(d=>[d.identity.name,d.identity.managerName,...d.players.map(p=>p.fullName)].some(n=>n.toLocaleLowerCase().includes(q))).sort((a,b)=>sort.value==='name'?a.identity.name.localeCompare(b.identity.name):sort.value==='roster'?b.players.length-a.players.length:Number(a.identity.id)-Number(b.identity.id));document.getElementById('team-results').innerHTML=rows.length?directoryRows(rows):'<p class="empty-search">No teams match. Try a team name, manager or roster player.</p>';document.querySelectorAll('.directory-team').forEach(d=>{d.open=q.length>0||openIds.includes(d.dataset.teamId)});document.getElementById('team-count').textContent=`${rows.length} of 10 teams · ${rows.reduce((n,d)=>n+d.players.length,0)} player references${q?' · matching rosters expanded':' · expand a roster'}`;}
search.addEventListener('input',updateDirectory);sort.addEventListener('change',updateDirectory);
document.getElementById('standings-sort').addEventListener('change',e=>{const rows=[...home.hub.standings].sort((a,b)=>e.target.value==='name'?a.team.name.localeCompare(b.team.name):e.target.value==='points'?b.pointsFor-a.pointsFor:a.rank-b.rank);document.getElementById('standings-rows').innerHTML=standingsRows(rows)});
document.querySelectorAll('.section-heading h2').forEach((h,i)=>{h.id='section-heading-'+i;h.closest('section')?.setAttribute('aria-labelledby',h.id)});
document.querySelector('.working-floor').setAttribute('aria-labelledby',document.querySelector('.working-floor h2').id);
await Promise.allSettled([...document.images].map(img=>img.decode()));
await document.fonts.ready;
document.querySelector('main').dataset.mockReady='02';
</script>
