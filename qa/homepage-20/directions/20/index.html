<body>
<a class="skip" href="#main">Skip to content</a>
<div id="app"><p class="wrap" style="padding:32px 0">Loading the league register…</p></div>
<noscript><p class="wrap">This offline design fixture requires JavaScript to display its shared inventory.</p></noscript>
<script type="module">
import {inventory,data,mode,aiState,esc,money} from '../../data.js';
const {home,weekly,personal,faces,archive}=data;
const edition=home.edition, member=mode==='member'&&personal.kind==='member', summary=member?personal.summary:null;
const teams=home.directory, teamById=new Map(teams.map(t=>[t.identity.id,t]));
const pair=(member?teams.find(t=>t.identity.id===summary.team.id)?.currentMatchup:null)||teams.find(t=>t.currentMatchup)?.currentMatchup;
const currentWeek=pair?.week??weekly?.week;
const teamName=id=>teamById.get(id)?.identity.name||`Unmatched team ${id}`;
const record=t=>`${t.wins}–${t.losses}${t.ties?'–'+t.ties:''}`;
const fmtDate=v=>v?new Date(v).toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric',timeZone:'UTC'}):'Unavailable';
const fmtTime=v=>v?new Date(v).toLocaleString('en-GB',{day:'2-digit',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit',timeZone:'UTC'})+' UTC':'Unavailable';
const pct=n=>`${Math.round(n*100)}%`;
const plink=(p,label)=>`<a href="/player/${esc(p.id??p.playerId)}">${esc(label??p.name??p.fullName)}</a>`;
const tlink=t=>`<a href="/teams/${esc(t.id)}">${esc(t.name)}</a>`;
const portrait=(id,name,cls='small-portrait')=>`<div class="${cls}"><span class="initials" aria-hidden="true">${esc(name.split(/\s+/).map(x=>x[0]).slice(0,2).join(''))}</span>${inventory.portraits[id]?`<img src="${esc(inventory.portraits[id])}" alt="" loading="lazy" onerror="this.hidden=true">`:''}</div>`;
const destinations=[['Home','/'],['News','/intel'],['Stocks','/stocks'],['History','/history'],['Arcade','/arcade'],['AI Decides','/ai-decides'],['Teams','/teams'],['Transactions','/transactions'],['Weekly archive','/weekly']];
const navLinks=destinations.map(([name,url])=>`<a href="${url}" ${name==='Home'?'aria-current="page"':''}>${name}</a>`).join('')+(member?'<a class="account" href="/team">My team</a>':'');
function aiMarkup(){
 if(!weekly)return `<div class="unavailable"><strong>Saved AI picks: Unavailable.</strong><p>No saved slate is connected. Matchup probabilities and returned choices are unavailable.</p></div>`;
 const stale=weekly.status==='stale';
 return `<div class="ai-grid">${weekly.matchups.map((m,i)=>{
 const r=m.result,valid=!!r&&m.teamIds.every(id=>teamById.has(id))&&m.teamIds.every(id=>r.probabilities.some(p=>p.choice===id));
 const live=teams.find(t=>t.currentMatchup?.home.id===m.teamIds[0]&&t.currentMatchup?.away.id===m.teamIds[1])?.currentMatchup;
 const matched=valid&&live?.week===weekly.week&&weekly.season===home.hub.season.seasonYear;
 const state=stale?'Stale':!matched?'Unmatched':m.status==='ready'?'Saved':m.status;
 const probabilities=r?.probabilities??[];
 return `<article class="ai-pair" data-ai-pair="${esc(m.matchupId)}"><div class="pair-head"><span>PAIR ${String(i+1).padStart(2,'0')}</span><span class="state ${stale?'stale':''}">${esc(state)}</span></div>${m.teamIds.map(id=>{const p=probabilities.find(p=>p.choice===id);return `<div class="prob-row"><a href="/teams/${esc(id)}">${esc(teamName(id))}</a><span class="num">${matched&&p?pct(p.probability):'—'}</span></div>`}).join('')}${matched&&!stale?`<div class="bar" aria-hidden="true">${m.teamIds.map(id=>`<span style="width:${(probabilities.find(p=>p.choice===id)?.probability??0)*100}%"></span>`).join('')}</div>`:''}<p class="pick">${stale?'Stale saved result. ':''}${matched&&r?`Returned choice: <strong>${esc(teamName(r.choice))}</strong>`:'Result unavailable for this current pair.'}</p><details class="provenance"><summary>Pick provenance</summary><p>${esc(r?.probabilityLabel??'Probability label unavailable.')}</p><p>Returned choice ID: ${esc(r?.choice??'Unavailable')}. Confidence: ${r?.confidence!=null?pct(r.confidence):'Unavailable'} (separate model signal).</p><p>Saved: ${fmtTime(weekly.generatedAt)}. Season ${esc(weekly.season)}, Week ${esc(weekly.week)}.</p><p>Model: ${esc(r?.model??'Unavailable')}. Prompt: ${esc(r?.promptVersion??'Unavailable')}.</p><p>Input snapshot: ${r?.snapshot?'Available':'Unavailable'}. Slate snapshot: ${weekly.snapshot?'Available':'Unavailable'}. Baseline: ${m.baseline?'Available':'Unavailable'}.</p><p>Evidence: ${esc([...m.evidence??[],...r?.evidence??[]].join(' ')||'Unavailable')}</p>${!matched?`<p>The saved pair does not match the current season/week/roster pair. It is not a current estimate.</p>`:''}${stale?'<p>These values are stale; no current model estimate is claimed.</p>':''}<p>Synthetic model output. No generation occurs here.</p></details></article>`;
 }).join('')}</div><p class="ai-note">${stale?'<strong>Stale saved slate.</strong> ':''}Model probabilities, not calibrated sports odds. Synthetic saved examples · ${fmtTime(weekly.generatedAt)} · Confidence is a separate signal in each provenance disclosure.</p>`;
}
function personalMarkup(){if(!member)return `<div class="public-desk"><div><strong>10</strong><span>Teams in the league</span></div><div><strong>${home.hub.season.playoffTeams}</strong><span>Playoff places</span></div><div><strong>${home.hub.season.playoffWeekStart}</strong><span>Playoffs begin · week</span></div></div>`;
return `<div data-personal><div class="profile-line"><div><span class="eyebrow muted">Your team / member preview</span><h2>${esc(summary.team.name)}</h2><p>${esc(summary.team.managerName)} · ${summary.coverage.roster} players · Standing ${summary.standing.rank} of ${teams.length} · ${record(summary.team)} W–L</p></div><a class="action" href="/teams/${esc(summary.team.id)}#team-roster">View roster</a></div></div>`;}
function valuationMarkup(){if(!member)return '';return `<section class="section" data-personal aria-labelledby="value-title"><div class="section-head"><div class="left"><span class="section-no">02</span><h2 id="value-title">Your roster, priced.</h2></div><a href="/stocks">Open the market</a></div><div class="value-grid"><div><span class="eyebrow muted">Modeled FAAB value · ${esc(summary.market.pricingBasis)}</span><div class="big-value">${money(summary.valuation.total)}</div><div class="facts"><p><strong>${summary.valuation.priced}/${summary.coverage.roster} priced</strong> · ${summary.valuation.unpriced} unpriced · Value rank ${summary.valuation.rank.rank} of ${summary.valuation.rank.teams}.</p><p>Synthetic modeled FAAB reference, not a cash balance or trade offer. ${summary.valuation.complete?'Complete pricing coverage.':'Partial pricing coverage.'}</p><p>Computed ${fmtTime(summary.checkedAt)}. Market basis updated ${fmtTime(summary.market.updatedAt)}.</p></div></div><div class="top-players">${summary.players.map(p=>`<article class="top-player">${portrait(p.id,p.name,'portrait')}<h3>${plink(p)}</h3><p class="player-price">${money(p.value)}</p><p class="small">${esc(p.position)} · +${p.changePct}% sample change</p></article>`).join('')}</div></div><details class="values-details"><summary>All ${summary.rosterValues.length} roster values and pricing basis</summary><div data-roster-values class="values-list">${summary.rosterValues.map(p=>`<div class="value-row"><span>${plink(p)} <span class="small">${esc(p.position)}</span></span><span class="num">${money(p.value)}</span></div>`).join('')}</div><p class="small" style="padding-bottom:16px">Modeled FAAB pricing, ${esc(summary.market.pricingBasis)} basis. ${summary.valuation.priced} priced, ${summary.valuation.unpriced} unpriced. Computed ${fmtTime(summary.checkedAt)}; synthetic values.</p></details><p class="history-state"><strong>Recorded history unavailable.</strong> ${esc(inventory.missing.history)}</p></section>`;}
function editorialMarkup(){return `<section class="section" aria-labelledby="editorial-title"><div class="section-head"><div class="left"><span class="section-no">03</span><h2 id="editorial-title">From the notebook.</h2></div><p>Dated sample editorial · ${esc(edition.dateLabel)} · Draft, not current weekly awards.</p></div><div class="editorial-grid">${edition.playerSpotlights.map((p,i)=>`<article class="story"><p class="eyebrow muted">${esc(p.periodLabel)}</p><div class="story-top">${portrait(p.playerId,p.name)}<div><h3>${plink(p)}</h3><p class="small">${esc(p.position)} · ${esc(teamName(p.teamId))}</p></div></div><h3>${esc(p.headline)}</h3><p class="opinion">${esc(p.opinion)}</p><div class="stats">${p.stats.map(s=>`<div><strong>${esc(s.value)}</strong><span>${esc(s.label)}</span></div>`).join('')}</div><p class="period">${esc(p.statPeriod)}</p><details class="provenance"><summary>Selection and source</summary><p>${esc(p.selectionReason)}</p><p><a href="${esc(p.source.url)}">${esc(p.source.label)}</a> · Checked ${esc(p.source.checkedAt)}.</p><p>Edition ${esc(edition.id)} · ${esc(edition.dateLabel)}. Draft sample. Not an official current Week ${summary?.playerGuide.previousWeek??2} award.</p></details></article>`).join('')}</div></section>`;}
function scoutMarkup(){const g=summary?.playerGuide;const priceFaces=faces.filter(f=>f.player).slice(0,3);return `<section class="section" ${member?'data-personal':''} aria-labelledby="scout-title"><div class="section-head"><div class="left"><span class="section-no">04</span><h2 id="scout-title">Scouting notes.</h2></div><p>${member?'Your observed form and completed-week sample.':'League players, modeled prices and dated editorial context.'}</p></div><div class="two-col"><div>${g?`<h3 class="subhead">On form, on your roster</h3><p class="small">${esc(g.watch.label)} · Synthetic observation sample</p>${g.watch.rows.map(p=>`<div class="guide-row"><span>${plink(p)}<small>${esc(p.note)}</small></span><span class="num">${p.value.toFixed(1)}<small>EMA FP/G · ${p.games} games</small></span></div>`).join('')}<p class="guide-note">${esc(g.watch.message)} Checked ${fmtTime(summary.checkedAt)}.</p>`:`<h3 class="subhead">League price references</h3><p class="small">Selected current top modeled players · Synthetic FAAB price basis, not observed form.</p>${priceFaces.map(f=>`<div class="guide-row"><span>${plink(f.player)}<small>${tlink(f.team)}</small></span><span class="num">${money(f.player.value)}<small>Modeled FAAB</small></span></div>`).join('')}<p class="guide-note">No member watch list is exposed in the public preview. Price and editorial selection do not establish player form.</p>`}<div class="price-scout"><h3>Editorial watch: AJ Dybantsa</h3><p class="guide-note">${esc(edition.playerSpotlights.find(p=>p.role==='one-to-watch')?.selectionReason??'Selection basis unavailable')}</p><p class="guide-note"><a href="/player/4866">Open player</a> · Dated ${esc(edition.dateLabel)} · College stats in the notebook above.</p></div></div><div>${g?`<h3 class="subhead">Completed Week ${g.previousWeek}: good &amp; rough</h3><p class="small">Synthetic recorded performers · Fantasy points, not current NBA averages.</p><div class="recap-grid">${[['Best of the sample',g.best],['Rough of the sample',g.rough]].map(([label,rows])=>`<div><h3>${label}</h3>${rows.map(p=>`<div class="guide-row"><span>${plink(p)}</span><span class="num">${p.value.toFixed(1)}<small>FP · ${p.games} GP</small></span></div>`).join('')}</div>`).join('')}</div><div class="recap-meta"><p>${esc(g.period)}.</p><p>${esc(g.coverage)}</p><p>${esc(inventory.missing.recap)} ${esc(g.recapMessage)}</p></div>`:`<h3 class="subhead">Know the ten teams</h3><p class="lede">Start with the faces of the league below, or inspect every roster in the team register.</p><div class="tool-links"><a href="#faces">League faces</a><a href="#teams">Search all rosters</a><a href="#standings">Current standings</a></div><p class="guide-note">Current figures are synthetic fixture examples. The dated player notebook retains its original periods and selection sources.</p>`}</div></div></section>`;}
function facesMarkup(){return `<section class="section" id="faces" aria-labelledby="faces-title"><div class="section-head"><div class="left"><span class="section-no">05</span><h2 id="faces-title">Faces of the league.</h2></div><p>Each team’s top modeled player · Synthetic FAAB values.</p></div><div class="faces-grid">${faces.map(f=>`<article class="face" data-face="${esc(f.team.id)}">${f.player?portrait(f.player.id,f.player.name):''}<h3>${tlink(f.team)}${f.champion?'<span class="small" style="display:block;color:var(--gh-champion)">2025 champion</span>':''}</h3><p>${f.player?`${plink(f.player)}<span class="num">${money(f.player.value)}</span><span class="small">${esc(f.player.position)} · Modeled FAAB</span>`:'Top player unavailable'}</p></article>`).join('')}</div></section>`;}
function wireMarkup(){return `<section class="section" aria-labelledby="wire-title"><div class="section-head"><div class="left"><span class="section-no">06</span><h2 id="wire-title">Around the league.</h2></div><a href="/intel">All news</a></div><div class="two-col"><div><h3 class="subhead">Edition happenings</h3><p class="small">Dated sample · ${esc(edition.dateLabel)}</p><ul class="wire-list">${edition.happenings.map(h=>`<li><time>${esc(h.dateLabel)}</time><div><h3><a href="${esc(h.href)}">${esc(h.title)}</a></h3><p>${esc(h.text)}</p></div></li>`).join('')}</ul></div><div><h3 class="subhead">${member?'Your team wire':'Recent transactions'}</h3><p class="small">Synthetic ${member?'member news and move':'league move'} samples</p><ul class="wire-list team-wire">${member?summary.news.map(n=>`<li><h3><a href="${esc(n.url)}">${esc(n.headline)}</a></h3><small>${esc(n.outlet.name)} · ${fmtDate(n.publishedAt)}</small></li>`).join(''):''}${(member?summary.moves:home.hub.transactions).map(m=>`<li><h3>${esc(m.summary)}</h3><small>Week ${m.week} · ${fmtDate(m.createdAt)} · ${esc(m.type.replaceAll('_',' '))}. Player legs unavailable in this sample.</small></li>`).join('')}</ul><div class="tool-links"><a href="/transactions">All transactions</a><a href="/trade-analyzer">Trade analyzer</a></div></div></div></section>`;}
function directoryTeam(t){const id=t.identity.id, m=t.currentMatchup,op=m?(m.home.id===id?m.away:m.home):null;return `<article class="directory-team" data-team-id="${esc(id)}"><div class="directory-main"><span class="team-number">${String(id).padStart(2,'0')}</span><div><h3>${tlink(t.identity)}</h3><p>${esc(t.identity.managerName)} · ${t.players.length} roster players${t.previousSeason.finish===1?' · 2025 champion':''}</p></div><div class="opponent">${op?`<span class="small">Week ${m.week} opponent · Incomplete</span><br>${tlink(op)}`:'Current matchup unavailable'}</div><div class="record num">${record(t.currentRecord)}<small>2026 W–L${t.currentRecord.ties?'–T':''}</small></div></div><details class="roster-disclosure"><summary>Roster · ${t.players.length} players</summary><p class="previous">${esc(t.previousSeason.season)}: ${t.previousSeason.wins}–${t.previousSeason.losses} W–L · Finish ${t.previousSeason.finish}. ${esc(t.previousSeason.ownerNote??'')}</p><div class="roster-links">${t.players.map(p=>`<a href="/player/${esc(p.id)}">${esc(p.fullName)}<small>${esc(p.position??'Position unavailable')} · ${esc(p.nbaTeam??'NBA team unavailable')}</small></a>`).join('')}</div><a href="/teams/${esc(id)}#team-roster">Open team roster</a></details>${t.previousSeason.ownerNote?`<p class="previous" style="margin-left:65px">2025 record ${t.previousSeason.wins}–${t.previousSeason.losses}: ${esc(t.previousSeason.ownerNote)}</p>`:''}</article>`;}
function directoryMarkup(){return `<section class="section" id="teams" aria-labelledby="teams-title"><div class="section-head"><div class="left"><span class="section-no">07</span><h2 id="teams-title">The team register.</h2></div><a href="/teams">Team profiles</a></div><div class="toolbar"><div class="field"><label for="team-search">SEARCH TEAM, MANAGER OR PLAYER</label><input id="team-search" type="search" placeholder="Find a name…" autocomplete="off"></div><div class="field"><label for="team-sort">SORT TEAMS</label><select id="team-sort"><option value="roster">Roster number</option><option value="name">Team name A–Z</option><option value="points">Season points, high first</option></select></div><button id="clear-search" type="button">Clear search</button></div><p class="result-count" role="status" id="team-count">10 of 10 teams · ${teams.reduce((n,t)=>n+t.players.length,0)} roster references</p><div id="directory-list">${teams.map(directoryTeam).join('')}</div><p id="no-results" class="empty-search" hidden>No teams match. Try another team, manager or player name.</p></section>`;}
function standingsMarkup(){return `<section class="section" id="standings" aria-labelledby="standings-title"><div class="section-head"><div class="left"><span class="section-no">08</span><h2 id="standings-title">League facts.</h2></div><p>2026 season · Current records and points are synthetic.</p></div><div class="two-col"><div class="table-wrap"><h3 class="subhead" id="standings-table-title">Standings</h3><div class="stand-sort"><label for="standings-sort">Sort standings</label><select id="standings-sort"><option value="rank">Rank, first to last</option><option value="points">Points for, high first</option><option value="name">Team name A–Z</option><option value="wins">Wins, high first</option></select></div><table aria-labelledby="standings-table-title"><thead><tr><th scope="col">Rank</th><th scope="col">Team</th><th scope="col">W</th><th scope="col">L</th><th scope="col">PF</th></tr></thead><tbody id="standings-body"></tbody></table><p class="guide-note">PF = source pointsFor ÷ 100 · Season fantasy points. All ten teams retained. Checked ${fmtTime(home.checkedAt)}.</p></div><div><h3 class="subhead">Evidence desk</h3><dl class="status-list"><div><dt>Lineup Power · Unavailable</dt><dd>${esc(inventory.missing.power)}</dd></div><div><dt>League superlatives · Unavailable</dt><dd>Points-for leader, points-against leader, longest win streak, most active manager, biggest blowout and closest game have no connected producer records.</dd></div><div><dt>Recorded value history · Unavailable</dt><dd>${esc(inventory.missing.history)}</dd></div></dl><h3 class="subhead" style="margin-top:28px">Latest sample moves</h3><ul class="wire-list team-wire">${home.hub.transactions.map(m=>`<li><h3>${esc(m.summary)}</h3><small>Week ${m.week} · ${fmtDate(m.createdAt)} · Synthetic transaction.</small></li>`).join('')}</ul><div class="tool-links"><a href="/transactions">Transaction log</a><a href="/stocks">Stocks &amp; market</a><a href="/trade-analyzer">Analyze a trade</a></div></div></div></section>`;}
function bottomMarkup(){return `<section class="section" aria-labelledby="offcourt-title"><div class="section-head"><div class="left"><span class="section-no">09</span><h2 id="offcourt-title">Between weeks.</h2></div></div><div class="bottom-grid"><div><h3 class="subhead">The weekly archive</h3>${archive.map(e=>`<a class="archive-row" href="/weekly/${esc(e.id)}"><span class="num">${esc(e.dateLabel)}</span><strong>${esc(e.title)}</strong><span>Draft sample edition · ${esc(e.id)}</span></a>`).join('')}<div class="tool-links"><a href="/weekly">All editions</a><a href="/history">League history</a></div></div><div><h3 class="subhead">A few at the line.</h3><p class="muted">Free-throw practice. A real court to play between league checks.</p><a href="/arcade/free-throw" aria-label="Play free-throw practice"><img class="arcade-preview" src="${esc(inventory.assets.game)}" alt="Free-throw practice game court preview" loading="lazy" onerror="this.hidden=true"></a><div class="tool-links"><a class="action" href="/arcade/free-throw">Play free-throw practice</a><a href="/arcade">Visit the Arcade</a></div><p class="guide-note">Keyboard: A/D or arrows to aim. Hold Space and release to shoot. Play opens the application route; this static mock does not run the game.</p></div></div></section><section class="section" aria-labelledby="sources-title"><div class="section-head"><div class="left"><span class="section-no">10</span><h2 id="sources-title">The source record.</h2></div></div><p class="muted" style="max-width:780px">Offline fixture benchmark ${esc(inventory.benchmark.slice(0,7))}. Dated approved identities, local portraits and editorial are preserved. All current records, scores, prices, form, news and AI are synthetic. Sources below support the dated edition; they do not verify this fixture’s current numbers.</p><div class="source-list">${edition.sources.map(s=>`<a href="${esc(s.url)}">${esc(s.label)}<br><span class="muted">Checked ${esc(s.checkedAt)}</span></a>`).join('')}</div></section>`;}
const heroTeam=(t,score)=>`<div class="team-score"><div><h2>${tlink(t)}</h2><p class="team-meta">${esc(t.managerName)} · ${record(t)} W–L</p></div><div class="score ${score==null?'pending':''}">${score==null?'Pending':Number(score).toFixed(1)}<small>${score==null?'Score unavailable':'Current score'}</small></div></div>`;
document.querySelector('#app').innerHTML=`<header class="site-header"><div class="wrap"><div class="masthead"><a class="brand" href="/" aria-label="GOAT Hoopers home"><img src="${esc(inventory.assets.logo)}" alt="GOAT Hoopers" width="213" height="40"></a><p class="head-note"><strong>THE LEAGUE REGISTER</strong><br><span class="issue">2026 SEASON / </span>${member?'MEMBER PREVIEW':'PUBLIC PREVIEW'}</p></div><nav class="nav" aria-label="League destinations">${navLinks}</nav><details class="mobile-nav"><summary>League menu</summary><nav aria-label="League destinations">${navLinks}</nav></details><div class="fixture"><strong>OFFLINE DESIGN FIXTURE</strong><span>Current records, scores, prices, form, news &amp; AI are synthetic. Dated league identities and editorial preserved.</span></div></div></header><main class="wrap" id="main" tabindex="-1"><div class="topline"><p class="eyebrow muted">GOAT Hoopers / 10 teams</p><nav class="compare" aria-label="Compare preview modes"><a href="?view=public${aiState!=='ready'?'&ai='+esc(aiState):''}" ${!member?'aria-current="page"':''}>Public view</a><a href="?view=member${aiState!=='ready'?'&ai='+esc(aiState):''}" ${member?'aria-current="page"':''}>Member view</a></nav></div><section aria-labelledby="week-title"><div class="hero-grid"><div class="hero-match"><div class="week-line"><h1 id="week-title">Week ${String(currentWeek).padStart(2,'0')}.</h1><p class="eyebrow muted">2026 season<br> · In progress</p></div><div class="match-label"><span>${member?'YOUR MATCHUP':'FEATURED MATCHUP'}</span><strong>Incomplete scoring</strong></div>${heroTeam(pair.home,pair.homePoints)}${heroTeam(pair.away,pair.awayPoints)}<div class="match-actions"><a href="/teams/${esc(pair.home.id)}#team-roster">${member?'View your roster':'View home roster'}</a><a href="/teams/${esc(pair.away.id)}">Scout opponent</a><a href="#ai">Saved AI picks</a></div></div><figure class="hero-court"><div class="court"><span class="court-fallback">The GOAT home court</span><img src="${esc(inventory.assets.court)}" alt="The GOAT Hoopers basketball arena and home court" width="1600" height="900" onerror="this.hidden=true"></div><figcaption><span>Our court. Our league.</span><span class="num">2026 / W${String(currentWeek).padStart(2,'0')}</span></figcaption></figure></div><div class="edition-note"><strong>Stale sample edition · ${esc(edition.dateLabel)}</strong> · ${esc(edition.title)}. Draft editorial ended ${fmtDate(edition.endsAt)}; it does not describe this current matchup.<details><summary>Read dated feature context and selection basis</summary><p>${esc(edition.game.title)}</p><p>${esc(edition.game.context)}</p><p>${esc(edition.game.selectionReason)}</p><p>Original Week ${edition.game.leagueWeek} editorial; current featured pairing is taken from the directory. Edition ${esc(edition.id)} was not published.</p></details></div>${personalMarkup()}</section><section class="section" id="ai" aria-labelledby="ai-title"><div class="section-head"><div class="left"><span class="section-no">01</span><h2 id="ai-title"><a href="/ai-decides" style="font:inherit;min-height:0;text-decoration:none">AI Decides.</a></h2></div><a href="/ai-decides">Open the playground</a></div>${aiMarkup()}</section>${valuationMarkup()}${editorialMarkup()}${scoutMarkup()}${facesMarkup()}${wireMarkup()}${directoryMarkup()}${standingsMarkup()}${bottomMarkup()}</main><footer class="footer"><div class="wrap"><div class="footer-top"><img class="footer-logo" src="${esc(inventory.assets.logo)}" alt="GOAT Hoopers" loading="lazy"><p>A working reference for ten friends and one basketball league. This is a static, offline design preview, with no authentication, saving or live data calls. Route links point to the application’s real destinations; this review server only serves static files.</p></div><nav class="tool-links" aria-label="Footer destinations">${destinations.map(([n,u])=>`<a href="${u}">${n}</a>`).join('')}${member?'<a href="/team">My team</a><a href="/teams/1#team-roster">View roster</a>':''}</nav><div class="end"><span>GOAT HOOPERS / QUIET LEAGUE INDEX</span><a href="#main">Back to the register</a></div></div></footer>`;
const directory=document.querySelector('#directory-list');
function updateDirectory(){const query=document.querySelector('#team-search').value.trim().toLocaleLowerCase(),sort=document.querySelector('#team-sort').value;const sorted=[...teams].sort((a,b)=>sort==='name'?a.identity.name.localeCompare(b.identity.name):sort==='points'?(b.currentRecord.pointsFor-a.currentRecord.pointsFor)||Number(a.identity.id)-Number(b.identity.id):Number(a.identity.id)-Number(b.identity.id));let count=0;for(const t of sorted){const el=directory.querySelector(`[data-team-id="${t.identity.id}"]`);const haystack=[t.identity.name,t.identity.managerName,...t.players.map(p=>p.fullName)].join(' ').toLocaleLowerCase();const match=!query||haystack.includes(query);el.hidden=!match;if(match)count++;directory.append(el);if(query&&match&&!`${t.identity.name} ${t.identity.managerName}`.toLowerCase().includes(query))el.querySelector('details').open=true;}
document.querySelector('#team-count').textContent=`${count} of ${teams.length} teams${query?' matching “'+document.querySelector('#team-search').value.trim()+'”':' · '+teams.reduce((n,t)=>n+t.players.length,0)+' roster references'}`;document.querySelector('#no-results').hidden=count!==0;}
document.querySelector('#team-search').addEventListener('input',updateDirectory);document.querySelector('#team-sort').addEventListener('change',updateDirectory);document.querySelector('#clear-search').addEventListener('click',()=>{document.querySelector('#team-search').value='';updateDirectory();document.querySelector('#team-search').focus()});
function updateStandings(){const sort=document.querySelector('#standings-sort').value;const sorted=[...home.hub.standings].sort((a,b)=>sort==='name'?a.team.name.localeCompare(b.team.name):sort==='points'?(b.pointsFor-a.pointsFor)||a.rank-b.rank:sort==='wins'?(b.wins-a.wins)||a.rank-b.rank:a.rank-b.rank);document.querySelector('#standings-body').innerHTML=sorted.map(s=>`<tr><td class="num">${s.rank}</td><td>${tlink(s.team)}</td><td class="num">${s.wins}</td><td class="num">${s.losses}</td><td class="num">${(s.pointsFor/100).toFixed(1)}</td></tr>`).join('')}
document.querySelector('#standings-sort').addEventListener('change',updateStandings);updateStandings();document.querySelector('main').dataset.mockReady='20';
</script>
