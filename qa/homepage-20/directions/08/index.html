 details{grid-column:1/-1}.story .stats{gap:18px}.story summary{font-size:14px}.wire{grid-template-columns:1fr;gap:24px}.wire h3,.wire .tiny{grid-column:auto}.wire-item h4{font-size:19px}.member-notebook{grid-template-columns:1fr;gap:30px}.member-notebook h3{font-size:26px}.performer-cols{grid-template-columns:1fr 1fr}.ai-section{padding-top:24px}.ai-intro{display:block}.ai-intro h2{font-size:32px;margin:10px 0}.ai-intro>.action{margin:8px 0 4px}.ai-pair{grid-template-columns:24px minmax(0,1fr);gap:6px 10px;padding:20px 0}.ai-teamline{font-size:15px;gap:12px}.ai-return{grid-column:2;display:block;margin-top:8px}.ai-return strong{display:inline;font-size:14px;margin-left:4px}.ai-return .confidence{margin-top:7px}.ai-pair details{grid-column:2}.ai-pair summary{font-size:14px}.ai-pair details dl{grid-template-columns:70px 1fr}.faces{grid-template-columns:1fr 1fr;gap:24px 20px}.face{display:grid;grid-template-columns:62px 1fr;gap:5px 8px}.face img{grid-row:span 3;height:72px;width:62px}.faces .face-team{font-size:14px}.face .face-player{font-size:12px}.face .face-price{font-size:14px!important}.directory-section{padding-top:24px}.directory-tools{gap:12px}.field.search{flex-basis:100%;min-width:0}.field.sort{flex:1;min-width:0}.field.sort select{width:100%}.directory-tools .clear{padding-inline:16px}.team-row{grid-template-columns:22px minmax(0,1fr);gap:10px 12px}.team-name{font-size:23px}.team-row .current-record{grid-column:2;display:flex;align-items:center;gap:10px;font-size:16px}.record-label{font-family:Inter,sans-serif;font-size:12px}.opponent{grid-column:2;display:block}.opponent .num{padding-top:5px}.team-bottom{margin-left:34px;gap:8px}.roster-list{grid-template-columns:1fr}.roster-list a{min-height:44px;display:flex;align-items:center}.roster-list li{padding:2px 0 8px}.roster summary{font-weight:600}.league-ledger,.tools-archive{grid-template-columns:1fr;gap:40px}.standings th,.standings td{padding:12px 5px}.standings th:nth-child(2){width:58%}.standings td:nth <body>
<a class="skip" href="#main">Skip to content</a>
<header class="site-header" data-site-chrome><div class="wrap"><div class="mast"><a class="brand" href="https://goathoopers.com/" aria-label="GOAT Hoopers home"><img src="/public/courtside/GOAT-HOOPERS-horizontal-black.svg" alt="GOAT Hoopers"></a><div class="header-notes"><span class="kicker">Ten friends.<br>Our league, our gym.</span><div class="mode-links" id="desktop-modes"></div><details class="mobile-menu"><summary>League menu</summary><nav class="mobile-nav" id="mobile-nav" aria-label="League navigation"></nav></details></div></div><div class="nav-line"><nav class="nav" id="desktop-nav" aria-label="League navigation"></nav></div></div></header>
<div class="wrap"><p class="fixture-note"><strong>Offline design fixture.</strong> Current records, scores, prices, form, news and AI are synthetic. Dated approved identities and editorial are preserved; this is not live league data.</p></div>
<main class="wrap" id="main"><p class="page-error">Loading the clubhouse board…</p></main>
<script type="module">
import {inventory,data,mode,aiState,esc,money} from '../../data.js';
const {home,weekly,personal,faces,archive}=data;
const edition=home.edition;
const summary=mode==='member'&&personal.kind==='member'?personal.summary:null;
const teams=home.directory;
const teamById=id=>teams.find(t=>t.identity.id===String(id))?.identity;
const teamName=id=>teamById(id)?.name??`Roster ${id}`;
const playerLink=(id,name)=>`<a href="/player/${esc(id)}">${esc(name)}</a>`;
const teamLink=(id,name)=>`<a href="/teams/${esc(id)}">${esc(name??teamName(id))}</a>`;
const date=(v)=>v?new Intl.DateTimeFormat('en-US',{month:'short',day:'numeric',year:'numeric',timeZone:'UTC'}).format(new Date(v)):'Unavailable';
const stamp=v=>v?`${date(v)} · ${new Date(v).toISOString().slice(11,16)} UTC`:'Unavailable';
const record=t=>`${t.wins}–${t.losses}${t.ties?`–${t.ties}`:''}`;
const score=v=>v===null||v===undefined?'Pending':Number(v).toFixed(1);
const pct=v=>v==null||!Number.isFinite(Number(v))?'Unavailable':`${Math.round(Number(v)*100)}%`;
const portrait=(id,name,cls='',loading='lazy')=>inventory.portraits[id]?`<img class="portrait ${cls}" src="${esc(inventory.portraits[id])}" alt="${esc(name)}" loading="${loading}" data-fallback="${esc(name)}">`:`<span class="broken-label" role="img" aria-label="Portrait unavailable for ${esc(name)}">Portrait unavailable</span>`;
const fixture=summary?.matchup??teams.find(t=>t.currentMatchup)?.currentMatchup;
const navItems=[['Home','#main'],['News','/intel'],['Stocks','/stocks'],['History','/history'],['Arcade','/arcade'],['AI Decides','/ai-decides'],['Teams','#directory'],['Transactions','/transactions'],['Weekly archive','#archive']];
if(summary)navItems.push(['My team','/team']);
const nav=navItems.map(([label,href])=>`<a href="${href}">${label}</a>`).join('');
const modeLinks=`<a href="?view=public${aiState==='ready'?'':`&ai=${esc(aiState)}`}"${mode==='public'?' aria-current="page"':''}>Public</a><a href="?view=member${aiState==='ready'?'':`&ai=${esc(aiState)}`}"${mode==='member'?' aria-current="page"':''}>Member</a>`;
document.querySelector('#desktop-nav').innerHTML=nav;
document.querySelector('#desktop-modes').innerHTML=modeLinks;
document.querySelector('#mobile-nav').innerHTML=nav+`<div class="mode-links">${modeLinks}</div>`;
function fixtureTeam(t,points){return `<div class="match-team"><h2>${teamLink(t.id,t.name)}</h2><p class="small muted">${esc(t.managerName)}<br><span class="num">${record(t)}</span> · 2026 record</p><div class="score ${points==null?'pending':''}">${score(points)}</div><p class="tiny muted">${points==null?'Awaiting score':'Known fantasy points'}</p></div>`}
function memberDesk(){return `<aside class="desk" data-personal aria-labelledby="desk-title"><div class="desk-top"><span class="kicker">Your clipboard</span><a class="small" href="/team">My team</a></div><h2 id="desk-title">${esc(summary.team.name)}</h2><p class="desk-meta muted">${esc(summary.team.managerName)} · ${summary.coverage.roster} players<br><span class="num">${summary.standing.rank} / ${teams.length}</span> in the synthetic standings</p><div class="desk-actions"><a class="action" href="/teams/${esc(summary.team.id)}#team-roster">View roster</a><a class="action quiet" href="#scouting">Scouting notebook</a></div><div class="valuation"><p class="kicker">Modeled roster value · FAAB dollars</p><p class="value-total">${money(summary.valuation.total)}</p><p class="small muted">${summary.valuation.priced} priced · ${summary.valuation.unpriced} unpriced · ${summary.coverage.roster} total<br>Value rank ${summary.valuation.rank.rank} of ${summary.valuation.rank.teams}${summary.valuation.rank.tied?' · tied':''}</p><p class="tiny muted" style="margin-top:8px">In-season modeled FAAB prices; synthetic snapshot computed ${stamp(summary.market.updatedAt)}. These are model values, not sale prices.</p><ul class="value-top">${summary.players.map(p=>`<li>${portrait(p.id,p.name)}<span>${playerLink(p.id,p.name)}<br><span class="tiny muted">${esc(p.position)}</span></span><span class="num">${money(p.value)}</span></li>`).join('')}</ul><details class="values-details"><summary>All ${summary.rosterValues.length} roster values</summary><ul class="value-list" data-roster-values>${summary.rosterValues.map(p=>`<li><span>${playerLink(p.id,p.name)} <span class="tiny muted">${esc(p.position)}</span></span><span class="num">${money(p.value)}</span></li>`).join('')}</ul></details><div class="notebook-line"><p class="small muted">Recorded value history unavailable.</p><p class="tiny muted">No recorded snapshots are connected; no trend line is inferred. Team checked ${stamp(summary.checkedAt)}.</p></div></div></aside>`}
function publicDesk(){return `<aside class="desk" aria-labelledby="desk-title"><div class="desk-top"><span class="kicker">League notice</span><span class="tiny muted">Public view</span></div><h2 id="desk-title">Ten teams.<br>Plenty to settle.</h2><p class="public-note">The current board is Week ${fixture.week}. Scores are incomplete. The archived editorial below belongs to an older draft edition.</p><ul class="public-list">${home.hub.standings.slice(0,3).map(s=>`<li><span><span class="num">${s.rank}.</span> ${teamLink(s.team.id,s.team.name)}</span><span class="num">${record(s)}</span></li>`).join('')}</ul><p class="tiny muted">Synthetic standings · ${home.hub.season.seasonYear}</p><div class="desk-actions"><a class="action" href="#directory">Meet all ten teams</a><a class="action quiet" href="#standings">Standings</a></div><div class="notebook-line"><p class="small"><a href="/stocks">Player market</a> · modeled FAAB values</p><p class="small"><a href="/ai-decides">AI Decides</a> · saved model picks</p><p class="small muted">Recorded team-value history unavailable; no recorded snapshots are connected.</p></div></aside>`}
const storyRoles={'player-of-week':'Last season’s standard','underperformer':'The group chat has questions','one-to-watch':'Scouting · dated watch'};
function story(s,i){return `<article class="story ${i===0?'lead-story':''}">${portrait(s.playerId,s.name)}<p class="kicker">${esc(storyRoles[s.role]??s.periodLabel)}</p><h3>${esc(s.headline)}</h3><p class="player-identity small">${playerLink(s.playerId,s.name)} <span class="muted">· ${esc(s.position)}</span><br><span class="tiny muted">${teamLink(s.teamId)} · current ownership</span></p><p class="opinion">${esc(s.opinion)}</p><div class="stats">${s.stats.map(x=>`<span>${esc(x.value)} <span class="tiny muted">${esc(x.label)}</span></span>`).join('')}</div><p class="tiny muted">${esc(s.statPeriod)}</p><details><summary>Selection basis & source</summary><p>${esc(s.selectionReason)}</p><p style="margin-top:10px">${esc(s.periodLabel)} · draft ${esc(edition.dateLabel)}<br><a href="${esc(s.source.url)}">${esc(s.source.label)}</a> · checked ${esc(s.source.checkedAt)}</p></details></article>`}
function memberNotebook(){const g=summary.playerGuide;const performers=(rows)=>`<ul class="performer-list">${rows.map(p=>`<li>${playerLink(p.id,p.name)}<span class="num">${p.value} pts · ${p.games} GP</span></li>`).join('')}</ul>`;return `<section class="section member-notebook" id="scouting" data-personal aria-label="Member scouting notebook"><div><p class="kicker">Your scouting notebook · synthetic form</p><h3 style="margin-top:10px">Keep an eye on these three.</h3><p class="small">${esc(g.watch.label)}</p><ul class="watch-list">${g.watch.rows.map(p=>`<li><span>${playerLink(p.id,p.name)}</span><span class="num">${p.value.toFixed(1)} EMA FP/G</span><span class="watch-meta">${p.games} observed games · ${esc(p.note)}</span></li>`).join('')}</ul><p class="tiny muted">${esc(g.watch.message)} Season ${esc(g.season)}, through current Week ${g.currentWeek}. Form is distinct from the modeled FAAB prices and dated editorial watch.</p><div class="team-wire"><h3>Your team wire</h3><ul>${summary.news.map(n=>`<li><a href="${esc(n.url)}">${esc(n.headline)}</a><br><span class="tiny muted">${esc(n.outlet.name)} · ${date(n.publishedAt)} · synthetic news</span></li>`).join('')}${summary.moves.map(m=>`<li>${esc(m.summary)}<br><span class="tiny muted">${date(m.createdAt)} · Week ${m.week} · sample move; add/drop details unavailable</span></li>`).join('')}</ul></div></div><div><p class="kicker">Completed Week ${g.previousWeek} · synthetic recap</p><h3 style="margin-top:10px">The week in your roster.</h3><p class="tiny muted" style="margin-top:12px">${esc(g.period)}</p><div class="performer-cols"><div><h4>Best in the shown cohort</h4>${performers(g.best)}</div><div><h4>Rough in the shown cohort</h4>${performers(g.rough)}</div></div><p class="small">${esc(inventory.missing.recap)}</p><p class="tiny muted" style="margin-top:10px">${esc(g.coverage)} Current-roster coverage: ${g.eligiblePlayed} verified participants. Lists can overlap. Points are recorded in this fixture, not projected.</p></div></section>`}
function aiRows(){if(!weekly)return `<p class="unavailable state">Unavailable — no saved AI slate is connected.</p><p class="small muted" style="margin-top:12px">Probabilities, returned choice, confidence and model provenance are unavailable.</p>`;return weekly.matchups.map((pair,i)=>{const r=pair.result;const livePair=teams.some(t=>t.currentMatchup&&t.currentMatchup.week===weekly.week&&weekly.season===home.hub.season.seasonYear&&[t.currentMatchup.home.id,t.currentMatchup.away.id].sort().join('|')===[...pair.teamIds].sort().join('|'));const valid=r&&livePair&&pair.status==='ready';const stale=weekly.status==='stale';return `<article class="ai-pair" data-ai-pair="${esc(pair.matchupId)}"><span class="ai-num">0${i+1}</span><div class="ai-teams">${pair.teamIds.map(id=>{const probability=r?.probabilities.find(p=>p.choice===id);return `<p class="ai-teamline"><span>${teamLink(id)}</span><span class="num">${valid&&probability?pct(probability.probability):'Unavailable'}</span></p>`}).join('')}${valid&&!stale?`<div class="prob-bar" aria-hidden="true">${pair.teamIds.map(id=>`<span style="width:${(r.probabilities.find(p=>p.choice===id)?.probability??0)*100}%"></span>`).join('')}</div>`:''}${!livePair?'<p class="state tiny">Unmatched saved pair — unavailable for the current matchup.</p>':''}${stale?'<p class="state small">Stale saved pick · not current</p>':''}</div><div class="ai-return">${valid?`<span>Returned choice</span> <strong>${esc(teamName(r.choice))}</strong><span class="confidence">Confidence ${pct(r.confidence)}<br>Separate model signal</span>`:'<span class="state">Unavailable</span>'}</div><details><summary>Saved pick provenance</summary><dl><dt>State</dt><dd>${stale?'Stale':esc(pair.status)} · ${esc(pair.message)}</dd><dt>Saved</dt><dd>${stamp(weekly.generatedAt)}</dd><dt>Model</dt><dd>${esc(r?.model??'Unavailable')}</dd><dt>Prompt</dt><dd>${esc(r?.promptVersion??'Unavailable')}</dd><dt>Input</dt><dd>${r?.snapshot?'Saved snapshot available':'Snapshot and input timestamp unavailable'}</dd><dt>Returned ID</dt><dd>${esc(r?.choice??'Unavailable')} · ${esc(r?teamName(r.choice):'Unavailable')}</dd><dt>Distribution</dt><dd>${r?.probabilities.map(p=>`${esc(teamName(p.choice))} ${pct(p.probability)}`).join('; ')??'Unavailable'}</dd><dt>Confidence</dt><dd>${r?pct(r.confidence):'Unavailable'} · independent of probabilities</dd></dl><p>${esc(r?.probabilityLabel??'Probability label unavailable')}</p><p>${[...(pair.evidence??[]),...(r?.evidence??[])].map(esc).join(' ')||'Evidence unavailable.'}</p></details></article>`}).join('')}
function directoryTeam(t,i){const id=t.identity.id;const op=t.currentMatchup?(t.currentMatchup.home.id===id?t.currentMatchup.away:t.currentMatchup.home):null;const prev=t.previousSeason;const ownPoints=t.currentMatchup?(t.currentMatchup.home.id===id?t.currentMatchup.homePoints:t.currentMatchup.awayPoints):null;const otherPoints=t.currentMatchup?(t.currentMatchup.home.id===id?t.currentMatchup.awayPoints:t.currentMatchup.homePoints):null;return `<article class="directory-team" data-team-id="${esc(id)}"><div class="team-row"><span class="directory-number">${String(i+1).padStart(2,'0')}</span><div><h3 class="team-name">${teamLink(id,t.identity.name)}</h3><p class="manager">${esc(t.identity.managerName)}</p></div><div class="current-record num">${record(t.currentRecord)}<div class="record-label">2026 record</div></div><div class="opponent">${op?`Week ${t.currentMatchup.week} vs ${teamLink(op.id,op.name)}<span class="num">Team ${score(ownPoints)} · Opp ${score(otherPoints)}<br><span class="tiny muted">Scoring incomplete</span></span>`:'Current opponent unavailable'}</div></div><div class="team-bottom"><p class="previous">${prev?`${esc(prev.season)} · ${prev.wins}–${prev.losses} · finish ${prev.finish}${prev.ownerNote?`<br>${esc(prev.ownerNote)}`:''}`:'Previous season unavailable'}</p><details class="roster"><summary>${t.players.length} players · open roster</summary>${prev?.ownerNote?`<p class="roster-note">Previous-season attribution: ${esc(prev.ownerNote)} The current roster belongs to ${esc(t.identity.managerName)}.</p>`:''}<ul class="roster-list">${t.players.map(p=>`<li>${playerLink(p.id,p.fullName)}<span class="tiny">${esc(p.position??'Position unavailable')} · ${esc(p.nbaTeam??'NBA team unavailable')}</span></li>`).join('')}</ul><a href="/teams/${esc(id)}#team-roster">Full team roster</a></details></div></article>`}
function standingsRows(rows){return rows.map(s=>`<tr><td class="num">${s.rank}</td><td>${teamLink(s.team.id,s.team.name)}</td><td class="num">${s.wins}</td><td class="num">${s.losses}</td><td class="num">${(s.pointsFor/100).toFixed(1)}</td></tr>`).join('')}
const main=document.querySelector('#main');
main.innerHTML=`<div class="board-heading"><h1>Week ${fixture.week} matchup board.</h1><p class="kicker">2026 season · 10 teams<br>Fixture checked ${stamp(home.checkedAt)}</p></div><div class="lead-grid"><section class="feature" aria-labelledby="fixture-heading"><div class="fixture-header"><p class="kicker" id="fixture-heading">01 / ${summary?'Your current matchup':'Featured current matchup'}</p><p class="fixture-status">Week ${fixture.week} · scoring incomplete<br><span class="tiny muted">Synthetic current pairing</span></p></div><div class="match-sides">${fixtureTeam(fixture.home,fixture.homePoints)}${fixtureTeam(fixture.away,fixture.awayPoints)}</div><figure class="court"><img src="${inventory.assets.court}" alt="The GOAT Hoopers arena and basketball court" fetchpriority="high"><figcaption><span>Our home court · original league arena</span><a href="/arcade">Visit the Arcade</a></figcaption></figure><details class="old-edition"><summary><span class="state">Stale draft edition</span> · ${esc(edition.dateLabel)}</summary><p><strong>${esc(edition.title)}</strong> is a dated sample draft. Its opening-week story is separate from the synthetic current Week ${fixture.week} pair shown above. It has not been published; it is not current Week 2 editorial.</p><p><strong>Original dated story: ${esc(edition.game.title)}</strong><br>${esc(edition.game.context)}</p><p class="tiny muted">Selection basis: ${esc(edition.game.selectionReason)} This frozen text describes its old sample period and is separate from the current fixture pairing.</p><p><a href="/weekly/${esc(edition.id)}">Read the dated edition</a>.</p></details></section>${summary?memberDesk():publicDesk()}</div>
<nav class="section-index" aria-label="On this board"><a href="#editorial">The pin-up</a><a href="#saved-picks">Saved picks</a><a href="#faces">League faces</a><a href="#directory">Team directory</a><a href="#standings">Standings</a><a href="#archive">Old editions</a></nav>
<section class="section" id="editorial" aria-labelledby="editorial-title"><div class="section-head"><p class="kicker">02 / The pin-up</p><h2 id="editorial-title">A few things to talk about.</h2><p class="small muted">Dated sample editorial<br>${esc(edition.dateLabel)} · unpublished draft</p></div><div class="editorial-layout"><div class="stories">${edition.playerSpotlights.map(story).join('')}</div><aside class="wire"><h3>From the league wire</h3>${edition.happenings.map(h=>`<article class="wire-item"><p class="kicker">${esc(h.dateLabel)} · dated edition</p><h4><a href="${esc(h.href)}">${esc(h.title)}</a></h4><p>${esc(h.text)}</p></article>`).join('')}<p class="tiny muted">These notices belong to the ${esc(edition.dateLabel)} edition. They do not describe the synthetic Week ${fixture.week} slate. <a href="#sources">Editorial sources</a></p></aside></div></section>
${summary?memberNotebook():''}
<section class="section ai-section" id="saved-picks" aria-labelledby="ai-title"><div class="ai-intro"><p class="kicker">03 / AI Decides</p><h2 id="ai-title">The saved picks.</h2><p><span class="state">${!weekly?'Unavailable':weekly.status==='stale'?'Stale saved slate':'Synthetic saved slate'}</span><br>${weekly?`${weekly.season} · Week ${weekly.week}<br>Saved ${stamp(weekly.generatedAt)}`:'No saved timestamp available'}</p><p>Model probabilities are not calibrated sports odds. The returned choice is shown explicitly; confidence is a separate signal.</p><a href="/ai-decides" class="action quiet">Open AI Decides</a></div><div class="ai-list">${aiRows()}</div></section>
<section class="section faces-section" id="faces" aria-labelledby="faces-title"><div class="section-head"><p class="kicker">04 / Our people</p><h2 id="faces-title">Ten teams, familiar faces.</h2><p class="small muted">Each team’s top modeled player.<br>Prices are synthetic FAAB values.</p></div><div class="faces">${faces.map(f=>`<article class="face" data-face="${esc(f.team.id)}">${portrait(f.player.id,f.player.name)}<h3 class="face-team">${teamLink(f.team.id,f.team.name)}</h3><p class="face-player">${playerLink(f.player.id,f.player.name)}</p><p class="face-price num">${money(f.player.value)}</p></article>`).join('')}</div></section>
<section class="section directory-section" id="directory" aria-labelledby="directory-title"><div class="section-head"><p class="kicker">05 / The roll call</p><h2 id="directory-title">Everybody in the gym.</h2><p class="small muted">All ten managers. Every player.<br>Current 2026 records are synthetic.</p></div><div class="directory-tools"><div class="field search"><label for="team-search">Find a team, manager or player</label><input id="team-search" type="search" placeholder="Try Embiid or NeuralNets" autocomplete="off"></div><div class="field sort"><label for="team-sort">Order teams</label><select id="team-sort"><option value="id">Roster number</option><option value="name">Team name A–Z</option><option value="players">Roster size, largest first</option><option value="pf">Points for, highest first</option></select></div><button class="clear" type="button" id="clear-search">Clear search</button></div><p class="result-count muted" id="directory-count" role="status" aria-live="polite">10 teams</p><div class="directory-list" id="directory-list">${teams.map(directoryTeam).join('')}</div></section>
<section class="section league-ledger" id="standings" aria-labelledby="standings-title"><div class="standings"><p class="kicker">06 / The league ledger</p><h2 id="standings-title" style="margin-top:10px">How the table stands.</h2><p class="small muted" style="margin-top:12px">2026 · all ten teams · synthetic records and PF</p><div class="field"><label for="standings-sort">Sort standings</label><select id="standings-sort"><option value="rank">Rank, first to last</option><option value="name">Team name A–Z</option><option value="pf">Points for, highest first</option><option value="pf-low">Points for, lowest first</option></select></div><table><caption class="sr-only">Synthetic 2026 standings. PF is pointsFor divided by 100.</caption><thead><tr><th scope="col">Rank</th><th scope="col">Team</th><th scope="col">W</th><th scope="col">L</th><th scope="col">PF</th></tr></thead><tbody id="standings-body">${standingsRows(home.hub.standings)}</tbody></table></div><div class="league-admin"><h3>Recent transactions</h3><p class="tiny muted">Synthetic Week ${fixture.week} sample moves</p><ul class="transactions">${home.hub.transactions.map(m=>`<li>${esc(m.summary)}<br><span class="tiny muted">${date(m.createdAt)} · Week ${m.week} · ${esc(m.type)}; add/drop details unavailable</span></li>`).join('')}</ul><a class="action quiet" href="/transactions">All transactions</a><div class="availability"><h3>Still waiting on the source.</h3><p><strong>Lineup Power unavailable.</strong> No producer snapshot is connected in this mock. No rankings are inferred.</p><p><strong>League stats unavailable.</strong> PF leader, points-against leader, longest streak, most active manager, biggest blowout and closest game have no source values.</p><p><a href="/stats">League stats</a> · <a href="/power">Lineup Power</a></p></div></div></section>
<section class="section tools-archive" aria-label="League tools and weekly archive"><div><p class="kicker">07 / After the whistle</p><h2 style="margin-top:10px">A little more court time.</h2><div class="arcade-poster"><a href="/arcade/free-throw" aria-label="Play free-throw practice"><img src="${inventory.assets.game}" alt="Free-throw practice game preview" loading="lazy"></a><div><h3>Free-throw practice</h3><p class="small muted">The playable game in the GOAT Arcade.</p><a href="/arcade/free-throw" class="action">Play free throw</a></div></div><div class="market-links"><a href="/stocks">Stocks & player market</a><a href="/trade-analyzer">Trade analyzer</a><a href="/arcade">All Arcade games</a></div><p class="tiny muted">Market basis: in-season modeled FAAB dollars. This mock shows synthetic prices and does not connect live market data.</p></div><div id="archive"><p class="kicker">08 / Leave it on the board</p><h2 style="margin-top:10px">The old editions.</h2><ul class="archive-list">${archive.map(e=>`<li><p class="kicker">${esc(e.dateLabel)} · ${esc(e.status)} sample</p><h3><a href="/weekly/${esc(e.id)}">${esc(e.title)}</a></h3><p class="tiny muted">${esc(e.id)} · unpublished archive fixture</p></li>`).join('')}</ul><a class="small" href="/weekly">All weekly editions</a><details class="sources" id="sources"><summary>Editorial sources & fixture provenance</summary><p>Approved dated identities and editorial preserved from benchmark ${esc(inventory.benchmark)}. Current records, scores, prices, form, news and saved AI are synthetic. No upstream requests or saves occur in this static concept.</p><ul>${edition.sources.map(s=>`<li><a href="${esc(s.url)}">${esc(s.label)}</a><br>Checked ${esc(s.checkedAt)}</li>`).join('')}</ul></details></div></section>
<footer class="footer"><p><strong>GOAT Hoopers · Clubhouse noticeboard.</strong><br>A static design direction for ten friends. Public and member views share league information; the member clipboard uses the supplied personal fixture. Navigation targets the real application routes. Next routing, authentication, live sources and playable-game behavior are outside this static preview.</p><nav class="footer-links" aria-label="Footer"><a href="/teams">Teams</a><a href="/history">History</a><a href="/weekly">Weekly archive</a><a href="#main">Back to the board</a></nav></footer>`;
function renderDirectory(){const query=document.querySelector('#team-search').value.trim().toLocaleLowerCase();const order=document.querySelector('#team-sort').value;const filtered=teams.filter(t=>[t.identity.name,t.identity.managerName,...t.players.map(p=>p.fullName)].join(' ').toLocaleLowerCase().includes(query));filtered.sort((a,b)=>{const tie=Number(a.identity.id)-Number(b.identity.id);if(order==='name')return a.identity.name.localeCompare(b.identity.name)||tie;if(order==='players')return b.players.length-a.players.length||tie;if(order==='pf')return b.currentRecord.pointsFor-a.currentRecord.pointsFor||tie;return tie});document.querySelector('#directory-list').innerHTML=filtered.length?filtered.map(directoryTeam).join(''):'<p class="empty-search">No matching teams or roster players. Clear search to restore all ten.</p>';document.querySelector('#directory-count').textContent=`${filtered.length} of ${teams.length} teams${query?` matching “${document.querySelector('#team-search').value.trim()}”`:''}`}
document.querySelector('#team-search').addEventListener('input',renderDirectory);
document.querySelector('#team-sort').addEventListener('change',renderDirectory);
document.querySelector('#clear-search').addEventListener('click',()=>{document.querySelector('#team-search').value='';renderDirectory();document.querySelector('#team-search').focus()});
document.querySelector('#standings-sort').addEventListener('change',e=>{const order=e.target.value;const rows=[...home.hub.standings].sort((a,b)=>order==='name'?a.team.name.localeCompare(b.team.name)||a.rank-b.rank:order==='pf'?b.pointsFor-a.pointsFor||a.rank-b.rank:order==='pf-low'?a.pointsFor-b.pointsFor||a.rank-b.rank:a.rank-b.rank);document.querySelector('#standings-body').innerHTML=standingsRows(rows)});
document.querySelectorAll('img[data-fallback]').forEach(img=>img.addEventListener('error',()=>{const label=document.createElement('span');label.className='broken-label';label.textContent=`Portrait unavailable · ${img.dataset.fallback}`;img.replaceWith(label)}));
const mobileMenu=document.querySelector('.mobile-menu');mobileMenu.addEventListener('keydown',e=>{if(e.key==='Escape'&&mobileMenu.open){mobileMenu.open=false;mobileMenu.querySelector('summary').focus()}});mobileMenu.querySelectorAll('a').forEach(a=>a.addEventListener('click',()=>{mobileMenu.open=false}));
const measureChrome=()=>document.documentElement.style.setProperty('--chrome-clearance',`${document.querySelector('.site-header').offsetHeight+20}px`);new ResizeObserver(measureChrome).observe(document.querySelector('.site-header'));measureChrome();
main.dataset.mockReady='08';
</script>
</body>
</html>
