<script type="module">
import {inventory,data,mode,aiState,esc,money} from '../../data.js';
const h=data.home, ed=h.edition, personal=mode==='member'?data.personal.summary:null;
const teamMap=new Map(h.directory.map(d=>[d.identity.id,d.identity]));
const teamLink=(t,cls='')=>`<a class="${cls}" href="/teams/${esc(t.id)}">${esc(t.name)}</a>`;
const playerLink=(p,cls='')=>`<a class="${cls}" href="/player/${esc(p.id??p.playerId)}">${esc(p.name??p.fullName)}</a>`;
const date=v=>v==null?'Unavailable':new Date(v).toLocaleString('en-GB',{day:'numeric',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit',timeZone:'UTC'})+' UTC';
const record=t=>`${t.wins}–${t.losses}${t.ties?'–'+t.ties:''}`;
const picture=(p,cls='portrait')=>inventory.portraits[p.id??p.playerId]?`<img class="${cls}" src="${esc(inventory.portraits[p.id??p.playerId])}" alt="" loading="lazy" onerror="this.hidden=true">`:`<span class="fallback" aria-hidden="true">${esc((p.name??p.fullName).split(' ').map(s=>s[0]).slice(0,2).join(''))}</span>`;
const directions=[['Home','#main'],['News','/intel'],['Stocks','/stocks'],['History','/history'],['Arcade','/arcade']];
const tools=[['Teams','/teams'],['Transactions','/transactions'],['Draft','/draft'],['AI Decides','/ai-decides'],['Trade analyzer','/trade-analyzer'],['Weekly archive','/weekly']];
const allLinks=[...directions.map(([a,b])=>[a,b==='#main'?'/':b]),...tools];
const matched=h.directory.find(d=>d.identity.id===(personal?.team.id??ed.game.teamIds[0])&&d.currentMatchup)?.currentMatchup??h.directory.find(d=>d.currentMatchup)?.currentMatchup;
function matchup(m){return ['home','away'].map(side=>{const t=m[side],n=m[side+'Points'];return `<div class="matchteam">${teamLink(t,'teamname')}<p class="manager">${esc(t.managerName)} · ${record(t)}</p><p class="score number ${n==null?'pending':''}">${n==null?'Pending':Number(n).toFixed(1)}</p><p class="meta">${n==null?'Score not supplied':'Known fantasy points'}</p></div>`}).join('')}
function desk(){if(!personal)return `<aside class="desk"><p class="eyebrow">The league desk · Public edition</p><h2>Ten teams.<br>One place to look.</h2><p class="quiet">Current fixture pairings, every roster and the saved model slate. Start with a team, then inspect its players.</p><div class="actions"><a class="action primary" href="#directory">Find a team</a><a class="action" href="/teams">Team profiles</a></div><p class="eyebrow">League notebook</p><p class="smalltop quiet">${esc(h.hub.season.seasonYear)} season · ${h.hub.season.totalTeams} teams · ${h.hub.season.playoffTeams} playoff places</p><p class="smalltop quiet">Playoffs begin Week ${h.hub.season.playoffWeekStart}. Current records and standings shown here are synthetic.</p><div class="unavailable"><h3>Modeled market</h3><p class="quiet">Each league face below links a top modeled player and their FAAB value. Value is separate from observed form.</p><a href="#faces" class="textlink">Meet the league</a></div><div class="valuehistory"><p class="meta">Member comparison is a fixture view, not sign-in.</p><a href="?view=member&ai=${esc(aiState)}" class="textlink">See member edition</a></div></aside>`;
const v=personal.valuation;return `<aside class="desk" data-personal><p class="eyebrow">Your desk · Member edition</p><h2>${esc(personal.team.name)}</h2><p class="identity">${esc(personal.team.managerName)} · ${record(personal.team)} · Standing #${personal.standing.rank}</p><div class="actions"><a class="action primary" href="/team">My team</a><a class="action" href="/teams/${esc(personal.team.id)}#team-roster">View roster · ${personal.coverage.roster}</a></div><p class="eyebrow">Your roster value${v.complete?'':' · subtotal'}</p><p class="total number">${money(v.total)}</p><p class="quiet">Modeled FAAB · ${esc(personal.market.pricingBasis)} basis</p><p class="meta smalltop">${v.priced} priced / ${personal.coverage.roster} roster players · ${v.unpriced} unpriced${v.rank?`<br>Value rank #${v.rank.rank} of ${v.rank.teams}`:''}<br>Computed ${date(personal.market.updatedAt)}</p><ul class="topvalues">${personal.players.map(p=>`<li>${playerLink(p)}<span>${money(p.value)}</span></li>`).join('')}</ul><details data-roster-values><summary>All ${personal.rosterValues.length} player values</summary><ul class="valuetable">${personal.rosterValues.map(p=>`<li>${playerLink(p)}<span class="mono">${money(p.value)}</span></li>`).join('')}</ul></details><div class="valuehistory"><p class="meta">${esc(inventory.missing.history)}</p><a href="/stocks" class="textlink">Open the market</a></div></aside>`}
function spotlight(p){return `<article class="story"><p class="eyebrow">${esc(p.periodLabel)} · Sample opinion</p><div class="storyfigure">${picture(p)}<div>${playerLink(p,'playername')}<p class="meta">${esc(p.position)} · ${teamLink(teamMap.get(p.teamId))}</p></div></div><h3>${esc(p.headline)}</h3><p>${esc(p.opinion)}</p><div class="stats">${p.stats.map(s=>`<div><b>${esc(s.value)}</b><span>${esc(s.label)}</span></div>`).join('')}</div><p class="meta">${esc(p.statPeriod)}</p><details class="provenance"><summary>Selection & source</summary><p>${esc(p.selectionReason)}</p><p><a href="${esc(p.source.url)}">${esc(p.source.label)}</a> · checked ${esc(p.source.checkedAt)}</p><p class="meta">Edition ${esc(ed.dateLabel)} · Draft / dated sample; not a current official award.</p></details></article>`}
function ai(){const w=data.weekly;if(!w)return `<div class="aihead"><h2><a href="/ai-decides">AI Decides</a></h2></div><p class="status smalltop">Unavailable — saved AI slate is missing.</p><p class="quiet smalltop">The five current pairings remain in the team directory. No returned choice or probabilities are available.</p><a href="/ai-decides" class="textlink">Open AI Decides</a>`;
return `<div class="aihead"><h2><a href="/ai-decides">AI Decides</a></h2><span class="eyebrow">Week ${w.week}</span></div><p class="aistatus ${w.status==='stale'?'status':''}">${w.status==='stale'?'STALE — past saved snapshot; not a current prediction.':'Saved synthetic picks · Experimental'}</p><p class="meta">Saved ${date(w.generatedAt)}. Model probabilities are not calibrated sports odds.</p>${w.matchups.map(p=>{const matchedPair=h.directory.some(d=>d.currentMatchup&&[d.currentMatchup.home.id,d.currentMatchup.away.id].join('|')===p.teamIds.join('|'));const valid=matchedPair&&p.status==='ready'&&p.result;return `<article class="airow" data-ai-pair="${esc(p.matchupId)}">${valid?p.teamIds.map(id=>{const t=teamMap.get(id),prob=p.result.probabilities.find(x=>x.choice===id);return `<div class="pairname">${teamLink(t)}<b>${prob?Math.round(prob.probability*100)+'%':'Unavailable'}</b></div>`}).join(''):`<p class="status">${p.teamIds.map(id=>esc(teamMap.get(id)?.name??id)).join(' / ')} · ${matchedPair?'Missing saved result':'Unmatched saved pair'}</p>`}${valid?`<div class="bars" aria-hidden="true">${p.teamIds.map(id=>`<span style="width:${(p.result.probabilities.find(x=>x.choice===id)?.probability??0)*100}%"></span>`).join('')}</div><p class="pick">Returned choice: <strong>${esc(teamMap.get(p.result.choice)?.name??p.result.choice)}</strong></p><p class="meta">Confidence: ${Math.round(p.result.confidence*100)}% · Separate model signal</p>`:''}<details class="provenance"><summary>Saved pick provenance</summary><p>Pair roster IDs: ${p.teamIds.map(esc).join(', ')} · ${esc(p.message)}</p><p>Saved: ${date(w.generatedAt)} · State: ${esc(w.status)} / ${esc(p.status)}</p><p>Model: ${esc(p.result?.model??'Unavailable')} · Prompt: ${esc(p.result?.promptVersion??'Unavailable')}</p><p>Input snapshot: ${p.result?.snapshot?'Available':'Unavailable'} · Slate snapshot: ${w.snapshot?'Available':'Unavailable'} · Baseline: ${p.baseline?'Available':'Unavailable'}</p><p>Evidence: ${p.evidence?.length?p.evidence.map(esc).join(' '):'Unavailable'}</p><p>Returned result evidence: ${p.result?.evidence?.length?p.result.evidence.map(esc).join(' '):'Unavailable'}</p><p class="meta">All choices and probabilities are displayed as returned. Choice is not inferred from probability order or size.</p></details></article>`}).join('')}<a href="/ai-decides" class="textlink">Open the decision playground</a>`}
function notebook(){if(!personal)return `<section class="section" id="notebook"><div class="sectionhead"><h2>Scouting notebook</h2><span class="eyebrow">Price and editorial are separate signals</span></div><div class="notegrid"><article class="notecol"><h3>Faces on the board</h3><p class="quiet">Selected league players by modeled value. These FAAB values are not observed form or a fantasy points projection.</p>${data.faces.slice(0,3).map(f=>`<div class="watchrow">${picture(f.player)}<div>${playerLink(f.player,'name')}<p class="meta">${teamLink(f.team)}</p></div><div class="metric">${money(f.player.value)}<small>Modeled FAAB</small></div></div>`).join('')}</article><article class="notecol"><h3>Editorial watch</h3><p class="quiet">AJ Dybantsa is the dated Oct 5–11 sample one-to-watch. His shown college averages belong to 2025–26 BYU.</p><a href="#editorial" class="textlink">Read the selection and source</a></article><article class="notecol"><h3>Observed form</h3><p class="quiet">A personal observed-form guide is available only in the member fixture. Prices and editorial picks above are distinct evidence.</p><a href="?view=member&ai=${esc(aiState)}#notebook" class="textlink">Compare member notebook</a></article></div></section>`;
const g=personal.playerGuide;const both=new Set(g.best.filter(x=>g.rough.some(y=>x.id===y.id)).map(x=>x.id));const best=g.best.filter(p=>!both.has(p.id)),rough=g.rough.filter(p=>!both.has(p.id));const recap=rows=>rows.map(p=>`<div class="recaprow"><div>${playerLink(p)}<p class="meta">${esc(p.note)}</p></div><div class="metric">${p.value} pts<p class="meta">${p.games} GP</p></div></div>`).join('');
return `<section class="section" id="notebook" data-personal><div class="sectionhead"><h2>Your scouting notebook</h2><span class="eyebrow">Synthetic evidence · ${esc(g.season)} season</span></div><div class="notegrid"><article class="notecol"><h3>Players to watch</h3><p class="quiet">${esc(g.watch.label)}</p>${g.watch.rows.map(p=>`<div class="watchrow">${picture(p)}<div>${playerLink(p,'name')}<p class="meta">${esc(p.note)}</p></div><div class="metric">${p.value}<small>EMA FP/G · ${p.games} games</small></div></div>`).join('')}<p class="meta smalltop">${esc(g.watch.message)}</p><p class="meta smalltop">Observed form above. Your desk lists modeled price; the October edition’s AJ Dybantsa selection is editorial.</p></article><article class="notecol"><h3>Your best</h3><p class="quiet">Completed-week recorded fantasy points</p>${recap(best)}<p class="meta smalltop">${g.best.length} selected of ${g.eligiblePlayed} eligible; shared selection below.</p></article><article class="notecol"><h3>The rough week</h3><p class="quiet">Completed-week recorded fantasy points</p>${recap(rough)}<p class="meta smalltop">${g.rough.length} selected of ${g.eligiblePlayed} eligible; shared selection below.</p></article></div><div class="cohort"><p class="quiet">Shared in both supplied lists — shown once:</p>${recap(g.best.filter(p=>both.has(p.id)))}<p class="meta smalltop">${esc(g.period)} · ${esc(g.coverage)}</p><p class="meta smalltop">${esc(inventory.missing.recap)}</p></div></section>`}
function wire(){return `<section class="section" id="wire"><div class="sectionhead"><h2>Around the league</h2><span class="eyebrow">Dated sample wire · ${esc(ed.dateLabel)}</span></div><div class="wiregrid">${ed.happenings.map(x=>`<article><p class="eyebrow">${esc(x.dateLabel)} · Sample</p><h3><a href="${esc(x.href)}">${esc(x.title)}</a></h3><p>${esc(x.text)}</p></article>`).join('')}</div>${personal?`<div class="teamwire" data-personal><article><h3>Your team news</h3>${personal.news.map(n=>`<p><a href="${esc(n.url)}">${esc(n.headline)}</a><br><span class="meta">${esc(n.outlet.name)} · ${date(n.publishedAt)} · Synthetic</span></p>`).join('')}</article><article><h3>Your recent moves</h3>${personal.moves.map(m=>`<p>${esc(m.summary)}<br><span class="meta">Week ${m.week} · ${date(m.createdAt)} · Synthetic sample</span></p>`).join('')}<a class="textlink" href="/transactions">All transactions</a></article></div>`:''}</section>`}
function faces(){return `<section class="section" id="faces"><div class="sectionhead"><h2>The faces of the league</h2><span class="eyebrow">Top modeled player · Synthetic FAAB</span></div><div class="faces">${data.faces.map(f=>`<article class="face" data-face="${esc(f.team.id)}">${picture(f.player)}<div>${teamLink(f.team,'teamlink')}${playerLink(f.player,'faceplayer')}<p class="quote">${money(f.player.value)}</p></div></article>`).join('')}</div></section>`}
function directory(){return `<section class="section" id="directory"><div class="sectionhead"><h2>Ten teams. Every roster.</h2><a class="textlink" href="/teams">Open team profiles</a></div><p class="quiet">Search teams, managers and all 228 roster players. Current fixture records are separate from the dated previous season.</p><div class="directorytools"><label class="field search">Find a team, manager or player<input type="search" id="teamsearch" placeholder="Try Embiid, NeuralNets, Aedan23" autocomplete="off"></label><label class="field">Order teams<select id="teamsort"><option value="rank">Current standing</option><option value="name">Team name A–Z</option><option value="count">Roster size: most first</option></select></label></div><p class="results" id="resultcount" role="status" aria-live="polite"></p><div id="teamlist"></div></section>`}
function directoryRow(d){const t=d.identity,m=d.currentMatchup,o=m?(m.home.id===t.id?m.away:m.home):null,ps=d.previousSeason;return `<article class="teamrow" data-team-id="${esc(t.id)}"><div>${teamLink(t,'teamlink')}<p class="manager">${esc(t.managerName)}${personal?.team.id===t.id?' · Your team':''}</p><p class="previous">${ps?`${esc(ps.season)}: ${ps.wins}–${ps.losses} · Finish #${ps.finish}${ps.ownerNote?' · Previous manager: '+esc(ps.ownerNote):''}`:'Previous season unavailable'}</p></div><div class="opponent"><p class="eyebrow">Current · Week ${m?.week??'unavailable'}</p>${o?`vs. ${teamLink(o)}`:'Pairing unavailable'}<p class="meta">${m?`${m.homePoints==null?'Pending':m.homePoints.toFixed(1)} / ${m.awayPoints==null?'Pending':m.awayPoints.toFixed(1)} · Incomplete`:'No score supplied'}</p></div><div class="currentrecord"><p class="eyebrow">Record</p><p class="record">${record(d.currentRecord??t)}</p></div><details><summary>View ${d.players.length} roster players</summary><ul class="rosterlist">${d.players.map(p=>`<li>${playerLink(p)}<small>${esc(p.position??'Position unavailable')} · ${esc(p.nbaTeam??'NBA team unavailable')}</small></li>`).join('')}</ul></details></article>`}
function lower(){return `<section class="section" id="standings"><div class="bottomgrid"><div><div class="sectionhead"><h2>Standings</h2><label class="field">Order standings<select id="standingssort"><option value="rank">Rank: first to last</option><option value="reverse">Rank: last to first</option><option value="pf">Points for: most first</option><option value="name">Team name A–Z</option></select></label></div><table><caption>2026 current fixture · All ten teams · PF = source pointsFor ÷ 100.</caption><thead><tr><th scope="col">#</th><th scope="col">Team</th><th scope="col">W</th><th scope="col">L</th><th scope="col">PF</th></tr></thead><tbody id="standingsbody"></tbody></table><div class="unavailable"><h3>League stats · Unavailable</h3><p class="quiet">Points leaders, streaks, activity, blowout and closest-game statistics have no supplied result.</p></div><div class="unavailable"><h3>Lineup Power · Unavailable</h3><p class="quiet">${esc(inventory.missing.power)}</p></div><details class="provenance"><summary>League transactions · ${h.hub.transactions.length} samples</summary>${h.hub.transactions.map(m=>`<p class="smalltop">${esc(m.summary)}<br><span class="meta">${date(m.createdAt)} · Week ${m.week} · Synthetic</span></p>`).join('')}<a href="/transactions" class="textlink">All transactions</a></details></div><aside><div class="sectionhead"><h2>Off the court</h2></div><div class="market"><article><p class="eyebrow">The exchange</p><h3>Stocks</h3><p class="quiet">Inspect modeled FAAB player values and their source context.</p><a class="textlink" href="/stocks">Open market</a></article><article><p class="eyebrow">The negotiation</p><h3>Trade analyzer</h3><p class="quiet">Compare both sides in the existing trade workspace.</p><a class="textlink" href="/trade-analyzer">Analyze a trade</a></article></div><article class="arcade"><a href="/arcade/free-throw" aria-label="Play free-throw practice"><img class="gameimage" src="${esc(inventory.assets.game)}" alt="Free-throw practice court preview" loading="lazy"></a><p class="eyebrow">Arcade · Free-throw practice</p><h3>Take a few shots.</h3><p class="quiet smalltop">The actual game has its own page. This front page uses a still preview.</p><div class="actions"><a class="action primary" href="/arcade/free-throw">Play free throws</a><a class="action" href="/arcade">Visit Arcade</a></div></article></aside></div></section>`}
function archive(){return `<section class="section" id="archive"><div class="sectionhead"><h2>From the weekly archive</h2><a href="/weekly" class="textlink">All editions</a></div><div class="archives">${data.archive.map(e=>`<article class="archive"><p class="eyebrow">${esc(e.dateLabel)} · Draft / sample</p><h3><a href="/weekly/${esc(e.id)}">${esc(e.title)}</a></h3><p>${esc(e.game.note)}</p><a href="/weekly/${esc(e.id)}" class="textlink">Read the ${esc(e.id)} edition</a></article>`).join('')}</div></section>`}
function sources(){return `<section class="section" id="sources"><div class="sectionhead"><h2>Read the fine print.</h2><span class="eyebrow">Source notes</span></div><div class="sourcegrid"><div><p>${esc(inventory.warning)}</p><p class="smalltop">Current fixture data was checked ${date(h.checkedAt)}. The saved AI slate has its own timestamp. The October draft edition is stale relative to this fixture and supplies dated sample opinions, not official Week 2 awards.</p><p class="smalltop">Historical records retain the supplied season and previous-manager attribution. Modeled price, observed form, completed-week totals and editorial opinion are distinct signals.</p><p class="meta smalltop">Benchmark ${esc(inventory.benchmark)} · Standalone static design fixture. Comparison links do not authenticate; route links point to existing product destinations.</p></div><div><p class="eyebrow" style="margin-bottom:12px">Dated editorial references · Checked Oct 8, 2026</p><ul>${ed.sources.map(s=>`<li><a href="${esc(s.url)}">${esc(s.label)}</a><br><span class="meta">Checked ${esc(s.checkedAt)}</span></li>`).join('')}</ul></div></div></section>`}
document.querySelector('#app').innerHTML=`<header><div class="masthead"><a class="brand" href="/" aria-label="GOAT Hoopers home"><img src="${esc(inventory.assets.logo)}" alt="GOAT Hoopers"></a><div class="mastnote"><strong>The Courtside Edition</strong><span class="meta">A fantasy basketball league bulletin</span><div class="comparison"><a href="?view=member&ai=${esc(aiState)}" ${mode==='member'?'aria-current="page"':''}>Member view</a><a href="?view=public&ai=${esc(aiState)}" ${mode==='public'?'aria-current="page"':''}>Public view</a></div></div></div><nav class="mainnav" aria-label="Main navigation">${directions.map(([n,u],i)=>`<a href="${u}" class="${i>2?'desktopnav':''}" ${i===0?'aria-current="page"':''}>${n}</a>`).join('')}<details class="navtools"><summary>League menu</summary><nav class="toolnav" aria-label="League destinations">${[...directions.slice(3),...tools,...(personal?[['My team','/team'],['View roster','/teams/1#team-roster']]:[['Log in','/login']])].map(([n,u])=>`<a href="${u}">${n}</a>`).join('')}</nav></details></nav><p class="fixture"><strong>OFFLINE DESIGN FIXTURE.</strong> Current records, scores, prices, form, news and AI are synthetic. Dated approved identities and editorial are preserved.</p></header><main id="main"><div class="editionline"><span class="eyebrow">2026 season / Week ${matched.week} / ${mode==='member'?'Your front page':'League front page'}</span><span class="meta right">Current fixture checked<br>${date(h.checkedAt)}</span></div><div class="front"><article class="lead"><p class="eyebrow">Featured current matchup · Incomplete scoring</p><h1>Week ${matched.week} is still<br>on the floor.</h1><div class="match">${matchup(matched)}</div><figure><div class="court"><img src="${esc(inventory.assets.court)}" alt="The GOAT Hoopers home court, viewed from the baseline"></div><figcaption class="caption"><p>The current pair comes from the league directory${personal?'; your team is featured':''}. A known zero remains 0.0; the missing away score is pending. This matchup is not final.</p><a class="textlink" href="#directory">Scout the rosters</a></figcaption></figure></article>${desk()}</div><section class="section" id="editorial"><div class="sectionhead"><h2>The October edition</h2><span class="eyebrow">Stale draft · ${esc(ed.dateLabel)} · Dated sample editorial</span></div><div class="newsgrid"><div><p class="quiet" style="margin-bottom:20px">${esc(ed.title)} — three preserved sample opinions. Their original periods and sources follow each selection.</p><div class="stories">${ed.playerSpotlights.map(spotlight).join('')}</div>${notebook()}</div><aside aria-label="All saved AI matchup picks">${ai()}</aside></div></section>${wire()}${faces()}${directory()}${lower()}${archive()}${sources()}</main><footer><div><a class="footbrand" href="/">GOAT HOOPERS.</a><p class="meta smalltop">Ten friends. The weekly bulletin.<br>Courtside Newspaper · Direction 01</p></div><nav class="footlinks" aria-label="Footer navigation">${allLinks.map(([n,u])=>`<a href="${u}">${n}</a>`).join('')}<a href="#sources">Sources & fixture notes</a><a href="#main">Back to top</a></nav></footer>`;
const rank=new Map(h.hub.standings.map(s=>[s.team.id,s.rank]));
function renderDirectory(){const q=document.querySelector('#teamsearch').value.trim().toLocaleLowerCase();const order=document.querySelector('#teamsort').value;const rows=h.directory.filter(d=>[d.identity.name,d.identity.managerName,...d.players.map(p=>p.fullName)].some(v=>v.toLocaleLowerCase().includes(q))).sort((a,b)=>order==='name'?a.identity.name.localeCompare(b.identity.name):order==='count'?b.players.length-a.players.length:rank.get(a.identity.id)-rank.get(b.identity.id));document.querySelector('#teamlist').innerHTML=rows.length?rows.map(directoryRow).join(''):'<p class="quiet">No teams match this search. Try another name.</p>';document.querySelector('#resultcount').textContent=`${rows.length} of 10 teams${q?' match your search':' · 228 roster player references available'}`;if(q)document.querySelectorAll('#teamlist details').forEach(d=>d.open=true)}
function renderStandings(){const o=document.querySelector('#standingssort').value;const rows=[...h.hub.standings].sort((a,b)=>o==='reverse'?b.rank-a.rank:o==='pf'?b.pointsFor-a.pointsFor:o==='name'?a.team.name.localeCompare(b.team.name):a.rank-b.rank);document.querySelector('#standingsbody').innerHTML=rows.map(r=>`<tr class="${personal?.team.id===r.team.id?'viewer':''}"><td>${r.rank}</td><td>${teamLink(r.team)}</td><td>${r.wins}</td><td>${r.losses}</td><td class="mono">${(r.pointsFor/100).toFixed(1)}</td></tr>`).join('')}
document.querySelector('#teamsearch').addEventListener('input',renderDirectory);document.querySelector('#teamsort').addEventListener('change',renderDirectory);document.querySelector('#standingssort').addEventListener('change',renderStandings);document.querySelector('.navtools').addEventListener('keydown',e=>{if(e.key==='Escape'){e.currentTarget.open=false;e.currentTarget.querySelector('summary').focus()}});renderDirectory();renderStandings();document.querySelector('#main').dataset.mockReady='01';
</script></body></html>
