<script type="module">
import {inventory,data,mode,aiState,esc,money} from '../../data.js';
const home=data.home, hub=home.hub, directory=home.directory, personal=data.personal.summary, edition=home.edition;
const team=id=>directory.find(t=>t.identity.id===String(id))?.identity;
const teamLink=t=>`<a href="/teams/${esc(t.id)}">${esc(t.name)}</a>`;
const playerLink=(id,name)=>`<a href="/player/${esc(id)}">${esc(name)}</a>`;
const priceLink=(id,value)=>`<a href="/stocks" title="Open the player market">${esc(money(value))}</a>`;
const date=v=>v==null?'Unavailable':new Date(v).toLocaleString('en-US',{timeZone:'UTC',year:'numeric',month:'short',day:'numeric',hour:'2-digit',minute:'2-digit',hour12:false})+' UTC';
const portrait=(id,name)=>inventory.portraits[id]?`<img class="portrait" src="${esc(inventory.portraits[id])}" alt="${esc(name)}" loading="lazy" width="48" height="48">`:`<span class="portrait" aria-hidden="true"></span>`;
const rank=personal?.standing?.rank;
const match=directory.find(t=>t.identity.id===(personal?.team.id??edition?.game.teamIds[0]??'1'))?.currentMatchup;
const nav=[['Home','/'],['News','/intel'],['Stocks','/stocks'],['History','/history'],['Arcade','/arcade'],['AI Decides','/ai-decides'],['Teams','/teams'],['Transactions','/transactions'],['Weekly archive','/weekly'],['Trade analyzer','/trade-analyzer']];
const section=(id,n,tag,title,intro,body,black=false,attrs='')=>`<section class="sheet ${black?'black':''}" id="${id}" ${attrs}><div class="rail" aria-hidden="true">${n}<small>${tag}</small></div><div class="sheetbody"><div class="sheethead"><h2>${title}</h2>${intro?`<p>${intro}</p>`:''}</div>${body}</div></section>`;
const scores=(p)=>p==null?'<span class="score pending">Pending</span>':`<span class="score">${Number(p).toFixed(1)}</span>`;
function featured(){if(!match)return '<h1>THE LEAGUE.</h1><p>Current matchup unavailable.</p>';return `<div class="eyebrow">2026 season / Current fixture matchup</div><div class="issue-title"><h1>WEEK</h1><span class="weekno">${String(match.week).padStart(2,'0')}</span></div><div class="scoreboard">${[[match.home,match.homePoints,'Home'],[match.away,match.awayPoints,'Away']].map(([t,p,role])=>`<div class="contender"><div class="eyebrow">${role}${personal?.team.id===t.id?' / Your team':''}</div><h2>${teamLink(t)}</h2>${scores(p)}<div class="meta">Manager ${esc(t.managerName)}<br>${t.wins} W / ${t.losses} L${t.ties?` / ${t.ties} T`:''}</div></div>`).join('')}</div><p class="game-state meta">Incomplete matchup. A reported 0.0 is a known score; Pending means no score supplied. These are synthetic scores.</p>`}
function desk(){return personal?`<aside class="desk" data-personal><div class="eyebrow">Your clubhouse / ${esc(personal.team.managerName)}</div><h2>${esc(personal.team.name)}</h2><div class="identity num">${personal.coverage.roster} players / Standing ${rank} of ${hub.teams.length}<br>${personal.team.wins} W / ${personal.team.losses} L</div><div class="actions"><a class="action primary" href="/team">My team</a><a class="action" href="/teams/${esc(personal.team.id)}#team-roster">View roster</a></div><p class="note">Team checked ${date(personal.checkedAt)}. Synthetic member edition.</p>${court()}</aside>`:`<aside class="desk"><div class="eyebrow">Public league edition</div><h2>TEN TEAMS.<br>ONE LEAGUE.</h2><div class="identity num">${hub.season.seasonYear} / ${hub.season.totalTeams} teams<br>${hub.season.playoffTeams} playoff places / Begin Week ${hub.season.playoffWeekStart}</div><div class="actions"><a class="action primary" href="#directory">Find a team</a><a class="action" href="/weekly">Weekly archive</a></div>${court()}</aside>`}
function court(){return `<figure class="court-strip"><img src="${esc(inventory.assets.court)}" alt="The GOAT Hoopers arena" width="112" height="80"><figcaption>The home floor.<br>Approved arena still / monochrome treatment.</figcaption></figure>`}
function radar(){const watch=personal?.playerGuide.watch;const ewatch=edition?.playerSpotlights.find(p=>p.role==='one-to-watch');const otherFace=data.faces.find(f=>f.team.id===match?.away.id)??data.faces[0];return section('radar','01','SCOUTING','ON THE<br>RADAR.', 'Form, modeled price and editorial opinion have distinct bases.',`<div class="columns"><div><h3 class="subhead">${watch?'Your players to watch':'Around the league'}</h3>${watch?`<p>${esc(watch.label)}</p><ol>${watch.rows.map((p,i)=>`<li class="watchrow"><span class="num">${i+1}.</span><div>${playerLink(p.id,p.name)}<div class="meta">${p.games} observed games / ${esc(personal.playerGuide.season)} in-season<br>${esc(p.note)}</div></div><span class="metric">${p.value.toFixed(1)}<br><small>EMA FPTS/GP</small></span></li>`).join('')}</ol><p class="note">${esc(watch.message)}</p>`:`<p>The ${esc(otherFace.team.name)} roster is anchored by ${playerLink(otherFace.player.id,otherFace.player.name)} at ${priceLink(otherFace.player.id,otherFace.player.value)} modeled FAAB. This is a valuation, not observed form.</p><p class="note">Current fixture quote; ${date(home.checkedAt)}. All ten roster anchors are listed in the league value index.</p>`}</div><div><h3 class="subhead">League context / Model value</h3><p>${teamLink(otherFace.team)} · ${playerLink(otherFace.player.id,otherFace.player.name)} · ${priceLink(otherFace.player.id,otherFace.player.value)} modeled FAAB.</p><p class="note">Synthetic in-season model quote. No performance claim follows from price.</p>${ewatch?`<div class="editorial-watch"><div class="eyebrow">Dated editorial / ${esc(edition.dateLabel)}</div><h3>${playerLink(ewatch.playerId,ewatch.name)}</h3><p>${esc(ewatch.headline)} ${esc(ewatch.opinion)}</p><p class="note">${esc(ewatch.periodLabel)}. Source statistics and selection reasoning appear in the dated edition below.</p></div>`:''}</div></div>`,false,personal?'data-personal':'')}
function valuation(){if(!personal)return '';let v=personal.valuation;return section('value','02','TEAM VALUE','THE<br>LEDGER.', 'Your current modeled roster value. FAAB units; a model quote, not a cash balance.',`<div class="ledger"><div><div class="eyebrow">${v.complete?'Complete modeled total':'Partial modeled subtotal'}</div><div class="total">${money(v.total)}</div><p class="num">${v.priced} priced / ${v.unpriced} unpriced / ${personal.coverage.roster} rostered</p><p class="note">Basis: ${esc(personal.market.pricingBasis)}.<br>Computed ${date(personal.market.updatedAt)}.</p><p class="history-note meta">${esc(inventory.missing.history)}</p></div><div><h3 class="subhead">Highest modeled FAAB value</h3><div class="topvalues">${personal.players.map(p=>`<div class="playerrow">${portrait(p.id,p.name)}<div><div class="name">${playerLink(p.id,p.name)}</div><span class="meta">${esc(p.position)} / modeled FAAB</span></div><span class="num">${priceLink(p.id,p.value)}</span></div>`).join('')}</div></div></div><details><summary>All ${personal.rosterValues.length} player values and coverage</summary><ul class="value-list" data-roster-values>${personal.rosterValues.map(p=>`<li><span>${playerLink(p.id,p.name)}<small> / ${esc(p.position)}</small></span><span class="num">${priceLink(p.id,p.value)}</span></li>`).join('')}</ul><p class="note">${v.priced} of ${personal.coverage.roster} roster references have a price; ${v.unpriced} are unpriced. A missing quote remains Unpriced. Quotes use the in-season model at the computation time above. Historical team valuation is unavailable.</p></details>`,true,'data-personal')}
function form(){if(!personal)return '';const g=personal.playerGuide;const unique=[...new Map([...g.best,...g.rough].map(p=>[p.id,p])).values()];return section('form','03','TEAM FORM','LAST<br>WEEK.', 'Completed-week fixture / synthetic recorded performers. These are not current official Week 2 awards.',`<div class="columns equal"><div><h3 class="subhead">Your best / The rough week</h3><p class="meta">${esc(g.period)}</p><ul class="guide-list">${unique.map(p=>`<li><div>${playerLink(p.id,p.name)}<div class="guide-tags">${[g.best.some(x=>x.id===p.id)?'Best selection':'',g.rough.some(x=>x.id===p.id)?'Rough selection':''].filter(Boolean).join(' / ')}</div></div><div class="num">${p.value.toFixed(1)} FPTS / ${p.games} GP</div></li>`).join('')}</ul><p class="note">Showing ${unique.length} / ${g.eligiblePlayed} eligible players. Overlapping selections appear once. ${esc(g.recapMessage)} ${esc(g.coverage)}</p></div><div><h3 class="subhead">Your team wire</h3><ul class="wire">${personal.news.map(n=>`<li><a href="${esc(n.url)}">${esc(n.headline)}</a><span class="meta">${esc(n.outlet.name)} / ${date(n.publishedAt)}</span></li>`).join('')}</ul><h3 class="subhead" style="margin-top:1.5rem">Your recent moves</h3><ul class="wire">${personal.moves.map(m=>`<li><p>${esc(m.summary)}</p><span class="meta">${esc(m.type)} / Week ${m.week}<br>${date(m.createdAt)}</span><a href="/transactions">View transactions</a></li>`).join('')}</ul></div></div>`,false,'data-personal')}
function decisions(){const w=data.weekly;const pairs=[...new Map(directory.filter(t=>t.currentMatchup).map(t=>{const m=t.currentMatchup;return [[m.home.id,m.away.id].join(':'),m]})).values()];return section('ai','04','MODEL OUTPUT','SAVED<br>DECISIONS.', 'Experimental saved model output. Returned choice and confidence are independent of the displayed probability distribution.',`${w?`<p class="meta">Season ${esc(w.season)} / Week ${w.week} / ${esc(w.message)}<br>Saved ${date(w.generatedAt)}.</p>${w.status==='stale'?'<p class="stale">STALE / Saved output is out of date</p>':''}`:'<p class="stale">Unavailable / No saved AI output</p>'}<div>${pairs.map((m,i)=>{const saved=w?.matchups.find(s=>s.teamIds[0]===m.home.id&&s.teamIds[1]===m.away.id&&w.week===m.week&&w.season===hub.season.seasonYear&&w.leagueId===inventory.member.weekly.leagueId);const r=saved?.result;const ok=r&&saved.status==='ready'&&saved.teamIds.includes(r.choice)&&r.probabilities.length===2&&r.probabilities.every(p=>saved.teamIds.includes(p.choice));return `<article class="airow" ${ok?`data-ai-pair="${esc(saved.matchupId)}"`:''}><div class="aiindex">${String(i+1).padStart(2,'0')}</div><div>${[m.home,m.away].map(t=>{const p=ok?r.probabilities.find(p=>p.choice===t.id):null;return `<div class="probline">${teamLink(t)}<b>${p?Math.round(p.probability*100)+'%':'—'}</b></div>`}).join('')}<p class="meta">Week ${m.week} / ${ok?esc(r.probabilityLabel):'Model probabilities unavailable'}</p></div><div class="aichoice">${ok?`<div class="eyebrow">${w.status==='stale'?'Stale saved choice':'Actual returned choice'}</div><strong>${esc(team(r.choice)?.name??r.choice)}</strong><p class="num">Confidence ${Math.round(r.confidence*100)}%</p><p class="meta">Saved ${date(w.generatedAt)}</p>`:`<strong>Unavailable</strong><p class="meta">${w?'No saved output matches this current week and ordered team pair.':'Current pairing retained; no saved result supplied.'}</p>`}</div>${ok?`<details class="aiproof"><summary>Saved model, prompt and input provenance</summary><dl class="proofgrid"><dt>Model</dt><dd>${esc(r.model)}</dd><dt>Prompt version</dt><dd>${esc(r.promptVersion)}</dd><dt>Returned choice ID</dt><dd>${esc(r.choice)} / ${esc(team(r.choice)?.name)}</dd><dt>Ordered roster IDs</dt><dd>${saved.teamIds.map(esc).join(' / ')}</dd><dt>League / season / week</dt><dd>${esc(w.leagueId)} / ${esc(w.season)} / ${w.week}</dd><dt>Generated</dt><dd>${date(w.generatedAt)}</dd><dt>Input snapshot</dt><dd>${r.snapshot||w.snapshot?esc(JSON.stringify(r.snapshot??w.snapshot)):'Unavailable; fixture carries no input snapshot or input timestamp.'}</dd><dt>Input evidence</dt><dd>${saved.evidence.map(esc).join(' ')||'Unavailable'}</dd><dt>Result evidence</dt><dd>${r.evidence.map(esc).join(' ')||'None supplied'}</dd><dt>Baseline</dt><dd>${saved.baseline?esc(JSON.stringify(saved.baseline)):'Unavailable'}</dd><dt>Status</dt><dd>${w.status==='stale'?'Stale saved output':esc(saved.status)}. ${esc(saved.message)}</dd></dl></details>`:''}</article>`}).join('')}</div><div class="actions" style="margin-top:1.5rem"><a class="action" href="/ai-decides">Open AI Decides</a></div>`,true)}
function editorial(){if(!edition)return section('edition','05','WEEKLY FILE','EDITION<br>UNAVAILABLE.','No dated edition is available.','<a class="action" href="/weekly">Browse the archive</a>');return section('edition','05','DATED EDITION','FROM<br>THE FILE.', 'Dated sample editorial; separate from the current fixture matchup and official weekly results.',`<div class="edition-title"><div><p class="eyebrow">${esc(edition.dateLabel)} / ${esc(edition.status)}</p><h3>${esc(edition.title)}</h3><a href="/weekly/${esc(edition.id)}">Open this dated edition</a></div><div><p>${esc(edition.game.title)}</p><details><summary>Opening-edition context and selection</summary><p>${esc(edition.game.context)}</p><p class="note">${esc(edition.game.selectionReason)} Dated edition Week ${edition.game.leagueWeek}; not the current Week ${match?.week??'unavailable'} pairing.</p></details></div></div>${edition.playerSpotlights.map(s=>`<article class="story">${portrait(s.playerId,s.name)}<div><p class="eyebrow">${esc(s.role.replaceAll('-',' '))} / Editorial opinion</p><h3>${playerLink(s.playerId,s.name)}</h3><p class="opinion">${esc(s.headline)} ${esc(s.opinion)}</p><p class="meta">${esc(s.periodLabel)} / ${teamLink(team(s.teamId))}</p></div><div class="storymeasure"><ul class="stats">${s.stats.map(st=>`<li><strong>${esc(st.value)}</strong>${esc(st.label)}</li>`).join('')}</ul><p class="meta">${esc(s.statPeriod)}</p><p class="note"><a href="${esc(s.source.url)}">${esc(s.source.label)}</a><br>Checked ${esc(s.source.checkedAt)}</p></div><details><summary>Why this player / selection and source</summary><p>${esc(s.selectionReason)}</p></details></article>`).join('')}<div class="columns equal" style="margin-top:1.5rem"><div><h3 class="subhead">League happenings / Dated file</h3><ul class="happenings">${edition.happenings.map(h=>`<li><div class="meta">${esc(h.dateLabel)} / ${esc(edition.dateLabel)}</div><h4><a href="${esc(h.href)}">${esc(h.title)}</a></h4><p>${esc(h.text)}</p></li>`).join('')}</ul></div><div><h3 class="subhead">Edition sources</h3><ul class="source-links">${edition.sources.map(s=>`<li><a href="${esc(s.url)}">${esc(s.label)}</a><br><span class="meta">Checked ${esc(s.checkedAt)}</span></li>`).join('')}</ul></div></div>`)}
function faces(){return section('faces','06','LEAGUE VALUE INDEX','ROSTER<br>ANCHORS.', 'Each team’s highest modeled player value. Synthetic FAAB quotes, not awards or a performance ranking.',`<div class="faces">${data.faces.map(f=>`<article class="face" data-face="${esc(f.team.id)}">${portrait(f.player.id,f.player.name)}<div><h3>${playerLink(f.player.id,f.player.name)}</h3><span class="teamlink">${teamLink(f.team)}</span><span class="meta">${esc(f.player.position)} / top modeled FAAB value</span></div><div class="quote">${priceLink(f.player.id,f.player.value)}</div></article>`).join('')}</div><p class="note">Current fixture quotes / ${date(home.checkedAt)}. Open a player’s profile or modeled price to inspect them.</p>`,true)}
function directorySection(){return section('directory','07','FULL DIRECTORY','EVERY<br>ROSTER.', 'Ten teams. All 228 roster references. Search team names, managers or players; expand for positions and NBA teams.',`<div class="controls"><label for="team-search">Find a team, manager or player<input id="team-search" type="search" autocomplete="off" placeholder="Name or manager"></label><label for="team-sort">Order teams<select id="team-sort"><option value="rank">Standing rank</option><option value="name">Team name A–Z</option><option value="players">Roster size, most first</option><option value="pf">Points for, high first</option></select></label><button id="clear-search" type="button">Clear search</button></div><p id="team-count" class="result" aria-live="polite"></p><div id="team-list"></div><p class="note">Current records and opponents are synthetic. Prior-season records retain their dated franchise and previous-manager attribution.</p>`)}
function teamMarkup(d){let t=d.identity,m=d.currentMatchup,opp=m?(m.home.id===t.id?m.away:m.home):null;const p=d.previousSeason;return `<article class="team" data-team-id="${esc(t.id)}"><div class="teamline"><span class="teamnumber">${String(t.id).padStart(2,'0')}</span><div><h3>${teamLink(t)}</h3><span class="meta">Manager ${esc(t.managerName)}${personal?.team.id===t.id?' / YOUR TEAM':''}</span></div><div class="teamrecord num">${d.currentRecord.wins} W / ${d.currentRecord.losses} L<br><small>2026 / ${d.players.length} players</small></div><p class="opponent meta">${opp?`Week ${m.week} opponent<br>${teamLink(opp)}<br>Incomplete`:'Current opponent unavailable'}</p></div><details><summary>Full ${d.players.length}-player roster</summary>${p?`<p class="previous">${esc(p.season)}: ${p.wins} W / ${p.losses} L / Finish ${p.finish}.${p.ownerNote?` <strong>Previous manager:</strong> ${esc(p.ownerNote)}`:''}</p>`:''}<ul class="roster">${d.players.map(p=>`<li>${playerLink(p.id,p.fullName)}<small>${esc(p.position)} / ${esc(p.nbaTeam??'NBA team unavailable')}</small></li>`).join('')}</ul></details></article>`}
function standings(){return section('standings','08','LEAGUE TABLE','THE<br>STANDINGS.', '2026 current fixture / All ten teams. PF means fantasy points for; source points are divided by 100.',`<div class="controls"><label for="standing-sort">Order standings<select id="standing-sort"><option value="rank">Rank, first to last</option><option value="wins">Wins, most first</option><option value="losses">Losses, most first</option><option value="pf">Points for, high first</option><option value="name">Team name A–Z</option></select></label></div><ol id="standing-list" aria-label="League standings"></ol><div class="empty-stats"><div><h3 class="subhead">League statistics</h3><p class="meta">Points for leader, points against leader, longest win streak, most active manager, biggest blowout and closest game: Unavailable. The fixture contains no league-stat producer output.</p></div><div><h3 class="subhead">Lineup Power</h3><p class="meta">${esc(inventory.missing.power)}</p></div></div><h3 class="subhead" style="margin-top:1.5rem">Recent transactions / Synthetic</h3><ul class="wire">${hub.transactions.map(t=>`<li><p>${esc(t.summary)}</p><span class="meta">Week ${t.week} / ${esc(t.type)} / ${date(t.createdAt)}</span></li>`).join('')}</ul><a class="action" style="margin-top:1rem" href="/transactions">All transactions</a>`,true)}
function tools(){return section('tools','09','LEAGUE TOOLS','KEEP<br>PLAYING.', '',`<article class="tool"><span class="num">01</span><h3>THE<br>MARKET.</h3><div class="toolbody"><p>Inspect modeled player prices and the evidence behind them. Current quotes and recorded history have distinct meanings.</p><a class="action" href="/stocks">Open Stocks</a></div></article><article class="tool"><span class="num">02</span><h3>THE<br>TRADE.</h3><div class="toolbody"><p>Compare the players on both sides with the existing trade analyzer.</p><a class="action" href="/trade-analyzer">Analyze a trade</a></div></article><article class="tool"><span class="num">03</span><div><h3>FREE<br>THROW.</h3><a class="action" href="/arcade/free-throw">Play free-throw practice</a><p class="note"><a href="/arcade">Browse Arcade</a> / Practice game. No reward or ranking claim.</p></div><div class="toolbody"><img class="gamepreview" src="${esc(inventory.assets.game)}" alt="Preview of the playable free-throw basketball court" loading="lazy" width="640" height="360"></div></article>`)}
function archives(){return section('archive','10','WEEKLY ARCHIVE','ON THE<br>RECORD.', 'The dated files remain available as the league moves on.',`<ol class="archive">${data.archive.map(e=>`<li><div class="eyebrow">${esc(e.dateLabel)}</div><a href="/weekly/${esc(e.id)}">${esc(e.title)}</a><span class="meta">${esc(e.status)}<br>${esc(e.id)}</span></li>`).join('')}</ol><a class="action" href="/weekly">All weekly editions</a>`)}
document.querySelector('#app').innerHTML=`<header><div class="mast"><a class="brand" href="/" aria-label="GOAT Hoopers home"><img src="${esc(inventory.assets.logo)}" alt="GOAT Hoopers" width="240" height="58"></a><div class="mastlinks"><a class="home-shortcut" href="/" aria-current="page">Home</a><a href="/stocks">Stocks</a><details id="navigation"><summary>Menu</summary><nav aria-label="Main navigation">${nav.map(([label,href])=>`<a class="navlink" href="${href}" ${href==='/'?'aria-current="page"':''}>${label}</a>`).join('')}${personal?'<a class="navlink" href="/team">My team</a>':''}</nav></details></div></div><div class="statusline"><span class="eyebrow">Offline synthetic fixture / Raw Monochrome 02</span><div class="compare"><a href="?view=member${aiState!=='ready'?'&ai='+esc(aiState):''}" ${mode==='member'?'aria-current="page"':''}>Member view</a><a href="?view=public${aiState!=='ready'?'&ai='+esc(aiState):''}" ${mode==='public'?'aria-current="page"':''}>Public view</a></div></div></header><main id="main"><section class="hero black"><div class="herogrid"><div>${featured()}</div>${desk()}</div></section><nav class="jumpbar" aria-label="Homepage sections"><a href="#radar">Scouting</a>${personal?'<a href="#value">Your value</a>':''}<a href="#ai">Saved AI</a><a href="#directory">Team directory</a><a href="#standings">Standings</a><a href="#archive">Archive</a></nav>${radar()}${valuation()}${form()}${decisions()}${editorial()}${faces()}${directorySection()}${standings()}${tools()}${archives()}</main><footer class="black"><div class="footer-mark">GOAT<br>HOOPERS.</div><div><p>${esc(inventory.warning)}</p><details><summary>Fixture source, asset and missing-data notes</summary><p class="meta">Benchmark ${esc(inventory.benchmark)}.<br>Fixture checked ${date(home.checkedAt)}. Approved team/player identities, roster references and dated editorial are preserved. All current records, scores, prices, form, news, moves and saved AI are synthetic examples.</p><p class="note">Approved local GOAT logo, arena still, free-throw preview and player portraits are used with CSS grayscale. Archivo Black and Space Mono are locally hosted under the SIL Open Font License 1.1. No external runtime request is required. Missing prices remain Unpriced, missing scores remain Pending and missing saved AI remains Unavailable. No recorded team-value chart or Power ranking is fabricated.</p></details><nav class="footlinks" aria-label="Footer navigation">${nav.map(([label,href])=>`<a href="${href}">${label}</a>`).join('')}</nav><p class="note">Independent visual study 02 / RAW MONOCHROME / Local fixture only.</p></div></footer>`;
function renderDirectory(){const q=document.querySelector('#team-search').value.trim().toLocaleLowerCase();const sort=document.querySelector('#team-sort').value;const rows=directory.filter(d=>[d.identity.name,d.identity.managerName,...d.players.map(p=>p.fullName)].some(s=>s.toLocaleLowerCase().includes(q)));const standing=id=>hub.standings.find(s=>s.team.id===id)?.rank??Infinity;rows.sort((a,b)=>{if(sort==='name')return a.identity.name.localeCompare(b.identity.name);if(sort==='players')return b.players.length-a.players.length||standing(a.identity.id)-standing(b.identity.id);if(sort==='pf')return b.currentRecord.pointsFor-a.currentRecord.pointsFor||standing(a.identity.id)-standing(b.identity.id);return standing(a.identity.id)-standing(b.identity.id)});document.querySelector('#team-list').innerHTML=rows.map(teamMarkup).join('');document.querySelector('#team-count').textContent=`${rows.length} of ${directory.length} teams / ${rows.reduce((n,d)=>n+d.players.length,0)} roster references${q?' / Matching “'+document.querySelector('#team-search').value.trim()+'”':''}`;if(!rows.length)document.querySelector('#team-list').innerHTML='<p>No matching teams, managers or roster players. Clear search to restore all teams.</p>'}
function renderStandings(){const sort=document.querySelector('#standing-sort').value;const rows=[...hub.standings].sort((a,b)=>sort==='pf'?b.pointsFor-a.pointsFor||a.rank-b.rank:sort==='name'?a.team.name.localeCompare(b.team.name):sort==='wins'?b.wins-a.wins||a.rank-b.rank:sort==='losses'?b.losses-a.losses||a.rank-b.rank:a.rank-b.rank);document.querySelector('#standing-list').innerHTML=rows.map(s=>`<li class="standingrow"><span class="standingrank">${s.rank}</span><div class="standingname">${teamLink(s.team)}${personal?.team.id===s.team.id?'<div class="meta">YOUR TEAM</div>':''}</div><dl><div><dt>W</dt><dd>${s.wins}</dd></div><div><dt>L</dt><dd>${s.losses}</dd></div><div><dt>PF / points</dt><dd>${(s.pointsFor/100).toFixed(2)}</dd></div></dl></li>`).join('')}
renderDirectory();renderStandings();document.querySelector('#team-search').addEventListener('input',renderDirectory);document.querySelector('#team-sort').addEventListener('change',renderDirectory);document.querySelector('#standing-sort').addEventListener('change',renderStandings);document.querySelector('#clear-search').addEventListener('click',()=>{document.querySelector('#team-search').value='';renderDirectory();document.querySelector('#team-search').focus()});
const menu=document.querySelector('#navigation'),trigger=menu.querySelector('summary');document.addEventListener('keydown',e=>{if(e.key==='Escape'&&menu.open){menu.open=false;trigger.focus();e.preventDefault()}});menu.querySelectorAll('a').forEach(a=>a.addEventListener('click',()=>{menu.open=false}));document.documentElement.dataset.mockReady='02';
</script></body></html>
