<script type="module">
import {inventory,data,mode,aiState,esc,money} from '../../data.js';
const home=data.home, hub=home.hub, member=mode==='member', s=data.personal.summary, edition=home.edition;
const link=(url,text,cls='')=>`<a href="${esc(url)}"${cls?` class="${cls}"`:''}>${esc(text)}</a>`;
const player=(p)=>link('/player/'+(p.id??p.playerId),p.name??p.fullName);
const team=(t)=>link('/teams/'+t.id,t.name);
const date=(v)=>v==null?'Unavailable':new Date(v).toISOString().replace('T',' ').replace('.000Z',' UTC').replace('Z',' UTC');
const rec=t=>`${t.wins} W · ${t.losses} L${t.ties?' · '+t.ties+' T':''}`;
const score=v=>v==null?'Pending':Number(v).toFixed(1);
const portrait=p=>inventory.portraits[p.id??p.playerId]?`<img class="portrait" loading="lazy" src="${esc(inventory.portraits[p.id??p.playerId])}" alt="">`:`<span class="portrait" aria-hidden="true" style="display:grid;place-items:center;font-weight:bold">${esc((p.name??p.fullName).split(' ').map(n=>n[0]).slice(0,2).join(''))}</span>`;
const matches=[...new Map(home.directory.filter(t=>t.currentMatchup).map(t=>[t.currentMatchup.home.id+'-'+t.currentMatchup.away.id,t.currentMatchup])).values()];
const current=s?.matchup??matches[0];
const nav=[['/','Home'],['/intel','News'],['/stocks','Stocks'],['/history','History'],['/arcade','Arcade']];
const tools=[['/ai-decides','AI Decides'],['/teams','Teams'],['/transactions','Transactions'],['/weekly','Weekly archive'],['/trade-analyzer','Trade analyzer'],['/draft','Draft']];
const sectionHead=(n,title,more='')=>`<div class="section-head"><div><span class="chapter">${n}</span><h2>${esc(title)}</h2></div>${more}</div>`;
const moves=arr=>`<ul class="clean-list news">${arr.map(t=>`<li>${link('/transactions',t.summary)}<span class="meta">Week ${t.week} · ${date(t.createdAt)} · ${esc(t.type.replaceAll('_',' '))}</span></li>`).join('')}</ul>`;
const sourceList=arr=>`<ul class="source-list">${arr.map(x=>`<li>${link(x.url,x.label)} <span class="meta">Checked ${esc(x.checkedAt)}</span></li>`).join('')}</ul>`;
function renderAI(){return matches.map(m=>{const pick=data.weekly?.matchups.find(p=>p.teamIds.length===2&&p.teamIds.includes(m.home.id)&&p.teamIds.includes(m.away.id));const r=pick?.result, ready=r&&pick.status==='ready'&&data.weekly.season===hub.season.seasonYear&&data.weekly.week===m.week&&[m.home.id,m.away.id].every(id=>r.probabilities.some(p=>p.choice===id&&Number.isFinite(p.probability))), stale=ready&&data.weekly.status==='stale';const named=id=>home.directory.find(t=>t.identity.id===id)?.identity.name??`Roster ${id}`;return `<article class="ai-row"${ready?' data-ai-pair="'+esc(pick.matchupId)+'"':''}>${stale?'<p class="stale">Stale saved output · past-week context; not a current pick</p>':''}<div class="ai-line"><div><div class="ai-teams">${team(m.home)}<span>versus</span>${team(m.away)}</div><p class="meta">Current display names · Week ${m.week} · roster IDs ${esc(m.home.id)} / ${esc(m.away.id)}${member&&[m.home.id,m.away.id].includes(s.team.id)?' · Your matchup':''}</p>${ready?`<p class="pick">Returned choice: <strong>${esc(named(r.choice))}</strong></p><p class="quiet">Independent confidence: ${Math.round(r.confidence*100)}% · Saved ${date(data.weekly.generatedAt)}</p>`:'<p class="pick">Unavailable · no matching saved result</p>'}</div><div>${ready?`<div class="prob-labels">${[m.home,m.away].map(t=>`<span>${esc(t.name)}<br><strong>${Math.round(r.probabilities.find(p=>p.choice===t.id).probability*100)}%</strong></span>`).join('')}</div><div class="split" aria-hidden="true">${[m.home,m.away].map(t=>`<span style="width:${r.probabilities.find(p=>p.choice===t.id).probability*100}%"></span>`).join('')}</div><p class="meta">${esc(r.probabilityLabel)}</p>`:'<p class="quiet">Current pairing remains available. Missing probabilities are unavailable.</p>'}</div></div>${ready?`<details class="provenance"><summary>Saved model and input evidence</summary><div class="details-body"><dl><dt>Returned choice ID</dt><dd>${esc(r.choice)} · ${esc(named(r.choice))}</dd><dt>Model / prompt</dt><dd>${esc(r.model)} / ${esc(r.promptVersion)}</dd><dt>League / season / week</dt><dd>${esc(data.weekly.leagueId)} / ${esc(data.weekly.season)} / ${data.weekly.week}</dd><dt>Saved timestamp</dt><dd>${date(data.weekly.generatedAt)}</dd><dt>Input snapshot</dt><dd>${r.snapshot?esc(JSON.stringify(r.snapshot)):'Unavailable · no input snapshot supplied in this fixture'}</dd><dt>Publication / preview</dt><dd>${stale?'Stale saved slate; preview period closed.':'Synthetic saved slate; not a published official prediction.'}</dd><dt>Evidence</dt><dd>${esc([...pick.evidence,...r.evidence].join(' ')||'No additional evidence supplied.')}</dd><dt>Baseline</dt><dd>${pick.baseline?esc(JSON.stringify(pick.baseline)):'Unavailable'}</dd></dl></div></details>`:''}</article>`}).join('')}
function memberValue(){return `<section class="section" data-personal>${sectionHead('01 / PLAYER DESK','Your roster value',link('/stocks','Open Stocks'))}<div class="value-bank"><div><p class="eyebrow">Current modeled FAAB ${s.valuation.complete?'total':'subtotal · partial pricing'}</p><strong class="value-total num">${money(s.valuation.total)}</strong><p class="quiet">${s.valuation.priced} priced · ${s.valuation.unpriced} unpriced · ${s.coverage.roster} rostered</p><p class="quiet">Value rank ${s.valuation.rank.rank} of ${s.valuation.rank.teams} · ${esc(s.market.pricingBasis)} model</p><p class="meta">Computed ${date(s.market.updatedAt)}</p></div><div class="top-players">${s.players.map(p=>`<article>${portrait(p)}<strong>${player(p)}</strong><span class="quote num">${link('/stocks',money(p.value))}</span><span class="meta">${esc(p.position)} · modeled price ${p.changePct>0?'Up':p.changePct<0?'Down':'Flat'} ${Math.abs(p.changePct)}%</span></article>`).join('')}</div></div><details><summary>Full roster valuation · all ${s.rosterValues.length} players</summary><div class="details-body"><p class="quiet">In-season modeled FAAB values, not sales or player form. Every rostered player is retained; missing prices read Unpriced.</p><ul class="roster-values" data-roster-values>${s.rosterValues.map(p=>`<li class="value-row"><span>${player(p)} <small>${esc(p.position)}</small></span>${link('/stocks',money(p.value),'price num')}</li>`).join('')}</ul></div></details><p class="bar-note quiet">${esc(inventory.missing.history)}</p></section>`}
