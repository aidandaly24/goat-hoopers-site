const profile=p=>`/player/${encodeURIComponent(p.id??p.playerId)}`;

const scoreTeam=(t,points)=>`<div class="score-team"><span class="current">${member&&t.id===ownId?'Your team':'Current team'}</span><h3>${link(teamHref(t.id),t.name)}</h3><span class="manager">${esc(t.managerName)} · ${record(t)} record</span><span class="score num ${points==null?'pending violet':'lime'}">${points==null?'Pending':Number(points).toFixed(1)}</span><span class="meta">${points==null?'Score not supplied':'Known fantasy points'}</span></div>`;
const intro=member&&s?`<div class="identity" data-personal><p class="eyebrow">Your night court · 2026</p><h1>${esc(s.team.name)}</h1><div class="personal-meta"><p class="secondary">${esc(s.team.managerName)} · ${record(s.team)} current record<br>${s.coverage.roster} roster players</p><p class="standing">Standing ${s.standing.rank} / ${dirs.length}</p></div><div class="actions">${link('/team','My team','button')}${link('/teams/1#team-roster','View roster','button secondary-button')}</div></div>`:`<div class="identity"><p class="eyebrow">GOAT Hoopers · 2026</p><h1>The league floor.</h1><p class="secondary">Ten teams. Current matchups, the roster desk and the next basketball decision.</p><div class="actions">${link('#directory','Find a team','button')}${link('/login','My team','button secondary-button')}</div></div>`;
function personal(){
  if(!member||!s)return '';
  const v=s.valuation,g=s.playerGuide;
  const all=s.rosterValues.map(p=>`<li>${link(profile(p),p.name)}<span class="num">${money(p.value)} <small>${esc(p.position)}</small></span></li>`).join('');
  const merged=new Map();
  for(const [key,label] of [['best','Best'],['rough','Rough']])for(const p of g[key]){const row=merged.get(p.id)||{...p,tags:[]};row.tags.push(label);merged.set(p.id,row)}
  return `<section class="section" data-personal aria-labelledby="roster-desk"><div class="section-title"><span class="index">01</span><h2 id="roster-desk">Your roster desk</h2>${link('/stocks','Open Stocks')}</div><div class="grid-two"><div><p class="eyebrow">${v.complete?'Current modeled total':'Partial modeled subtotal'} · FAAB</p><p class="value-total num">${money(v.total)}</p><p class="secondary basis">${v.priced} / ${s.coverage.roster} priced · ${v.unpriced} unpriced${v.rank?` · Value rank ${v.rank.rank} / ${v.rank.teams}`:''}<br>Basis: ${esc(s.market.pricingBasis)} modeled FAAB value.<br>Computed ${date(s.market.updatedAt)}</p><h3>Highest modeled values</h3><ul class="value-list">${s.players.map(p=>`<li><span>${link(profile(p),p.name)}<br><small>${esc(p.position)} · Modeled price basis</small></span>${link('/stocks',money(p.value),'num')}</li>`).join('')}</ul><details class="value-all"><summary>All ${s.rosterValues.length} roster values</summary><div><ul class="all-values" data-roster-values>${all}</ul></div></details><p class="unavailable">${esc(inventory.missing.history)}</p></div><div><p class="eyebrow">Scouting notebook · observed form</p><h3>Players to watch</h3><p class="secondary">${esc(g.watch.label)}</p><ul class="watch-list">${g.watch.rows.map(p=>`<li><span>${link(profile(p),p.name)}<small>${esc(p.note)}</small></span><span class="metric num">${p.value.toFixed(1)}<small>EMA FP/G · ${p.games} games</small></span></li>`).join('')}</ul><p class="secondary">${esc(g.watch.message)}</p><p class="meta">2026 season · through fixture check ${date(s.checkedAt)}. Observed form is separate from modeled price and dated editorial.</p></div></div><div class="completed"><header><h3>Completed-week form</h3><span class="meta">Synthetic fixture · source Week ${g.previousWeek}</span></header><p class="secondary">${esc(g.period)}</p><ul>${[...merged.values()].map(p=>`<li class="form-row"><span>${link(profile(p),p.name)}<br><small>${esc(p.note)}</small></span><span class="classification secondary">${p.tags.join(' + ')} selection</span><span class="num">${p.value.toFixed(1)} <small>FP · ${p.games} GP</small></span></li>`).join('')}</ul><p class="meta">Best: ${g.best.length} / ${g.eligiblePlayed} eligible; Rough: ${g.rough.length} / ${g.eligiblePlayed} eligible. Shared selections appear once.</p><p class="secondary">${esc(g.coverage)}</p><p class="meta">${esc(g.recapMessage)} ${esc(inventory.missing.recap)}</p></div><div class="grid-two wire"><div><h3>Your team wire</h3>${s.news.map(n=>`<div class="wire-row">${link(n.url,n.headline)}<br><small>${esc(n.outlet.name)} · ${date(n.publishedAt)}</small></div>`).join('')}</div><div><h3>Your recent moves</h3>${s.moves.map(m=>`<div class="wire-row"><p>${esc(m.summary)}</p><small>Synthetic move · Week ${m.week} · ${date(m.createdAt)}</small></div>`).join('')}${link('/transactions','All transactions')}</div></div></section>`;
}
function ai(){
 const slate=data.weekly, currentPairs=dirs.filter(d=>d.currentMatchup?.home.id===d.identity.id).map(d=>d.currentMatchup);
 const rows=(slate?.matchups??[]).map((p,i)=>{
  const pair=currentPairs.find(m=>p.teamIds.length===2&&p.teamIds.includes(m.home.id)&&p.teamIds.includes(m.away.id)&&m.week===slate.week);
  const valid=!!(pair&&p.result&&['ready','stale'].includes(p.status));
  if(!valid)return `<li class="ai-row"><span class="pair-num">${String(i+1).padStart(2,'0')}</span><div style="grid-column:2/-1"><h3>Saved pick unavailable</h3><p class="secondary">Saved roster IDs or current week do not match. ${esc(p.message)}</p></div></li>`;
  const r=p.result,stale=slate.status==='stale'||p.status==='stale',choice=team(r.choice);
  const probs=p.teamIds.map(id=>{const pr=r.probabilities.find(q=>String(q.choice)===id);return {t:team(id),pct:pr?pr.probability*100:null}});
  return `<li class="ai-row" data-ai-pair="${esc(p.teamIds.join('-'))}"><span class="pair-num">${String(i+1).padStart(2,'0')}</span>${probs.map(x=>`<div class="probability"><span class="team">${link(teamHref(x.t.id),x.t.name)}</span><span class="percent num">${x.pct==null?'Unavailable':x.pct.toFixed(0)+'%'}</span>${x.pct==null?'':`<div class="prob-track" aria-hidden="true"><span style="width:${x.pct}%"></span></div>`}</div>`).join('')}<div class="ai-pick"><p class="returned">Returned choice: ${esc(choice?.name??r.choice)}</p><p class="ai-note">${stale?'<strong class="violet">Stale saved output</strong>':'Saved output'} · Confidence ${(r.confidence*100).toFixed(0)}%<br>Saved ${date(slate.generatedAt)}</p></div><details><summary>Model, prompt and source evidence</summary><div class="provenance"><p><strong>Returned result</strong>Choice roster ID ${esc(r.choice)}. Confidence ${(r.confidence*100).toFixed(0)}% is independent of the distribution. ${esc(r.probabilityLabel)}.</p><p><strong>Saved provenance</strong>Model: ${esc(r.model)}<br>Prompt: ${esc(r.promptVersion)}<br>League: ${esc(slate.leagueId)}<br>Season ${slate.season} · Week ${slate.week}<br>Pair IDs: ${esc(p.teamIds.join(', '))}<br>Generated ${date(slate.generatedAt)}</p><p><strong>Input snapshot / evidence</strong>${slate.snapshot||r.snapshot?esc(JSON.stringify(slate.snapshot??r.snapshot)):'Input snapshot unavailable in fixture.'}<br>${esc([...p.evidence,...(r.evidence??[])].join(' '))}<br>Current display names identify roster IDs; they are not frozen prediction metadata. Synthetic saved example.</p></div></details></li>`;
 }).join('');
 return `<section class="section" id="ai" aria-labelledby="ai-title"><div class="section-title"><span class="index">02</span><h2 id="ai-title">${link('/ai-decides','AI Decides')}</h2>${link('/ai-decides','Open the playground')}</div><div class="ai-intro"><p class="secondary">Saved model slate · Week ${slate?.week??matchup.week} · experimental probabilities</p><span class="meta">${aiState==='stale'?'Stale saved output':aiState==='missing'?'Unavailable':'Synthetic saved examples'}</span></div>${rows?`<ol class="ai-list">${rows}</ol>`:`<div class="unavailable"><h3>Saved AI unavailable</h3><p>No saved output is supplied. Current matchups remain available in the league directory; probability and confidence are unavailable.</p></div>`}</section>`;
}
function editorial(){return `<section class="section" aria-labelledby="editorial-title"><div class="section-title"><span class="index">03</span><h2 id="editorial-title">The dated notebook</h2>${link('/weekly/'+edition.id,'Read the edition')}</div><div class="dated"><p class="eyebrow">Sample draft · ${esc(edition.dateLabel)} · ${esc(edition.title)}</p><p class="secondary">Archived editorial context, outside the current Week ${matchup.week} matchup. These are dated opinions and source-period statistics, not current fantasy awards.</p></div><div class="story-grid">${edition.playerSpotlights.map(p=>`<article class="story"><div class="story-top">${portrait(p.playerId,p.name)}<div><span class="meta">${esc(p.periodLabel)}</span><h4>${link('/player/'+p.playerId,p.name)}</h4><small>${esc(p.position)} · ${link(teamHref(p.teamId),team(p.teamId).name)}</small></div></div><h3>${esc(p.headline)}</h3><div class="story-body"><p>${esc(p.opinion)}</p><div class="stats">${p.stats.map(st=>`<div><strong>${esc(st.value)}</strong><span>${esc(st.label)}</span></div>`).join('')}</div><p class="meta">${esc(p.statPeriod)}</p></div><details><summary>Selection and source</summary><div><p>${esc(p.selectionReason)}</p>${link(p.source.url,p.source.label)}<br><small>Checked ${esc(p.source.checkedAt)}</small></div></details></article>`).join('')}</div><div class="dated-wire"><h3>Around the league · dated edition</h3><ul>${edition.happenings.map(n=>`<li><small>${esc(n.dateLabel)}</small><div>${link(n.href,n.title)}<p class="secondary">${esc(n.text)}</p></div></li>`).join('')}</ul></div><details><summary>Edition source notes and pairing context</summary><div><p class="secondary">${esc(edition.game.context)}</p><p class="meta">${esc(edition.game.selectionReason)} This preserved opening-edition copy is dated; the current featured scoreboard above comes from currentMatchup.</p>${sourceList(edition.sources)}</div></details></section>`}
function club(d){
 const t=d.identity, m=d.currentMatchup,opponent=m?(m.home.id===t.id?m.away:m.home):null,face=data.faces.find(f=>f.team.id===t.id),p=face?.player;
 return `<article class="club" data-team-id="${esc(t.id)}"><div class="club-main"><span class="club-number">${String(t.id).padStart(2,'0')}</span><div><h3>${link(teamHref(t.id),t.name)}</h3><span class="secondary">${esc(t.managerName)}${member&&t.id===ownId?' <span class="current">· You</span>':''}</span></div><div class="club-record"><span class="record num">${record(d.currentRecord)}</span><br><small>2026 W–L${t.ties?'–T':''}</small></div><div class="opponent">${opponent?`Week ${m.week} · vs ${link(teamHref(opponent.id),opponent.name)}<br><small>Incomplete · ${d.players.length} roster players</small>`:'Current matchup unavailable'}<div class="prior">${d.previousSeason.season}: ${d.previousSeason.wins}–${d.previousSeason.losses} · Finish ${d.previousSeason.finish}${d.previousSeason.ownerNote?'<br>Previous manager: '+esc(d.previousSeason.ownerNote):''}</div></div></div><div class="face-line" data-face="${esc(t.id)}">${p?portrait(p.id,p.name,''):''}<div><small>Highest modeled value · ${esc(p?.position??'Unavailable')}</small>${p?link(profile(p),p.name):'<p>Player unavailable</p>'}</div>${p?link('/stocks',money(p.value)+' FAAB','price num'):'<span>Price unavailable</span>'}</div><details id="roster-${esc(t.id)}"><summary>Full roster · ${d.players.length} players</summary><div><ul class="roster-grid">${d.players.map(p=>`<li>${link(profile(p),'').replace('></a>',`><span>${esc(p.fullName)}</span><small>${esc(p.position)} · ${esc(p.nbaTeam??'NBA unavailable')}</small></a>`)}</li>`).join('')}</ul></div></details></article>`
}
function directory(){return `<section class="section" id="directory" aria-labelledby="directory-title"><div class="section-title"><span class="index">04</span><h2 id="directory-title">The ten-team run</h2>${link('/teams','Team profiles')}</div><p class="secondary">A working roster desk. Current records and modeled player values are synthetic; 2025 records retain their season and manager context.</p><div class="search-tools"><label for="team-search">Find team, manager or roster player<input type="search" id="team-search" placeholder="Search the league" autocomplete="off"></label><label for="team-sort">Order teams<select id="team-sort"><option value="slot">Roster number</option><option value="name">Team name A–Z</option><option value="wins">Current wins, highest first</option><option value="points">Current fantasy PF, highest first</option><option value="roster">Roster size, largest first</option></select></label></div><p id="team-count" class="meta" aria-live="polite">10 teams · 228 roster players</p><div id="clubs">${dirs.map(club).join('')}</div><p id="no-teams" class="unavailable" hidden>No teams match. Clear the search to show the league.</p></section>`}
function standingRows(rows){return rows.map(x=>`<div class="standing-row ${member&&x.team.id===ownId?'is-you':''}" role="row"><span class="rank num" role="cell">${x.rank}</span><span role="cell">${link(teamHref(x.team.id),x.team.name)}${member&&x.team.id===ownId?'<span class="you">Your team</span>':''}</span><span class="num" role="cell" data-label="Wins">${x.wins}</span><span class="num" role="cell" data-label="Losses">${x.losses}</span><span class="num" role="cell" data-label="PF points">${(x.pointsFor/100).toFixed(1)}</span></div>`).join('')}
function standings(){return `<section class="section" aria-labelledby="standings-title"><div class="section-title"><span class="index">05</span><h2 id="standings-title">Standings</h2>${link('/intel','League intel')}</div><div class="standings-tools"><p class="secondary">2026 current fixture · PF shown as fantasy points<br>Saved input pointsFor ÷ 100</p><label class="sort-label" for="standing-sort">Order standings<select id="standing-sort"><option value="rank">Rank, best first</option><option value="name">Team name A–Z</option><option value="wins">Wins, highest first</option><option value="losses">Losses, lowest first</option><option value="points">PF, highest first</option></select></label></div><div class="standings" role="table" aria-label="2026 synthetic standings"><div class="standings-head" role="row"><span role="columnheader">Rank</span><span role="columnheader">Team</span><span role="columnheader">W</span><span role="columnheader">L</span><span role="columnheader">PF</span></div><div id="standing-rows" role="rowgroup">${standingRows(home.hub.standings)}</div></div><div class="league-gaps"><p class="unavailable">League stats unavailable: points leaders, streak, activity, blowout and closest-game producer fields are not supplied.</p><p class="unavailable">${esc(inventory.missing.power)}</p></div><div class="wire"><h3>League transactions</h3>${home.hub.transactions.map(t=>`<div class="wire-row"><p>${esc(t.summary)}</p><small>Synthetic · ${esc(t.type)} · Week ${t.week} · ${date(t.createdAt)}</small></div>`).join('')}${link('/transactions','Open Transactions')}</div></section>`}
const priceFaces=data.faces.slice(0,3);
document.getElementById('app').innerHTML=`<header class="chrome"><div class="shell"><div class="topline"><a class="brand" href="/" aria-label="GOAT Hoopers home"><img src="${inventory.assets.logoDark}" alt="GOAT Hoopers" width="260" height="56"></a><div class="nav-control"><nav class="primary" aria-label="Primary">${nav.map(([url,label])=>`<a href="${url}"${url==='/'?' aria-current="page"':''}>${label}</a>`).join('')}</nav><details class="menu" id="menu"><summary>Menu</summary><nav class="menu-panel" aria-label="League destinations">${nav.filter(([u])=>u!='/stocks').map(([u,l])=>link(u,l,'phone-extra')).join('')}${tools.map(([u,l])=>link(u,l)).join('')}${link(member?'/team':'/login','My team')}</nav></details></div></div></div></header><div class="shell fixture"><details><summary><strong>Synthetic design fixture</strong> · source details</summary><div><p>${esc(inventory.warning)}</p><p>Fixture checked ${date(home.checkedAt)}. Approved dated identities and editorial remain supplied examples.</p></div></details><nav class="switcher" aria-label="Compare fixture views"><a href="?view=member"${member?' aria-current="page"':''}>Member view</a><a href="?view=public"${!member?' aria-current="page"':''}>Public view</a></nav></div><main id="main" class="shell page-court" tabindex="-1"><section class="night-stage" aria-label="Featured current matchup"><svg class="court-lines" viewBox="0 0 1200 600" preserveAspectRatio="xMidYMid slice" aria-hidden="true"><g stroke="#d2ff41" stroke-width="1.5" fill="none"><rect x="28" y="28" width="1144" height="544"/><path d="M600 28V572M28 170H190V430H28M1172 170H1010V430H1172"/><circle cx="600" cy="300" r="88"/><circle cx="190" cy="300" r="75"/><circle cx="1010" cy="300" r="75"/><path d="M28 60C480 60 480 540 28 540M1172 60C720 60 720 540 1172 540"/></g></svg><div class="stage-layout">${intro}<div class="matchup"><div class="score-heading"><h2>${member?'Your week':'Featured matchup'} ${matchup.week}</h2><span class="status">Incomplete · synthetic scores</span></div><div class="scoreboard">${scoreTeam(matchup.home,matchup.homePoints)}${scoreTeam(matchup.away,matchup.awayPoints)}</div><div class="floor-context"><div><p class="eyebrow">The current pairing</p><p>Known zero and a missing score are different states. This Week ${matchup.week} pairing comes from the current directory.</p><p class="meta">Checked ${date(home.checkedAt)}. Dated opening-edition commentary appears in the notebook below.</p></div><figure class="court-photo"><img src="${inventory.assets.court}" alt="The GOAT Hoopers basketball arena and court" width="640" height="360"><figcaption>The league floor · existing approved arena still</figcaption></figure></div></div></div></section>${personal()}${ai()}${editorial()}${directory()}${standings()}<section class="section tool-deck" aria-labelledby="tools-title"><div class="section-title"><span class="index">06</span><h2 id="tools-title">Off the sideline</h2></div><div class="tool-grid"><div><p class="eyebrow">The market</p><h3>Player prices. Real decisions.</h3><p class="secondary">Inspect the modeled FAAB price basis in Stocks. Price is a model value, not observed form or a transaction.</p><div class="market-links">${priceFaces.map(f=>`<a href="/stocks"><span>${esc(f.player.name)}</span><span class="num">${money(f.player.value)}</span></a>`).join('')}</div><div class="actions" style="margin-top:1.3rem">${link('/stocks','Open Stocks','button')}${link('/trade-analyzer','Trade analyzer','button secondary-button')}</div></div><div class="arcade"><p class="eyebrow">Arcade · Free Throw practice</p><h3>Take it to the court.</h3><img src="${inventory.assets.game}" alt="Preview of the playable GOAT Hoopers free-throw basketball court" width="640" height="360" loading="lazy">${link('/arcade/free-throw','Play free throw','button')}<p class="meta" style="margin-top:.6rem">Existing playable practice game. No reward or ranked result is claimed. ${link('/arcade','Browse Arcade')}</p></div></div></section><section class="section" aria-labelledby="archive-title"><div class="section-title"><span class="index">07</span><h2 id="archive-title">Keep the editions</h2>${link('/weekly','Weekly archive')}</div><ul class="archive">${data.archive.map(a=>`<li><span class="eyebrow">${esc(a.dateLabel)}</span><h3>${link('/weekly/'+a.id,a.title)}</h3><p class="secondary">${esc(a.game.note)} · ${a.status==='draft'?'Sample draft':'Published edition'}</p><details><summary>Edition context and sources</summary><div><p>${esc(a.game.context)}</p><p class="meta">${esc(a.game.selectionReason)}</p>${sourceList(a.sources)}</div></details></li>`).join('')}</ul></section></main><footer class="shell footer"><a class="brand" href="/" aria-label="GOAT Hoopers home"><img src="${inventory.assets.logoDark}" alt="GOAT Hoopers" width="260" height="56"></a><nav class="footer-nav" aria-label="Footer">${[...nav,...tools].map(([u,l])=>link(u,l)).join('')}</nav><details><summary>Full fixture and source explanation</summary><div><p class="secondary">${esc(inventory.warning)}</p><p class="meta">Fixture benchmark ${esc(inventory.benchmark)}. No current score, price, trend, news item or AI output is presented as live. Recorded value history, league stat leaders and Power remain unavailable. Saved AI output preserves returned choices, probability distribution, independent confidence and model provenance.</p>${sourceList(edition.sources)}</div></details><p class="meta">Electric Night Court · isolated QA art direction 01 · local assets and fonts · no external runtime requests</p><div class="bottom-mark" aria-hidden="true">AFTER HOURS. ALL HOOPS.</div></footer>`;
const menu=document.getElementById('menu');
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&menu.open){menu.open=false;menu.querySelector('summary').focus();e.preventDefault()}});
menu.addEventListener('click',e=>{if(e.target.closest('a'))menu.open=false});
const search=document.getElementById('team-search'),sort=document.getElementById('team-sort');
const nodes=new Map([...document.querySelectorAll('[data-team-id]')].map(n=>[n.dataset.teamId,n]));
function updateClubs(){
 const q=search.value.trim().toLocaleLowerCase();let count=0,players=0;
 const ordered=[...dirs].sort((a,b)=>{let n=0;switch(sort.value){case'name':n=a.identity.name.localeCompare(b.identity.name);break;case'wins':n=b.currentRecord.wins-a.currentRecord.wins;break;case'points':n=b.currentRecord.pointsFor-a.currentRecord.pointsFor;break;case'roster':n=b.players.length-a.players.length;break;default:n=Number(a.identity.id)-Number(b.identity.id)}return n||Number(a.identity.id)-Number(b.identity.id)});
 for(const d of ordered){const node=nodes.get(d.identity.id);document.getElementById('clubs').append(node);const text=[d.identity.name,d.identity.managerName,...d.players.map(p=>p.fullName)].join(' ').toLocaleLowerCase();const match=!q||text.includes(q);node.hidden=!match;if(match){count++;players+=d.players.length;if(q&&d.players.some(p=>p.fullName.toLocaleLowerCase().includes(q)))node.querySelector('details').open=true}}
 document.getElementById('team-count').textContent=`${count} ${count===1?'team':'teams'} · ${players} roster players${q?' matching the search':''}`;
 document.getElementById('no-teams').hidden=count!==0;
}
search.addEventListener('input',updateClubs);sort.addEventListener('change',updateClubs);
document.getElementById('standing-sort').addEventListener('change',e=>{const rows=[...home.hub.standings].sort((a,b)=>{let n=0;switch(e.target.value){case'name':n=a.team.name.localeCompare(b.team.name);break;case'wins':n=b.wins-a.wins;break;case'losses':n=a.losses-b.losses;break;case'points':n=b.pointsFor-a.pointsFor;break;default:n=a.rank-b.rank}return n||a.rank-b.rank});document.getElementById('standing-rows').innerHTML=standingRows(rows)});
document.documentElement.dataset.mockReady='01';
</script>
